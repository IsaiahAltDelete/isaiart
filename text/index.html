/* ============================================================
   5. WORLD — endless regions, terrain, prop chunks
   ============================================================ */
const SPEED=5.5;             /* world px per second */
const SLOT=1300, JIT=760, BLEND=210;
let camOff=0;
const camX=()=> elapsed()/1000*SPEED + camOff;

const bound=i=> i*SLOT + (hash1(Math.imul(i,7919)+3)-.5)*JIT;
function regionAt(wx){
  let i=Math.floor(wx/SLOT);
  while(bound(i)>wx) i--;
  while(bound(i+1)<=wx) i++;
  return i;
}
const rawBiome=i=> Math.floor(hash1(Math.imul(i,104729)+13)*BIOMES.length)%BIOMES.length;
function biomeOf(i){
  let k=rawBiome(i);
  if(k===rawBiome(i-1)) k=(k+1+Math.floor(hash1(Math.imul(i,31337)+7)*(BIOMES.length-1)))%BIOMES.length;
  return k;
}
/* {a,b,t} — a and b are biome indices, t is the blend toward b */
function blendAt(wx){
  const i=regionAt(wx), b0=bound(i);
  const d=wx-b0;
  if(d<BLEND) return {a:biomeOf(i-1),b:biomeOf(i),t:smooth(d/BLEND)};
  const k=biomeOf(i);
  return {a:k,b:k,t:1};
}
const biomeIdxAt=wx=>{const b=blendAt(wx); return b.t<.5?b.a:b.b;};

/* terrain: shape from noise, palette/biome from the same world x (fully coherent) */
const LAYER=[{base:.150,amp:.060,freq:.0024},
             {base:.070,amp:.038,freq:.0050},
             {base:.000,amp:.017,freq:.0078}];
function layerYFor(wx,l,B_){
  const L=LAYER[l];
  return horizon - L.base*H - B_.lift*H*(l===2?1:.6)
       - fbm(wx*L.freq,l*257+11,3)*L.amp*H*B_.amp;
}
function terrainY(wx,l){
  const bl=blendAt(wx);
  if(bl.a===bl.b) return Math.round(layerYFor(wx,l,BIOMES[bl.a]));
  return Math.round(lerp(layerYFor(wx,l,BIOMES[bl.a]),layerYFor(wx,l,BIOMES[bl.b]),bl.t));
}

/* ---- prop chunks ---- */
const CHUNK=110;
const chunkCache=new Map();
function chunkProps(l,ci){
  const key=l+':'+ci;
  let v=chunkCache.get(key);
  if(v) return v;
  const r=seeded(Math.imul(ci,7919)+Math.imul(l,104729)+5);
  const wx0=ci*CHUNK;
  const bi=biomeIdxAt(wx0+CHUNK/2), Bm=BIOMES[bi];
  const list=[];
  /* dens is authored [most-distant .. nearest]; the near layer carries the detail */
  const n=Math.round(Bm.dens[2-l]*(CHUNK/110)*(l===0?2.0:l===1?2.8:3.6)*(.55+r()));
  for(let i=0;i<n;i++){
    const wx=wx0+r()*CHUNK;
    let kind;
    if(l===0) kind='far';
    else{
      const tbl=l===1
        ? [[3,'tree'],[1.1,'house'],[.5,'rock'],[1.4,'small']]
        : [[2.6,'tree'],[1.5,'house'],[.9,'rock'],[2.6,'small'],[(Bm.tower?0.7:0),'tower'],[.45,'sig']];
      kind=pick(tbl,r());
    }
    if(kind==='tree'&&!Bm.tree) kind='rock';
    if(kind==='house'&&!Bm.house) kind='rock';
    list.push({k:kind,wx:wx,b:bi,a:r(),c:r(),d:r()});
  }
  /* rare world events, near layer only */
  if(l===2 && Bm.ev.length && r()<.30){
    list.push({k:'event',ev:Bm.ev[Math.floor(r()*Bm.ev.length)],wx:wx0+r()*CHUNK,b:bi,a:r(),c:r(),d:r()});
  }
  chunkCache.set(key,list);
  if(chunkCache.size>900){
    const cut=Math.floor(camX()/CHUNK);
    for(const k of chunkCache.keys()){
      const ci2=parseInt(k.split(':')[1],10);
      if(Math.abs(ci2-cut)>60) chunkCache.delete(k);
    }
  }
  return list;
}

/* ============================================================
   6. PROP ART
   ============================================================ */
function px(x,y,w,h,c){ g.fillStyle=c; g.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0)); }
function disc(x,y,r,c){
  g.fillStyle=c;
  for(let dy=-r;dy<=r;dy++){
    const w=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy)));
    g.fillRect((x-w)|0,(y+dy)|0,w*2+1,1);
  }
}
/* staircase triangle, point up */
function tri(x,y,w,h,c){
  g.fillStyle=c;
  for(let i=0;i<h;i++){
    const ww=Math.max(1,Math.round(w*(i/h)));
    g.fillRect((x-ww/2)|0,(y-h+i)|0,ww,1);
  }
}
let hazeCol=[140,170,200];
const LSCALE=[.42,.66,1];
function C(c,l){ return rgb(l?mix(tint(c),hazeCol,l===1?.16:0):tint(c)); }
function CF(c){ return rgb(mix(tint(c),hazeCol,.45)); }

function drawProp(p,l,sx,gy,now){
  const Bm=BIOMES[p.b], s=LSCALE[l];
  switch(p.k){
    case 'far'  : farSil(Bm,sx,gy,p,now); break;
    case 'tree' : drawTree(Bm,sx,gy,p,l,s,now); break;
    case 'house': drawHouse(Bm,sx,gy,p,l,s,now); break;
    case 'tower': drawTower(Bm,sx,gy,p,l,s,now); break;
    case 'rock' : drawRock(Bm,sx,gy,p,l,s); break;
    case 'small': drawSmall(Bm,sx,gy,p,l,s,now); break;
    case 'sig'  : drawSig(Bm,sx,gy,p,l,s,now); break;
    case 'event': drawEvent(p.ev,Bm,sx,gy,p,now); break;
  }
}

/* ---------- trees ---------- */
function drawTree(Bm,x,gy,p,l,s,now){
  const T=Bm.tree, h=Math.round((9+p.a*11)*s)+2;
  const sway=REDUCED?0:Math.round(Math.sin(now/1500+p.wx*.07)*(l===2?1:.6));
  const tc=C(T.t,l), a=C(T.a,l), b=C(T.b,l);
  switch(T.s){
    case 'round':
      px(x,gy-h+2,Math.max(1,Math.round(s*1.6)),h-2,tc);
      disc(x+sway,gy-h,Math.max(2,Math.round(h*.42)),a);
      disc(x-1+sway,gy-h-1,Math.max(1,Math.round(h*.30)),b);
      break;
    case 'pine': case 'snowpine':
      px(x,gy-3,1,3,tc);
      for(let i=0;i<3;i++){
        const w=Math.round(h*.62-i*h*.16), yy=gy-3-Math.round(h*.30*i)-Math.round(h*.30);
        tri(x+Math.round(sway*i/2),yy+3,w,Math.round(h*.34),i===0?a:a);
      }
      if(T.s==='snowpine'){ tri(x+sway,gy-3-Math.round(h*.90),Math.round(h*.30),Math.round(h*.22),b); }
      else tri(x+sway,gy-3-Math.round(h*.86),Math.round(h*.28),Math.round(h*.20),b);
      break;
    case 'cherry':
      px(x,gy-h+3,Math.max(1,Math.round(s*1.6)),h-3,tc);
      px(x-2,gy-h+4,2,1,tc); px(x+2,gy-h+5,2,1,tc);
      disc(x+sway,gy-h,Math.max(2,Math.round(h*.44)),a);
      disc(x-2+sway,gy-h-2,Math.max(1,Math.round(h*.26)),b);
      disc(x+3+sway,gy-h+1,Math.max(1,Math.round(h*.22)),b);
      break;
    case 'dead':
      px(x,gy-h,1,h,tc);
      px(x-2,gy-h+2,2,1,tc); px(x+1,gy-h+4,3,1,tc);
      px(x-3,gy-h+1,1,2,tc); px(x+3,gy-h+3,1,2,tc);
      break;
    case 'gnarled':
      px(x,gy-h,2,h,tc);
      px(x-3,gy-h+3,3,1,tc); px(x+2,gy-h+5,3,1,tc);
      disc(x+sway,gy-h-1,Math.max(2,Math.round(h*.34)),a);
      disc(x+3+sway,gy-h+2,Math.max(1,Math.round(h*.20)),b);
      /* hanging moss */
      px(x-2,gy-h+2,1,Math.round(h*.25),b);
      break;
    case 'palm':
      for(let i=0;i<h;i++) px(x+Math.round(Math.sin(i/h*1.2)*2),gy-i,1,1,tc);
      const tx=x+Math.round(Math.sin(1.2)*2);
      for(let k=-2;k<=2;k++){
        if(!k) continue;
        for(let i=1;i<=4;i++) px(tx+k*i,gy-h+Math.abs(k)*i*.4+(i*i*.18)|0,1,1,k%2?a:b);
      }
      disc(tx,gy-h,1,b);
      break;
    case 'cactus':
      px(x,gy-h,2,h,a);
      px(x,gy-h,1,h,b);
      if(p.a>.4){ px(x-3,gy-Math.round(h*.6),3,1,a); px(x-3,gy-Math.round(h*.6)-3,1,3,a); }
      if(p.c>.5){ px(x+2,gy-Math.round(h*.75),3,1,a); px(x+4,gy-Math.round(h*.75)-4,1,4,a); }
      if(p.d>.75) px(x,gy-h-1,2,1,C(Bm.accent,l));
      break;
    case 'spiral':
      for(let i=0;i<h;i++) px(x+Math.round(Math.sin(i*.55)*2.4),gy-i,1,1,tc);
      for(let i=0;i<5;i++){
        const ang=i*1.25+p.a*6, rr=3+i*.7;
        disc(x+Math.round(Math.cos(ang)*rr),gy-h+Math.round(Math.sin(ang)*rr*.5),Math.max(1,Math.round(2*s)),i%2?a:b);
      }
      break;
  }
}

/* ---------- houses ---------- */
function drawHouse(Bm,x,gy,p,l,s,now){
  const Hs=Bm.house, lit=clamp(night*1.4,0,1)*(Hs.lit?1:0);
  const w=Math.round((10+p.a*7)*s), hh=Math.round((8+p.c*6)*s);
  const wall=C(Hs.w,l), dark=C(Hs.d,l), roof=C(Hs.r,l), roofD=C(Hs.rd,l);
  const x0=x-(w>>1);
  const winC=lit>.15?rgb(mix([120,150,180],[255,206,110],lit)):C([126,152,174],l);
  switch(Hs.s){
    case 'modern': {
      const th=Math.round(hh*(1.6+p.a*2.6));
      px(x0,gy-th,w,th,wall); px(x0,gy-th,Math.max(1,w>>2),th,dark);
      for(let r=1;r<th-1;r+=3) for(let c=1;c<w-1;c+=3){
        const on=hash2(p.wx+r*13,c*7)>(.42-lit*.34);
        px(x0+c,gy-th+r,1,1,on?rgb(mix([90,110,130],[255,226,140],lit)):dark);
      }
      px(x0-1,gy-th-1,w+2,1,dark);
      if(p.d>.7) px(x,gy-th-4,1,4,dark),px(x,gy-th-5,1,1,rgb([255,80,80],.9));
      break; }
    case 'timber':
      px(x0,gy-hh,w,hh,wall);
      for(let i=1;i<w;i+=3) px(x0+i,gy-hh,1,hh,dark);
      px(x0,gy-hh+Math.round(hh/2),w,1,dark);
      for(let i=0;i<5;i++) px(x0-1-i,gy-hh-i*1.6,w+2+i*2,2,i?roof:roofD);
      break;
    case 'cottage':
      px(x0,gy-hh,w,hh,wall); px(x0,gy-3,w,3,dark);
      for(let i=0;i<4;i++) px(x0-2+i,gy-hh-i*1.7,w+4-i*2,2,i?roof:roofD);
      break;
    case 'pagoda':
      px(x0,gy-hh,w,hh,wall); px(x0,gy-hh,w,1,dark);
      for(let t=0;t<2;t++){
        const yy=gy-hh-t*Math.round(hh*.55), ww=w+5-t*3;
        px(x-(ww>>1),yy-2,ww,2,roof);
        px(x-(ww>>1)-1,yy,ww+2,1,roofD);
        if(t) px(x0+1,yy,w-2,Math.round(hh*.5),wall);
      }
      break;
    case 'adobe':
      px(x0,gy-hh,w,hh,wall); px(x0,gy-hh,w,2,roof);
      px(x0+1,gy-hh-1,w-2,1,roofD);
      for(let i=2;i<w-1;i+=4) px(x0+i,gy-hh+2,1,1,dark);
      break;
    case 'mush': {
      const cap=Math.round(w*.85);
      px(x-1,gy-hh,3,hh,wall);
      disc(x,gy-hh,cap>>1,roof);
      px(x-(cap>>1),gy-hh,cap,1,roofD);
      disc(x-2,gy-hh-1,1,C([255,255,255],l)); disc(x+2,gy-hh-2,1,C([255,255,255],l));
      break; }
    case 'stilt':
      px(x0+1,gy-4,1,4,dark); px(x0+w-2,gy-4,1,4,dark);
      px(x0,gy-hh-4,w,hh,wall);
      for(let i=0;i<3;i++) px(x0-1+i,gy-hh-4-i*1.5,w+2-i*2,2,i?roof:roofD);
      break;
    case 'barn':
      px(x0,gy-hh,w,hh,wall); px(x0,gy-hh,w,1,dark);
      px(x-1,gy-Math.round(hh*.7),2,Math.round(hh*.7),dark);
      for(let i=0;i<3;i++) px(x0-1+i,gy-hh-i*2,w+2-i*2,2,i?roof:roofD);
      break;
    case 'factory':
      px(x0,gy-hh,w,hh,wall);
      for(let i=0;i<w-2;i+=4){ tri(x0+i+2,gy-hh,4,3,roof); }
      for(let i=1;i<w-1;i+=3) px(x0+i,gy-hh+3,2,2,winC);
      break;
    case 'dome':
      disc(x,gy-2,Math.max(3,w>>1),wall);
      px(x-(w>>1),gy-1,w,2,dark);
      disc(x,gy-3,Math.max(2,(w>>1)-2),roof);
      px(x-1,gy-2,2,2,winC);
      break;
    case 'igloo':
      disc(x,gy,Math.max(3,w>>1),wall);
      px(x-(w>>1),gy+1,w,2,dark);
      disc(x,gy,Math.max(2,(w>>1)-2),roof);
      px(x-1,gy-1,3,2,dark);
      break;
    case 'ruin':
      px(x0,gy-hh,w,hh,wall);
      px(x0+Math.round(w*.4),gy-hh-2,Math.round(w*.3),2,dark);
      px(x0+1,gy-hh+1,2,3,dark); px(x0+w-4,gy-hh+2,2,4,dark);
      px(x0,gy-hh,w,1,dark);
      break;
  }
  /* door + window on ground-level styles */
  if(['cottage','timber','pagoda','adobe','barn','stilt','factory'].indexOf(Hs.s)>=0){
    const dy=Hs.s==='stilt'?gy-4:gy;
    px(x-1,dy-4,3,4,dark);
    if(w>8) px(x0+2,dy-hh+2,2,2,winC);
    if(lit>.2){ px(x0+1,dy-hh+1,4,4,rgb([255,214,130],lit*.18)); }
  }
}

/* ---------- towers ---------- */
function drawTower(Bm,x,gy,p,l,s,now){
  const T=Bm.tower; if(!T) return;
  const a=C(T.a,l), b=C(T.b,l), acc=C(Bm.accent,l);
  const h=Math.round((20+p.a*16)*s), w=Math.max(3,Math.round(6*s));
  const lit=clamp(night*1.4,0,1);
  switch(T.s){
    case 'castle':
      px(x-(w>>1),gy-h,w,h,a);
      px(x-(w>>1),gy-h,2,h,b);
      for(let i=0;i<w;i+=2) px(x-(w>>1)+i,gy-h-2,1,2,a);
      px(x-(w>>1)-1,gy-h,w+2,1,b);
      if(lit>.2) px(x-1,gy-Math.round(h*.6),2,2,rgb(mix([80,90,110],[255,206,110],lit)));
      break;
    case 'wizard': {
      for(let i=0;i<h;i++){
        const ww=Math.max(2,Math.round(w*(1-i/h*.35)))+ (Math.sin(i*.5)>0?0:0);
        px(x-(ww>>1),gy-i,ww,1,i%5===0?b:a);
      }
      tri(x,gy-h,w+3,Math.round(h*.32),b);
      px(x,gy-h-Math.round(h*.32)-2,1,2,acc);
      disc(x,gy-h-Math.round(h*.32)-3,1,acc);
      if(lit>.15){ px(x-1,gy-Math.round(h*.55),2,2,rgb([255,226,140],lit)); disc(x,gy-Math.round(h*.55),3,rgb([255,226,140],lit*.15)); }
      break; }
    case 'sky': {
      const th=Math.round(h*1.5);
      px(x-(w>>1),gy-th,w,th,a);
      px(x-(w>>1),gy-th,1,th,b);
      for(let r=2;r<th-1;r+=3) for(let c=1;c<w-1;c+=2){
        const on=hash2(p.wx+r*7,c*11)>(.45-lit*.35);
        px(x-(w>>1)+c,gy-th+r,1,1,on?rgb(mix([90,110,130],[255,230,150],lit)):b);
      }
      px(x,gy-th-3,1,3,b); px(x,gy-th-4,1,1,rgb([255,90,90],.85));
      break; }
    case 'silo':
      px(x-(w>>1),gy-h,w,h,a);
      px(x-(w>>1),gy-h,1,h,b);
      for(let i=2;i<h;i+=4) px(x-(w>>1),gy-i,w,1,b);
      disc(x,gy-h,(w>>1)+1,b);
      break;
    case 'light':
      for(let i=0;i<h;i++){ const ww=Math.max(2,Math.round(w*(1-i/h*.4))); px(x-(ww>>1),gy-i,ww,1,(Math.floor(i/3)%2)?a:b); }
      px(x-2,gy-h-3,5,3,b);
      { const on=(now/900|0)%2===0;
        px(x-1,gy-h-2,3,1,on?rgb([255,240,170]):a);
        if(on){ disc(x,gy-h-2,7,rgb([255,240,170],.10)); px(x+2,gy-h-2,14,1,rgb([255,240,170],.14)); } }
      break;
    case 'stack':
      px(x-(w>>1),gy-h,w,h,a);
      px(x-(w>>1),gy-h,1,h,b);
      px(x-(w>>1)-1,gy-h,w+2,2,b);
      if(!REDUCED) for(let i=0;i<4;i++){
        const t=((now/1100)+i*.25)%1;
        px(x+Math.round(Math.sin(t*4+i)*3),gy-h-2-t*16,1+(t>.5?1:0),1,rgb(mix([90,90,96],[40,40,46],t),(1-t)*.5));
      }
      break;
    case 'antenna':
      px(x-1,gy-h,2,h,a);
      for(let i=1;i<4;i++) px(x-3,gy-h+i*Math.round(h/4),7,1,b);
      disc(x,gy-h-2,2,C(Bm.accent,l));
      if(!REDUCED){ const pl=.4+.6*Math.abs(Math.sin(now/500)); disc(x,gy-h-2,4,rgb(tint(Bm.accent),pl*.22)); }
      break;
  }
}

/* ---------- rocks ---------- */
function drawRock(Bm,x,gy,p,l,s){
  const c=C(Bm.rockC,l), d=rgb(mix(tint(Bm.rockC),[0,0,0],.28));
  const w=Math.max(2,Math.round((3+p.a*5)*s)), h=Math.max(1,Math.round((2+p.c*3)*s));
  px(x-(w>>1),gy-h,w,h,c);
  px(x-(w>>1),gy-1,w,1,d);
  px(x-(w>>1)+1,gy-h,Math.max(1,w-3),1,rgb(mix(tint(Bm.rockC),[255,255,255],.18)));
}

/* ---------- small details ---------- */
function drawSmall(Bm,x,gy,p,l,s,now){
  const kind=Bm.small[Math.floor(p.a*Bm.small.length)%Bm.small.length];
  const acc=C(Bm.accent,l), lit=clamp(night*1.4,0,1);
  const sway=REDUCED?0:Math.round(Math.sin(now/800+p.wx*.1)*.6);
  switch(kind){
    case 'flower':
      px(x,gy-2,1,2,C([90,150,80],l)); px(x+sway,gy-3,1,1,acc); break;
    case 'glowflower':
      px(x,gy-3,1,3,C([90,150,120],l));
      disc(x+sway,gy-4,1,acc);
      if(night>.2) disc(x+sway,gy-4,3,rgb(tint(Bm.accent),night*.20));
      break;
    case 'bush':
      disc(x,gy-1,Math.max(1,Math.round(2*s)),C(Bm.tree?Bm.tree.a:[70,120,70],l));
      disc(x-1,gy-2,Math.max(1,Math.round(1.4*s)),C(Bm.tree?Bm.tree.b:[100,160,90],l)); break;
    case 'fence':
      for(let i=0;i<4;i++) px(x+i*3,gy-3,1,3,C([120,92,60],l));
      px(x,gy-3,10,1,C([140,108,72],l)); px(x,gy-1,10,1,C([120,92,60],l)); break;
    case 'crops':
      for(let i=0;i<6;i++){ const hh=3+((i*7+p.wx)%3); px(x+i*2,gy-hh,1,hh,C([180,160,70],l)); px(x+i*2+sway,gy-hh-1,1,1,acc);} break;
    case 'hay':
      disc(x,gy-2,Math.max(2,Math.round(2.6*s)),C([200,175,95],l));
      px(x-3,gy-2,7,1,C([170,145,75],l)); break;
    case 'bones':
      px(x-3,gy-1,7,1,C([224,214,190],l)); px(x-3,gy-2,1,1,C([224,214,190],l)); px(x+3,gy-2,1,1,C([224,214,190],l)); break;
    case 'skull':
      disc(x,gy-2,2,C([228,220,198],l)); px(x-1,gy-2,1,1,C([60,50,44],l)); px(x+1,gy-2,1,1,C([60,50,44],l)); break;
    case 'rock': drawRock(Bm,x,gy,p,l,s*.7); break;
    case 'obsidian':
      tri(x,gy,Math.max(2,Math.round(3*s)),Math.max(3,Math.round(6*s)),C([40,30,40],l));
      px(x,gy-4,1,2,C([120,60,90],l)); break;
    case 'lava': {
      const pulse=.55+.45*Math.sin(now/420+p.wx);
      px(x-3,gy-1,7,1,rgb(mix([255,120,40],[255,220,120],pulse)));
      disc(x,gy-1,5,rgb([255,120,40],.10*pulse)); break; }
    case 'ember': {
      const t=((now/1400)+p.a)%1;
      px(x,gy-2-t*14,1,1,rgb([255,150,60],(1-t)*.9)); break; }
    case 'crystal': {
      const hh=Math.max(3,Math.round((4+p.c*5)*s));
      tri(x,gy,Math.max(2,Math.round(2.6*s)),hh,acc);
      if(night>.15) disc(x,gy-hh/2,hh,rgb(tint(Bm.accent),night*.13));
      break; }
    case 'rune':
      px(x-2,gy-1,5,1,C([90,84,140],l));
      px(x,gy-3,1,2,rgb(tint(Bm.accent),.5+.5*Math.sin(now/700+p.wx))); break;
    case 'candle':
      px(x,gy-3,1,3,C([220,210,190],l));
      px(x,gy-4,1,1,rgb([255,200,90],.6+.4*Math.sin(now/220+p.wx)));
      if(night>.2) disc(x,gy-4,3,rgb([255,200,90],night*.16)); break;
    case 'mushroom': {
      const hh=Math.max(2,Math.round((3+p.c*4)*s));
      px(x,gy-hh,1,hh,C([230,220,240],l));
      disc(x,gy-hh,Math.max(1,Math.round(2*s)),C(Bm.house?Bm.house.r:[255,110,150],l));
      if(night>.2) disc(x,gy-hh,Math.max(3,Math.round(4*s)),rgb(tint(Bm.accent),night*.14));
      break; }
    case 'toadstool':
      px(x,gy-2,1,2,C([200,196,180],l)); disc(x,gy-2,1,C([180,70,60],l)); break;
    case 'lantern':
      px(x,gy-6,1,6,C([90,70,50],l));
      px(x-1,gy-8,3,3,rgb(mix(tint([200,90,70]),[255,200,120],lit)));
      if(lit>.15) disc(x,gy-7,5,rgb([255,190,110],lit*.18)); break;
    case 'banner':
      px(x,gy-9,1,9,C([90,70,50],l));
      px(x+1,gy-9,4,5,C(Bm.accent,l)); px(x+1,gy-4,4,1,C(Bm.accent,l)); break;
    case 'barrel':
      px(x-2,gy-4,4,4,C([130,96,58],l)); px(x-2,gy-3,4,1,C([100,72,44],l)); break;
    case 'crate':
      px(x-2,gy-4,5,4,C([150,124,86],l)); px(x-2,gy-2,5,1,C([116,94,64],l)); break;
    case 'pipe':
      px(x-1,gy-5,3,5,C([120,116,110],l)); px(x-2,gy-6,5,1,C([148,144,138],l)); break;
    case 'gear':
      disc(x,gy-3,Math.max(2,Math.round(2.4*s)),C([140,120,90],l));
      px(x-4,gy-3,9,1,C([140,120,90],l)); px(x,gy-7,1,9,C([140,120,90],l)); break;
    case 'panel':
      px(x-3,gy-4,7,3,C([90,110,140],l)); px(x-3,gy-4,7,1,C(Bm.accent,l)); px(x,gy-1,1,1,C([80,76,100],l)); break;
    case 'probe':
      px(x,gy-4,1,4,C([160,150,180],l)); disc(x,gy-5,1,C(Bm.accent,l));
      if(!REDUCED) disc(x,gy-5,3,rgb(tint(Bm.accent),.10+.10*Math.sin(now/400))); break;
    case 'streetlight': {
      const hh=Math.round(11*s);
      px(x,gy-hh,1,hh,C([70,74,82],l)); px(x,gy-hh,3,1,C([70,74,82],l));
      px(x+2,gy-hh+1,1,1,rgb(mix([120,124,132],[255,226,150],lit)));
      if(lit>.15){ disc(x+2,gy-hh+2,6,rgb([255,220,140],lit*.13)); }
      break; }
    case 'car': {
      const col=[[200,70,70],[70,110,200],[220,200,90],[230,230,235]][Math.floor(p.c*4)%4];
      px(x-4,gy-3,9,2,C(col,l)); px(x-2,gy-5,5,2,C(col,l));
      px(x-3,gy-1,2,1,C([30,30,34],l)); px(x+2,gy-1,2,1,C([30,30,34],l));
      if(lit>.3) px(x+5,gy-3,1,1,rgb([255,240,190],lit)); break; }
    case 'hydrant': px(x,gy-3,2,3,C([200,70,60],l)); px(x-1,gy-4,4,1,C([200,70,60],l)); break;
    case 'column': {
      const hh=Math.max(4,Math.round((7+p.c*9)*s));
      px(x-1,gy-hh,3,hh,C([190,184,166],l));
      px(x-1,gy-hh,1,hh,C([160,154,138],l));
      px(x-2,gy-hh-1,5,1,C([200,194,176],l)); px(x-2,gy-1,5,1,C([200,194,176],l));
      break; }
    case 'rubble':
      px(x-3,gy-1,3,1,C([170,164,150],l)); px(x+1,gy-2,2,2,C([150,144,130],l)); break;
    case 'grave':
      px(x-1,gy-4,3,4,C([150,150,156],l)); px(x-2,gy-4,5,1,C([150,150,156],l));
      px(x,gy-3,1,1,C([100,100,108],l)); break;
    case 'icespike':
      tri(x,gy,Math.max(2,Math.round(2.4*s)),Math.max(3,Math.round(7*s)),C([200,232,248],l)); break;
    case 'snowman':
      disc(x,gy-2,2,C([245,250,255],l)); disc(x,gy-5,1,C([245,250,255],l));
      px(x-1,gy-5,1,1,C([40,40,50],l)); px(x+1,gy-5,1,1,C([40,40,50],l));
      px(x,gy-5,1,1,C([230,120,50],l)); break;
    case 'reed':
      for(let i=0;i<3;i++){ px(x+i*2+sway,gy-5-i,1,5+i,C([110,140,80],l)); px(x+i*2+sway,gy-6-i,1,1,C([120,90,60],l)); } break;
    case 'lily':
      px(x-2,gy,5,1,C([80,120,70],l)); px(x,gy-1,1,1,C([240,230,250],l)); break;
    case 'shell':
      disc(x,gy-1,1,C([240,220,215],l)); break;
    case 'crab':
      px(x-1,gy-1,3,1,C([210,90,70],l)); px(x-2,gy-2,1,1,C([210,90,70],l)); px(x+2,gy-2,1,1,C([210,90,70],l)); break;
    case 'buoy':
      px(x,gy-4,2,4,C([220,80,60],l)); px(x,gy-5,2,1,C([240,240,240],l)); break;
    default:
      drawRock(Bm,x,gy,p,l,s*.7);
  }
}

/* ---------- biome signature landmarks ---------- */
function drawSig(Bm,x,gy,p,l,s,now){
  const acc=C(Bm.accent,l), lit=clamp(night*1.4,0,1);
  switch(Bm.sig){
    case 'well':
      px(x-4,gy-4,9,4,C([140,134,120],l)); px(x-4,gy-4,9,1,C([170,164,150],l));
      px(x-4,gy-10,1,6,C([110,84,54],l)); px(x+4,gy-10,1,6,C([110,84,54],l));
      px(x-5,gy-11,11,2,C([130,80,60],l)); px(x,gy-8,1,3,C([90,80,70],l)); break;
    case 'gate':
      px(x-9,gy-14,4,14,C([150,146,138],l)); px(x+6,gy-14,4,14,C([150,146,138],l));
      px(x-9,gy-16,19,2,C([130,126,118],l));
      for(let i=0;i<19;i+=3) px(x-9+i,gy-18,2,2,C([150,146,138],l));
      px(x-4,gy-9,9,9,C([90,64,44],l)); px(x,gy-9,1,9,C([70,48,32],l));
      px(x-1,gy-19,3,4,C(Bm.accent,l)); break;
    case 'obelisk': {
      const hh=Math.round(26*s);
      for(let i=0;i<hh;i++){ const ww=Math.max(2,Math.round(5*(1-i/hh*.45))); px(x-(ww>>1),gy-i,ww,1,i%6===0?C([170,140,100],l):C([196,166,120],l)); }
      tri(x,gy-hh,4,4,C([214,186,140],l));
      px(x-1,gy-Math.round(hh*.6),3,1,acc); break; }
    case 'torii': {
      const hh=Math.round(15*s), w=Math.round(14*s);
      px(x-(w>>1),gy-hh,3,hh,C([200,60,60],l)); px(x+(w>>1)-2,gy-hh,3,hh,C([200,60,60],l));
      px(x-(w>>1)-3,gy-hh,w+6,3,C([214,70,70],l));
      px(x-(w>>1)-1,gy-hh+5,w+2,2,C([200,60,60],l));
      px(x-(w>>1)-4,gy-hh-2,w+8,2,C([40,34,40],l)); break; }
    case 'portal': {
      const hh=Math.round(16*s), pulse=.55+.45*Math.sin(now/600+p.wx);
      for(let i=0;i<hh;i++){
        const ww=Math.round(7*Math.sin(i/hh*Math.PI))+1;
        px(x-(ww>>1),gy-i,ww,1,rgb(mix(tint(Bm.accent),[255,255,255],.25*pulse),.55+.35*pulse));
      }
      px(x-5,gy-hh,2,hh,C([70,60,100],l)); px(x+4,gy-hh,2,hh,C([70,60,100],l));
      disc(x,gy-Math.round(hh*.55),Math.round(9*s),rgb(tint(Bm.accent),.10*pulse)); break; }
    case 'monolith': {
      const hh=Math.round(24*s);
      px(x-3,gy-hh,7,hh,C([56,52,84],l)); px(x-3,gy-hh,2,hh,C([74,68,110],l));
      for(let i=3;i<hh;i+=5) px(x-1,gy-i,3,1,rgb(tint(Bm.accent),.4+.4*Math.sin(now/700+i)));
      if(night>.2) disc(x,gy-hh/2,Math.round(11*s),rgb(tint(Bm.accent),night*.10)); break; }
    case 'arch': {
      const hh=Math.round(16*s), w=Math.round(16*s);
      px(x-(w>>1),gy-hh,4,hh,C([186,180,162],l)); px(x+(w>>1)-3,gy-hh+3,4,hh-3,C([186,180,162],l));
      for(let i=0;i<6;i++){ const yy=gy-hh-2+i, ww=w-i*2; px(x-(ww>>1),yy,ww,1,C([196,190,172],l)); }
      px(x+(w>>1)-3,gy-hh,4,2,C([160,154,138],l)); break; }
    case 'windmill': {
      const hh=Math.round(22*s);
      for(let i=0;i<hh;i++){ const ww=Math.max(3,Math.round(8*(1-i/hh*.4))); px(x-(ww>>1),gy-i,ww,1,C([224,216,196],l)); }
      px(x-2,gy-6,4,6,C([120,90,60],l));
      const ang=REDUCED?.6:now/2600;
      for(let b=0;b<4;b++){
        const a2=ang+b*Math.PI/2;
        for(let r=2;r<Math.round(11*s);r++)
          px(x+Math.round(Math.cos(a2)*r),gy-hh+Math.round(Math.sin(a2)*r),1,1,C([150,116,78],l));
      }
      disc(x,gy-hh,1,C([90,70,50],l)); break; }
    case 'lighthouse': drawTower(Bm,x,gy,p,l,s,now); break;
    case 'wreck': {
      px(x-8,gy-3,17,3,C([90,70,54],l));
      px(x-6,gy-9,2,7,C([110,86,64],l)); px(x+3,gy-7,2,5,C([110,86,64],l));
      px(x-5,gy-9,7,1,C([80,62,48],l)); break; }
    case 'shrine':
      px(x-4,gy-6,9,6,C([110,104,88],l)); px(x-5,gy-8,11,2,C([90,84,70],l));
      px(x-1,gy-5,3,4,C([50,46,40],l));
      px(x,gy-4,1,1,rgb(tint(Bm.accent),.5+.5*Math.sin(now/600))); break;
    case 'forge': {
      px(x-6,gy-8,13,8,C([60,48,50],l)); px(x-6,gy-8,13,1,C([84,68,70],l));
      const pulse=.5+.5*Math.sin(now/380);
      px(x-2,gy-5,5,4,rgb(mix([255,110,40],[255,220,130],pulse)));
      disc(x,gy-4,9,rgb([255,120,50],.13*pulse));
      px(x+3,gy-14,3,6,C([70,56,58],l));
      if(!REDUCED) for(let i=0;i<3;i++){ const t=((now/900)+i*.33)%1; px(x+4,gy-15-t*12,1,1,rgb([120,110,110],(1-t)*.5)); }
      break; }
    case 'gearworks': {
      px(x-7,gy-10,15,10,C([88,84,80],l));
      const ang=REDUCED?0:now/1400;
      for(let k=0;k<2;k++){
        const cx=x-3+k*7, r=3;
        disc(cx,gy-5,r,C([140,120,90],l));
        for(let t2=0;t2<6;t2++){ const a2=ang*(k?-1:1)+t2*1.047;
          px(cx+Math.round(Math.cos(a2)*(r+1)),gy-5+Math.round(Math.sin(a2)*(r+1)),1,1,C([160,138,104],l)); }
      }
      break; }
    case 'dish': {
      px(x,gy-10,2,10,C([150,142,170],l));
      for(let i=0;i<7;i++){ const ww=7-Math.abs(i-3)*1.4; px(x-3+Math.round(Math.abs(i-3)*.6),gy-14-i+3,Math.max(1,Math.round(ww)),1,C([190,182,210],l)); }
      px(x+1,gy-13,1,3,C(Bm.accent,l));
      if(night>.2) disc(x,gy-13,7,rgb(tint(Bm.accent),night*.10)); break; }
    case 'wolfrock': {
      tri(x,gy,Math.round(10*s),Math.round(12*s),C([120,134,150],l));
      tri(x,gy-Math.round(8*s),Math.round(5*s),Math.round(5*s),C([220,238,250],l)); break; }
    default:
      drawRock(Bm,x,gy,p,l,s);
  }
}

/* ---------- far silhouettes ---------- */
function farSil(Bm,x,gy,p,now){
  const c=CF(Bm.pal[0]), c2=CF(mix(Bm.pal[0],[255,255,255],.18));
  const s=.6+p.a*.8;
  switch(Bm.far){
    case 'hills': disc(x,gy+3,Math.round(14*s),c); break;
    case 'peaks': case 'snowpeaks': {
      const hh=Math.round(30*s);
      tri(x,gy,Math.round(30*s),hh,c);
      if(Bm.far==='snowpeaks') tri(x,gy-hh+Math.round(hh*.34),Math.round(11*s),Math.round(hh*.34),c2);
      break; }
    case 'mesa': {
      const hh=Math.round(18*s), w=Math.round(26*s);
      px(x-(w>>1),gy-hh,w,hh,c); px(x-(w>>1),gy-hh,w,2,c2); break; }
    case 'castle': {
      const hh=Math.round(24*s);
      px(x-14,gy-hh*.6,28,hh*.6,c);
      for(let i=0;i<28;i+=4) px(x-14+i,gy-hh*.6-2,2,2,c);
      px(x-6,gy-hh,5,hh,c); px(x+3,gy-hh*.85,5,hh*.85,c);
      tri(x-4,gy-hh,7,5,c); tri(x+5,gy-hh*.85,7,5,c); break; }
    case 'skyline': {
      const hh=Math.round((22+p.c*30)*s), w=Math.round((7+p.a*7));
      px(x-(w>>1),gy-hh,w,hh,c);
      const lit=clamp(night*1.5,0,1);
      if(lit>.1) for(let r=2;r<hh-1;r+=3) for(let cc=1;cc<w-1;cc+=2)
        if(hash2(p.wx+r*5,cc*3)>.55) px(x-(w>>1)+cc,gy-hh+r,1,1,rgb([255,226,150],lit*.5));
      px(x,gy-hh-3,1,3,c); break; }
    case 'spires': {
      const hh=Math.round((26+p.c*18)*s);
      for(let i=0;i<hh;i++){ const ww=Math.max(1,Math.round(6*(1-i/hh))); px(x-(ww>>1),gy-i,ww,1,c); }
      tri(x,gy-hh,5,7,c); break; }
    case 'brokentowers': {
      const hh=Math.round((16+p.c*14)*s);
      px(x-3,gy-hh,7,hh,c);
      px(x-3,gy-hh,3,3,c2);
      px(x+5,gy-Math.round(hh*.5),3,Math.round(hh*.5),c); break; }
    case 'isles': {
      const w=Math.round(18*s);
      disc(x,gy+2,w>>1,c);
      if(p.c>.55){ px(x-2,gy-6,1,6,c); disc(x-2,gy-7,2,c2); }
      break; }
    case 'volcano': {
      const hh=Math.round(34*s), w=Math.round(40*s);
      tri(x,gy,w,hh,c);
      px(x-3,gy-hh,7,2,rgb(mix(tint([255,90,40]),hazeCol,.35),.85));
      if(!REDUCED) for(let i=0;i<3;i++){ const t=((now/2200)+i*.33)%1;
        px(x+Math.round(Math.sin(t*5+i)*5),gy-hh-2-t*22,1+(t>.6?1:0),1,rgb([90,80,84],(1-t)*.45)); }
      break; }
    case 'stacks': {
      const hh=Math.round((24+p.c*14)*s);
      px(x-2,gy-hh,5,hh,c); px(x-3,gy-hh,7,2,c2);
      if(!REDUCED) for(let i=0;i<3;i++){ const t=((now/1800)+i*.33)%1;
        px(x+Math.round(Math.sin(t*4+i)*4),gy-hh-2-t*18,1,1,rgb([110,105,100],(1-t)*.4)); }
      break; }
    case 'domes': {
      disc(x,gy+1,Math.round(11*s),c);
      if(p.c>.6){ px(x+6,gy-9,1,9,c); disc(x+6,gy-10,2,c2); }
      break; }
    case 'mist': {
      px(x-14,gy-6,28,6,rgb(mix(tint(Bm.pal[0]),hazeCol,.6),.5));
      disc(x,gy-2,Math.round(10*s),c); break; }
    default: disc(x,gy+3,Math.round(12*s),c);
  }
}

/* ============================================================
   6b. WORLD EVENTS  (the easter eggs)
   ============================================================ */
function drawEvent(ev,Bm,x,gy,p,now){
  const lit=clamp(night*1.4,0,1);
  const bob=REDUCED?0:Math.sin(now/900+p.a*6)*2;
  switch(ev){

  case 'ufo': {                      /* farmland abduction */
    const hy=gy-34+Math.round(bob);
    const beam=.5+.5*Math.sin(now/1300+p.a*6);
    /* beam */
    for(let i=0;i<32;i++){
      const t=i/32, ww=2+t*9;
      px(x-(ww>>1),hy+4+i,ww,1,rgb([180,255,200],(.30-t*.22)*beam));
    }
    /* cow, rising and spinning */
    const cy=gy-4-beam*22, spin=Math.sin(now/300)>0;
    px(x-3,cy-3,7,3,rgb(tint([245,245,245])));
    px(spin?x-3:x+1,cy-3,3,2,rgb(tint([40,36,40])));
    px(x-2,cy,1,1,rgb(tint([220,220,220]))); px(x+2,cy,1,1,rgb(tint([220,220,220])));
    px(spin?x-4:x+4,cy-4,1,1,rgb(tint([245,245,245])));
    /* saucer */
    disc(x,hy,9,rgb(tint([150,158,176])));
    px(x-9,hy,19,2,rgb(tint([110,118,138])));
    disc(x,hy-3,4,rgb(mix(tint([170,220,255]),[220,255,255],.4)));
    for(let i=0;i<5;i++){
      const a2=now/500+i*1.26;
      px(x+Math.round(Math.cos(a2)*7),hy+1,1,1,rgb([255,240,140],.5+.5*Math.sin(now/200+i)));
    }
    disc(x,hy,16,rgb([160,255,200],.06*beam));
    break; }

  case 'parade': {                   /* marchers with flags */
    const n=6;
    for(let i=0;i<n;i++){
      const off=((now/34)+i*17)%150;
      const mx=Math.round(x-70+off), step=Math.floor(now/160+i)%2;
      const my=gy;
      const col=[[210,80,80],[80,120,210],[230,200,90],[120,200,130],[200,120,210],[240,240,240]][i%6];
      px(mx,my-6,2,4,rgb(tint(col)));
      px(mx,my-8,2,2,rgb(tint([240,208,170])));
      px(mx,my-2,1,2,rgb(tint([50,44,50]))); px(mx+1,my-2,1,2,rgb(tint(step?[50,44,50]:[70,64,70])));
      if(i%2===0){ px(mx+2,my-13,1,7,rgb(tint([120,90,60]))); px(mx+3,my-13,4,3,rgb(tint(Bm.accent))); }
    }
    if(!REDUCED) for(let i=0;i<8;i++){
      const t=((now/1600)+i*.125)%1;
      px(x-60+((i*37)%120),gy-30-t*10,1,1,rgb([255,220,120],(1-t)*.7));
    }
    break; }

  case 'dragon': {
    const dx=x+Math.sin(now/2600+p.a*6)*70, dy=gy-70+Math.sin(now/1400+p.a*6)*12;
    const flap=Math.sin(now/220)>0?-3:2;
    const c=rgb(tint(p.c>.5?[150,60,70]:[70,80,140]));
    px(dx-6,dy,13,2,c);
    px(dx+6,dy-1,3,2,c); px(dx+8,dy-2,2,2,c);
    px(dx-9,dy,4,1,c);
    px(dx-2,dy+flap,5,Math.abs(flap),c);
    px(dx+1,dy-flap,5,Math.abs(flap),c);
    px(dx+9,dy-1,1,1,rgb([255,200,60],.9));
    break; }

  case 'knight': {
    const off=((now/40)+p.a*100)%180, mx=Math.round(x-90+off);
    px(mx,gy-9,3,5,rgb(tint([180,186,196])));
    px(mx,gy-12,3,3,rgb(tint([200,206,216])));
    px(mx+1,gy-12,1,1,rgb(tint([40,40,50])));
    px(mx+3,gy-16,1,10,rgb(tint([140,120,90])));
    px(mx+3,gy-16,4,3,rgb(tint(Bm.accent)));
    px(mx,gy-4,1,4,rgb(tint([60,54,60]))); px(mx+2,gy-4,1,4,rgb(tint([60,54,60])));
    break; }

  case 'whale': {
    const t=(now/9000+p.a)%1;
    const wx2=x-60+t*120, arc=Math.sin(t*Math.PI);
    const wy=waterY-arc*26+8;
    const c=rgb(tint([70,96,130])), c2=rgb(tint([120,150,180]));
    disc(wx2,wy,7,c); px(wx2-9,wy+1,20,4,c);
    px(wx2-11,wy-2,5,3,c);          /* tail */
    px(wx2+6,wy+1,8,2,c2);
    px(wx2+4,wy-2,1,1,rgb(tint([240,240,250])));
    if(arc>.7){ for(let i=0;i<7;i++) px(wx2+2,wy-8-i,1,1,rgb([220,240,255],(1-i/7)*.7)); }
    break; }

  case 'ship': {
    const wx2=x+Math.sin(now/6000+p.a*6)*40, wy=waterY-2+Math.sin(now/900)*1;
    const c=rgb(tint([104,74,50])), s2=rgb(tint([238,234,224]));
    px(wx2-8,wy-3,17,3,c); px(wx2-6,wy-4,13,1,rgb(tint([130,96,66])));
    px(wx2,wy-16,1,13,c);
    px(wx2-6,wy-15,6,10,s2); px(wx2+1,wy-13,6,8,s2);
    px(wx2,wy-17,4,2,rgb(tint(Bm.accent)));
    break; }

  case 'kraken': {
    const t=(now/11000+p.a)%1;
    if(t<.55){
      const a2=Math.sin(t/.55*Math.PI);
      for(let k=0;k<4;k++){
        const bx=x-18+k*12, len=Math.round(16*a2*(.6+k*.13));
        for(let i=0;i<len;i++)
          px(bx+Math.round(Math.sin(i*.4+k+now/600)*3),waterY-i,2,1,rgb(tint([90,60,110])));
        px(bx,waterY-len,2,2,rgb(tint([120,80,150])));
      }
    }
    break; }

  case 'airship': {
    const ax=x+Math.sin(now/5000+p.a*6)*60, ay=gy-58+Math.sin(now/1700)*4;
    const c=rgb(tint([176,150,110])), c2=rgb(tint([130,108,78]));
    disc(ax,ay,6,c); px(ax-13,ay-4,27,9,c); px(ax-13,ay+3,27,2,c2);
    px(ax-4,ay+5,9,4,rgb(tint([110,84,58])));
    px(ax+13,ay-1,4,3,c2);
    if(!REDUCED) px(ax-16,ay+1,3,1,rgb(tint([90,80,70])));
    for(let i=0;i<3;i++) px(ax-9+i*8,ay+5,1,1,rgb([255,220,140],lit));
    break; }

  case 'blimp': case 'satellite': {
    const ax=x+Math.sin(now/6000+p.a*6)*70, ay=gy-72;
    px(ax-9,ay,19,7,rgb(tint([220,220,230])));
    px(ax-9,ay+5,19,2,rgb(tint([180,180,195])));
    px(ax-3,ay+7,7,3,rgb(tint([80,84,96])));
    px(ax-4,ay+2,9,2,rgb(tint(Bm.accent)));
    break; }

  case 'helicopter': case 'drone': {
    const ax=x+Math.sin(now/2200+p.a*6)*46, ay=gy-52+Math.sin(now/700)*3;
    const c=rgb(tint([90,96,110]));
    px(ax-4,ay,9,4,c); px(ax+4,ay+1,6,1,c);
    const spin=Math.floor(now/60)%2;
    px(ax-(spin?8:3),ay-2,spin?17:7,1,rgb(tint([150,156,170])));
    px(ax,ay-3,1,1,c);
    if(lit>.2) px(ax-4,ay+2,1,1,rgb([255,90,90],lit));
    break; }

  case 'balloon': {
    const ax=x+Math.sin(now/4000+p.a*6)*36, ay=gy-64+Math.sin(now/2000)*7;
    const c1=rgb(tint([225,90,90])), c2=rgb(tint([240,225,200]));
    for(let i=-7;i<=7;i++){
      const ww=Math.round(Math.sqrt(Math.max(0,49-i*i)));
      px(ax-ww,ay+i,ww*2+1,1,(Math.floor((i+7)/3)%2)?c1:c2);
    }
    px(ax-2,ay+8,5,1,rgb(tint([120,96,64])));
    px(ax-2,ay+9,5,4,rgb(tint([150,116,76])));
    break; }

  case 'rift': {                     /* a tear showing another reality */
    const rx=x, ry=gy-30+bob, pulse=.55+.45*Math.sin(now/700+p.a*6);
    const other=BIOMES[Math.floor(hash1(Math.floor(p.wx/97))*BIOMES.length)%BIOMES.length];
    for(let i=-14;i<=14;i++){
      const ww=Math.round(Math.cos(i/14*1.55)*7*pulse);
      if(ww<1) continue;
      px(rx-ww,ry+i,ww*2,1,rgb(mix(other.pal[3],other.sky[0],.5)));
    }
    for(let i=-15;i<=15;i++){
      const ww=Math.round(Math.cos(i/15*1.55)*8*pulse);
      px(rx-ww-1,ry+i,1,1,rgb(mix(tint(Bm.accent),[255,255,255],.4),.9));
      px(rx+ww,ry+i,1,1,rgb(mix(tint(Bm.accent),[255,255,255],.4),.9));
    }
    disc(rx,ry,Math.round(20*pulse),rgb(tint(Bm.accent),.08));
    break; }

  case 'pixie': case 'crane': case 'raven': case 'vulture': case 'heron': {
    const n=ev==='pixie'?5:3;
    for(let i=0;i<n;i++){
      const t=((now/7000)+i*.14+p.a)%1;
      const bx=x-80+t*160, by=gy-40-Math.sin(t*Math.PI)*22+Math.sin(now/300+i)*2;
      if(ev==='pixie'){
        px(bx,by,1,1,rgb(tint(Bm.accent)));
        disc(bx,by,3,rgb(tint(Bm.accent),.16+.10*Math.sin(now/200+i)));
      }else{
        const up=Math.sin(now/180+i)>0?-1:1;
        const c=rgb(tint(ev==='crane'?[240,240,244]:ev==='raven'?[36,32,40]:[70,60,54]));
        px(bx,by,1,1,c); px(bx-1,by+up,1,1,c); px(bx+1,by+up,1,1,c);
      }
    }
    break; }

  case 'deer': case 'mammoth': case 'sled': case 'tractor': case 'caravan': case 'cart': {
    const off=((now/(ev==='mammoth'?70:46))+p.a*200)%260, mx=Math.round(x-130+off);
    if(ev==='deer'){
      const c=rgb(tint([150,104,66]));
      px(mx,gy-6,7,3,c); px(mx+6,gy-9,2,4,c); px(mx+5,gy-11,1,2,c); px(mx+8,gy-11,1,2,c);
      const st=Math.floor(now/200)%2;
      px(mx+1,gy-3,1,3,c); px(mx+5,gy-3,1,3,c); px(mx+(st?2:4),gy-3,1,3,c);
    }else if(ev==='mammoth'){
      const c=rgb(tint([120,86,70]));
      px(mx,gy-11,15,8,c); px(mx+14,gy-10,4,5,c);
      px(mx+16,gy-6,4,1,rgb(tint([230,226,210])));
      px(mx+2,gy-3,2,3,c); px(mx+10,gy-3,2,3,c);
    }else if(ev==='tractor'){
      px(mx,gy-7,11,4,rgb(tint([200,80,60])));
      px(mx+7,gy-11,5,4,rgb(tint([200,80,60])));
      disc(mx+2,gy-2,2,rgb(tint([50,46,50]))); disc(mx+9,gy-3,3,rgb(tint([50,46,50])));
      if(!REDUCED) for(let i=0;i<2;i++){ const t=((now/700)+i*.5)%1; px(mx+9,gy-13-t*8,1,1,rgb([120,110,105],(1-t)*.5)); }
    }else if(ev==='sled'){
      px(mx,gy-4,11,3,rgb(tint([140,100,60]))); px(mx-1,gy-1,13,1,rgb(tint([180,190,205])));
      px(mx+3,gy-8,3,4,rgb(tint([200,80,80])));
      for(let d2=0;d2<2;d2++){ const dx2=mx+13+d2*6, st=Math.floor(now/160+d2)%2;
        px(dx2,gy-5,5,3,rgb(tint([200,196,190]))); px(dx2+4,gy-7,2,2,rgb(tint([200,196,190])));
        px(dx2+1,gy-2,1,2,rgb(tint([170,166,160]))); px(dx2+(st?2:3),gy-2,1,2,rgb(tint([170,166,160]))); }
    }else{ /* caravan / cart */
      const c=rgb(tint([150,116,72]));
      px(mx,gy-8,13,5,c); px(mx,gy-10,13,2,rgb(tint(Bm.accent)));
      disc(mx+3,gy-2,2,rgb(tint([90,70,50]))); disc(mx+10,gy-2,2,rgb(tint([90,70,50])));
      if(ev==='caravan'){ const cx2=mx+17; px(cx2,gy-9,5,5,rgb(tint([190,160,110]))); px(cx2+4,gy-12,2,4,rgb(tint([190,160,110])));
        px(cx2+1,gy-4,1,4,rgb(tint([170,140,95]))); px(cx2+3,gy-4,1,4,rgb(tint([170,140,95]))); }
    }
    break; }

  case 'ghost': case 'witch': case 'moonbeast': {
    const t=(now/6000+p.a)%1;
    const gx=x-50+t*100, gy2=gy-26+Math.sin(now/700)*4;
    if(ev==='witch'){
      px(gx-5,gy2+3,13,1,rgb(tint([110,86,58])));
      px(gx,gy2-4,3,7,rgb(tint([60,50,80])));
      tri(gx+1,gy2-4,7,4,rgb(tint([60,50,80])));
      px(gx+1,gy2-1,1,1,rgb(tint([250,220,190])));
    }else{
      const a2=.55+.25*Math.sin(now/800);
      disc(gx,gy2,4,rgb([230,235,255],a2*.55));
      px(gx-4,gy2,9,4,rgb([230,235,255],a2*.4));
      px(gx-2,gy2-1,1,1,rgb([40,40,60],a2)); px(gx+2,gy2-1,1,1,rgb([40,40,60],a2));
    }
    break; }

  case 'meteor': case 'comet': {
    const t=(now/5200+p.a)%1;
    if(t<.42){
      const mt=t/.42, mx=x-70+mt*150, my=gy-100+mt*70;
      for(let i=0;i<10;i++) px(mx-i*2.2,my-i*1.1,2,1,rgb([255,180+i*4,90],(1-i/10)*.8));
      px(mx,my,2,2,rgb([255,240,200]));
    }
    break; }

  case 'lavaburst': case 'steamburst': case 'bubble': case 'crop': {
    const t=(now/3400+p.a)%1;
    const hot=ev==='lavaburst';
    for(let i=0;i<7;i++){
      const a2=i/7*Math.PI, sp=t*20;
      const bx=x+Math.cos(a2)*sp*1.3, by=gy-Math.sin(a2)*sp+t*t*14;
      if(ev==='crop'){ if(t<.05) px(x-14,gy-1,29,1,rgb(tint([210,190,110]))); break; }
      px(bx,by,1,1,rgb(hot?[255,140,50]:ev==='bubble'?[170,210,170]:[210,215,220],(1-t)*.75));
    }
    if(ev==='crop'){ /* crop circle glyph */
      for(let i=0;i<12;i++){ const a2=i/12*6.283;
        px(x+Math.round(Math.cos(a2)*11),gy-1+Math.round(Math.sin(a2)*3),1,1,rgb(tint([190,170,95]))); }
      disc(x,gy-1,3,rgb(tint([190,170,95])));
    }
    break; }

  case 'phoenix': {
    const t=(now/8000+p.a)%1;
    const fx2=x-80+t*160, fy=gy-70-Math.sin(t*Math.PI)*20;
    const up=Math.sin(now/160)>0?-3:2;
    px(fx2-4,fy,9,2,rgb([255,150,50]));
    px(fx2-2,fy+up,5,Math.abs(up),rgb([255,200,80]));
    px(fx2+1,fy-up,5,Math.abs(up),rgb([255,200,80]));
    for(let i=1;i<7;i++) px(fx2-4-i*2,fy+1,2,1,rgb([255,120,40],(1-i/7)*.7));
    break; }

  case 'aurora': break;              /* handled in the sky pass */
  case 'digsite': {
    px(x-9,gy-1,19,1,rgb(tint([150,130,100])));
    px(x-6,gy-6,1,5,rgb(tint([120,96,64]))); px(x-7,gy-7,3,1,rgb(tint([120,96,64])));
    px(x+3,gy-4,5,3,rgb(tint([210,200,180])));
    px(x+4,gy-7,1,3,rgb(tint([180,170,150])));
    break; }
  case 'mirage': {
    const a2=.25+.2*Math.sin(now/1600+p.a*6);
    for(let i=0;i<9;i++) px(x-11+i*3,gy-9-Math.round(Math.sin(now/500+i)*1.5),2,7,rgb([170,220,235],a2*.4));
    px(x-11,gy-2,25,1,rgb([200,235,245],a2)); break; }
  case 'festival': {
    for(let i=0;i<9;i++){
      const lx=x-32+i*8, ly=gy-24+Math.sin(i*.9)*3;
      px(lx,ly,2,3,rgb(mix(tint([255,120,150]),[255,230,160],(i%3)/2)));
      if(lit>.2) disc(lx,ly+1,4,rgb([255,180,140],lit*.13));
    }
    px(x-34,gy-26,70,1,rgb(tint([90,70,60])));
    break; }
  case 'cat': {                       /* the mascot, out for a walk */
    const c=rgb(tint([255,217,160])), o=rgb(tint([43,29,47]));
    const bobc=Math.floor(now/500)%2;
    px(x-3,gy-5,7,4,c); px(x-3,gy-5,7,1,o);
    px(x-4,gy-7,4,3,c); px(x-4,gy-8,1,1,c); px(x-1,gy-8,1,1,c);
    px(x-3,gy-6,1,1,o); px(x-1,gy-6,1,1,o);
    px(x+4,gy-7-bobc,1,3,c);
    px(x-2,gy-1,1,1,o); px(x+2,gy-1,1,1,o);
    break; }
  }
}

/* ============================================================
   7. SCENE RENDER
   ============================================================ */
const cv=$('scene'), g=cv.getContext('2d',{alpha:false});
const fxc=$('fx'),  gf=fxc.getContext('2d');
let W=0,H=0,PX=4,horizon=0,vign=null,waterY=0;
let stars=[],clouds=[],flies=[],birds=[],rainP=[],snowP=[],splash=[],fgP=[],amb=[];
let colH=[null,null,null], colW=null;
let builtW=-1,builtH=-1;

function build(){
  builtW=innerWidth; builtH=innerHeight;
  PX = innerWidth<640 ? 3 : 4;
  W = Math.max(16,Math.ceil(innerWidth/PX)); H = Math.max(16,Math.ceil(innerHeight/PX));
  cv.width=W; cv.height=H; fxc.width=W; fxc.height=H;
  g.imageSmoothingEnabled=false; gf.imageSmoothingEnabled=false;
  horizon = Math.round(H*.87);
  colH=[new Int16Array(W),new Int16Array(W),new Int16Array(W)];
  colW=new Float32Array(W);

  const r=seeded(20260811);
  stars=[];
  for(let i=0;i<120;i++) stars.push({x:(r()*W)|0,y:(r()*horizon*.86)|0,p:r()*6.283,s:r()<.10?2:1});
  clouds=[];
  for(let i=0;i<15;i++){
    const w=(10+r()*24)|0, parts=[];
    for(let j=0;j<4+((r()*3)|0);j++)
      parts.push({dx:(r()*w)|0,dy:((r()*4)|0),w:(4+r()*9)|0,h:(3+r()*3)|0});
    clouds.push({x:r()*W,y:5+r()*(horizon*.50),w:w,sp:.8+r()*1.8,parts:parts,th:i/15});
  }
  flies=[]; for(let i=0;i<16;i++) flies.push({x:r()*W,y:horizon-6-r()*26,p:r()*6.283,q:r()*6.283,sp:.35+r()*.5});
  amb=[];  for(let i=0;i<34;i++) amb.push({x:r()*W,y:r()*horizon,p:r()*6.283,v:.3+r(),s:r()});
  const grd=g.createRadialGradient(W/2,H*.45,H*.2,W/2,H*.5,H*.95);
  grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,'rgba(0,0,0,.18)');
  vign=grd;
  rainP=[];snowP=[];splash=[];fgP=[];
  chunkCache.clear();
}

/* lighting */
let light=1,night=0,warm=0,sunAlt=0,skyBands=[],bandH=1;
const NIGHT_MUL=[.24,.28,.50];
function tint(base,extraWarm){
  const c=[base[0]*lerp(NIGHT_MUL[0],1,light),base[1]*lerp(NIGHT_MUL[1],1,light),base[2]*lerp(NIGHT_MUL[2],1,light)];
  const w=warm*(extraWarm===undefined?1:extraWarm);
  const out=w>0?mix(c,[255,152,96],w*.30):c;
  return cur.dark>.02?mix(out,[78,88,104],cur.dark*.30):out;
}
const skyAt=y=>skyBands[clamp((y/bandH)|0,0,skyBands.length-1)]||skyBands[0];

function fillRidge(l,color){
  const a=colH[l];
  g.beginPath(); g.moveTo(0,H);
  for(let x=0;x<W;x++){ g.lineTo(x,a[x]); g.lineTo(x+1,a[x]); }
  g.lineTo(W,H); g.closePath();
  g.fillStyle=color; g.fill();
}
function capRidge(l,color,thick){
  const a=colH[l];
  g.beginPath();
  for(let x=0;x<W;x++) g.rect(x,a[x],1,thick);
  g.fillStyle=color; g.fill();
}
/* per-column palette blend, so biome borders are spatial not sudden */
function colColor(x,cx,idx){
  const bl=blendAt(cx+x);
  const A=BIOMES[bl.a].pal[idx], Bp=BIOMES[bl.b].pal[idx];
  return bl.a===bl.b?A:mix(A,Bp,bl.t);
}
/* draws a terrain layer, recolouring wherever the biome changes across the screen */
function paintLayer(l,idx,hazeAmt,snowAmt){
  const a=colH[l], cx=camX();
  let runStart=0, runCol=colColor(0,cx,idx);
  const flush=(x0,x1,col)=>{
    let c=tint(col);
    if(hazeAmt) c=mix(c,hazeCol,hazeAmt);
    if(snowAmt) c=mix(c,tint(SNOWC),snowAmt);
    g.fillStyle=rgb(c);
    g.beginPath(); g.moveTo(x0,H);
    for(let x=x0;x<x1;x++){ g.lineTo(x,a[x]); g.lineTo(x+1,a[x]); }
    g.lineTo(x1,H); g.closePath(); g.fill();
  };
  const STEP=6;
  for(let x=STEP;x<W;x+=STEP){
    const c=colColor(x,cx,idx);
    if(Math.abs(c[0]-runCol[0])+Math.abs(c[1]-runCol[1])+Math.abs(c[2]-runCol[2])>6){
      flush(runStart,x+1,runCol); runStart=x; runCol=c;
    }
  }
  flush(runStart,W,runCol);
}
const SNOWC=hex('#f3f8ff');

let lightning=0,lightningNext=3000;

function drawScene(dt,now){
  const h=hourNow(), cx=camX();
  sunAlt=Math.sin((h-6)/12*Math.PI);
  const gloom=cur.dark;
  light=clamp(sunAlt*1.10+.34,0,1)*(1-gloom*.42);
  night=clamp(-sunAlt*1.8+.06,0,1);
  warm=clamp(1-Math.abs(sunAlt)*4.2,0,1)*(1-gloom*.6);

  /* biome at screen centre drives sky mood + ambient */
  const bc=blendAt(cx+W/2);
  const BA=BIOMES[bc.a], BB=BIOMES[bc.b];

  /* ---- sky ---- */
  const k=skyKeys(h);
  let top=k[0],midc=k[1],bot=k[2];
  const bTint=mix(BA.sky[0],BB.sky[0],bc.t), bAmt=lerp(BA.sky[1],BB.sky[1],bc.t)*(0.35+light*.65);
  top=mix(top,bTint,bAmt*.85); midc=mix(midc,bTint,bAmt); bot=mix(bot,bTint,bAmt*.75);
  if(gloom>0){
    const overcast=mix([124,128,138],[62,66,78],clamp(gloom*1.15,0,1));
    const gray=mix([20,24,36],overcast,clamp(sunAlt*1.2+.35,0,1));
    top =mix(top ,gray,                       clamp(gloom*1.15,0,.93));
    midc=mix(midc,mix(gray,[255,255,255],.06),clamp(gloom*1.05,0,.88));
    bot =mix(bot ,mix(gray,[255,255,255],.16),clamp(gloom*.92 ,0,.85));
  }
  const N=20; bandH=horizon/N; skyBands=[];
  for(let i=0;i<N;i++){
    const p=i/(N-1), e=p*p*.55+p*.45;
    skyBands.push(e<.5?mix(top,midc,e*2):mix(midc,bot,(e-.5)*2));
  }
  for(let i=0;i<N;i++){ g.fillStyle=rgb(skyBands[i]); g.fillRect(0,Math.round(i*bandH),W,Math.ceil(bandH)+1); }
  g.fillStyle=rgb(skyBands[N-1]); g.fillRect(0,horizon-2,W,H-horizon+2);
  hazeCol=skyBands[N-1];

  /* ---- stars ---- */
  if(night>.02){
    for(let i=0;i<stars.length;i++){
      const s=stars[i], tw=.55+.45*Math.sin(now/620+s.p);
      g.fillStyle=rgb([255,252,236],night*tw*.95);
      g.fillRect(s.x,s.y,s.s,s.s);
    }
  }
  /* aurora — tundra nights */
  const auroraAmt=(BA.id==='tundra'?1-bc.t:0)+(BB.id==='tundra'?bc.t:0);
  if(auroraAmt>.02&&night>.35&&cur.cloud<.6){
    for(let b2=0;b2<3;b2++)
      for(let x=0;x<W;x+=2){
        const yy=horizon*.22+Math.sin(x*.026+now/2600+b2*1.7)*13+b2*9;
        const a2=(.16-b2*.035)*night*auroraAmt*(1-cur.cloud);
        g.fillStyle=rgb(b2===1?[120,255,190]:[150,120,255],a2);
        g.fillRect(x,yy,2,Math.round(16+Math.sin(x*.04+now/1900)*7));
      }
  }
  /* second moon / ringed planet for the stranger realities */
  const oddAmt=(BA.id==='outpost'||BA.id==='feywild'?1-bc.t:0)+(BB.id==='outpost'||BB.id==='feywild'?bc.t:0);
  if(oddAmt>.03){
    const px2=Math.round(W*.20), py2=Math.round(horizon*.24);
    const col=BB.id==='feywild'||BA.id==='feywild'?[255,150,210]:[170,220,255];
    disc(px2,py2,10,rgb(col,.5*oddAmt*(0.35+night*.65)));
    disc(px2-2,py2-2,4,rgb(mix(col,[255,255,255],.4),.35*oddAmt));
    for(let i=-16;i<=16;i++) px(px2+i,py2+Math.round(i*.28),1,1,rgb(mix(col,[255,255,255],.5),.28*oddAmt));
  }

  /* ---- sun / moon ---- */
  const arcTop=horizon*.14, arcH=horizon-arcTop;
  let sunX=-999,sunY=0;
  if(sunAlt>-.18){
    sunX=Math.round(W*clamp((h-5.6)/12.8,-.1,1.1));
    sunY=Math.round(horizon-8-Math.max(0,sunAlt)*arcH*.96);
    const glow=mix([255,214,120],[255,150,90],warm);
    disc(sunX,sunY,10,rgb(glow,.10*clamp(sunAlt*3,0,1)));
    disc(sunX,sunY,7,rgb(glow,.20*clamp(sunAlt*3,0,1)));
    disc(sunX,sunY,5,rgb(mix([255,240,190],[255,168,96],warm)));
    disc(sunX,sunY,4,rgb(mix([255,252,226],[255,206,140],warm*.8)));
  }
  if(night>.02){
    const mh=(h+12)%24, mAlt=Math.sin((mh-6)/12*Math.PI);
    if(mAlt>-.18){
      const px2=Math.round(W*clamp((mh-5.6)/12.8,-.1,1.1));
      const py2=Math.round(horizon-8-Math.max(0,mAlt)*arcH*.90);
      disc(px2,py2,8,rgb([210,224,255],.10*night));
      disc(px2,py2,5,rgb([246,246,226],night));
      disc(px2-1,py2-1,1,rgb([214,214,196],night));
      disc(px2+2,py2+1,1,rgb([214,214,196],night));
      disc(px2+3,py2-2,3,rgb(skyAt(py2),night*.92));
      if(sunX<-100){ sunX=px2; sunY=py2; }
    }
  }

  /* ---- clouds ---- */
  for(let i=0;i<clouds.length;i++){
    const c=clouds[i];
    c.x-=(c.sp*(REDUCED?.25:1)*(1+cur.rain*.9)+SPEED*.055)*dt;
    if(c.x<-c.w-18) c.x=W+8+Math.random()*44;
    const vis=clamp((cur.cloud-c.th*.92)*4,0,1);
    if(vis<=.02) continue;
    const body=mix(tint([255,255,255],1.2),[186,196,214],cur.dark*.7);
    const shade=mix(body,[120,132,158],.35);
    g.globalAlpha=vis*(.85+light*.15);
    for(let j=0;j<c.parts.length;j++){
      const q=c.parts[j], x2=Math.round(c.x+q.dx), y2=Math.round(c.y+q.dy);
      g.fillStyle=rgb(shade); g.fillRect(x2,y2+q.h-1,q.w,1);
      g.fillStyle=rgb(body);  g.fillRect(x2,y2,q.w,q.h-1);
    }
    g.globalAlpha=1;
  }

  /* ---- terrain columns ---- */
  for(let l=0;l<3;l++){
    const a=colH[l];
    for(let x=0;x<W;x++) a[x]=terrainY(cx+x,l);
  }
  /* water level + per-column water amount */
  let anyWater=0;
  waterY=horizon;
  for(let x=0;x<W;x++){
    const bl=blendAt(cx+x);
    const wa=(BIOMES[bl.a].water?1-bl.t:0)+(BIOMES[bl.b].water?bl.t:0);
    colW[x]=wa; if(wa>anyWater) anyWater=wa;
  }
  if(anyWater>.02){
    const wb=BA.water||BB.water;
    waterY=Math.round(horizon-(wb?wb.rise:.02)*H);
  }
  const cov=clamp(cur.cover,0,1);

  paintLayer(0,0,.45,cov*.45);
  drawLayerProps(0,now,cx);
  paintLayer(1,1,.16,cov*.6);
  capRidge(1,rgb(mix(mix(tint(colColor(W>>1,cx,2)),hazeCol,.16),tint(SNOWC),cov*.65)),1);
  drawLayerProps(1,now,cx);
  paintLayer(2,3,0,cov*.82);
  capRidge(2,rgb(mix(tint(colColor(W>>1,cx,4)),tint(SNOWC),cov*.9)),2);
  px(0,H-Math.round(H*.035),W,Math.round(H*.035),rgb(tint(colColor(W>>1,cx,5))));

  /* ground speckle — keeps the foreground from reading as a flat slab */
  const dirtTop=H-Math.round(H*.035);
  for(let x=0;x<W;x+=2){
    if(colW[x]>.5) continue;
    const wx=Math.floor(cx+x), gy=colH[2][x];
    const sc=rgb(mix(tint(mix(colColor(x,cx,3),SNOWC,cov*.82)),[0,0,0],.16));
    for(let k2=0;k2<3;k2++){
      if(hash2(wx+k2*4099,k2*31)>.34) continue;
      const yy=gy+5+k2*8+Math.floor(hash2(wx,k2*17)*7);
      if(yy>=dirtTop) continue;
      px(x,yy,1+(hash2(wx,k2)<.3?1:0),1,sc);
    }
  }

  /* ---- water ---- */
  if(anyWater>.02){
    const wb=BA.water||BB.water||{c:hex('#2f7fb0'),alpha:.85};
    const wc=tint(wb.c);
    const shallow=mix(wc,[255,255,255],.30), deep=mix(wc,[0,0,0],.30);
    for(let x=0;x<W;x++){
      const a2=colW[x]*wb.alpha; if(a2<=.02) continue;
      const wave=Math.round(Math.sin((cx+x)*.09+now/700)*1.2
                          +Math.sin((cx+x)*.031-now/1500)*1.6);
      const top=waterY+wave;
      g.fillStyle=rgb(deep,a2);   g.fillRect(x,top,1,H-top);
      g.fillStyle=rgb(wc,a2);     g.fillRect(x,top,1,Math.round(H*.06));
      g.fillStyle=rgb(shallow,a2);g.fillRect(x,top,1,3);
    }
    /* crest highlights + swell lines */
    g.fillStyle=rgb(mix(wc,[255,255,255],.62),.75*anyWater);
    for(let x=0;x<W;x++){
      if(colW[x]<.3) continue;
      const wave=Math.round(Math.sin((cx+x)*.09+now/700)*1.2
                          +Math.sin((cx+x)*.031-now/1500)*1.6);
      if(Math.sin((cx+x)*.21+now/520)>.55) g.fillRect(x,waterY+wave,1,1);
    }
    g.fillStyle=rgb(mix(wc,[255,255,255],.35),.30*anyWater);
    for(let row=0;row<5;row++){
      const yy=waterY+6+row*Math.round(H*.022);
      if(yy>=H) break;
      for(let x=0;x<W;x+=3){
        if(colW[x]<.3) continue;
        if(Math.sin((cx+x)*.055+now/900+row*2.1)>.60) g.fillRect(x,yy,2,1);
      }
    }
    /* sun / moon glitter */
    if(sunX>-100&&sunX<W+40&&anyWater>.3){
      for(let i=0;i<12;i++){
        const yy=waterY+2+i*2;
        if(yy>=H) break;
        const jitter=Math.round(Math.sin(now/300+i*1.3)*(1+i*.4));
        g.fillStyle=rgb(mix([255,240,190],wc,.25),(.30-i*.022)*anyWater*(light*.6+.4));
        g.fillRect(sunX+jitter-1,yy,2+((i%3)|0),1);
      }
    }
  }

  drawLayerProps(2,now,cx);
  drawGrass(now,cx,cov);

  /* ---- ambient per-biome particles ---- */
  drawAmbient(dt,now,BA,BB,bc.t);

  /* ---- fireflies ---- */
  if(night>.45&&cur.rain<.2&&cur.snow<.2){
    const a2=night*(1-cur.rain);
    for(let i=0;i<flies.length;i++){
      const f=flies[i];
      const x2=Math.round(f.x+Math.sin(now/900*f.sp+f.p)*9);
      const y2=Math.round(f.y+Math.cos(now/1100*f.sp+f.q)*5);
      const pulse=.35+.65*Math.abs(Math.sin(now/700+f.p));
      g.fillStyle=rgb([190,255,120],a2*pulse*.22); g.fillRect(x2-1,y2-1,3,3);
      g.fillStyle=rgb([226,255,168],a2*pulse);     g.fillRect(x2,y2,1,1);
    }
  }

  drawBirds(dt,now);
  drawRain(dt); drawSnow(dt,now);

  if(!REDUCED&&wxKey==='storm'&&cur.rain>.6){
    lightningNext-=dt*1000;
    if(lightningNext<=0){ lightning=1; lightningNext=2600+Math.random()*7000; }
  }
  if(lightning>0){
    lightning=Math.max(0,lightning-dt*3.2);
    g.fillStyle='rgba(226,238,255,'+(lightning>.7?.30:lightning*.20)+')';
    g.fillRect(0,0,W,H);
  }
  g.fillStyle=vign; g.fillRect(0,0,W,H);
}

/* props for one layer across the visible span */
function drawLayerProps(l,now,cx){
  const c0=Math.floor((cx-90)/CHUNK), c1=Math.floor((cx+W+90)/CHUNK);
  for(let ci=c0;ci<=c1;ci++){
    const list=chunkProps(l,ci);
    for(let i=0;i<list.length;i++){
      const p=list[i], sx=Math.round(p.wx-cx);
      if(sx<-70||sx>W+70) continue;
      const gx=clamp(sx,0,W-1);
      let gy=colH[l][gx];
      if(colW[gx]>.5&&(p.k==='event'||p.k==='small')&&BIOMES[p.b].water) gy=waterY;
      drawProp(p,l,sx,gy,now);
    }
  }
}

function drawGrass(now,cx,cov){
  const step=Math.max(2,Math.round(W/110));
  for(let x=1;x<W;x+=step){
    const bl=blendAt(cx+x);
    const gr=(BIOMES[bl.a].grass?1-bl.t:0)+(BIOMES[bl.b].grass?bl.t:0);
    if(gr<.35||colW[x]>.5) continue;
    const base=mix(colColor(x,cx,4),SNOWC,cov*.75);
    const hh=1+(Math.floor(hash2(Math.floor(cx+x),7)*3));
    const s=REDUCED?0:Math.round(Math.sin(now/700+(cx+x)*.1)*.6);
    const c=rgb(tint(x%3===0?mix(base,[255,255,255],.22):base));
    const gy=colH[2][x];
    for(let k2=0;k2<hh;k2++) px(x+(k2===hh-1?s:0),gy-1-k2,1,1,c);
    if(hash2(Math.floor(cx+x),19)<.13){
      px(x+1,gy-hh-1,1,1,rgb(tint(BIOMES[bl.t<.5?bl.a:bl.b].accent)));
    }
  }
}

/* biome ambient particles */
function drawAmbient(dt,now,BA,BB,t){
  const kind=(t<.5?BA.amb:BB.amb);
  if(!kind) return;
  const strength=t<.5?1-t*2:(t-.5)*2;
  for(let i=0;i<amb.length;i++){
    const a=amb[i];
    switch(kind){
      case 'petal':
        a.y+=a.v*7*dt; a.x+=Math.sin(now/1200+a.p)*.5-SPEED*dt*.5;
        px(a.x,a.y,1,1,rgb([255,170,205],.75*strength)); break;
      case 'sand':
        a.x-=(28+a.v*30)*dt; a.y+=Math.sin(now/500+a.p)*.25;
        px(a.x,a.y,2,1,rgb([226,200,150],.30*strength)); break;
      case 'ember':
        a.y-=(9+a.v*13)*dt; a.x+=Math.sin(now/600+a.p)*.4;
        px(a.x,a.y,1,1,rgb([255,140,50],.75*strength*(a.s*.6+.4))); break;
      case 'ash':
        a.y+=(5+a.v*7)*dt; a.x+=Math.sin(now/900+a.p)*.35;
        px(a.x,a.y,1,1,rgb([170,168,164],.42*strength)); break;
      case 'wisp': {
        const yy=a.y+Math.sin(now/1100+a.p)*8;
        a.x-=SPEED*dt*.4;
        const pu=.4+.6*Math.abs(Math.sin(now/900+a.p));
        px(a.x,yy,1,1,rgb([150,255,210],.8*strength*pu));
        disc(a.x,yy,2,rgb([120,255,190],.10*strength*pu)); break; }
      case 'spark': {
        const pu=.3+.7*Math.abs(Math.sin(now/500+a.p*3));
        a.y-=(4+a.v*6)*dt;
        px(a.x,a.y,1,1,rgb([180,240,255],.7*strength*pu)); break; }
      case 'pollen':
        a.y+=Math.sin(now/1500+a.p)*.22; a.x-=(4+a.v*5)*dt;
        px(a.x,a.y,1,1,rgb([255,244,180],.45*strength)); break;
      case 'drift':
        a.x-=(20+a.v*22)*dt; a.y+=Math.sin(now/800+a.p)*.3;
        px(a.x,a.y,1,1,rgb([236,246,255],.5*strength)); break;
    }
    if(a.x<-4) a.x=W+4; if(a.x>W+4) a.x=-4;
    if(a.y>horizon) a.y=0; if(a.y<-4) a.y=horizon;
  }
}

function drawBirds(dt,now){
  if(light>.55&&cur.rain<.2&&birds.length===0&&Math.random()<dt*.05){
    const n=3+((Math.random()*3)|0), dir=Math.random()<.5?1:-1;
    const by=8+Math.random()*(horizon*.35);
    for(let i=0;i<n;i++)
      birds.push({x:dir>0?-8-i*7:W+8+i*7,y:by+(i%2?2:-1)+i*1.2,d:dir,sp:9+Math.random()*5,p:Math.random()*6.283});
  }
  for(let i=birds.length-1;i>=0;i--){
    const b=birds[i];
    b.x+=b.d*b.sp*dt;
    if(b.x<-20||b.x>W+20){ birds.splice(i,1); continue; }
    const up=Math.sin(now/110+b.p)>0?-1:1;
    g.fillStyle=rgb(tint([46,52,70],0));
    const bx=Math.round(b.x), by=Math.round(b.y+Math.sin(now/700+b.p));
    g.fillRect(bx,by,1,1); g.fillRect(bx-1,by+up,1,1); g.fillRect(bx+1,by+up,1,1);
  }
}

function drawRain(dt){
  const want=Math.round(W*.95*cur.rain*(REDUCED?.4:1));
  while(rainP.length<want) rainP.push({x:Math.random()*W,y:Math.random()*horizon,v:60+Math.random()*55,l:2+((Math.random()*3)|0)});
  while(rainP.length>want) rainP.pop();
  if(!rainP.length) return;
  g.fillStyle=rgb(tint(hex('#a9dcff'),0),.62);
  const wind=cur.rain*.30;
  for(let i=0;i<rainP.length;i++){
    const p=rainP[i];
    p.y+=p.v*dt; p.x+=p.v*dt*wind;
    const gx=clamp(p.x|0,0,W-1);
    const gy=colW[gx]>.5?waterY:colH[2][gx];
    if(p.y>gy){
      if(splash.length<26) splash.push({x:p.x,y:gy,t:.22});
      p.y=-2-Math.random()*10; p.x=Math.random()*W;
    }
    g.fillRect(p.x|0,p.y|0,1,p.l);
  }
  for(let i=splash.length-1;i>=0;i--){
    const s=splash[i]; s.t-=dt;
    if(s.t<=0){ splash.splice(i,1); continue; }
    g.fillStyle=rgb(tint([210,240,255],0),s.t*3.2);
    g.fillRect((s.x|0)-1,(s.y|0)-1,3,1);
  }
}
function drawSnow(dt,now){
  const want=Math.round(W*.36*cur.snow*(REDUCED?.4:1));
  while(snowP.length<want) snowP.push({x:Math.random()*W,y:Math.random()*horizon,v:9+Math.random()*13,p:Math.random()*6.283,s:Math.random()<.25?2:1});
  while(snowP.length>want) snowP.pop();
  if(!snowP.length) return;
  g.fillStyle=rgb(tint(SNOWC,0),.92);
  for(let i=0;i<snowP.length;i++){
    const p=snowP[i];
    p.y+=p.v*dt;
    const x2=p.x+Math.sin(now/1000+p.p)*5;
    const gx=clamp(x2|0,0,W-1);
    if(p.y>colH[2][gx]){ p.y=-2; p.x=Math.random()*W; }
    g.fillRect(x2|0,p.y|0,p.s,p.s);
  }
}

/* foreground layer, in front of the window */
function drawFX(dt,now){
  gf.clearRect(0,0,W,H);
  const mode=cur.rain>.25?'rain':cur.snow>.25?'snow':(light>.55&&cur.cloud<.4)?'petal':'none';
  const want=mode==='none'?0:Math.round((mode==='rain'?26:mode==='snow'?22:10)*(REDUCED?.35:1));
  while(fgP.length<want) fgP.push({x:Math.random()*W,y:Math.random()*H,v:20+Math.random()*40,p:Math.random()*6.283,s:Math.random()});
  while(fgP.length>want) fgP.pop();
  if(!want) return;
  for(let i=0;i<fgP.length;i++){
    const p=fgP[i];
    if(mode==='rain'){
      p.y+=p.v*4.6*dt; p.x+=p.v*1.4*dt;
      if(p.y>H){p.y=-10;p.x=Math.random()*W;}
      gf.fillStyle='rgba(200,236,255,.35)'; gf.fillRect(p.x|0,p.y|0,2,7);
    }else if(mode==='snow'){
      p.y+=p.v*.75*dt;
      const x2=p.x+Math.sin(now/900+p.p)*9;
      if(p.y>H){p.y=-4;p.x=Math.random()*W;}
      gf.fillStyle='rgba(255,255,255,.55)'; gf.fillRect(x2|0,p.y|0,2,2);
    }else{
      p.y+=p.v*.28*dt; p.x+=Math.sin(now/1300+p.p)*.35-SPEED*dt*1.6;
      if(p.y>H){p.y=-4;p.x=Math.random()*W;}
      if(p.x<-4) p.x=W+4;
      gf.fillStyle=p.s<.5?'rgba(255,190,215,.5)':'rgba(255,236,170,.5)';
      gf.fillRect(p.x|0,p.y|0,1,1);
    }
  }
}

/* ============================================================
   8. MASCOT
   ============================================================ */
const CAT=[
'................','..K..........K..','..KK........KK..','..KIK......KIK..',
'..KIIKKKKKKIIK..','.KKIIBBBBBBIIKK.','.KBBBBBBBBBBBBK.','KBBEEBBBBBBEEBBK',
'KBBEEBBBBBBEEBBK','KBPPBBBNNBBBPPBK','KBBBBBBMMBBBBBBK','.KBBBBBBBBBBBBK.',
'.KKBBBBBBBBBBKK.','..KKBBBBBBBBKK..','...KKKKKKKKKK...','................'];
const CATPAL={K:'#2b1d2f',B:'#ffd9a0',I:'#ff9bb3',P:'#ff9bb3',E:'#2b1d2f',N:'#e0748a',M:'#2b1d2f'};
const mc=$('mascot'), mg=mc.getContext('2d');
let blinkT=0,blinking=false;
function drawCat(){
  mg.clearRect(0,0,16,16);
  for(let y=0;y<16;y++){
    const row=CAT[y];
    for(let x=0;x<16;x++){
      let ch=row[x];
      if(ch==='.') continue;
      if(blinking&&ch==='E') ch=(y===7)?'B':'K';
      mg.fillStyle=CATPAL[ch]||'#2b1d2f';
      mg.fillRect(x,y,1,1);
    }
  }
}
function hop(){ if(REDUCED) return; mc.classList.remove('hop'); void mc.offsetWidth; mc.classList.add('hop'); }
let lastHop=0;
function maybeHop(){ const n=performance.now(); if(n-lastHop>500){lastHop=n;hop();} }
let lastActivity=performance.now(), zNext=0;
function zzz(now){
  if(REDUCED||now<zNext) return;
  zNext=now+5200+Math.random()*5000;
  if(night>.6&&now-lastActivity>7000){
    const z=$('zz'); z.classList.remove('go'); void z.offsetWidth; z.classList.add('go');
  }
}

/* ============================================================
   9. LOOP + HUD
   ============================================================ */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){ last=now; return; }
  let dt=(now-last)/1000; last=now;
  if(dt>.06) dt=.06;
  if(innerWidth!==builtW||innerHeight!==builtH) build();

  if(now>wxNext) pickWeather();
  const tgt=WX[wxKey], k=Math.min(1,dt*.35);
  cur.cloud=lerp(cur.cloud,tgt.cloud,k);
  cur.rain =lerp(cur.rain ,tgt.rain ,k);
  cur.snow =lerp(cur.snow ,tgt.snow ,k);
  cur.dark =lerp(cur.dark ,tgt.dark ,k);
  cur.cover=clamp(cur.cover+(cur.snow>.3?dt*.035:-dt*.07),0,1);
  if(nudge!==nudgeTarget) nudge=Math.abs(nudgeTarget-nudge)<600?nudgeTarget:lerp(nudge,nudgeTarget,Math.min(1,dt*3));

  drawScene(dt,now);
  drawFX(dt,now);

  if(now>blinkT){
    if(blinking){ blinking=false; blinkT=now+2200+Math.random()*3200; drawCat(); }
    else{ blinking=true; blinkT=now+(night>.6?260:120); drawCat(); }
  }
  zzz(now);
  updateHUD();
  syncTheme();
}

let hudT=0,lastPlace=-1;
function updateHUD(){
  const n=performance.now();
  if(n-hudT<400) return; hudT=n;
  const h=hourNow(), hh=(h|0), mm=Math.floor((h-hh)*60);
  $('clockTxt').textContent=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
  $('clockEm').textContent = h<5||h>=20?'🌙':h<7?'🌅':h<17.5?(cur.cloud>.6?'🌥':'🌞'):h<19?'🌇':'🌆';
  const bi=biomeIdxAt(camX()+W/2);
  if(bi!==lastPlace){
    lastPlace=bi;
    $('placeTxt').textContent=BIOMES[bi].name;
    $('placeEm').textContent=BIOMES[bi].em;
  }
}

let themeMode='auto',appliedNight=null;
function syncTheme(){
  const want=themeMode==='day'?false:themeMode==='night'?true:light<.33;
  if(want!==appliedNight){ appliedNight=want; document.documentElement.classList.toggle('night',want); }
}
function setTheme(m){
  themeMode=m; localStorage.setItem(LS.theme,m); appliedNight=null;
  $('themeIcon').innerHTML = m==='day'
    ? '<path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>'
    : m==='night'
    ? '<path d="M20 13a8 8 0 1 1-9-9 6 6 0 0 0 9 9z"/>'
    : '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/>';
  $('themeBtn').title='Theme: '+m+' (click to change)';
}

/* ============================================================
   10. EDITOR APP
   ============================================================ */
const editor=$('editor'), filename=$('filename'), ext=$('ext');
const fileGroup=$('fileGroup'), filePicker=$('filePicker');
const saveState=$('saveState'), saveLabel=$('saveLabel');

function updateStats(){
  const v=editor.value;
  $('cWords').textContent=((v.trim().match(/\S+/g)||[]).length).toLocaleString();
  $('cChars').textContent=v.length.toLocaleString();
  $('cLines').textContent=(v?v.split('\n').length:1).toLocaleString();
}
let saveTimer,dirty=false;
function markDirty(){
  dirty=true; saveState.classList.add('unsaved'); saveLabel.textContent='saving';
  clearTimeout(saveTimer); saveTimer=setTimeout(persist,450);
}
function persist(){
  try{
    localStorage.setItem(LS.text,editor.value);
    localStorage.setItem(LS.name,filename.value);
    localStorage.setItem(LS.ext,ext.value);
  }catch(e){}
  dirty=false; saveState.classList.remove('unsaved'); saveLabel.textContent='saved';
}
editor.addEventListener('input',()=>{ updateStats(); markDirty(); lastActivity=performance.now(); maybeHop(); });
filename.addEventListener('input',markDirty);
ext.addEventListener('change',markDirty);
editor.addEventListener('keydown',e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const s=editor.selectionStart,en=editor.selectionEnd;
    editor.value=editor.value.slice(0,s)+'  '+editor.value.slice(en);
    editor.selectionStart=editor.selectionEnd=s+2;
    updateStats(); markDirty();
  }
});
let toastTimer;
function toast(msg,type){
  const t=$('toast');
  $('toastMsg').textContent=msg;
  t.className='show'+(type==='err'?' err':'');
  t.querySelector('.ic').innerHTML = type==='err'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M12 4v11M12 18v2"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 12l6 6L20 6"/></svg>';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}
function cleanName(){
  const n=filename.value.trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\.+$/,'');
  return n||'untitled';
}
function save(){
  if(!editor.value.trim()){
    fileGroup.classList.remove('shake'); void fileGroup.offsetWidth; fileGroup.classList.add('shake');
    editor.focus(); toast('nothing to save yet','err'); return;
  }
  const name=cleanName(); filename.value=name;
  const blob=new Blob([editor.value],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name+ext.value;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  persist(); hop(); toast('saved '+name+ext.value);
}
async function copy(){
  if(!editor.value){ toast('nothing to copy','err'); return; }
  try{ await navigator.clipboard.writeText(editor.value); }
  catch(e){
    editor.select(); try{document.execCommand('copy');}catch(_){}
    const sel=window.getSelection(); if(sel) sel.removeAllRanges();
  }
  hop(); toast('copied!');
}
function clearAll(){
  if(!editor.value){ toast('already empty','err'); return; }
  editor.value=''; updateStats(); persist(); editor.focus(); toast('cleared');
}
$('openBtn').addEventListener('click',()=>filePicker.click());
filePicker.addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    editor.value=ev.target.result;
    const dot=file.name.lastIndexOf('.');
    if(dot>0){
      filename.value=file.name.slice(0,dot);
      const found=[].slice.call(ext.options).find(o=>o.value===file.name.slice(dot).toLowerCase());
      if(found) ext.value=found.value;
    }else filename.value=file.name;
    updateStats(); persist(); hop(); toast('opened '+file.name);
  };
  reader.onerror=()=>toast('could not read file','err');
  reader.readAsText(file);
  filePicker.value='';
});
$('saveBtn').addEventListener('click',save);
$('copyBtn').addEventListener('click',copy);
$('clearBtn').addEventListener('click',clearAll);
$('themeBtn').addEventListener('click',()=>{
  const order=['auto','day','night'];
  setTheme(order[(order.indexOf(themeMode)+1)%3]);
  toast('theme: '+themeMode);
});
$('wxChip').addEventListener('click',()=>{
  pickWeather(WX_ORDER[(WX_ORDER.indexOf(wxKey)+1)%WX_ORDER.length]);
  toast(WX[wxKey].name.toLowerCase()+' incoming');
});
$('clockChip').addEventListener('click',()=>{ nudgeTarget+=CYCLE*(2/24); toast('+2 hours'); });

/* ---- note transparency ---- */
const opacityEl=$('opacity');
let fadeT;
function setAlpha(v,save){
  const pct=clamp(Math.round(v),15,100);
  document.documentElement.style.setProperty('--alpha',(pct/100).toFixed(2));
  $('opacityVal').textContent=pct+'%';
  if(opacityEl.value!=pct) opacityEl.value=pct;
  if(save!==false){ try{ localStorage.setItem(LS.alpha,String(pct)); }catch(e){} }
}
opacityEl.addEventListener('input',()=>{
  document.documentElement.classList.add('nofade');
  clearTimeout(fadeT);
  fadeT=setTimeout(()=>document.documentElement.classList.remove('nofade'),900);
  setAlpha(+opacityEl.value);
});
$('placeChip').addEventListener('click',()=>{
  const cx=camX(), i=regionAt(cx);
  camOff += (bound(i+1)+BLEND+40)-cx;
  const bi=biomeOf(i+1);
  toast('travelling to '+BIOMES[bi].name.toLowerCase());
});
document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='s'){ e.preventDefault(); save(); }
  if((e.ctrlKey||e.metaKey)&&k==='o'){ e.preventDefault(); filePicker.click(); }
});
document.addEventListener('pointerdown',()=>{lastActivity=performance.now();});
window.addEventListener('beforeunload',()=>{ if(dirty) persist(); });
let rzT;
window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(build,120); });

/* ============================================================
   11. INIT
   ============================================================ */
(function init(){
  const stored=localStorage.getItem(LS.theme);
  setTheme(stored==='day'||stored==='night'||stored==='auto'?stored:'auto');
  const savedText=localStorage.getItem(LS.text);
  if(savedText!=null) editor.value=savedText;
  filename.value=localStorage.getItem(LS.name)||'untitled';
  const savedExt=localStorage.getItem(LS.ext);
  if(savedExt&&[].slice.call(ext.options).some(o=>o.value===savedExt)) ext.value=savedExt;
  const savedAlpha=parseInt(localStorage.getItem(LS.alpha)||'100',10);
  setAlpha(isFinite(savedAlpha)?savedAlpha:100,false);
  updateStats();
  build(); pickWeather('clear'); drawCat();
  requestAnimationFrame(frame);
  editor.focus();
})();
})();
</script>
