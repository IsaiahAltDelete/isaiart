<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f3ec">
<title>Drumpad</title>
<meta name="description" content="A sixteen-step drum machine in the browser: eight synthesised drums and four keys, swing, accents, live recording from the keyboard, shareable patterns and WAV export.">

<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">

<!-- Theme before first paint, so the page never flashes the wrong one. -->
<script>
(function () {
    var t = 'light';
    try { t = localStorage.getItem('isaiart.drumpad.theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="drumpad.css?v=1">
</head>
<body>

<main class="page">

    <header class="mast">
        <a class="back" href="https://isaiart.com" aria-label="Back to isaiart.com"><span class="arrow">&larr;</span></a>

        <h1 class="title">
            <span class="title-main" data-split>Drumpad</span>
            <span class="title-slash" aria-hidden="true">/</span>
            <span class="title-mode" id="titleMode">16 steps</span>
        </h1>

        <div class="transport" role="group" aria-label="Transport">
            <button class="tbtn tbtn-play" type="button" id="playBtn" aria-pressed="false" aria-label="Play (space)" title="Play / pause · Space">
                <svg class="ico i-play" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M7 4.5v15l12-7.5z"/></svg>
                <svg class="ico i-pause" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/></svg>
            </button>
            <button class="tbtn" type="button" id="stopBtn" aria-label="Stop" title="Stop · return to step 1">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M5.5 5.5h13v13h-13z"/></svg>
            </button>
            <button class="tbtn tbtn-rec" type="button" id="recBtn" aria-pressed="false" aria-label="Record keyboard hits into the pattern" title="Record · keys you press while playing land on the grid">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="12" cy="12" r="6"/></svg>
            </button>
        </div>

        <label class="dial">
            <span class="label">Tempo</span>
            <input type="range" id="bpm" min="50" max="200" step="1" value="112" aria-label="Tempo">
            <span class="val"><span id="bpmVal">112</span><small>bpm</small></span>
        </label>

        <label class="dial">
            <span class="label">Swing</span>
            <input type="range" id="swing" min="0" max="100" step="1" value="0" aria-label="Swing">
            <span class="val"><span id="swingVal">0</span><small>%</small></span>
        </label>

        <div class="dial dial-vol">
            <button class="mute" type="button" id="muteBtn" aria-pressed="false" aria-label="Mute">
                <svg class="ico i-on" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/></svg>
                <svg class="ico i-off" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></svg>
            </button>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
            <span class="vu" id="vu" aria-hidden="true"><i></i></span>
        </div>

        <span class="spacer"></span>

        <button class="theme-btn" type="button" id="themeBtn" aria-label="Switch to dark theme"><i></i></button>
    </header>

    <div class="seq-wrap">
        <div class="seq enter" id="seq" role="grid" aria-label="Step sequencer">
            <!-- drumpad.js builds the rows -->
        </div>
    </div>

    <div class="dock">
        <span class="label">Patterns</span>
        <div class="presets" id="presets" role="group" aria-label="Preset patterns"></div>
        <div class="actions">
            <button class="btn" type="button" id="randomBtn" title="A new pattern that still makes sense">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><circle class="f" cx="8.5" cy="8.5" r="1.4"/><circle class="f" cx="15.5" cy="15.5" r="1.4"/><circle class="f" cx="12" cy="12" r="1.4"/><circle class="f" cx="15.5" cy="8.5" r="1.4"/><circle class="f" cx="8.5" cy="15.5" r="1.4"/></svg>
                Random
            </button>
            <button class="btn btn-danger" type="button" id="clearBtn" title="Empty the grid">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
                Clear
            </button>
            <button class="btn" type="button" id="shareBtn" title="Copy a link to this pattern">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.3 1.3"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.3-1.3"/></svg>
                Share
            </button>
            <button class="btn" type="button" id="exportBtn" title="Render the loop to a WAV file">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>
                Export
            </button>
        </div>
    </div>

    <p class="keys-help" aria-label="Keyboard">
        <span><kbd>Space</kbd> play</span>
        <span><kbd>1</kbd>–<kbd>8</kbd> drums</span>
        <span><kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd><kbd>R</kbd> keys</span>
        <span><kbd>Shift</kbd>+click a step for an accent</span>
        <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> tempo</span>
    </p>

</main>

<dialog class="dlg" id="exportDlg" aria-labelledby="exportTitle">
    <form method="dialog" class="dlg-in" id="exportForm">
        <h2 id="exportTitle">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg>
            Export WAV
            <button class="x" type="button" id="exportClose" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </h2>
        <div class="fld">
            <label class="label" for="loops">Loops</label>
            <input class="field" type="number" id="loops" min="1" max="64" step="1" value="4">
            <span class="hint" id="loopsHint">How many times the sixteen steps repeat.</span>
        </div>
        <div class="row">
            <button class="btn" type="button" id="exportCancel">Cancel</button>
            <button class="btn btn-primary" type="button" id="renderBtn">Render</button>
        </div>
    </form>
    <div class="dlg-in render" id="exportStatus" hidden>
        <p id="statusText">Rendering…</p>
        <div class="bar" id="statusBar"><i></i></div>
        <div id="downloadHost"></div>
    </div>
</dialog>

<script src="drumpad.js?v=1"></script>
</body>
</html>
