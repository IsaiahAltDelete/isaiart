<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile</title>
    <meta name="description" content="See how an image repeats as a tiled pattern: tile size, gap and rotation, live in the browser.">

    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/kit.css?v=1">
    <script src="../assets/kit.js?v=1"></script>
    <script src="../assets/sky.js?v=1" defer></script>
    <style>

        .work {
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        /* controls */
        .controls { display: flex; flex-direction: column; gap: 22px; }
        .group { display: flex; flex-direction: column; gap: 18px; }
        .group + .group { padding-top: 22px; border-top: 1px solid var(--rule); }
        .group .panel-h { margin-bottom: 0; }

        .drop { min-height: 168px; gap: 8px; }
        .drop strong { font-size: 18px; }
        .preview-image {
            display: none;
            max-width: 100%;
            max-height: 120px;
            border-radius: var(--r-s);
            box-shadow: 0 0 0 1px var(--rule-hi);
        }
        /* once a picture is in, its thumbnail stands where the icon was */
        .drop:has(.preview-image[style*="block"]) .drop-ico { display: none; }

        .error-message {
            display: none;
            margin-top: -8px;
            font-size: 13.5px;
            color: var(--alert);
        }

        .slider-info {
            display: flex;
            justify-content: space-between;
            margin-top: -2px;
            font-size: 12.5px;
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
        }

        /* preview */
        .stage { display: flex; flex-direction: column; padding: 16px; }
        .stage .panel-h { margin: 4px 6px 14px; }
        #imagePreview {
            position: relative;
            width: 100%;
            height: clamp(420px, calc(100vh - 210px), 820px);
            overflow: hidden;
            border-radius: var(--r-m);
        }
        .tile-container { width: 100%; height: 100%; position: relative; }
        .tile-container img { display: block; user-select: none; -webkit-user-drag: none; }
        #imagePreview.over { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 60%, transparent); }

        .empty-note {
            position: absolute; left: 50%; bottom: 18px; z-index: 2;
            transform: translateX(-50%);
            padding: 8px 18px;
            border: 1px solid var(--rule);
            border-radius: 999px;
            background: var(--panel-solid);
            color: var(--ink-soft);
            font-size: 13.5px;
            white-space: nowrap;
            pointer-events: none;
        }

        @media (max-width: 900px) {
            .work { grid-template-columns: minmax(0, 1fr); }
            #imagePreview { height: 380px; }
        }
        @media (max-width: 680px) {
            .stage { padding: 12px; }
            .drop { min-height: 136px; padding: 20px; }
            #imagePreview { height: 340px; }
            .empty-note { white-space: normal; text-align: center; width: max-content; max-width: calc(100% - 32px); }
        }
    </style>
</head>
<body>
<quiet-sky></quiet-sky>

<main class="kit-page">
    <header class="top">
        <a class="brand" href="./">Tile <small>repeat preview</small></a>
        <div class="top-actions">
            <a class="icon-btn" href="/" aria-label="isaiart.com home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v8.5h11V10"/></svg></a>
            <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle light / dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
        </div>
    </header>


    <div class="work">
        <section class="panel controls" aria-label="Controls">
            <div class="group file-upload">
                <h2 class="panel-h">Image</h2>
                <label class="drop" id="dropZone" for="imageUpload">
                    <input class="sr-only" type="file" id="imageUpload" accept="image/*">
                    <span class="drop-ico"><svg viewBox="0 0 24 24"><path d="M12 15.5V5"/><path d="m7.5 9.5 4.5-4.5 4.5 4.5"/><path d="M5 15v3.5h14V15"/></svg></span>
                    <img id="uploadPreview" class="preview-image" alt="Upload preview">
                    <strong>Drop an image</strong>
                    <span class="hint">or click to choose one</span>
                </label>
                <div id="errorMessage" class="error-message" role="alert"></div>
            </div>

            <div class="group">
                <h2 class="panel-h">Tiles</h2>

                <div class="fld slider-container">
                    <label class="lbl" for="imageSize">Tile size <span class="val" id="imageSizeValue">100px</span></label>
                    <input class="range" type="range" id="imageSize" min="50" max="200" value="100">
                    <div class="slider-info"><span>50px</span><span>200px</span></div>
                </div>

                <div class="fld slider-container">
                    <label class="lbl" for="gapSize">Gap <span class="val" id="gapSizeValue">0px</span></label>
                    <input class="range" type="range" id="gapSize" min="0" max="50" value="0">
                    <div class="slider-info"><span>0px</span><span>50px</span></div>
                </div>

                <div class="fld slider-container">
                    <label class="lbl" for="rotation">Rotation <span class="val" id="rotationValue">0°</span></label>
                    <input class="range" type="range" id="rotation" min="0" max="360" value="0">
                    <div class="slider-info"><span>0°</span><span>360°</span></div>
                </div>
            </div>
        </section>

        <section class="panel stage preview-container" aria-label="Preview">
            <h2 class="panel-h">Preview</h2>
            <div id="imagePreview" class="well">
                <div class="tile-container"></div>
                <div class="empty-note" id="emptyNote">A placeholder tile until you add an image. You can drop one here too.</div>
            </div>
        </section>
    </div>

</main>

    <script>
        const imageSizeSlider = document.getElementById('imageSize');
        const gapSizeSlider = document.getElementById('gapSize');
        const rotationSlider = document.getElementById('rotation');
        const imageSizeValue = document.getElementById('imageSizeValue');
        const gapSizeValue = document.getElementById('gapSizeValue');
        const rotationValue = document.getElementById('rotationValue');
        const tileContainer = document.querySelector('.tile-container');
        const imageUpload = document.getElementById('imageUpload');
        const uploadPreview = document.getElementById('uploadPreview');
        const errorMessage = document.getElementById('errorMessage');
        const dropZone = document.getElementById('dropZone');
        const previewBox = document.getElementById('imagePreview');
        const emptyNote = document.getElementById('emptyNote');

        let uploadedImageUrl = null;

        function loadFile(file) {
            if (!file) return;
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageUrl = e.target.result;
                    uploadPreview.src = uploadedImageUrl;
                    uploadPreview.style.display = 'block';
                    errorMessage.style.display = 'none';
                    emptyNote.hidden = true;
                    updateTiles();
                };
                reader.readAsDataURL(file);
            } else {
                errorMessage.textContent = 'Please upload an image file';
                errorMessage.style.display = 'block';
                uploadPreview.style.display = 'none';
            }
        }

        imageUpload.addEventListener('change', function(e) {
            loadFile(e.target.files[0]);
        });

        // the drop zone and the preview both take a dropped file
        [dropZone, previewBox].forEach(function (el) {
            el.addEventListener('dragover', function (e) { e.preventDefault(); el.classList.add('over'); });
            el.addEventListener('dragleave', function () { el.classList.remove('over'); });
            el.addEventListener('drop', function (e) {
                e.preventDefault();
                el.classList.remove('over');
                if (e.dataTransfer && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
            });
        });

        // A quiet stand-in tile in the page's own greys, until there is an image.
        function placeholderTile() {
            const css = getComputedStyle(document.documentElement);
            const fill = css.getPropertyValue('--panel-solid').trim() || '#111217';
            const mark = css.getPropertyValue('--ink-faint').trim() || '#77777e';
            const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
                '<rect x="0.5" y="0.5" width="99" height="99" rx="10" fill="' + fill + '" stroke="' + mark + '" stroke-opacity=".28"/>' +
                '<path d="M50 30 C52 44 56 48 70 50 C56 52 52 56 50 70 C48 56 44 52 30 50 C44 48 48 44 50 30Z" fill="' + mark + '" fill-opacity=".45"/>' +
                '</svg>';
            return 'data:image/svg+xml,' + encodeURIComponent(svg);
        }

        function updateTiles() {
            const imageSize = parseInt(imageSizeSlider.value);
            const gapSize = parseInt(gapSizeSlider.value);
            const rotation = parseInt(rotationSlider.value);

            // Update value displays
            imageSizeValue.textContent = `${imageSize}px`;
            gapSizeValue.textContent = `${gapSize}px`;
            rotationValue.textContent = `${rotation}°`;

            // Clear existing tiles
            tileContainer.innerHTML = '';

            // Calculate number of tiles needed
            const containerWidth = previewBox.offsetWidth;
            const containerHeight = previewBox.offsetHeight;
            const tilesAcross = Math.ceil(containerWidth / (imageSize + gapSize)) + 1;
            const tilesDown = Math.ceil(containerHeight / (imageSize + gapSize)) + 1;
            const src = uploadedImageUrl || placeholderTile();

            // Create tiles
            for (let y = 0; y < tilesDown; y++) {
                for (let x = 0; x < tilesAcross; x++) {
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = '';
                    img.style.position = 'absolute';
                    img.style.left = `${x * (imageSize + gapSize)}px`;
                    img.style.top = `${y * (imageSize + gapSize)}px`;
                    img.style.width = `${imageSize}px`;
                    img.style.height = `${imageSize}px`;
                    img.style.transform = `rotate(${rotation}deg)`;
                    img.style.transformOrigin = 'center center';
                    img.style.objectFit = 'cover';
                    tileContainer.appendChild(img);
                }
            }
        }

        // Add event listeners
        imageSizeSlider.addEventListener('input', updateTiles);
        gapSizeSlider.addEventListener('input', updateTiles);
        rotationSlider.addEventListener('input', updateTiles);

        // Initial render
        updateTiles();

        // Update on window resize, and repaint the placeholder when the theme flips
        window.addEventListener('resize', updateTiles);
        document.addEventListener('kit:theme', function () { if (!uploadedImageUrl) updateTiles(); });
    </script>
</body>
</html>
