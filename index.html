<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISAIART | Project Directory</title>
  <meta name="description" content="Every project on isaiart.com — games, simulators, image tools, audio toys, and utilities." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #06070b;
      --panel:    rgba(7, 8, 13, 0.44);
      --rule:     rgba(255,255,255,0.10);
      --rule-hi:  rgba(255,255,255,0.22);
      --white:    #f4f4f2;
      --off:      #adada8;   /* secondary — 8.9:1 on bg */
      --dim:      #9a9a95;   /* tertiary  — 6.6:1 on bg, still AA once the
                                translucent panel lightens the backdrop */
      --accent:   #8fb4ff;
      --nav-h:    56px;
    }

    /* no hard-coded root font-size — that would override the reader's own
       browser text-size setting. scroll-padding clears the fixed nav. */
    html { scroll-behavior: smooth; scroll-padding-top: var(--nav-h); }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Barlow', system-ui, sans-serif;
      font-weight: 400;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #4d4d54; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--off); }

    /* ── GALAXY BACKGROUND ───────────────────────────────────────────── */
    #galaxy {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: -3; display: block;
      pointer-events: none;
    }

    /* broad ambient tint that parallaxes against the star field — kept very
       faint so the rendered core, not a CSS blob, reads as the galactic centre */
    #core-glow {
      position: fixed; inset: -20%;
      z-index: -2; pointer-events: none;
      background:
        radial-gradient(46% 34% at 50% 50%, rgba(120,105,220,0.055), transparent 76%),
        radial-gradient(20% 14% at 50% 50%, rgba(255,206,140,0.05), transparent 78%);
      will-change: transform;
    }

    /* keeps the type readable no matter how bright the galaxy gets */
    #scrim {
      position: fixed; inset: 0;
      z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 90% 75% at 50% 45%, transparent 0%, rgba(6,7,11,0.38) 100%),
        linear-gradient(to bottom, rgba(6,7,11,0.62) 0%, rgba(6,7,11,0.06) 26%, rgba(6,7,11,0.06) 74%, rgba(6,7,11,0.66) 100%);
    }

    /* ── NAV ─────────────────────────────────────────────────────────── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: stretch;
      height: var(--nav-h);
      border-bottom: 1px solid var(--rule-hi);
      background: rgba(6,7,11,0.90);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .nav-brand {
      display: flex; align-items: center; gap: 18px;
      padding: 0 26px;
      border-right: 1px solid var(--rule-hi);
    }
    .brand-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.15rem; font-weight: 900;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--white); text-decoration: none;
    }
    .brand-name:hover { color: var(--accent); }
    .nav-note {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 0 22px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem; font-weight: 400;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--dim);
    }

    .nav-actions {
      display: flex; align-items: center;
      border-left: 1px solid var(--rule-hi); padding: 0 12px;
    }
    .icon-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: 1px solid transparent; cursor: pointer;
      text-decoration: none;
      color: var(--off); transition: color .15s, border-color .15s;
    }
    .icon-btn:hover { color: var(--white); border-color: var(--rule-hi); }
    .icon-btn .material-symbols-outlined { font-size: 18px; }

    /* ── MAIN ────────────────────────────────────────────────────────── */
    main {
      position: relative; z-index: 10;
      margin: var(--nav-h) auto 0;
      max-width: 1440px;
      padding-bottom: 0;
      background: var(--panel);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border-left: 1px solid var(--rule);
      border-right: 1px solid var(--rule);
    }

    /* ── HERO ────────────────────────────────────────────────────────── */
    .hero {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      border-bottom: 1px solid var(--rule-hi);
    }

    .hero-left {
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 64px 56px 44px;
      border-right: 1px solid var(--rule-hi);
      position: relative;
    }
    .hero-num {
      position: absolute; top: 26px; left: 56px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--dim);
    }
    .hero-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(3.4rem, 7vw, 6rem);
      font-weight: 900; line-height: 0.88;
      letter-spacing: -0.015em; text-transform: uppercase;
      color: var(--white);
      animation: fadeUp .7s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .hero-right {
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 64px 56px 44px; gap: 16px;
    }
    .hero-stat {
      display: flex; align-items: baseline; gap: 16px;
      border-bottom: 1px solid var(--rule); padding-bottom: 14px;
    }
    .hero-stat:last-child { border-bottom: none; padding-bottom: 0; }
    .stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.6rem; font-weight: 900; color: var(--white);
      line-height: 1; letter-spacing: -0.02em;
      min-width: 2.6ch;
    }
    .stat-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.78rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--off);
    }

    /* ── SEARCH ──────────────────────────────────────────────────────── */
    .search-row {
      display: grid;
      grid-template-columns: 56px 1fr auto 56px;
      align-items: stretch;
      border-bottom: 1px solid var(--rule);
      min-height: 58px;
    }
    .search-icon-cell {
      display: flex; align-items: center; justify-content: center;
      border-right: 1px solid var(--rule);
      color: var(--off);
    }
    .search-icon-cell .material-symbols-outlined { font-size: 19px; }

    /* no `outline: none` here — an id selector would beat :focus-visible and
       leave the page's only text input with no visible focus state */
    #search-input {
      background: transparent; border: none;
      width: 100%; padding: 0 22px;
      font-family: 'Barlow', sans-serif;
      font-size: 0.98rem; font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--white);
    }
    #search-input::placeholder { color: var(--dim); }
    #search-input:focus { background: rgba(255,255,255,0.03); }

    .search-count {
      display: flex; align-items: center; white-space: nowrap;
      padding: 0 20px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.76rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--dim);
    }
    .search-clear {
      display: flex; align-items: center; justify-content: center;
      border-left: 1px solid var(--rule);
      background: none; border-top: 0; border-right: 0; border-bottom: 0;
      color: var(--dim); cursor: pointer;
      transition: color .15s, background .15s;
    }
    .search-clear:hover { color: var(--white); background: rgba(255,255,255,0.04); }
    .search-clear .material-symbols-outlined { font-size: 17px; }

    /* ── CATEGORY FILTER CHIPS ───────────────────────────────────────── */
    .filter-row {
      display: flex; flex-wrap: wrap;
      border-bottom: 1px solid var(--rule-hi);
    }
    .chip {
      appearance: none; background: none; cursor: pointer;
      border: 0;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      padding: 13px 20px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--dim);
      transition: color .15s, background .15s;
    }
    .chip:hover { color: var(--white); background: rgba(255,255,255,0.04); }
    .chip[aria-pressed="true"] {
      color: var(--bg); background: var(--white);
    }
    /* the accent ring is invisible on the white selected chip — go dark there */
    .chip[aria-pressed="true"]:focus-visible { outline-color: var(--bg); }

    /* ── CATEGORY HEADERS ────────────────────────────────────────────── */
    .cat-header {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: stretch;
      min-height: 52px;
      border-bottom: 1px solid var(--rule);
      background: rgba(255,255,255,0.02);
    }
    .cat-icon-cell {
      display: flex; align-items: center; justify-content: center;
      border-right: 1px solid var(--rule);
      color: var(--accent);
    }
    .cat-icon-cell .material-symbols-outlined { font-size: 19px; }
    .cat-title-cell { display: flex; align-items: center; padding: 0 22px; }
    .cat-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.95rem; font-weight: 700;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--white);
    }
    .cat-count-cell {
      display: flex; align-items: center;
      padding: 0 20px;
      border-left: 1px solid var(--rule);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.76rem; font-weight: 400;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--dim);
    }

    /* ── PROJECT GRID ────────────────────────────────────────────────── */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }
    @media (max-width: 1180px) { .project-grid { grid-template-columns: repeat(3,1fr); } }
    @media (max-width: 860px)  { .project-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 520px)  { .project-grid { grid-template-columns: 1fr; } }

    .p-card {
      display: flex; flex-direction: column;
      gap: 10px;
      padding: 22px 24px 24px;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      text-decoration: none;
      position: relative; overflow: hidden;
      transition: background .18s;
      min-height: 148px;
    }
    .p-card:hover, .p-card:focus-visible { background: rgba(255,255,255,0.05); }

    /* corner marks */
    .p-card::before, .p-card::after {
      content: '';
      position: absolute;
      width: 11px; height: 11px;
      border-color: var(--accent); border-style: solid;
      opacity: 0; transition: opacity .18s;
    }
    .p-card::before { top: 9px; left: 9px; border-width: 1px 0 0 1px; }
    .p-card::after  { bottom: 9px; right: 9px; border-width: 0 1px 1px 0; }
    .p-card:hover::before, .p-card:hover::after,
    .p-card:focus-visible::before, .p-card:focus-visible::after { opacity: 1; }

    .p-card-top {
      display: flex; align-items: center; gap: 10px;
    }
    .p-card-top .material-symbols-outlined { font-size: 20px; }
    .p-card-path {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.72rem; font-weight: 400;
      letter-spacing: 0.14em; text-transform: lowercase;
      color: var(--dim);
    }

    .p-card-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.35rem; font-weight: 700;
      letter-spacing: 0.02em; text-transform: uppercase;
      color: var(--white); line-height: 1.1;
    }
    .p-card-desc {
      font-size: 0.88rem; font-weight: 400; line-height: 1.5;
      color: var(--off);
      margin-top: auto;
    }

    .p-card-arrow {
      position: absolute; top: 20px; right: 20px;
      color: var(--accent); opacity: 0;
      transition: opacity .18s, transform .18s;
      font-size: 0.85rem;
      font-family: 'Barlow Condensed', sans-serif;
    }
    .p-card:hover .p-card-arrow,
    .p-card:focus-visible .p-card-arrow { opacity: 1; transform: translate(2px,-2px); }

    /* ── EMPTY STATE ─────────────────────────────────────────────────── */
    .no-results {
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 88px 24px; text-align: center;
      border-bottom: 1px solid var(--rule);
    }
    .no-results.show { display: flex; }
    .no-results-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 5rem; font-weight: 900;
      color: #55555c; line-height: 1; margin-bottom: 10px;
    }
    .no-results-txt {
      font-size: 0.95rem; color: var(--off);
    }

    .cat-block.hidden { display: none; }

    /* ── FOOTER ──────────────────────────────────────────────────────── */
    /* sibling of <main> so it exposes a contentinfo landmark, so it repeats
       main's panel treatment to stay visually continuous */
    footer {
      position: relative; z-index: 10;
      max-width: 1440px; margin: 0 auto;
      background: var(--panel);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: stretch;
      min-height: 54px;
      border: 1px solid var(--rule);
      border-top-color: var(--rule-hi);
      border-bottom: none;
    }
    .foot-brand {
      display: flex; align-items: center;
      padding: 0 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.9rem; font-weight: 900;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--off);
      border-right: 1px solid var(--rule);
    }
    .foot-links { display: flex; list-style: none; flex-wrap: wrap; }
    .foot-links li { border-right: 1px solid var(--rule); }
    .foot-links a {
      display: flex; align-items: center; height: 100%; padding: 0 18px;
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.78rem; font-weight: 400;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
      transition: color .15s;
    }
    .foot-links a:hover { color: var(--white); }
    .foot-copy {
      display: flex; align-items: center;
      padding: 0 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.76rem; letter-spacing: 0.12em; color: var(--dim);
      border-left: 1px solid var(--rule);
    }

    /* ── RESPONSIVE ──────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .nav-note { display: none; }
      .hero { grid-template-columns: 1fr; }
      .hero-left { border-right: none; padding: 56px 26px 32px; }
      .hero-num { left: 26px; }
      .hero-right {
        padding: 24px 26px 30px;
        flex-direction: row; gap: 0;
        border-top: 1px solid var(--rule);
      }
      .hero-stat {
        flex-direction: column; gap: 4px; flex: 1;
        border-bottom: none; padding-bottom: 0;
      }
      /* drop the count cell *and* its grid track, or the clear button
         collapses into the leftover `auto` column */
      .search-count { display: none; }
      .search-row { grid-template-columns: 56px 1fr 56px; }
      main { border-left: none; border-right: none; }
      footer { grid-template-columns: 1fr; border-left: none; border-right: none; }
      .foot-brand, .foot-copy { border: none; }
      .foot-brand { padding: 14px 24px; }
      .foot-copy { border-top: 1px solid var(--rule); padding: 14px 24px; }
      .foot-links { border-top: 1px solid var(--rule); }
      /* the stretched row height is gone here, so pad for a real tap target */
      .foot-links a { height: auto; min-height: 48px; padding: 0 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>

<canvas id="galaxy" aria-hidden="true"></canvas>
<div id="core-glow" aria-hidden="true"></div>
<div id="scrim" aria-hidden="true"></div>

<nav>
  <div class="nav-brand">
    <a href="https://isaiart.com" class="brand-name">ISAIART</a>
  </div>
  <div class="nav-note"></div>
  <div class="nav-actions">
    <a class="icon-btn" href="https://isaiart.com" target="_blank" rel="noopener" aria-label="Open isaiart.com">
      <span class="material-symbols-outlined">open_in_new</span>
    </a>
  </div>
</nav>

<main>

  <div class="hero">
    <div class="hero-left">
      <span class="hero-num">ISAIART · 2026</span>
      <h1 class="hero-title">All<br>Projects</h1>
    </div>
    <div class="hero-right">
      <div class="hero-stat">
        <span class="stat-num" id="total-count">0</span>
        <span class="stat-label">Projects</span>
      </div>
      <div class="hero-stat">
        <span class="stat-num" id="cat-count">0</span>
        <span class="stat-label">Categories</span>
      </div>
      <div class="hero-stat">
        <span class="stat-num">∞</span>
        <span class="stat-label">More Coming</span>
      </div>
    </div>
  </div>

  <div class="search-row">
    <div class="search-icon-cell">
      <span class="material-symbols-outlined">search</span>
    </div>
    <input type="text" id="search-input" placeholder="Search projects…" autocomplete="off" aria-label="Search projects" />
    <div class="search-count" id="search-count"></div>
    <button class="search-clear" id="search-clear" aria-label="Clear search">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="filter-row" id="filter-row"></div>

  <!-- the visible count is hidden on small screens, so announce separately -->
  <div class="sr-only" id="search-status" role="status" aria-live="polite"></div>

  <div id="projects-container"></div>

  <div class="no-results" id="no-results">
    <div class="no-results-num">00</div>
    <div class="no-results-txt">Nothing matched that search.</div>
  </div>

</main>

<footer>
    <div class="foot-brand">ISAIART</div>
    <ul class="foot-links">
      <li><a href="https://isaiart.com">Home</a></li>
      <li><a href="https://dnd.isaiart.com">D&amp;D</a></li>
      <li><a href="https://music.isaiart.com">Music</a></li>
      <li><a href="https://thg.isaiart.com">Hunger Games</a></li>
    </ul>
    <div class="foot-copy">© 2026 Isaiah</div>
  </footer>

<script>
/* ═══ PROJECT DATA ═══════════════════════════════════════════════════════
   One entry per real directory. Redirect-only folders are intentionally
   left out and point straight at their destination instead.            */

      { title: "Pokémon",       url: "pkmn/",     icon: "pets",             color: "#fca5a5", desc: "A playable Game Boy style adventure.", keywords: "rpg gameboy monsters battle" },
      { title: "Realms",        url: "realms/",   icon: "castle",           color: "#c4b5fd", desc: "Live out a life on the Sword Coast.", keywords: "faerun dnd fantasy life sim map" },
      { title: "Hunger Games",  url: "https://thg.isaiart.com", icon: "sports_kabaddi", color: "#4ade80", desc: "Run a full battle royale simulation.", keywords: "thg survival tribute battle royale" }
    ]
  },
  {
    category: "Image & Art",

/* ═══ RENDER ════════════════════════════════════════════════════════════ */
const container  = document.getElementById('projects-container');
const filterRow  = document.getElementById('filter-row');
const noResults  = document.getElementById('no-results');
const countEl    = document.getElementById('search-count');
const statusEl   = document.getElementById('search-status');

let total = 0;

// strip accents so "pokemon" matches "Pokémon"
const COMBINING = /[\u0300-\u036f]/g;
const fold = s => s.toLowerCase().normalize('NFD').replace(COMBINING, '');

// Filter chips
const chips = [{ label: 'All', key: '*' }, ...projects.map(s => ({ label: s.category, key: s.category }))];
chips.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.type = 'button';
  b.textContent = c.label;
  b.dataset.key = c.key;
  b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
  filterRow.appendChild(b);
});

// Category blocks
projects.forEach(section => {
  total += section.items.length;

  const block = document.createElement('section');
  block.className = 'cat-block';
  block.dataset.cat = section.category;

  block.innerHTML = `
    <div class="cat-header">
      <div class="cat-icon-cell"><span class="material-symbols-outlined">${section.icon}</span></div>
      <div class="cat-title-cell"><h2 class="cat-title">${section.category}</h2></div>
      <div class="cat-count-cell" data-full="${section.items.length}">${section.items.length}</div>
    </div>
    <div class="project-grid"></div>
  `;
  container.appendChild(block);

  const grid = block.querySelector('.project-grid');

  section.items.forEach(item => {
    const external = /^https?:/.test(item.url);
    const a = document.createElement('a');
    a.href = item.url;
    a.className = 'p-card';
    if (external) { a.target = '_blank'; a.rel = 'noopener'; }
    // explicit name: reads "Chess. Play a full game against the computer."
    // instead of relying on name-from-content across the card's block children
    a.setAttribute('aria-label', `${item.title}. ${item.desc}`);
    a.dataset.search = fold([item.title, item.desc, item.keywords, section.category].join(' '));

    const label = external
      ? item.url.replace(/^https?:\/\//, '').replace(/\/$/, '')
      : '/' + item.url.replace(/\/$/, '');

    a.innerHTML = `
      <div class="p-card-top">
        <span class="material-symbols-outlined" style="color:${item.color}">${item.icon}</span>
        <span class="p-card-path">${label}</span>
      </div>
      <div class="p-card-name">${item.title}</div>
      <p class="p-card-desc">${item.desc}</p>
      <span class="p-card-arrow" aria-hidden="true">↗</span>
    `;
    grid.appendChild(a);
  });
});

document.getElementById('total-count').textContent = total;
document.getElementById('cat-count').textContent  = projects.length;

// Material Symbols renders via ligature text, so screen readers would read
// "psychology /chess CHESS ..." as each card's link name. Hide the glyphs.
document.querySelectorAll('.material-symbols-outlined')
  .forEach(el => el.setAttribute('aria-hidden', 'true'));

/* ═══ SEARCH + FILTER ═══════════════════════════════════════════════════ */
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
let activeCat = '*';

function applyFilters() {
  const q = fold(searchInput.value.trim());
  let shown = 0;

  document.querySelectorAll('.cat-block').forEach(block => {
    const catOk = activeCat === '*' || block.dataset.cat === activeCat;
    let visible = 0;

    block.querySelectorAll('.p-card').forEach(card => {
      const match = catOk && (!q || card.dataset.search.includes(q));
      card.style.display = match ? 'flex' : 'none';
      if (match) visible++;
    });

    // keep the header count honest while a search is narrowing the grid
    const cell = block.querySelector('.cat-count-cell');
    cell.textContent = q ? `${visible} / ${cell.dataset.full}` : cell.dataset.full;

    block.classList.toggle('hidden', visible === 0);
    shown += visible;
  });

  noResults.classList.toggle('show', shown === 0);
  const summary = (q || activeCat !== '*')
    ? `${shown} of ${total}`
    : `${total} projects`;
  countEl.textContent = summary;
  statusEl.textContent = shown === 0
    ? 'No projects matched'
    : `${summary} shown`;
}

searchInput.addEventListener('input', applyFilters);

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  applyFilters();
  searchInput.focus();
});

filterRow.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  activeCat = chip.dataset.key;
  filterRow.querySelectorAll('.chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c === chip))
  );
  applyFilters();
});

// "/" focuses search, Escape clears it
const isEditable = el => !el || el.isContentEditable ||
  /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);

document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey
      && !isEditable(document.activeElement)) {
    e.preventDefault();
    searchInput.focus();
  } else if (e.key === 'Escape' && document.activeElement === searchInput
             && !e.isComposing) {   // don't eat an IME candidate cancel
    searchInput.value = '';
    applyFilters();
  }
});

applyFilters();

/* ═══ GALAXY BACKGROUND — WebGL point-sprite spiral ═════════════════════
   A tilted spiral galaxy projected in the vertex shader. The mouse orbits
   the camera (yaw + tilt) and pushes nearby stars away from the cursor. */
(function initGalaxy() {
  const canvas = document.getElementById('galaxy');
  const glow   = document.getElementById('core-glow');
  // premultipliedAlpha MUST be true: additive blending writes colour already
  // scaled by alpha, and an unpremultiplied canvas would scale it a second
  // time on composite, crushing every star to near-black.
  const gl = canvas.getContext('webgl', {
    alpha: true, antialias: true, premultipliedAlpha: true, depth: false
  });
  if (!gl) { canvas.style.display = 'none'; return; }

  const VERT = `
    attribute vec3 a_pos;    // galaxy space: disc on XZ, thin on Y
    attribute vec4 a_seed;   // x size, y phase, z kind, w colour

    uniform float u_time;
    uniform float u_spin;
    uniform vec2  u_res;
    uniform vec2  u_mouse;   // -1..1, smoothed
    uniform float u_dpr;

    varying float v_alpha;
    varying vec3  v_color;
    varying float v_soft;

    vec3 palette(float t) {
      if (t < 0.16) return vec3(1.00, 0.86, 0.62);  // gold core
      if (t < 0.32) return vec3(1.00, 0.94, 0.86);  // warm white
      if (t < 0.54) return vec3(0.90, 0.93, 1.00);  // white blue
      if (t < 0.74) return vec3(0.55, 0.74, 1.00);  // blue
      if (t < 0.86) return vec3(0.45, 0.90, 1.00);  // cyan
      if (t < 0.95) return vec3(0.68, 0.50, 1.00);  // violet
      return vec3(1.00, 0.55, 0.78);                // pink
    }

    void main() {
      vec3 p = a_pos;
      float r = length(p.xz);

      // differential rotation — the core spins faster than the rim
      float ang = u_spin * (1.7 / (0.75 + r));
      float ca = cos(ang), sa = sin(ang);
      p.xz = mat2(ca, -sa, sa, ca) * p.xz;

      // camera orbit driven by the pointer
      float yaw  = u_mouse.x * 0.55;
      float tilt = 0.72 - u_mouse.y * 0.32;
      float cy = cos(yaw),  sy = sin(yaw);
      p.xz = mat2(cy, -sy, sy, cy) * p.xz;
      float ct = cos(tilt), st = sin(tilt);
      p.yz = mat2(ct, -st, st, ct) * p.yz;

      // perspective projection — the camera sits well clear of the disc so the
      // whole spiral stays in frame instead of flying past the lens
      const float CAM   = 12.0;
      const float FOCAL = 3.0;
      float depth  = max(CAM - p.z, 1.0);
      float aspect = u_res.x / max(u_res.y, 1.0);
      vec2 ndc = vec2(p.x * FOCAL / depth / aspect, p.y * FOCAL / depth);

      // cursor pushes nearby stars outward — a tight local bubble, wide enough
      // to feel alive but not so wide it drags the whole core off centre
      vec2 d = ndc - u_mouse;
      d.x *= aspect;
      float dd = dot(d, d);
      ndc += normalize(d + vec2(1e-4)) * exp(-dd * 13.0) * 0.085;

      gl_Position = vec4(ndc, 0.0, 1.0);

      float isNeb = step(a_seed.z, 0.12);
      float persp = clamp(FOCAL / depth * 4.0, 0.5, 4.0);
      gl_PointSize = mix(2.1 + a_seed.x * 5.2, 26.0 + a_seed.x * 34.0, isNeb) * persp * u_dpr;

      float twinkle = 0.62 + 0.38 * sin(u_time * (0.6 + a_seed.x * 2.3) + a_seed.y * 6.2831);
      float fog     = smoothstep(17.0, 7.0, depth);
      float core    = smoothstep(3.4, 0.0, r) * 0.7;

      v_alpha = mix(0.34 + a_seed.x * 0.66, 0.085, isNeb) * twinkle * (0.40 + fog) * (1.0 + core);
      v_color = palette(a_seed.w);
      v_soft  = isNeb;
    }`;

  const FRAG = `
    precision mediump float;
    varying float v_alpha;
    varying vec3  v_color;
    varying float v_soft;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float f    = smoothstep(0.5, 0.0, d);
      float star = f * f;
      float puff = f * f * f * 0.55;
      float a    = mix(star, puff, v_soft);
      gl_FragColor = vec4(v_color, a * v_alpha);
    }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const vs = compile(gl.VERTEX_SHADER, VERT);
  const fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) { canvas.style.display = 'none'; return; }

  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.style.display = 'none'; return; }
  gl.useProgram(prog);

  /* ── star field generation ──────────────────────────────────────── */
  const mobile = innerWidth < 700;
  const COUNT  = mobile ? 3200 : 9000;
  const ARMS   = 2;
  const TWIST  = 0.95;   // open pitch — a tight winding overlaps itself and
                         // reads as uniform scatter instead of arms
  const RADIUS = 5.2;
  const ARM_W  = 0.30;   // arm half-width in world units — constant, so the
                         // arms stay crisp instead of smearing near the core

  const pos  = new Float32Array(COUNT * 3);
  const seed = new Float32Array(COUNT * 4);

  const gauss = () => {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };

  for (let i = 0; i < COUNT; i++) {
    const roll = Math.random();
    let x, y, z, kind;

    // pick a point on an arm centreline, then offset perpendicular-ish by a
    // fixed world-space amount — this is what makes the spiral legible
    const onArm = (rad, width, thick) => {
      const theta = Math.floor(Math.random() * ARMS) * (Math.PI * 2 / ARMS) + rad * TWIST;
      x = Math.cos(theta) * rad + gauss() * width;
      z = Math.sin(theta) * rad + gauss() * width;
      y = gauss() * thick;
    };

    if (roll < 0.11) {
      // central bulge — dense, warm, slightly puffed sphere
      const rb = Math.abs(gauss()) * 0.95;
      const u = Math.random() * 2 - 1, ph = Math.random() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u);
      x = rb * s * Math.cos(ph);
      y = rb * u * 0.62;
      z = rb * s * Math.sin(ph);
      kind = 0.2 + Math.random() * 0.8;
    } else if (roll < 0.21) {
      // nebula puffs — soft colour along the arms, kept small enough to
      // tint the arms rather than fog the whole field
      onArm(0.7 + Math.random() * (RADIUS * 0.8), ARM_W * 1.3, 0.16);
      kind = 0.02 + Math.random() * 0.09;
    } else if (roll < 0.82) {
      // spiral arm stars
      const rr = Math.pow(Math.random(), 0.5) * RADIUS;
      onArm(rr, ARM_W, 0.26 * Math.exp(-rr / 2.4) + 0.035);
      kind = 0.2 + Math.random() * 0.8;
    } else {
      // halo / field stars
      const rh = RADIUS * (0.4 + 1.15 * Math.cbrt(Math.random()));
      const u = Math.random() * 2 - 1, ph = Math.random() * Math.PI * 2;
      const s = Math.sqrt(1 - u * u);
      x = rh * s * Math.cos(ph);
      y = rh * u * 0.55;
      z = rh * s * Math.sin(ph);
      kind = 0.2 + Math.random() * 0.8;
    }

    pos[i * 3]     = x;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = z;

    // colour tracks radius: gold core → white → blue arms → violet rim
    const r = Math.sqrt(x * x + z * z);
    let hue = Math.min(1, Math.max(0, (r / RADIUS) * 0.95 + gauss() * 0.10));
    if (kind < 0.12) hue = 0.80 + Math.random() * 0.20;   // nebulae skew violet/pink

    seed[i * 4]     = Math.random();       // size
    seed[i * 4 + 1] = Math.random();       // twinkle phase
    seed[i * 4 + 2] = kind;                // star vs nebula
    seed[i * 4 + 3] = hue;                 // colour
  }

  function bind(name, data, size) {
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, name);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  }
  bind('a_pos', pos, 3);
  bind('a_seed', seed, 4);

  const uTime  = gl.getUniformLocation(prog, 'u_time');
  const uSpin  = gl.getUniformLocation(prog, 'u_spin');
  const uRes   = gl.getUniformLocation(prog, 'u_res');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');
  const uDpr   = gl.getUniformLocation(prog, 'u_dpr');

  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);   // additive glow
  gl.clearColor(0, 0, 0, 0);

  /* ── pointer ────────────────────────────────────────────────────── */
  const target = [0, 0];
  const smooth = [0, 0];
  let interacted = false;

  function pointTo(cx, cy) {
    interacted = true;
    target[0] =  (cx / innerWidth)  * 2 - 1;
    target[1] = -((cy / innerHeight) * 2 - 1);
    start();
  }
  addEventListener('pointermove', e => pointTo(e.clientX, e.clientY), { passive: true });
  addEventListener('touchmove', e => {
    if (e.touches[0]) pointTo(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  /* ── sizing ─────────────────────────────────────────────────────── */
  let dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2);
    canvas.width  = Math.round(innerWidth  * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uDpr, dpr);
  }
  addEventListener('resize', () => { resize(); start(); });
  resize();

  /* ── loop ───────────────────────────────────────────────────────── */
  const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
  let reduce = motionQuery.matches;
  let spin = 0, last = performance.now(), raf = 0, running = false;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // reduced motion: hold the camera dead centre so nothing moves at all,
    // not even the pointer-driven orbit
    if (reduce) {
      target[0] = 0; target[1] = 0;
    } else if (!interacted) {
      // before the first pointer move, drift slowly so it still breathes
      const t = now * 0.00012;
      target[0] = Math.sin(t * 1.7) * 0.45;
      target[1] = Math.cos(t * 1.1) * 0.30;
    }

    const ease = reduce ? 0.02 : 0.055;
    smooth[0] += (target[0] - smooth[0]) * ease;
    smooth[1] += (target[1] - smooth[1]) * ease;

    if (!reduce) spin += dt * 0.075;

    glow.style.transform =
      `translate3d(${-smooth[0] * 28}px, ${smooth[1] * 20}px, 0)`;

    gl.uniform1f(uTime, reduce ? 0 : now * 0.001);
    gl.uniform1f(uSpin, spin);
    gl.uniform2f(uMouse, smooth[0], smooth[1]);

    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.POINTS, 0, COUNT);

    // Under reduced motion nothing animates, so once the pointer ease has
    // settled every frame is identical — park the loop rather than redraw a
    // static image forever. pointTo()/resize() wake it back up.
    const settling = Math.abs(target[0] - smooth[0]) + Math.abs(target[1] - smooth[1]);
    if (reduce && settling < 1e-4) { running = false; raf = 0; return; }

    raf = requestAnimationFrame(frame);
  }

  function start() {
    if (running || document.hidden) return;
    running = true;
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (!running) return;
    cancelAnimationFrame(raf);
    running = false; raf = 0;
  }

  start();

  // stop burning frames on a hidden tab
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

  // honour the OS setting changing mid-session instead of only at load
  const onMotionChange = () => { reduce = motionQuery.matches; start(); };
  if (motionQuery.addEventListener) motionQuery.addEventListener('change', onMotionChange);
  else motionQuery.addListener(onMotionChange);
})();
</script>
