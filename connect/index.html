<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/3.0.1/iconfont/material-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --cell-size: 50px;
            --border-color: #000;
            --player-one-color: #e53935; /* Red */
            --player-two-color: #1e88e5; /* Blue */
            --board-bg: #fff;
            --hover-color: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fff;
            color: #000;
            padding: 20px;
        }

        h1 {
            font-weight: 300;
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .game-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .player-indicator {
            margin-left: 10px;
            transition: transform 0.3s ease;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(7, var(--cell-size));
            gap: 6px;
            padding: 10px;
            background-color: var(--border-color);
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .column {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .column:hover {
            background-color: var(--hover-color);
        }

        .column::before {
            content: '';
            position: absolute;
            top: -30px;
            width: 80%;
            height: 30px;
            background-color: transparent;
        }

        .column:hover::before {
            background-color: var(--hover-color);
            border-radius: 50% 50% 0 0;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--board-bg);
            border-radius: 50%;
            margin: 2px;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .cell.player-1 {
            background-color: var(--player-one-color);
            animation: drop 0.5s ease-in-out;
        }

        .cell.player-2 {
            background-color: var(--player-two-color);
            animation: drop 0.5s ease-in-out;
        }

        .cell.win {
            animation: pulse 1.5s infinite;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }

        button {
            background-color: #fff;
            border: 2px solid #000;
            padding: 8px 16px;
            font-size: 1rem;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #000;
            color: #fff;
        }

        button .material-icons {
            margin-right: 8px;
        }
        
        .game-mode {
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .mode-selection {
            display: flex;
            gap: 10px;
        }
        
        .mode-btn {
            padding: 10px 15px;
            background-color: #fff;
            border: 2px solid #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
        }
        
        .mode-btn.active {
            background-color: #000;
            color: #fff;
        }
        
        .difficulty-selection {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .difficulty-selection.hide {
            display: none;
        }
        
        .difficulty-buttons {
            display: flex;
            gap: 5px;
        }
        
        .difficulty-btn {
            padding: 5px 10px;
            background-color: #fff;
            border: 1px solid #000;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
        }
        
        .difficulty-btn.active {
            background-color: #000;
            color: #fff;
        }

        @keyframes drop {
            0% {
                transform: translateY(-300px);
                opacity: 0;
            }
            60% {
                transform: translateY(30px);
            }
            80% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.7);
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 0 10px rgba(0, 0, 0, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 0, 0, 0);
            }
        }

        .material-icons {
            font-size: 24px;
        }

    </style>
</head>
<body>
    <h1>CONNECT FOUR</h1>
    
    <div class="game-info">
        <span id="status">Current player:</span>
        <div class="player-indicator">
            <span id="current-player" class="material-icons">radio_button_unchecked</span>
        </div>
    </div>
    
    <div id="game-board" class="game-board"></div>
    
    <div class="game-mode">
        <div class="mode-selection">
            <button id="vs-player-btn" class="mode-btn active">
                <span class="material-icons">people</span>
                Player vs Player
            </button>
            <button id="vs-computer-btn" class="mode-btn">
                <span class="material-icons">computer</span>
                Player vs Computer
            </button>
        </div>
        <div id="difficulty-selection" class="difficulty-selection hide">
            <p>Difficulty:</p>
            <div class="difficulty-buttons">
                <button id="easy-btn" class="difficulty-btn active" title="Looks one move ahead and misses tactics fairly often">Easy</button>
                <button id="medium-btn" class="difficulty-btn" title="Looks four moves ahead, but still slips now and then">Medium</button>
                <button id="hard-btn" class="difficulty-btn" title="Looks six moves ahead and rarely blunders">Hard</button>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button id="reset-btn">
            <span class="material-icons">refresh</span>
            Reset Game
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ROWS = 6;
            const COLS = 7;
            const board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            let currentPlayer = 1;
            let gameActive = true;
            let vsComputer = false;
            let difficulty = 'easy';
            
            const gameBoard = document.getElementById('game-board');
            const statusEl = document.getElementById('status');
            const currentPlayerEl = document.getElementById('current-player');
            const resetBtn = document.getElementById('reset-btn');
            const vsPlayerBtn = document.getElementById('vs-player-btn');
            const vsComputerBtn = document.getElementById('vs-computer-btn');
            const difficultySelection = document.getElementById('difficulty-selection');
            const easyBtn = document.getElementById('easy-btn');
            const mediumBtn = document.getElementById('medium-btn');
            const hardBtn = document.getElementById('hard-btn');
            
            // Create the game board
            function createBoard() {
                gameBoard.innerHTML = '';
                
                for (let col = 0; col < COLS; col++) {
                    const column = document.createElement('div');
                    column.classList.add('column');
                    column.dataset.col = col;
                    
                    for (let row = ROWS - 1; row >= 0; row--) {
                        const cell = document.createElement('div');
                        cell.classList.add('cell');
                        cell.dataset.row = row;
                        cell.dataset.col = col;
                        column.appendChild(cell);
                    }
                    
                    column.addEventListener('click', () => dropPiece(col));
                    gameBoard.appendChild(column);
                }
                
                updatePlayerIndicator();
            }
            
            // Drop a piece in the selected column
            function dropPiece(col) {
                if (!gameActive) return;
                
                // Human player is always 1, computer is 2
                if (vsComputer && currentPlayer !== 1) return;
                
                const row = getLowestEmptyRow(col);
                if (row === -1) return; // Column is full
                
                placePiece(row, col);
                
                // If game is still active and vs computer, make computer move
                if (gameActive && vsComputer) {
                    setTimeout(makeComputerMove, 380 + Math.random() * 420);
                }
            }
            
            // Get the lowest empty row in a column
            function getLowestEmptyRow(col) {
                for (let row = 0; row < ROWS; row++) {
                    if (board[row][col] === 0) {
                        return row;
                    }
                }
                return -1; // Column is full
            }
            
            // Place a piece and check game state
            function placePiece(row, col) {
                board[row][col] = currentPlayer;
                const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                cell.classList.add(`player-${currentPlayer}`);
                
                if (checkWin(row, col)) {
                    highlightWinningCells();
                    statusEl.textContent = vsComputer && currentPlayer === 2 ? 
                        "Computer wins!" : `Player ${currentPlayer} wins!`;
                    gameActive = false;
                } else if (checkDraw()) {
                    statusEl.textContent = "It's a draw!";
                    gameActive = false;
                } else {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    updatePlayerIndicator();
                }
            }
            
            /* ------------------------------------------------------------------
             * Computer opponent
             *
             * Negamax + alpha-beta over a window-based evaluation, wrapped in a
             * deliberate imperfection layer. The search is what makes it
             * competitive; the imperfection layer is what keeps it beatable.
             * Three knobs do the tuning:
             *   depth  - how far ahead it actually looks
             *   temp   - softmax temperature at the root, so it doesn't always
             *            grab the single best move
             *   seeWin / seeThreat - odds it notices an immediate win or an
             *            immediate loss. A missed tactic is hidden from the
             *            search too, otherwise the lookahead would just find it
             *            again and the "miss" would never happen.
             * ---------------------------------------------------------------- */
            const AI_P = 2, HU_P = 1;
            const WIN_SCORE = 100000;
            const COL_ORDER = [3, 2, 4, 1, 5, 0, 6]; // centre-first: better pruning

            // temp/slack are in evaluation units, and real root spreads are only
            // ~20-90 wide, so these stay small — a slack of a few hundred would
            // let every column in and reduce the CPU to a coin flip.
            const AI_LEVELS = {
                easy:   { depth: 1, temp: 45, seeWin: 0.70, seeThreat: 0.45, slack: 200 },
                medium: { depth: 4, temp: 22, seeWin: 0.94, seeThreat: 0.82, slack: 55  },
                hard:   { depth: 6, temp: 8,  seeWin: 1.00, seeThreat: 0.97, slack: 22  },
            };

            function validMoves() {
                return COL_ORDER.filter(c => board[ROWS - 1][c] === 0);
            }

            // Score one 4-cell window from `me`'s point of view.
            function scoreWindow(a, b, c, d, me) {
                const opp = me === AI_P ? HU_P : AI_P;
                let mine = 0, theirs = 0, empty = 0;
                for (const v of [a, b, c, d]) {
                    if (v === me) mine++;
                    else if (v === opp) theirs++;
                    else empty++;
                }
                if (mine && theirs) return 0; // dead window
                if (mine === 4) return 1000;
                if (mine === 3 && empty === 1) return 60;
                if (mine === 2 && empty === 2) return 8;
                // Blocking is worth a shade more than building, so it doesn't
                // race when it should be defending.
                if (theirs === 3 && empty === 1) return -75;
                if (theirs === 2 && empty === 2) return -9;
                return 0;
            }

            function evaluate(me) {
                let score = 0;
                for (let r = 0; r < ROWS; r++) {
                    if (board[r][3] === me) score += 7;         // centre control
                    else if (board[r][3] !== 0) score -= 7;

                    for (let c = 0; c < COLS; c++) {
                        if (c + 3 < COLS)
                            score += scoreWindow(board[r][c], board[r][c+1], board[r][c+2], board[r][c+3], me);
                        if (r + 3 < ROWS)
                            score += scoreWindow(board[r][c], board[r+1][c], board[r+2][c], board[r+3][c], me);
                        if (r + 3 < ROWS && c + 3 < COLS)
                            score += scoreWindow(board[r][c], board[r+1][c+1], board[r+2][c+2], board[r+3][c+3], me);
                        if (r + 3 < ROWS && c - 3 >= 0)
                            score += scoreWindow(board[r][c], board[r+1][c-1], board[r+2][c-2], board[r+3][c-3], me);
                    }
                }
                return score;
            }

            function negamax(depth, alpha, beta, me) {
                const moves = validMoves();
                if (!moves.length) return 0;              // draw
                if (depth === 0) return evaluate(me);

                let best = -Infinity;
                for (const col of moves) {
                    const row = getLowestEmptyRow(col);
                    board[row][col] = me;
                    // +depth so a win now beats the same win three moves later
                    const score = checkWin(row, col)
                        ? WIN_SCORE + depth
                        : -negamax(depth - 1, -beta, -alpha, me === AI_P ? HU_P : AI_P);
                    board[row][col] = 0;

                    if (score > best) best = score;
                    if (best > alpha) alpha = best;
                    if (alpha >= beta) break;
                }
                return best;
            }

            // Exact score per legal column (no pruning between roots, since the
            // sampler needs real numbers to weigh, not just the argmax).
            function rootScores(depth, skip) {
                const out = [];
                for (const col of validMoves()) {
                    if (skip.includes(col)) continue;
                    const row = getLowestEmptyRow(col);
                    board[row][col] = AI_P;
                    const score = checkWin(row, col)
                        ? WIN_SCORE
                        : -negamax(depth - 1, -Infinity, Infinity, HU_P);
                    board[row][col] = 0;
                    out.push({ col, score });
                }
                return out;
            }

            // A column where `player` wins outright right now, or -1.
            function immediateWin(player) {
                for (const col of validMoves()) {
                    const row = getLowestEmptyRow(col);
                    board[row][col] = player;
                    const won = checkWin(row, col);
                    board[row][col] = 0;
                    if (won) return col;
                }
                return -1;
            }

            function pickMove() {
                const cfg = AI_LEVELS[difficulty] || AI_LEVELS.easy;
                const moves = validMoves();
                if (!moves.length) return -1;
                if (moves.length === 1) return moves[0];

                // Tactics it might overlook. Anything overlooked goes on `blind`
                // so the search can't quietly rediscover it.
                const blind = [];

                const win = immediateWin(AI_P);
                if (win !== -1) {
                    if (Math.random() < cfg.seeWin) return win;
                    blind.push(win);
                }

                const threat = immediateWin(HU_P);
                if (threat !== -1) {
                    if (Math.random() < cfg.seeThreat) return threat;
                    blind.push(threat);
                }

                let scored = rootScores(cfg.depth, blind);
                if (!scored.length) scored = rootScores(cfg.depth, []);
                if (!scored.length) return moves[0];

                // Don't volunteer for a forced loss unless every move is one.
                const safe = scored.filter(m => m.score > -WIN_SCORE / 2);
                const pool = (safe.length ? safe : scored);
                const best = Math.max(...pool.map(m => m.score));
                const shortlist = pool.filter(m => m.score >= best - cfg.slack);

                // Softmax: usually the best move, sometimes a near-miss. This is
                // the difference between "tough" and "airtight".
                const weights = shortlist.map(m => Math.exp((m.score - best) / cfg.temp));
                let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
                for (let i = 0; i < shortlist.length; i++) {
                    roll -= weights[i];
                    if (roll <= 0) return shortlist[i].col;
                }
                return shortlist[shortlist.length - 1].col;
            }

            function makeComputerMove() {
                if (!gameActive || currentPlayer !== 2) return;

                const col = pickMove();
                if (col === -1) return;

                const row = getLowestEmptyRow(col);
                if (row === -1) return;
                placePiece(row, col);
            }

            // Update the player indicator
            function updatePlayerIndicator() {
                if (currentPlayer === 1) {
                    currentPlayerEl.textContent = 'radio_button_checked';
                    currentPlayerEl.style.color = 'var(--player-one-color)';
                    statusEl.textContent = vsComputer ? 'Your turn:' : 'Current player:';
                } else {
                    currentPlayerEl.textContent = 'radio_button_checked';
                    currentPlayerEl.style.color = 'var(--player-two-color)';
                    statusEl.textContent = vsComputer ? 'Computer\'s turn:' : 'Current player:';
                }
            }
            
            // Check for a win
            function checkWin(row, col) {
                const directions = [
                    [1, 0], // vertical
                    [0, 1], // horizontal
                    [1, 1], // diagonal right
                    [1, -1] // diagonal left
                ];
                
                return directions.some(dir => {
                    const [rowDir, colDir] = dir;
                    return countConsecutive(row, col, rowDir, colDir) >= 4;
                });
            }
            
            // Count consecutive pieces
            function countConsecutive(row, col, rowDir, colDir) {
                const player = board[row][col];
                let count = 1; // Start with the piece just placed
                
                // Check in the positive direction
                let r = row + rowDir;
                let c = col + colDir;
                while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                    count++;
                    r += rowDir;
                    c += colDir;
                }
                
                // Check in the negative direction
                r = row - rowDir;
                c = col - colDir;
                while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === player) {
                    count++;
                    r -= rowDir;
                    c -= colDir;
                }
                
                return count;
            }
            
            // Check for a draw
            function checkDraw() {
                return board[ROWS - 1].every(cell => cell !== 0);
            }
            
            // Highlight winning cells
            function highlightWinningCells() {
                const winningCells = findWinningCells();
                winningCells.forEach(([row, col]) => {
                    const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                    cell.classList.add('win');
                });
            }
            
            // Find winning cells
            function findWinningCells() {
                const winningCells = [];
                const player = currentPlayer;
                
                // Check horizontal
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col <= COLS - 4; col++) {
                        if (board[row][col] === player && 
                            board[row][col+1] === player && 
                            board[row][col+2] === player && 
                            board[row][col+3] === player) {
                            winningCells.push([row, col], [row, col+1], [row, col+2], [row, col+3]);
                        }
                    }
                }
                
                // Check vertical
                for (let row = 0; row <= ROWS - 4; row++) {
                    for (let col = 0; col < COLS; col++) {
                        if (board[row][col] === player && 
                            board[row+1][col] === player && 
                            board[row+2][col] === player && 
                            board[row+3][col] === player) {
                            winningCells.push([row, col], [row+1, col], [row+2, col], [row+3, col]);
                        }
                    }
                }
                
                // Check diagonal (down-right)
                for (let row = 0; row <= ROWS - 4; row++) {
                    for (let col = 0; col <= COLS - 4; col++) {
                        if (board[row][col] === player && 
                            board[row+1][col+1] === player && 
                            board[row+2][col+2] === player && 
                            board[row+3][col+3] === player) {
                            winningCells.push([row, col], [row+1, col+1], [row+2, col+2], [row+3, col+3]);
                        }
                    }
                }
                
                // Check diagonal (down-left)
                for (let row = 0; row <= ROWS - 4; row++) {
                    for (let col = COLS - 1; col >= 3; col--) {
                        if (board[row][col] === player && 
                            board[row+1][col-1] === player && 
                            board[row+2][col-2] === player && 
                            board[row+3][col-3] === player) {
                            winningCells.push([row, col], [row+1, col-1], [row+2, col-2], [row+3, col-3]);
                        }
                    }
                }
                
                return winningCells;
            }
            
            // Reset the game
            function resetGame() {
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        board[row][col] = 0;
                    }
                }
                
                currentPlayer = 1;
                gameActive = true;
                createBoard();
            }
            
            // Set game mode
            function setGameMode(mode) {
                vsComputer = mode === 'computer';
                vsPlayerBtn.classList.toggle('active', !vsComputer);
                vsComputerBtn.classList.toggle('active', vsComputer);
                difficultySelection.classList.toggle('hide', !vsComputer);
                resetGame();
            }
            
            // Set difficulty level
            function setDifficulty(level) {
                difficulty = level;
                easyBtn.classList.toggle('active', level === 'easy');
                mediumBtn.classList.toggle('active', level === 'medium');
                hardBtn.classList.toggle('active', level === 'hard');
            }
            
            // Event listeners
            resetBtn.addEventListener('click', resetGame);
            vsPlayerBtn.addEventListener('click', () => setGameMode('player'));
            vsComputerBtn.addEventListener('click', () => setGameMode('computer'));
            easyBtn.addEventListener('click', () => setDifficulty('easy'));
            mediumBtn.addEventListener('click', () => setDifficulty('medium'));
            hardBtn.addEventListener('click', () => setDifficulty('hard'));
            
            // Initialize the game
            createBoard();
        });
    </script>
</body>
</html>
