<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0b0d">
<title>Connect Four</title>
<meta name="description" content="Connect Four against an opponent that understands threat parity — the strategy that actually decides the game.">

<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Tokens and the theme switch only. The rack/chassis vocabulary lives in
     console.css and is deliberately left out: this is a game, not an
     instrument panel, and it should feel like somewhere you sit down. -->
<link rel="stylesheet" href="../assets/vector.css?v=11">
<script src="../assets/cassette.js?v=11"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Minimal by subtraction, centred, one column. It shares the family's palette
   and its light/dark switch, so it belongs — but none of the furniture. The
   board is the only thing here with any weight, and everything else gets out
   of its way.
   ═══════════════════════════════════════════════════════════════════════════ */

/* The game's own colours. The two discs are the family's red and amber bands
   so it still reads as the same site, but the board gets a real colour of its
   own — a Connect Four board is blue, and a grey one would be a chart. */
:root {
    --p1:    #e5484d;
    --p2:    #ffb000;
    --board: #1c3160;   /* the face */
    --hole:  #0b1220;   /* what an empty slot shows */
    --halo:  rgba(255,255,255,0.62);
    /* Ink for anything knocked out of an --accent fill. Near-black --ground
       reads fine on amber here; in light it does not, so that theme overrides
       it rather than every call site special-casing itself. */
    --on-accent: var(--ground);
}
:root[data-theme="light"] {
    --p1:    #d43a30;
    --p2:    #e09400;
    --board: #5b7ba8;   /* denim, not sky — it has to hold amber without glare */
    --hole:  #3d5474;
    --halo:  rgba(255,255,255,0.78);
    --on-accent: #241703;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    /* Deliberately NOT a flex container. As a row-direction flex parent it
       squeezed the single child down to its minimum content width — the wrap
       collapsed to 40px and the board overflowed the viewport. A block body
       with an auto-margin child is all the centring this needs. */
    min-height: 100dvh;
    background: var(--ground);
    color: var(--ink);
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

.wrap {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 26px 20px 44px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* ── Head ─────────────────────────────────────────────────────────────── */
.head { display: flex; align-items: center; gap: 14px; }
.head h1 {
    font-size: 0.86rem; font-weight: 500;
    letter-spacing: 0.26em; text-transform: uppercase;
}
.head .sp { flex: 1 1 auto; }
.theme { display: flex; align-items: center; gap: 8px; }
.theme-ico {
    width: 13px; height: 13px; flex-shrink: 0;
    color: var(--ink-faint); fill: none; stroke: currentColor;
    stroke-width: 1.4; stroke-linecap: round;
    transition: color var(--slide);
}
.ico-moon { fill: currentColor; stroke: none; }
:root[data-theme="dark"] .ico-moon,
:root:not([data-theme]) .ico-moon { color: var(--phos); }
:root[data-theme="light"] .ico-sun { color: var(--phos); }

/* ── Turn bar ─────────────────────────────────────────────────────────── */
.turnbar { display: flex; align-items: center; gap: 10px; }
.disc {
    width: 13px; height: 13px; border-radius: 50%;
    flex-shrink: 0; background: var(--rule-hi);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.28);
}
.disc.p1 { background: var(--p1); }
.disc.p2 { background: var(--p2); }
#turnName { font-size: 0.84rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
.turnbar .sp { flex: 1 1 auto; }

button.t {
    background: none; border: 1px solid var(--rule-lo); border-radius: 2px;
    color: var(--ink-soft); font: inherit; font-size: 0.72rem;
    letter-spacing: 0.13em; text-transform: uppercase;
    padding: 8px 13px; cursor: pointer;
    transition: color 160ms var(--snap), border-color 160ms var(--snap);
}
button.t:hover:not(:disabled) { color: var(--ink); border-color: var(--rule); }
button.t:disabled { opacity: 0.34; cursor: not-allowed; }
button.t:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

/* Once the game is over the only useful thing on the page is the button that
   starts another one, so it stops being furniture and asks for the click:
   filled, plus a ring that breathes outward. The ring is a box-shadow spread
   rather than a transform so it costs nothing to animate and does not shift
   the turn bar's layout while it pulses. */
button.t.glow {
    color: var(--on-accent);
    background: var(--accent);
    border-color: var(--accent);
    animation: newglow 1.7s ease-in-out infinite;
}
/* Beats button.t:hover, which would otherwise repaint the label mid-glow. */
button.t.glow:hover:not(:disabled) { color: var(--on-accent); border-color: var(--accent); }
@keyframes newglow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,176,0,0.34); }
    70%      { box-shadow: 0 0 0 7px rgba(255,176,0,0); }
}

/* ── Board ────────────────────────────────────────────────────────────────
   Three layers per cell, and the order is the whole trick:

     z0  ::before  the slot itself — a dark disc with an inner shadow, so an
                   empty cell reads as a hole bored into the face
     z1  .pip      the playing piece
     z2  ::after   the face — a radial gradient that is TRANSPARENT in the
                   middle and solid --board everywhere else

   Because the face sits above the piece, a disc falls *behind* the board and
   is revealed through the slot instead of sliding across it. That, plus
   overflow:hidden clipping the piece while it is still above the top row, is
   most of why the drop reads as physical rather than as an element appearing.

   Getting this backwards is subtle and looks completely wrong: paint the face
   with --ground and the page background becomes the board while the slots
   show the blue, i.e. blue dots on paper. */
.board {
    position: relative;
    display: grid; grid-template-columns: repeat(7, 1fr);
    width: 100%; aspect-ratio: 7 / 6;
    background: var(--board);
    border-radius: 12px;
    overflow: hidden;
    touch-action: manipulation;
}
.col { position: relative; display: flex; flex-direction: column-reverse; cursor: pointer; }
.col.full, .col.locked { cursor: default; }
/* The hover wash has to sit ABOVE the face, not behind it. A background on
   .col itself is painted under every positioned descendant, so the face
   covered it completely and the column highlight never showed at all. */
.col::after {
    content: '';
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: rgba(255,255,255,0.10);
    opacity: 0; transition: opacity 130ms var(--snap);
}
.col:hover:not(.full):not(.locked)::after { opacity: 1; }

.cell { position: relative; flex: 1 1 0; }
.cell::before {
    content: '';
    position: absolute; inset: 13%; border-radius: 50%; z-index: 0;
    background: var(--hole);
    box-shadow: inset 0 3px 4px rgba(0,0,0,0.4);
}
.cell::after {
    content: '';
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 0 37%, var(--board) 37.6% 100%);
}
.cell .pip {
    position: absolute; inset: 13%; border-radius: 50%; z-index: 1;
    transform: translateY(-640%);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.26);
}
.cell .pip.p1 { background: var(--p1); }
.cell .pip.p2 { background: var(--p2); }
/* Fall time scales with height, so every drop is the same acceleration
   rather than the same duration. */
.cell .pip.drop { animation: fall var(--fall, 320ms) cubic-bezier(0.45, 0.05, 0.35, 1.12) forwards; }
@keyframes fall { to { transform: translateY(0); } }
.cell .pip.set { transform: translateY(0); }

/* 0.3 sank the losing discs into the board and they read as empty slots.
   Enough to recede, not enough to disappear. */
.board.over .pip:not(.win) { opacity: 0.52; }
.pip.win { animation: pulse 1.05s ease-in-out infinite alternate; z-index: 3; }
@keyframes pulse {
    from { box-shadow: inset 0 -3px 0 rgba(0,0,0,0.26); }
    to   { box-shadow: inset 0 -3px 0 rgba(0,0,0,0.26), 0 0 0 4px var(--halo); }
}

.ghost {
    position: absolute; top: 0; z-index: 4;
    width: calc(100% / 7); aspect-ratio: 1;
    pointer-events: none; opacity: 0;
    transition: opacity 120ms var(--snap), left 120ms var(--snap);
}
.ghost i { position: absolute; inset: 15%; border-radius: 50%; display: block; opacity: 0.55; }
.ghost.on { opacity: 1; }

/* ── Tally ────────────────────────────────────────────────────────────── */
.tally {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px;
    font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-soft);
}
.tally span.grp { display: flex; align-items: center; gap: 7px; }
.tally b { font-weight: 500; color: var(--phos); font-variant-numeric: tabular-nums; }
.tally .sp { flex: 1 1 auto; }
.tally button {
    background: none; border: 0; color: var(--ink-soft);
    font: inherit; font-size: 0.7rem; letter-spacing: 0.13em;
    text-transform: uppercase; cursor: pointer; padding: 4px 0;
}
.tally button:hover { color: var(--alert); }

/* ── Options ──────────────────────────────────────────────────────────── */
.opts { display: flex; flex-direction: column; gap: 13px; }
/* align-items is set EXPLICITLY. These are page-local names, but the shared
   vector.css owns a generic `.row { display:flex; align-items:center }` and an
   earlier version of this file reused that name — the inherited `center` was
   not overridden, so in a column flex box it shrank every control to its
   content width and centred the whole options block. Renamed to .opt, and the
   property is pinned so the next collision cannot do it again. */
.opt { display: flex; flex-direction: column; align-items: stretch; gap: 7px; }
.opt > span.lbl {
    font-size: 0.68rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-soft);
}
.pick { display: flex; border: 1px solid var(--rule-lo); border-radius: 2px; overflow: hidden; }
.pick label { flex: 1 1 0; display: flex; cursor: pointer; }
.pick label + label { border-left: 1px solid var(--rule-lo); }
.pick input { position: absolute; opacity: 0; width: 0; height: 0; }
.pick span {
    flex: 1 1 auto; text-align: center;
    padding: 9px 4px; min-height: 36px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--ink-soft);
    transition: color 160ms var(--snap), background 160ms var(--snap);
}
.pick label:hover span { color: var(--ink); }
/* --on-accent, not --ground: in light that would be pale stock ON pale amber,
   measured 1.3:1, i.e. the selected option was the least legible text here. */
.pick input:checked + span { color: var(--on-accent); background: var(--accent); }
.pick input:focus-visible + span { outline: 1px solid var(--accent); outline-offset: -2px; }
@media (pointer: coarse) { .pick span { min-height: 42px; } }

.blurb { font-size: 0.78rem; line-height: 1.72; color: var(--ink-soft); max-width: 54ch; }

/* ── Readout ──────────────────────────────────────────────────────────── */
.strip {
    display: flex; align-items: flex-start; gap: 14px;
    padding-top: 14px; border-top: 1px solid var(--rule-lo);
    font-size: 0.74rem; line-height: 1.66; color: var(--ink-soft);
}
#analysis {
    font: inherit; color: var(--phos); white-space: pre-wrap; margin: 0;
    min-height: 4.8em; flex: 1 1 auto;
}
.foot { font-size: 0.7rem; letter-spacing: 0.08em; color: var(--ink-soft); text-align: right; white-space: nowrap; }
.foot b { font-weight: 400; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.keys { font-size: 0.7rem; letter-spacing: 0.06em; color: var(--ink-soft); text-align: center; }
kbd {
    font: inherit; font-size: 0.95em; border: 1px solid var(--rule-lo);
    border-radius: 2px; padding: 1px 5px; color: var(--ink-soft);
}
a.home { color: var(--ink-soft); text-decoration: none; font-size: 0.7rem; letter-spacing: 0.13em; text-transform: uppercase; }
a.home:hover { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
    .cell .pip.drop, .pip.win { animation: none; }
    /* The fill still marks it as the thing to press; only the pulse goes. */
    button.t.glow { animation: none; }
    * { transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div class="wrap">

    <header class="head">
        <h1>Connect Four</h1>
        <span class="sp"></span>
        <div class="theme">
            <svg class="theme-ico ico-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 10.6A5.8 5.8 0 0 1 5.4 2.8a5.8 5.8 0 1 0 7.8 7.8Z"/></svg>
            <label class="rocker">
                <input type="checkbox" id="themeSw" aria-label="Light or dark theme">
                <span class="rock"></span>
            </label>
            <svg class="theme-ico ico-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1"/><path d="M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4"/></svg>
        </div>
    </header>

    <div class="turnbar">
        <span class="disc p1" id="turnDisc" aria-hidden="true"></span>
        <span id="turnName">Your move</span>
        <span class="sp"></span>
        <button class="t" type="button" id="undoBtn" disabled>Undo</button>
        <button class="t" type="button" id="newBtn">New</button>
    </div>

    <div class="board" id="board" role="grid" aria-label="Connect Four board">
        <div class="ghost" id="ghost" aria-hidden="true"><i></i></div>
    </div>

    <div class="tally">
        <span class="grp"><i class="disc p1"></i><span id="n1">You</span> <b id="s1">0</b></span>
        <span class="grp"><i class="disc p2"></i><span id="n2">Computer</span> <b id="s2">0</b></span>
        <span class="grp">Draws <b id="sd">0</b></span>
        <span class="sp"></span>
        <button type="button" id="resetScore">Clear</button>
    </div>

    <div class="opts">
        <div class="opt">
            <span class="lbl">Opponent</span>
            <div class="pick" role="radiogroup" aria-label="Opponent">
                <label><input type="radio" name="mode" value="cpu" checked><span>Computer</span></label>
                <label><input type="radio" name="mode" value="human"><span>Two player</span></label>
            </div>
        </div>

        <div class="opt" id="diffFld">
            <span class="lbl">Strength</span>
            <div class="pick" role="radiogroup" aria-label="Strength">
                <label><input type="radio" name="diff" value="easy"><span>Easy</span></label>
                <label><input type="radio" name="diff" value="fair" checked><span>Fair</span></label>
                <label><input type="radio" name="diff" value="sharp"><span>Sharp</span></label>
                <label><input type="radio" name="diff" value="brutal"><span>Brutal</span></label>
            </div>
            <p class="blurb" id="diffNote"></p>
        </div>

        <div class="opt">
            <span class="lbl">Opens</span>
            <div class="pick" role="radiogroup" aria-label="Who opens">
                <label><input type="radio" name="first" value="you" checked><span>You</span></label>
                <label><input type="radio" name="first" value="cpu"><span>Them</span></label>
                <label><input type="radio" name="first" value="alt"><span>Alternate</span></label>
            </div>
            <p class="blurb">Connect Four is a first-player win with perfect play, so who opens matters more than it looks.</p>
        </div>
    </div>

    <div class="strip">
        <pre id="analysis"></pre>
        <span class="foot">move <b id="fMove">0</b><br>last <b id="fLast">&mdash;</b></span>
    </div>

    <p class="keys"><kbd>1</kbd>&ndash;<kbd>7</kbd> drop &middot; <kbd>U</kbd> undo &middot; <kbd>N</kbd> new</p>

    <p style="text-align:center"><a class="home" href="../">&larr; isaiart.com</a></p>

</div>

<script src="../assets/console.js?v=11"></script>
<script src="engine.js?v=2"></script>
<script src="game.js?v=9"></script>
</body>
</html>
