async function battleLoop(){
  for(;;){
    B.brk=false; // set when a faint brings in a replacement: that ends the turn
    const act=await playerAction();
    if(act.type==='run'){
      const fSpe=effSpe(B.foe,B.fStages),pSpe=effSpe(B.ply,B.pStages);
      B.runTries++;
      const odds=pSpe>=fSpe?1:(pSpe*32/fSpe+30*B.runTries)/256;
      if(rnd()<odds){sfx('run');await say("Got away safely!");B.result='run';return;}
      await say("Can't escape!");
      if(await foeTurn())return;continue;
    }
    if(act.type==='ball'){
      if(await throwBall(act.item))return;
      if(await foeTurn())return;continue;
    }
    if(act.type==='item'){
      if(await foeTurn())return;continue;
    }
    if(act.type==='switch'){
      await say("Come back, "+monName(B.ply)+"!");
      await tween(v=>B.plyScale=v,1,0,200);
      B.plyIdx=act.idx;B.ply=G.party[act.idx];B.pStages=freshStages();
      await say("Go, "+monName(B.ply)+"!");
      await tween(v=>B.plyScale=v,0,1,240);
      if(await foeTurn())return;continue;
    }
    if(act.type==='move'){
      const mover=B.ply;                 // the Pokemon that locked in this move
      const mv=mover.moves[act.idx];
      const pFirst=effSpe(B.ply,B.pStages)>=effSpe(B.foe,B.fStages);
      const fmv=aiPickMove();
      const first=(MOVES[mv.m].fx.prio||0)>(MOVES[fmv?fmv.m:'tackle'].fx.prio||0)?true:
                  (MOVES[fmv?fmv.m:'tackle'].fx.prio||0)>(MOVES[mv.m].fx.prio||0)?false:pFirst;
      if(first){
        if(await doMove(true,mv))return;
        // a knocked-out foe's replacement does not get to swing this turn
        if(!B.brk&&B.foe.hp>0){if(await foeAct(fmv))return;}
      }else{
        if(await foeAct(fmv))return;
        // if the chosen Pokemon fainted, its move is lost with it
        if(!B.brk&&B.ply===mover&&B.ply.hp>0){if(await doMove(true,mv))return;}
      }
      // end of turn poison/burn (skipped on the turn a replacement came in)
      if(!B.brk){if(await endTurnStatus())return;}
    }
  }
}
async function playerAction(){
  for(;;){
    const c=await menu([{label:'FIGHT'},{label:'BAG'},{label:'POKéMON'},{label:'RUN'}],
      {right:6,bottom:84,w:110,cancel:false});
    if(c===0){
      const items=B.ply.moves.map(mv=>{const M2=MOVES[mv.m];
        return{label:M2.n,sub:TYPE_NAMES[M2.t]+'  PP '+mv.pp+'/'+M2.pp,dim:mv.pp<=0};});
      const mi=await menu(items,{right:6,bottom:84,w:170});
      if(mi<0)continue;
      if(B.ply.moves[mi].pp<=0){
        if(B.ply.moves.every(m=>m.pp<=0))return{type:'move',idx:-1}; // struggle handled in doMove
        await say("No PP left for that move!");continue;
      }
      return{type:'move',idx:mi};
    }
    if(c===1){
      const r=await battleBag();
      if(r)return r;continue;
    }
    if(c===2){
      const idx=await choosePartyMon("Switch to which Pokémon?",true);
      if(idx<0)continue;
      if(idx===B.plyIdx){await say(DEX[B.ply.id].n+" is already out!");continue;}
      if(G.party[idx].egg){await say("You can't send an EGG into battle! Probably illegal. Definitely sad.");continue;}
      if(G.party[idx].hp<=0){await say("It has no energy left to battle!");continue;}
      return{type:'switch',idx};
    }
    if(c===3){
      if(B.kind==='trainer'){await say("You can't run from a trainer battle!");continue;}
      return{type:'run'};
    }
  }
}
async function battleBag(){
  const ids=Object.keys(G.bag).filter(k=>G.bag[k]>0);
  if(!ids.length){await say("The bag is empty!");return null;}
  ids.sort((a,b)=>BAG_ORDER.indexOf(a)-BAG_ORDER.indexOf(b));
  const items=ids.map(k=>({label:ITEMS[k].n+' ×'+G.bag[k],sub:ITEMS[k].d,iconItem:k}));
  const c=await menu(items,{right:6,bottom:84,w:200});
  if(c<0)return null;
  const id=ids[c],it=ITEMS[id];
  if(it.ball){
    if(B.kind==='trainer'){await say("You can't catch a trainer's Pokémon!");return null;}
    G.bag[id]--;return{type:'ball',item:id};
  }
  const used=await useItemOn(id,true);
  return used?{type:'item'}:null;
}
async function useItemOn(id,inBattle){
  const it=ITEMS[id];
  if(it.repel){G.bag[id]--;G.repel=it.repel;await say("Repel applied! Weak wild Pokémon will stay away.");return true;}
  if(it.rod){await say("Stand facing water and press A to cast the line!");return false;}
  const idx=await choosePartyMon("Use "+it.n+" on which Pokémon?",true);
  if(idx<0)return false;
  const mon=G.party[idx];
  if(it.heal){
    if(mon.hp<=0){await say("It's fainted — a Potion won't help!");return false;}
    if(mon.hp>=mon.maxhp){await say("HP is already full!");return false;}
    mon.hp=Math.min(mon.maxhp,mon.hp+it.heal);G.bag[id]--;
    await say(DEX[mon.id].n+" recovered HP!");return true;
  }
  if(it.cure){
    if(!mon.st){await say("It has no status problem!");return false;}
    mon.st=null;G.bag[id]--;await say(DEX[mon.id].n+" was cured!");return true;
  }
  if(it.revive){
    if(mon.hp>0){await say("It hasn't fainted!");return false;}
    mon.hp=Math.floor(mon.maxhp*it.revive);mon.st=null;G.bag[id]--;
    await say(DEX[mon.id].n+" came back to its senses!");return true;
  }
  if(it.pp){for(const mv of mon.moves)mv.pp=Math.min(MOVES[mv.m].pp,mv.pp+it.pp);G.bag[id]--;
    await say(DEX[mon.id].n+"'s moves recovered PP!");return true;}
  if(it.candy){
    if(mon.egg){await say("The Egg wobbles. Feeding it candy through the shell seems unwise.");return false;}
    if(mon.lvl>=100){await say("It's already at max level!");return false;}
    G.bag[id]--;await gainLevel(mon);return true;
  }
  if(it.tm){
    if(mon.egg){await say("Eggs are famously bad students.");return false;}
    if(!canLearnTM(mon,it.tm)){await say(monName(mon)+" can't learn "+MOVES[it.tm].n+"!\n(It needs a "+TYPE_NAMES[MOVES[it.tm].t]+" or Normal affinity.)");return false;}
    if(mon.moves.some(m2=>m2.m===it.tm)){await say(monName(mon)+" already knows "+MOVES[it.tm].n+"!");return false;}
    const ok=await teachMove(mon,it.tm);
    if(ok)G.bag[id]--;
    return ok;
  }
  if(it.hold){
    if(mon.egg){await say("The Egg has no hands. Or pockets.");return false;}
    if(mon.held){
      addItem(mon.held,1);
      await say(monName(mon)+" handed back its "+ITEMS[mon.held].n+".");
    }
    mon.held=id;G.bag[id]--;calcStats(mon);
    await say(monName(mon)+" is now holding the "+it.n+"!");
    return true;
  }
  return false;
}
// teach a move, prompting to forget one if the moveset is full
async function teachMove(mon,mid){
  if(mon.moves.length<4){
    mon.moves.push({m:mid,pp:MOVES[mid].pp});
    sfx('level');await say(monName(mon)+" learned "+MOVES[mid].n+"!");
    return true;
  }
  const ok=await askYesNo(monName(mon)+" wants to learn "+MOVES[mid].n+"!\nForget an old move to make room?");
  if(!ok){await say(monName(mon)+" did not learn "+MOVES[mid].n+".");return false;}
  const items=mon.moves.map(mv=>({label:MOVES[mv.m].n,sub:TYPE_NAMES[MOVES[mv.m].t]+' pow '+(MOVES[mv.m].p||'—')}));
  const c=await menu(items,{right:6,bottom:84,w:180});
  if(c<0){await say(monName(mon)+" did not learn "+MOVES[mid].n+".");return false;}
  await say("1, 2 and... poof! "+MOVES[mon.moves[c].m].n+" was forgotten.");
  mon.moves[c]={m:mid,pp:MOVES[mid].pp};
  sfx('level');await say(monName(mon)+" learned "+MOVES[mid].n+"!");
  return true;
}
async function throwBall(itemId){
  const it=ITEMS[itemId];
  await say(G.player.name+" threw a "+it.n+"!");
  const d=DEX[B.foe.id];
  sfx('throw');
  // arc toward the foe
  B.cBall={x:60,y:295,rot:0,tier:itemId};
  await tween(k=>{B.cBall.x=60+(339-60)*k;B.cBall.y=295+(92-295)*k-Math.sin(Math.PI*k)*85;B.cBall.rot=k*12;},0,1,520);
  // absorb: foe dissolves into the ball with a flash
  B.flash=0.55;
  await tween(v=>B.foeScale=v,1,0,260);
  B.flash=0;B.foeShow=false;
  // ball drops to the ground
  await tween(k=>{B.cBall.y=92+k*62;B.cBall.rot=0;},0,1,180);
  const stBonus=B.foe.st==='SLP'||B.foe.st==='FRZ'?2:B.foe.st?1.5:1;
  const a=(3*B.foe.maxhp-2*B.foe.hp)*d.cr*it.ball*stBonus/(3*B.foe.maxhp);
  const shakes=a>=255?4:Math.floor(4*Math.pow(a/255,0.4));
  const success=shakes>=4||rnd()*255<a;
  // wobble... wobble... wobble...
  for(let i=0;i<(success?3:Math.min(shakes,3));i++){
    await sleep(300);
    sfx('shake');
    await tween(v=>B.cBall.rot=v,0,-0.38,110);
    await tween(v=>B.cBall.rot=v,-0.38,0.38,150);
    await tween(v=>B.cBall.rot=v,0.38,0,110);
  }
  if(success){
    await sleep(260);
    B.stars=1;B.caught=true;
    sfx('catch');
    await say("Gotcha! "+d.n+" was caught!");
    B.stars=0;B.cBall=null;
    markDex(B.foe.id,true);
    if(await askYesNo("Give "+d.n+" a nickname?")){
      const nn=await nameInput("Nickname for "+d.n+"?",true);
      if(nn)B.foe.nick=nn.slice(0,10);
    }
    if(G.party.length<6){G.party.push(B.foe);await say(monName(B.foe)+" joined your party!");}
    else{G.box.push(B.foe);await say(monName(B.foe)+" was sent to the PC Box!");}
    await grantExp();
    B.result='caught';return true;
  }
  // burst free
  await sleep(200);
  sfx('burst');
  B.flash=0.6;B.cBall=null;B.foeShow=true;
  await tween(v=>B.foeScale=v,0,1,220);
  B.flash=0;
  await say("Oh no! It broke free!");
  return false;
}
function aiPickMove(){
  const usable=B.foe.moves.filter(m=>m.pp>0);
  if(!usable.length)return{m:'struggle',pp:1};
  let best=null,bestScore=-1;
  for(const mv of usable){
    const M2=MOVES[mv.m];let score=rnd()*14;
    if(M2.p>0){
      const eff=typeMult(M2.t,DEX[B.ply.id].t);
      if(eff===0)score=-100+rnd(); // never click an immune move
      else score+=M2.p*eff*(DEX[B.foe.id].t.includes(M2.t)?1.5:1)/1.6;
    }else{
      // status moves: valuable early, useless once applied
      const fx2=M2.fx||{};
      if((fx2.psn||fx2.par||fx2.brn||fx2.slp)&&!B.ply.st&&B.foe.hp>B.foe.maxhp*0.6)score+=42;
      else if(fx2.stat&&fx2.stat[0]==='self'&&B.foe.hp>B.foe.maxhp*0.7)score+=26;
      else if(fx2.heal&&B.foe.hp<B.foe.maxhp*0.5)score+=55;
      else score-=20;
    }
    if(score>bestScore){bestScore=score;best=mv;}
  }
  return best;
}
// smart trainers (leaders, elites, champion) heal and pivot
async function foeSmartActions(){
  if(B.kind!=='trainer'||!B.cfg.leader)return false;
  // sip a potion when hurting
  if(B.foeItems===undefined)B.foeItems=2;
  if(B.foeItems>0&&B.foe.hp>0&&B.foe.hp<B.foe.maxhp*0.28&&rnd()<0.55){
    B.foeItems--;
    B.foe.hp=Math.min(B.foe.maxhp,B.foe.hp+120);
    sfx('heal');drawBattle();
    await say(B.cfg.name+" used a Hyper Potion!\n"+DEX[B.foe.id].n+" recovered health!");
    return true;
  }
  // pivot to a better matchup when badly disadvantaged
  const bench=B.trainerParty.filter(p=>p.hp>0&&p!==B.foe);
  if(bench.length&&rnd()<0.3){
    const threat=Math.max(...DEX[B.foe.id].t.map(()=>1),...B.ply.moves.map(mv=>MOVES[mv.m].p>0?typeMult(MOVES[mv.m].t,DEX[B.foe.id].t):1));
    if(threat>=2){
      const better=bench.find(p=>Math.max(...B.ply.moves.map(mv=>MOVES[mv.m].p>0?typeMult(MOVES[mv.m].t,DEX[p.id].t):1))<2);
      if(better){
        await say(B.cfg.name+" recalled "+DEX[B.foe.id].n+"!");
        B.foe=better;B.foeIdx=B.trainerParty.indexOf(better);B.fStages=freshStages();
        markDex(B.foe.id,false);
        await say(B.cfg.name+" sent out "+DEX[B.foe.id].n+"!");
        await sendFoe();
        return true;   // the pivot consumed the foe's action for this turn
      }
    }
  }
  return false;
}
async function execFoeMove(fmv){return await doMove(false,fmv);}
async function doMove(isPly,mv){
  const user=isPly?B.ply:B.foe, targ=isPly?B.foe:B.ply;
  const uStages=isPly?B.pStages:B.fStages, tStages=isPly?B.fStages:B.pStages;
  const uName=isPly?monName(user):((B.kind==='trainer'?'Foe ':'Wild ')+DEX[user.id].n);
  // pre-move status
  if(user.st==='SLP'){
    const key=isPly?'pSlp':'fSlp';
    if(B[key]>0){B[key]--;await say(uName+" is fast asleep!");return false;}
    user.st=null;await say(uName+" woke up!");
  }
  if(user.st==='FRZ'){
    if(rnd()<0.2){user.st=null;await say(uName+" thawed out!");}
    else{await say(uName+" is frozen solid!");return false;}
  }
  if(user.st==='PAR'&&rnd()<0.25){await say(uName+" is paralyzed! It can't move!");return false;}
  if(mv&&mv.idx===-1)mv=null;
  let mdef;
  if(!mv||(isPly&&B.ply.moves.every(m=>m.pp<=0)&&mv.m===undefined)){mdef=MOVES.struggle;}
  else{mdef=MOVES[mv.m];if(mv.pp!==undefined&&mv.pp<999)mv.pp=Math.max(0,mv.pp-1);}
  if(!mdef)mdef=MOVES.struggle;
  await say(uName+" used "+mdef.n+"!");
  if(mdef.acc<100&&rnd()*100>mdef.acc){await say("The attack missed!");return false;}
  const fx=mdef.fx||{};
  if(mdef.p>0){
    const phys=PHYS.has(mdef.t);
    const atk=effAtk(user,phys,uStages),def=Math.max(1,effDef(targ,phys,tStages));
    const stab=DEX[user.id].t.includes(mdef.t)?1.5:1;
    const tm=typeMult(mdef.t,DEX[targ.id].t);
    if(tm===0){await say("It doesn't affect "+DEX[targ.id].n+"...");return false;}
    await playMoveFX(isPly,mdef.t,false);
    const crit=rnd()<(fx.crit?0.125:0.0625)?1.75:1;
    let wmult=1;
    if(B.weather==='rain'){if(mdef.t==='WAT')wmult=1.3;else if(mdef.t==='FIR')wmult=0.7;}
    else if(B.weather==='snow'){if(mdef.t==='ICE')wmult=1.3;else if(mdef.t==='FIR')wmult=0.8;}
    if(user.held==='muscleband'&&phys)wmult*=1.1;
    if(user.held==='wiseglasses'&&!phys)wmult*=1.1;
    let dmg=Math.floor(((2*user.lvl/5+2)*mdef.p*atk/def)/50+2);
    dmg=Math.max(1,Math.floor(dmg*stab*tm*crit*wmult*(0.85+rnd()*0.15)));
    targ.hp=Math.max(0,targ.hp-dmg);
    if(isPly)B.anim.fShake=6;else B.anim.pShake=6;
    sfx(tm>1?'superhit':tm<1?'weakhit':'hit');
    drawBattle();
    if(crit>1)await say("A critical hit!");
    if(tm>1)await say("It's super effective!");
    if(tm<1)await say("It's not very effective...");
    if(fx.drain){const h=Math.max(1,Math.floor(dmg*fx.drain));user.hp=Math.min(user.maxhp,user.hp+h);
      await say(uName+" drained energy!");}
    if(fx.recoil){user.hp=Math.max(0,user.hp-Math.floor(dmg*fx.recoil));await say(uName+" is hit with recoil!");}
    if(targ.hp<=0)return await handleFaint(!isPly);
    if(targ.held==='sitrusberry'&&targ.hp<targ.maxhp*0.5){
      targ.hp=Math.min(targ.maxhp,targ.hp+Math.floor(targ.maxhp*0.3));
      targ.held=null;sfx('heal');drawBattle();
      await say((isPly?DEX[targ.id].n:monName(targ))+"'s Sitrus Berry restored its health!");
    }
    // secondary status
    if(!targ.st){
      for(const s of['brn','psn','par','frz'])
        if(fx[s]&&rnd()*100<fx[s]){targ.st=s.toUpperCase();
          if(targ.st==='BRN')await say(DEX[targ.id].n+" was burned!");
          if(targ.st==='PSN')await say(DEX[targ.id].n+" was poisoned!");
          if(targ.st==='PAR')await say(DEX[targ.id].n+" is paralyzed!");
          if(targ.st==='FRZ')await say(DEX[targ.id].n+" was frozen solid!");break;}
      if(fx.slp&&rnd()*100<fx.slp){targ.st='SLP';B[isPly?'fSlp':'pSlp']=ri(1,3);
        await say(DEX[targ.id].n+" fell asleep!");}
    }
    if(fx.stat&&rnd()*100<fx.stat[3]){
      const[who,stat,delta]=fx.stat;
      const st2=who==='self'?uStages:tStages;
      st2[stat]=clamp(st2[stat]+delta,-6,6);
      await say((who==='self'?uName:DEX[targ.id].n)+"'s "+stat.toUpperCase()+(delta>0?" rose!":" fell!"));
    }
    if(user.hp<=0)return await handleFaint(isPly);
    return false;
  }
  // pure status move
  await playMoveFX(isPly,mdef.t,true);
  if(fx.heal){user.hp=Math.min(user.maxhp,user.hp+Math.floor(user.maxhp*fx.heal));
    await say(uName+" recovered health!");return false;}
  if(fx.stat){
    const[who,stat,delta,ch]=fx.stat;
    const st2=who==='self'?uStages:tStages;
    st2[stat]=clamp(st2[stat]+delta,-6,6);
    await say((who==='self'?uName:DEX[targ.id].n)+"'s "+stat.toUpperCase()+(delta>0?" rose!":" fell!"));
    return false;
  }
  if(targ.st){await say("But it failed!");return false;}
  for(const s of['brn','psn','par'])
    if(fx[s]){targ.st=s.toUpperCase();
      await say(DEX[targ.id].n+(s==='brn'?" was burned!":s==='psn'?" was poisoned!":" is paralyzed!"));return false;}
  if(fx.slp){targ.st='SLP';B[isPly?'fSlp':'pSlp']=ri(1,3);await say(DEX[targ.id].n+" fell asleep!");return false;}
  await say("But it failed!");return false;
}
// one foe action: a potion or pivot IS their turn, otherwise they attack
async function foeAct(fmv){
  if(await foeSmartActions())return false;
  // a queued move belongs to whoever chose it — never let a fresh Pokemon use it
  if(!fmv||!B.foe.moves||!B.foe.moves.includes(fmv))fmv=aiPickMove();
  return await execFoeMove(fmv);
}
async function foeTurn(){
  if(await foeAct(aiPickMove()))return true;
  return B.brk?false:await endTurnStatus();
}
async function endTurnStatus(){
  for(const[mon,isPly]of[[B.ply,true],[B.foe,false]]){
    if(mon.hp<=0)continue;
    if(mon.st==='PSN'||mon.st==='BRN'){
      mon.hp=Math.max(0,mon.hp-Math.max(1,Math.floor(mon.maxhp/8)));
      drawBattle();
      await say(DEX[mon.id].n+(mon.st==='PSN'?" is hurt by poison!":" is hurt by its burn!"));
      if(mon.hp<=0){if(await handleFaint(isPly))return true;}
    }
  }
  return false;
}
// returns true if battle over
async function handleFaint(plyFainted){
  if(plyFainted){
    sfx("faint");await say(monName(B.ply)+" fainted!");
    const alive=G.party.findIndex(p=>p.hp>0);
    if(alive<0){
      if(B.kind==='trainer'&&B.cfg.lose){await say(B.cfg.lose);}
      B.result='blackout';return true;
    }
    let idx=-1;
    while(idx<0||G.party[idx].hp<=0){
      idx=await choosePartyMon("Send out which Pokémon?",false);
      if(idx>=0&&G.party[idx].hp<=0){await say("It has no energy left!");idx=-1;}
    }
    B.plyIdx=idx;B.ply=G.party[idx];B.pStages=freshStages();
    await say("Go! "+monName(B.ply)+"!");
    B.plyScale=0;await tween(v=>B.plyScale=v,0,1,240);
    B.brk=true;   // the turn ends here: the newcomer acts next turn
    return false;
  }
  // foe fainted
  sfx('faint');await say((B.kind==='trainer'?'Foe ':'Wild ')+DEX[B.foe.id].n+" fainted!");
  await grantExp();
  if(B.kind==='trainer'){
    B.foeIdx++;
    if(B.foeIdx<B.trainerParty.length){
      B.foe=B.trainerParty[B.foeIdx];B.fStages=freshStages();
      markDex(B.foe.id,false);
      await say(B.cfg.name+" sent out "+DEX[B.foe.id].n+"!");
      await sendFoe();
      B.brk=true;   // fresh Pokemon, fresh turn — no free hit either way
      return false;
    }
    B.result='win';return true;
  }
  B.result='win';return true;
}
async function grantExp(){
  const exp=Math.floor(expYield(B.foe)*(B.kind==='trainer'?1.5:1));
  const mon=B.ply;
  if(mon.hp<=0||mon.lvl>=100)return;
  await say(monName(mon)+" gained "+exp+" EXP!");
  mon.exp+=exp;
  while(mon.exp>=expNext(mon.lvl)&&mon.lvl<100){
    mon.exp-=expNext(mon.lvl);
    await gainLevel(mon);
  }
}
async function gainLevel(mon){
  mon.lvl++;
  const oldMax=mon.maxhp;calcStats(mon);
  mon.hp=Math.min(mon.maxhp,mon.hp+(mon.maxhp-oldMax));
  sfx("level");await say(monName(mon)+" grew to Lv"+mon.lvl+"!");
  if(B.active)drawBattle();
  // learn moves
  for(const[l,mid]of learnset(mon.id)){
    if(l===mon.lvl&&!mon.moves.some(mv=>mv.m===mid)){
      if(mon.moves.length<4){mon.moves.push({m:mid,pp:MOVES[mid].pp});
        await say(monName(mon)+" learned "+MOVES[mid].n+"!");}
      else{
        const ok=await askYesNo(monName(mon)+" wants to learn "+MOVES[mid].n+"!\nForget an old move to make room?");
        if(ok){
          const items=mon.moves.map(mv=>({label:MOVES[mv.m].n,sub:TYPE_NAMES[MOVES[mv.m].t]+' pow '+MOVES[mv.m].p}));
          const c=await menu(items,{right:6,bottom:84,w:180});
          if(c>=0){await say("1, 2 and... poof! "+MOVES[mon.moves[c].m].n+" was forgotten.");
            mon.moves[c]={m:mid,pp:MOVES[mid].pp};
            await say(monName(mon)+" learned "+MOVES[mid].n+"!");}
          else await say(monName(mon)+" did not learn "+MOVES[mid].n+".");
        } else await say(monName(mon)+" did not learn "+MOVES[mid].n+".");
      }
    }
  }
  // evolution
  const d=DEX[mon.id];
  if(d.ev&&mon.lvl>=d.el&&!B.active){await evolve(mon);}
  else if(d.ev&&mon.lvl>=d.el){mon.pendingEvo=true;}
}
async function evolve(mon){
  const d=DEX[mon.id],to=DEX[d.ev];
  const ok=await askYesNo("What? "+d.n+" is evolving!\n(Press YES to let it evolve, NO to stop it.)");
  if(!ok){await say(d.n+" stopped evolving. (It will try again next level.)");mon.pendingEvo=false;return;}
  sfx("evolve");await say("Congratulations! Your "+(mon.nick||d.n)+" evolved into "+to.n+"!");
  mon.id=d.ev;mon.pendingEvo=false;
  const hpPct=mon.hp/mon.maxhp;calcStats(mon);mon.hp=Math.max(1,Math.floor(mon.maxhp*hpPct));
  markDex(mon.id,true);
  // learn moves of new form at this level? keep current moves
}
async function checkPendingEvos(){
  for(const mon of G.party){
    const d=DEX[mon.id];
    if((mon.pendingEvo||(d.ev&&mon.lvl>=d.el))&&d.ev){await evolve(mon);}
  }
}

function battleSceneFor(m){
  if(G.surfing)return 'water';
  if(!m)return 'grass';
  if(!m.outdoor){
    const ind=String(m.indoor||'');
    if(ind.indexOf('gym')===0)return 'gym';
    if(ind==='league'||ind.indexOf('e4')===0)return 'league';
    return m.dark?'cave':'indoor';
  }
  if(m.dark)return 'cave';
  const t=m.theme;
  if(t===THEMES.snow)return 'snow';
  if(t===THEMES.dark)return 'haunt';
  if(t===THEMES.stone||t===THEMES.gravel)return 'rocky';
  if(t===THEMES.harbor)return 'beach';
  if(t===THEMES.urban)return 'city';
  if(t===THEMES.fairy)return 'meadow';
  return 'grass';
}

 cinderfoot:{x:288,y:76,c:'#95917a',n:'Cinderfoot',s:'l'}};
const MAP_EDGES=[['dewbrook','brightleaf','1'],['brightleaf','portazure','2'],['portazure','voltis','3'],
 ['voltis','fernholm','4'],['fernholm','meadow',''],['fernholm','shadowvale','5'],['shadowvale','ironpeak','6'],
 ['ironpeak','frostmere','7'],['frostmere','drakenspire','8'],['drakenspire','victory','9'],
 ['dewbrook','orchard',''],['milltide','voltis',''],['cinderfoot','ironpeak','']];
function mapNodeFor(mapKey){
 if(MAP_NODES[mapKey])return mapKey;
 if(mapKey==='league'||mapKey.indexOf('e4')===0)return 'victory';
 const base=mapKey.split('_')[0];
 if(MAP_NODES[base])return base;
 if(mapKey==='echocave')return 'cinderfoot';
 if(mapKey==='glacierhollow')return 'frostmere';
 if(base==='tower'||base==='apt'){
   const suf=({pa:'portazure',vo:'voltis',dk:'drakenspire'})[(mapKey.split('_')[1]||'').slice(0,2)];
   if(suf)return suf;
 }
 if(mapKey.indexOf('route')===0){
   const num=mapKey.slice(5);
   const e=MAP_EDGES.find(ed=>ed[2]===num);
   if(e)return e; // edge → draw between nodes
 }
 return 'dewbrook';
}
function regionMap(){
 return new Promise(res=>{
   const div=document.createElement('div');div.className='win';
   div.style.cssText='left:6px;top:6px;right:6px;bottom:6px;z-index:80;overflow:hidden;background:#f0e6c8';
   const cv2=document.createElement('canvas');cv2.width=468;cv2.height=308;
   div.appendChild(cv2);
   $('uiroot').appendChild(div);
   const c=cv2.getContext('2d');
   let tick2=0;
   const draw=()=>{
     tick2++;
     c.fillStyle='#f0e6c8';c.fillRect(0,0,468,308);
     // parchment texture + sea corner
     c.fillStyle='#e6dab4';for(let i=0;i<40;i++)c.fillRect((i*97)%468,(i*61)%308,14,3);
     c.fillStyle='#a8cfe8';c.beginPath();c.moveTo(0,308);c.quadraticCurveTo(140,240,60,180);
     c.quadraticCurveTo(20,150,0,160);c.lineTo(0,308);c.closePath();// decorative western sea
     c.fill();
     c.fillStyle='#30346d';c.font='bold 20px VT323,monospace';c.fillText('THE CLAUDE REGION',150,24);
     c.font='13px VT323,monospace';c.fillText('~ charted by C.L. Claude, 300 years ago ~',140,40);
     // routes
     c.strokeStyle='#c9a96a';c.lineWidth=6;c.lineCap='round';
     for(const[a,b]of MAP_EDGES){const A=MAP_NODES[a],Bn=MAP_NODES[b];
       c.beginPath();c.moveTo(A.x,A.y);c.lineTo(Bn.x,A.y);c.lineTo(Bn.x,Bn.y);c.stroke();}
     // nodes
     c.font='12px VT323,monospace';
     for(const k in MAP_NODES){const N=MAP_NODES[k];
       c.fillStyle='#30346d';c.fillRect(N.x-9,N.y-9,18,18);
       c.fillStyle=N.c;c.fillRect(N.x-7,N.y-7,14,14);
       if(k==='victory'){c.fillStyle='#fff';c.font='11px VT323';c.fillText('★',N.x-4,N.y+4);c.font='12px VT323,monospace';}
       c.fillStyle='#30346d';
       c.fillText(N.n,N.s==='r'?N.x+14:N.x-N.n.length*6-12,N.y+4);
     }
     // you are here
     const loc=mapNodeFor(G.map);
     let mx,my;
     if(Array.isArray(loc)){const A=MAP_NODES[loc[0]],Bn=MAP_NODES[loc[1]];mx=(A.x+Bn.x)/2;my=(A.y+Bn.y)/2;}
     else{mx=MAP_NODES[loc].x;my=MAP_NODES[loc].y;}
     const pulse=6+Math.sin(tick2/5)*3;
     c.strokeStyle='#b13e53';c.lineWidth=3;
     c.beginPath();c.arc(mx,my,pulse+8,0,7);c.stroke();
     c.fillStyle='#b13e53';c.beginPath();c.arc(mx,my,4,0,7);c.fill();
     c.font='bold 13px VT323,monospace';c.fillStyle='#b13e53';
     c.fillText('YOU ARE HERE',mx-38,my-pulse-12);
     c.fillStyle='#566c86';c.font='12px VT323,monospace';
     c.fillText('press A / B to close',180,300);
   };
   draw();
   const iv=setInterval(draw,80);
   const h=e=>{const act=KEYMAP[e.key];
     if(act==='a'||act==='b'){e.stopPropagation();cleanup();}};
   const cleanup=()=>{clearInterval(iv);document.removeEventListener('keydown',h,true);div.remove();res();};
   document.addEventListener('keydown',h,true);
   div.addEventListener('click',cleanup);
 });
}

function codeOverlay(title,text,editable){

    ta.value=text;if(!editable)ta.readOnly=true;
    const row=document.createElement('div');row.style.cssText='margin-top:8px;display:flex;gap:8px';
    const mkBtn=(t,bg)=>{const b=document.createElement('button');b.textContent=t;

      return b;};
    const cleanup=v=>{div.remove();G.state=was==='naming'?'play':was;res(v);};
    if(!editable){
      const cp=mkBtn('COPY','#3b5dc9');
      cp.addEventListener('click',()=>{ta.select();
        if(navigator.clipboard)navigator.clipboard.writeText(ta.value);
        else document.execCommand('copy');
        cp.textContent='COPIED!';});
      row.appendChild(cp);
    }else{
      const ld=mkBtn('LOAD','#38b764');
      ld.addEventListener('click',()=>cleanup(ta.value));
      row.appendChild(ld);
    }
    const cl=mkBtn('CLOSE','#b13e53');
    cl.addEventListener('click',()=>cleanup(null));
    row.appendChild(cl);
    div.appendChild(ta);div.appendChild(row);
    $('uiroot').appendChild(div);
    ta.addEventListener('keydown',e=>e.stopPropagation());
    if(editable)setTimeout(()=>ta.focus(),50);
  });
}

const BADGE_NAMES=['Terra','Tide','Volt','Bloom','Phantom','Fist','Frost','Wyrm'];
// ---------- cinematic badge ceremony ----------
function badgeCeremony(idx,badgeName){
  return new Promise(res=>{
    sfx('badge');
    const div=document.createElement('div');
    div.style.cssText='position:absolute;inset:0;z-index:95;background:rgba(8,8,22,.93)';
    const cv3=document.createElement('canvas');cv3.width=480;cv3.height=320;
    div.appendChild(cv3);
    document.getElementById('game').appendChild(div);
    const c=cv3.getContext('2d');
    const t0=performance.now();
    const parts=[];
    for(let i=0;i<30;i++)parts.push({a:Math.random()*7,r:45+Math.random()*100,sp:0.5+Math.random(),ph:Math.random()*7});
    let done=false;
    function draw(t){
      if(done)return;
      const k=Math.min((t-t0)/900,1);
      c.clearRect(0,0,480,320);
      // rotating golden rays
      c.save();c.translate(240,135);c.rotate(t/2600);
      for(let i=0;i<12;i++){
        c.rotate(Math.PI/6);
        const gr=c.createLinearGradient(0,0,210,0);
        gr.addColorStop(0,'rgba(255,215,106,.3)');gr.addColorStop(1,'rgba(255,215,106,0)');
        c.fillStyle=gr;c.beginPath();c.moveTo(0,0);c.lineTo(210,-20);c.lineTo(210,20);c.closePath();c.fill();
      }
      c.restore();
      // halo
      const hg=c.createRadialGradient(240,135,10,240,135,120);
      hg.addColorStop(0,'rgba(255,240,190,.5)');hg.addColorStop(1,'rgba(255,240,190,0)');
      c.fillStyle=hg;c.beginPath();c.arc(240,135,120,0,7);c.fill();
      // badge spins and scales in with a little overshoot
      const s=k<1?(0.15+1.2*k-0.35*k*k):1;
      const size=140*s;
      c.save();c.translate(240,135);c.rotate((1-k)*7);
      drawBadgeIcon(c,idx,-size/2,-size/2,size,true);
      c.restore();
      // orbiting sparkles
      for(const p of parts){
        const rr=p.r*(0.65+0.35*Math.sin(t/320+p.ph));
        const tw=(Math.sin(t/85+p.ph)+1)/2;
        c.globalAlpha=0.25+tw*0.75;
        c.fillStyle=tw>0.6?'#fff':'#ffd76a';
        c.fillRect(240+Math.cos(p.a+t/900*p.sp)*rr-2,135+Math.sin(p.a+t/900*p.sp)*rr*0.72-2,4,4);
      }
      c.globalAlpha=1;
      // title card
      if(k>0.45){
        c.textAlign='center';
        c.fillStyle='#141423';c.font='bold 34px VT323,monospace';
        c.fillText((badgeName||BADGE_NAMES[idx]+' Badge').toUpperCase(),242,262);
        c.fillStyle='#ffd76a';
        c.fillText((badgeName||BADGE_NAMES[idx]+' Badge').toUpperCase(),240,260);
        c.fillStyle='#fff';c.font='bold 22px VT323,monospace';
        c.fillText('— GET! —',240,290);
        if(t-t0>1400&&Math.floor(t/450)%2){
          c.fillStyle='#94b0c2';c.font='14px VT323,monospace';
          c.fillText('press A',240,312);
        }
        c.textAlign='left';
      }
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
    const h=e=>{const act=KEYMAP[e.key];
      if((act==='a'||act==='b')&&performance.now()-t0>1300){e.stopPropagation();cleanup();}};
    const cleanup=()=>{done=true;document.removeEventListener('keydown',h,true);div.remove();res();};
    document.addEventListener('keydown',h,true);
    div.addEventListener('click',()=>{if(performance.now()-t0>1300)cleanup();});
  });
}

function typeChip(t){return '<span style="background:'+TYPE_COLORS[t]+';color:#fff;padding:0 6px;border-radius:4px;font-size:12px;margin-right:4px;text-shadow:1px 1px 0 rgba(0,0,0,.35)">'+TYPE_NAMES[t]+'</span>';}
function statBarsHTML(vals,labels,max){
  let h='';
  for(let i=0;i<vals.length;i++){
    const pct=clamp(vals[i]/max*100,4,100);
    const col=pct>=62?'#38b764':pct>=45?'#8bc34a':pct>=28?'#e8b743':'#e05a5a';
    h+='<div style="display:flex;align-items:center;gap:4px;line-height:1.2">'+
      '<span style="width:32px;font-size:12px;color:#566c86">'+labels[i]+'</span>'+
      '<span style="width:28px;font-size:12px;text-align:right">'+vals[i]+'</span>'+
      '<span style="flex:1;background:#e3e3d8;border-radius:3px;height:7px;margin-left:3px"><span style="display:block;height:7px;border-radius:3px;width:'+pct+'%;background:'+col+'"></span></span></div>';
  }
  return h;
}
function evoChainOf(id){
  let base=id,guard=0;
  for(;;){const pre=DEX.findIndex(d=>d&&d.ev===base);if(pre>0&&guard++<6)base=pre;else break;}
  const chain=[];let cur=base;
  while(cur){chain.push(cur);cur=DEX[cur].ev||0;}
  return chain;
}
function makeDetailPanel(){
  const div=document.createElement('div');div.className='win';
  div.style.cssText='left:198px;top:6px;right:6px;height:236px;padding:7px 10px;overflow:hidden;z-index:45';
  $('uiroot').appendChild(div);
  return div;
}
function spriteInto(div,sel,id,size,dark,shiny){
  const host=div.querySelector(sel);if(!host)return;
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const cx=c.getContext('2d');
  drawMon(cx,id,0,0,size,{shiny});
  if(dark){cx.globalCompositeOperation='source-atop';cx.fillStyle='#232540';cx.fillRect(0,0,size,size);}
  host.appendChild(c);
}

       :seen?'<div style="font-size:13px;color:#566c86;padding-top:12px">Catch one to record its full stats!</div>'
       :'<div style="font-size:13px;color:#94a3b8;padding-top:12px">Data unknown.<br>Encounter it in the wild!</div>')+

async function openShop(stock){

    if(c===0){
      for(;;){
        const items=stock.map(k=>({label:ITEMS[k].n+'  ₽'+ITEMS[k].price,sub:ITEMS[k].d,iconItem:k,dim:G.player.money<ITEMS[k].price}));
        const i=await menu(items,{right:6,top:6,w:220,note:'₽'+G.player.money+' — B to stop buying'});
        if(i<0)break;
        const id=stock[i],it=ITEMS[id];
        if(G.player.money<it.price){await say("Clerk: Not enough money, friend.");continue;}
        let qty=1;
        const qc=await menu([{label:'×1  ₽'+it.price},{label:'×5  ₽'+it.price*5,dim:G.player.money<it.price*5},
          {label:'×10  ₽'+it.price*10,dim:G.player.money<it.price*10}],{right:6,top:110,w:140});
        if(qc<0)continue;
        qty=[1,5,10][qc];
        if(G.player.money<it.price*qty){await say("Clerk: Not enough for that many!");continue;}
        G.player.money-=it.price*qty;addItem(id,qty);updateHud();
        await say("Clerk: "+it.n+" ×"+qty+"! Anything else?");
      }
    }
    if(c===1){
      for(;;){
        const ids=Object.keys(G.bag).filter(k=>G.bag[k]>0&&ITEMS[k].price>0);
        if(!ids.length){await say("Clerk: Nothing I can buy from you today!");break;}
        const items=ids.map(k=>({label:ITEMS[k].n+' ×'+G.bag[k]+'  →  ₽'+Math.floor(ITEMS[k].price/2),sub:ITEMS[k].d,iconItem:k}));
        const i=await menu(items,{right:6,top:6,w:230,note:'Selling at half price — B to stop'});
        if(i<0)break;
        const id=ids[i];G.bag[id]--;G.player.money+=Math.floor(ITEMS[id].price/2);updateHud();
        await say("Clerk: Pleasure doing business!");
      }
    }
  }
}

  return new Promise(res=>{

    const div=document.createElement('div');div.className='win';
    div.style.cssText='left:90px;top:100px;width:300px;padding:14px;z-index:80';

    inp.maxLength=10;inp.value='';inp.placeholder=allowEmpty?'(leave blank to skip)':'Skye';
    const btn=document.createElement('button');btn.textContent='OK!';
    btn.style.cssText='margin-top:8px;font:bold 14px VT323,monospace;padding:6px 22px;background:#38b764;color:#fff;border:2px solid #30346d;border-radius:4px;cursor:pointer';

      res(v||(allowEmpty?'':'Skye'));};

const LOOK_ROWS=[
 {k:'fem',n:'STYLE',vals:[false,true],names:['BOY','GIRL']},
 {k:'skin',n:'SKIN',vals:['#f0c8a0','#ffdbac','#d9a066','#8d5524'],names:['FAIR','PEACH','TAN','DEEP']},
 {k:'hair',n:'HAIR',vals:['#3a2c1e','#141423','#7a4a2b','#e8b743','#b13e53','#e88fb0','#566c86','#c0cbdc'],names:['BROWN','BLACK','AUBURN','BLOND','RED','PINK','SLATE','SILVER']},
 {k:'shirt',n:'OUTFIT',vals:['#b13e53','#3b5dc9','#38b764','#9d47a0','#ef7d57','#f75a87','#e8b743','#566c86'],names:['CRIMSON','COBALT','LEAF','PLUM','TANGERINE','ROSE','GOLD','STORM']},
 {k:'pants',n:'LEGS',vals:['#30346d','#3a2c1e','#566c86','#1a1c2c'],names:['NAVY','BROWN','GREY','NIGHT']},
 {k:'hat',n:'HAT',vals:['#b13e53','#3b5dc9','#38b764','#e8b743','#141423',''],names:['RED CAP','BLUE CAP','GREEN CAP','GOLD CAP','BLACK CAP','NO HAT']},
];
function appearanceEditor(start){
  return new Promise(res=>{
    const was=G.state;G.state='naming';
    start=start||{};
    const look={};
    const idx=LOOK_ROWS.map(r=>{
      let i=r.vals.indexOf(r.k==='fem'?!!start.fem:(start[r.k]!==undefined?start[r.k]:r.vals[0]));
      if(i<0)i=0;look[r.k]=r.vals[i];return i;
    });
    let sel=0; // 0..5 rows, 6 = DONE
    const div=document.createElement('div');div.className='win';
    div.style.cssText='left:70px;top:14px;width:340px;padding:10px;z-index:88';
    div.innerHTML='<div style="text-align:center;font-size:17px;margin-bottom:4px">CHOOSE YOUR LOOK</div>'+
      '<div style="display:flex;gap:10px"><canvas id="lookcv" width="110" height="118" style="background:#8fd3ff;border:2px solid #1a1c2c;image-rendering:pixelated"></canvas>'+
      '<div id="lookrows" style="flex:1"></div></div>'+
      '<div id="lookdone" style="text-align:center;margin-top:6px;padding:2px;border:2px solid #1a1c2c;background:#41a6f6;color:#fff;cursor:pointer">START ADVENTURE!</div>'+
      '<div class="mnote" style="margin-top:4px">ARROWS change · ENTER done · click works too</div>';
    $('uiroot').appendChild(div);
    const rowsEl=div.querySelector('#lookrows'),doneEl=div.querySelector('#lookdone');
    const pc=div.querySelector('#lookcv').getContext('2d');
    function paintRows(){
      rowsEl.innerHTML='';
      LOOK_ROWS.forEach((r,i)=>{
        const d=document.createElement('div');
        d.style.cssText='display:flex;justify-content:space-between;padding:1px 4px;font-size:15px'+(i===sel?';background:#41a6f6;color:#fff':'');
        d.innerHTML='<span style="cursor:pointer" data-cyc="-1">◀</span><span style="min-width:60px;text-align:center">'+r.n+'</span>'+
          '<span style="min-width:88px;text-align:center">'+r.names[idx[i]]+'</span><span style="cursor:pointer" data-cyc="1">▶</span>';
        d.addEventListener('click',e=>{sel=i;const c=e.target.getAttribute('data-cyc');if(c)cycle(i,+c);paintRows();});
        rowsEl.appendChild(d);
      });
      doneEl.style.background=sel===LOOK_ROWS.length?'#ef7d57':'#41a6f6';
    }
    function cycle(i,d){
      const r=LOOK_ROWS[i];idx[i]=(idx[i]+d+r.vals.length)%r.vals.length;
      look[r.k]=r.vals[idx[i]];sfx('blip');
    }
    let step=0;
    const DIRS=['down','right','up','left'];
    function draw(){
      pc.fillStyle='#a7f070';pc.fillRect(0,88,110,30);
      pc.fillStyle='#8fd3ff';pc.fillRect(0,0,110,88);
      pc.save();pc.imageSmoothingEnabled=false;
      pc.translate(8,8);pc.scale(3,3);
      drawPerson(pc,0,0,0,DIRS[Math.floor(step/4)%4],step%2,Object.assign({},PAL_PLAYER,look));
      pc.restore();step++;
    }
    const iv=setInterval(draw,320);draw();
    function finish(ok){
      clearInterval(iv);document.removeEventListener('keydown',h,true);div.remove();
      G.state=was==='naming'?'play':was;
      sfx(ok?'confirm':'cancel');
      res(ok?Object.assign({},look):null);
    }
    doneEl.addEventListener('click',()=>finish(true));
    const h=e=>{
      const act=KEYMAP[e.key];if(!act)return;
      e.stopPropagation();e.preventDefault();
      if(act==='up'){sel=(sel-1+LOOK_ROWS.length+1)%(LOOK_ROWS.length+1);sfx('blip');}
      else if(act==='down'){sel=(sel+1)%(LOOK_ROWS.length+1);sfx('blip');}
      else if(act==='left'&&sel<LOOK_ROWS.length){cycle(sel,-1);draw();}
      else if(act==='right'&&sel<LOOK_ROWS.length){cycle(sel,1);draw();}
      else if(act==='a'){if(sel===LOOK_ROWS.length)return finish(true);sel=LOOK_ROWS.length;}
      else if(act==='b')return finish(false);
      paintRows();
    };
    document.addEventListener('keydown',h,true);
    paintRows();
  });
}

        '<span style="color:#94b0c2">LF:</span> <span class="ww"></span> <b>'+DEX[want].n+'</b>'+
        ' <span style="color:#94b0c2">· FT:</span> <span class="wo"></span> <b>'+DEX[offer].n+'</b><br>'+
        '<span style="color:#c0cbdc;font-size:12px">“'+NOTES[Math.floor(r()*NOTES.length)]+'”</span>';
      wtr.appendChild(d);
      d.querySelector('.ww').appendChild(wikiMonIcon(want,20,!G.dex.seen[want]));
      d.querySelector('.wo').appendChild(wikiMonIcon(offer,20,!G.dex.seen[offer]));
    }
  }
}
function wikiBrowser(startPage){
  return new Promise(res=>{
    const was=G.state;G.state='naming';
    let page=startPage||0;
    const div=document.createElement('div');div.className='win';
    div.style.cssText='left:6px;top:4px;width:468px;height:312px;z-index:90;padding:0;overflow:hidden;background:#1a1c2c;border-color:#3b5dc9;display:flex;flex-direction:column';
    div.innerHTML=
      '<div style="background:linear-gradient(#41a6f6,#3b5dc9);color:#fff;padding:2px 8px;font-size:15px;display:flex;justify-content:space-between;flex-shrink:0">'+
        '<span>▒ ClaudeNet Navigator 2.1</span><span id="wx" style="cursor:pointer;background:#b13e53;padding:0 7px;border:1px solid #fff">✕</span></div>'+
      '<div id="waddr" style="background:#0f1020;color:#a7f070;padding:1px 8px;font-size:13px;border-bottom:2px solid #3b5dc9;flex-shrink:0"></div>'+
      '<div id="wtabs" style="display:flex;flex-shrink:0;background:#262b44"></div>'+
      '<div id="wbody" style="flex:1;overflow-y:auto;padding:8px 10px;'+WIKI_CSS+'"></div>'+
      '<div style="background:#262b44;color:#566c86;font-size:11px;padding:0 8px;flex-shrink:0;display:flex;justify-content:space-between"><span>◀▶ pages · ▲▼ scroll · B close</span><span>dial-up: 56k ●●●○</span></div>';
    $('uiroot').appendChild(div);
    const body=div.querySelector('#wbody'),tabs=div.querySelector('#wtabs'),addr=div.querySelector('#waddr');
    function render(){
      addr.textContent='⌂ https://claude.net/'+WIKI_URLS[page];
      tabs.innerHTML='';
      WIKI_PAGES.forEach((t,i)=>{
        const b=document.createElement('div');
        b.textContent=t;
        b.style.cssText='padding:1px 7px;font-size:13px;cursor:pointer;border-right:1px solid #1a1c2c;'+
          (i===page?'background:#3b5dc9;color:#fff':'color:#8fd3ff');
        b.addEventListener('click',()=>{page=i;sfx('blip');render();});
        tabs.appendChild(b);
      });
      body.scrollTop=0;
      wikiPageHTML(page,body);
    }
    function cleanup(){
      document.removeEventListener('keydown',h,true);div.remove();
      G.state=was==='naming'?'play':was;sfx('cancel');res();
    }
    div.querySelector('#wx').addEventListener('click',cleanup);
    const h=e=>{
      const act=KEYMAP[e.key];if(!act)return;
      e.stopPropagation();e.preventDefault();
      if(act==='left'){page=(page-1+WIKI_PAGES.length)%WIKI_PAGES.length;sfx('blip');render();}
      else if(act==='right'){page=(page+1)%WIKI_PAGES.length;sfx('blip');render();}
      else if(act==='up')body.scrollTop-=44;
      else if(act==='down')body.scrollTop+=44;
      else if(act==='b')cleanup();
    };
    document.addEventListener('keydown',h,true);
    render();
  });
}
</script>
