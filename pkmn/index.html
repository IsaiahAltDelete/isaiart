* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#1a1c2c; touch-action:none;
  font-family:"VT323","Courier New",ui-monospace,Menlo,Consolas,monospace; }
#wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#game { position:relative; width:480px; height:320px; transform-origin:center center;
  background:#000; image-rendering:pixelated; }
canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
#cv { position:absolute; left:0; top:0; }

/* ---------- generic window ---------- */
.win { position:absolute; background:#f8f8f0; border:3px solid #30346d; border-radius:6px;
  box-shadow:0 2px 0 rgba(0,0,0,.4), inset 0 0 0 2px #94b0c2; color:#1a1c2c;
  font-weight:bold; font-size:15px; line-height:1.3; z-index:30; }
.hidden { display:none !important; }

/* ---------- dialog box ---------- */
#dlg { left:4px; right:4px; bottom:4px; height:74px; padding:8px 26px 8px 12px; z-index:40; }
#dlgtext { white-space:pre-wrap; font-size:17px; }
#dlgmore { position:absolute; right:8px; bottom:4px; animation:bob .6s infinite alternate; color:#b13e53; }
@keyframes bob { from{transform:translateY(0)} to{transform:translateY(3px)} }

/* ---------- menus ---------- */
.menu { padding:6px 10px; z-index:50; }
.menu .mi { padding:2px 4px 2px 14px; position:relative; white-space:nowrap; cursor:pointer; }
.menu .mi.sel::before { content:"▶"; position:absolute; left:0; font-size:9px; top:4px; color:#b13e53; }
.menu .mi.dim { color:#94a3b8; }
.menu .mnote { font-size:12px; color:#566c86; padding:2px 4px; border-top:2px solid #94b0c2; margin-top:4px; }

/* ---------- HUD ---------- */
#hud { position:absolute; left:4px; top:4px; z-index:20; background:rgba(26,28,44,.75); color:#f4f4f4;
  font-size:14px; font-weight:bold; padding:2px 8px; border-radius:4px; pointer-events:none; }

/* ---------- battle ---------- */
#battle { position:absolute; inset:0; z-index:35; overflow:hidden; }
#bscene { position:absolute; inset:0; }
.bpanel { position:absolute; background:#f8f8f0; border:3px solid #30346d; border-radius:6px;
  padding:5px 8px; font-size:15px; font-weight:bold; color:#1a1c2c; min-width:150px; }
#efoe  { left:8px; top:8px; }
#eply  { right:8px; bottom:84px; }
.hpout { background:#30346d; border-radius:4px; height:8px; margin-top:3px; padding:1px; }
.hpin  { background:#38b764; height:6px; border-radius:3px; width:100%; transition:width .35s; }
.expout{ background:#30346d; border-radius:3px; height:5px; margin-top:3px; padding:1px; }
.expin { background:#41a6f6; height:3px; border-radius:2px; width:0%; }
.stag  { display:inline-block; font-size:11px; padding:0 3px; border-radius:3px; color:#fff; margin-left:4px; vertical-align:2px; }

/* ---------- overlays ---------- */
.screen { position:absolute; inset:0; z-index:60; background:#f8f8f0; color:#1a1c2c;
  font-weight:bold; font-size:15px; overflow:hidden; }
.screen h2 { font-size:17px; background:#30346d; color:#fff; padding:5px 10px; }
.scrollbox { position:absolute; top:26px; bottom:24px; left:0; right:0; overflow-y:auto; }
.foot { position:absolute; bottom:0; left:0; right:0; background:#94b0c2; color:#1a1c2c;
  font-size:12px; padding:3px 10px; }
.row { display:flex; align-items:center; gap:6px; padding:3px 10px; cursor:pointer; }
.row.sel { background:#ffd76a; }
.row canvas { flex:0 0 auto; }

/* ---------- title ---------- */
#title { position:absolute; inset:0; z-index:70; background:linear-gradient(#1a1c2c,#30346d 60%,#3b5dc9);
  display:flex; flex-direction:column; align-items:center; color:#fff; }
#tlogo { margin-top:34px; text-align:center; }
#tlogo .big { font-size:40px; font-weight:900; letter-spacing:2px; color:#ffd76a;
  text-shadow:3px 3px 0 #b13e53, -2px -2px 0 #30346d; }
#tlogo .sub { font-size:16px; font-weight:900; color:#73eff7; letter-spacing:8px; text-shadow:2px 2px 0 #30346d; }
#tmon { margin-top:6px; }
#tmenu { margin-top:10px; text-align:center; font-size:19px; font-weight:bold; }
#tmenu div { padding:3px 18px; cursor:pointer; }
#tmenu div.sel { background:rgba(255,255,255,.18); border-radius:6px; }
#tfoot { position:absolute; bottom:4px; font-size:11px; color:#94b0c2; text-align:center; width:100%; }

/* ---------- touch controls ---------- */
#touch { position:fixed; inset:0; z-index:90; pointer-events:none; display:none; }
body.touch #touch { display:block; }
.tbtn { position:absolute; pointer-events:auto; background:rgba(148,176,194,.25);
  border:2px solid rgba(148,176,194,.5); color:rgba(255,255,255,.8); user-select:none;
  display:flex; align-items:center; justify-content:center; font-weight:900; }
.tbtn:active { background:rgba(148,176,194,.55); }
#dpad { position:absolute; left:12px; bottom:16px; width:132px; height:132px; pointer-events:none; }
#dpad .tbtn { width:44px; height:44px; font-size:16px; border-radius:8px; }
#tup{left:44px;top:0} #tdn{left:44px;bottom:0} #tlf{left:0;top:44px} #trt{right:0;top:44px}
#tA { right:16px; bottom:64px; width:58px; height:58px; border-radius:50%; font-size:20px; }
#tB { right:84px; bottom:22px; width:50px; height:50px; border-radius:50%; font-size:18px; }
#tS { right:24px; bottom:150px; width:64px; height:26px; border-radius:12px; font-size:10px; }
</style>

// ---------- RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,y,s){let h=(x*374761393+y*668265263+s*1442695041)|0;h=(h^(h>>>13))|0;h=Math.imul(h,1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const rnd=Math.random;
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function monName(mon){return mon.nick||DEX[mon.id].n;}
function wpick(list){ // [[item,weight],...]
  let tot=0; for(const e of list)tot+=e[1];
  let r=rnd()*tot; for(const e of list){r-=e[1]; if(r<=0)return e[0];} return list[0][0];

// ---------- learnsets ----------
function learnset(id){
  const d=DEX[id],r=mulberry32(id*7919+13),t1=d.t[0],t2=d.t[1]||d.t[0];
  const tm1=TYPE_MOVES[t1],tm2=TYPE_MOVES[t2];
  const buffs=['harden','sharpen','agility','focusmind'];
  const ls=[[1,'tackle'],[1,tm1[0]]];
  ls.push([7,r()<.5?'growl':'leer']);
  ls.push([13,tm1[1]]);
  ls.push([18,t2!==t1?tm2[0]:'quickdash']);
  const st=TYPE_STATUS[t1]||TYPE_STATUS[t2];
  ls.push([24,(st&&r()<.65)?st:buffs[Math.floor(r()*buffs.length)]]);
  ls.push([30,tm1[2]]);
  ls.push([36,t2!==t1?tm2[1]:(r()<.5?'slam':'furyswipes')]);
  ls.push([42,tm1[3]]);
  ls.push([48,t2!==t1?tm2[2]:'hyperrush']);
  return ls;
}
function movesAtLevel(id,lvl){
  const known=[];
  for(const[l,m]of learnset(id)){if(l<=lvl&&!known.includes(m))known.push(m);}
  return known.slice(-4).map(m=>({m,pp:MOVES[m].pp}));
}

function makeMon(id,lvl){
  const d=DEX[id];
  const ivs=[ri(0,15),ri(0,15),ri(0,15),ri(0,15),ri(0,15),ri(0,15)];
  const mon={id,lvl,exp:0,ivs,st:null,shiny:rnd()<1/384,nat:ri(0,NATURES.length-1),moves:movesAtLevel(id,lvl)};
  if(rnd()<0.08)mon.held='sitrusberry'; // some wild Pokémon carry berries
  calcStats(mon); mon.hp=mon.maxhp;
  return mon;
}
function calcStats(mon){
  const d=DEX[mon.id],b=d.bs,iv=mon.ivs,l=mon.lvl;
  mon.maxhp=Math.floor((2*b[0]+iv[0])*l/100)+l+10;
  mon.atk=Math.floor((2*b[1]+iv[1])*l/100)+5;
  mon.def=Math.floor((2*b[2]+iv[2])*l/100)+5;
  mon.spa=Math.floor((2*b[3]+iv[3])*l/100)+5;
  mon.spd=Math.floor((2*b[4]+iv[4])*l/100)+5;
  mon.spe=Math.floor((2*b[5]+iv[5])*l/100)+5;
  const na=NATURES[mon.nat||0];
  if(na[1])mon[na[1]]=Math.floor(mon[na[1]]*1.1);
  if(na[2])mon[na[2]]=Math.floor(mon[na[2]]*0.9);
  if(mon.held==='quickfeather')mon.spe=Math.floor(mon.spe*1.1);
}
function expNext(lvl){return lvl*lvl*2+20;}
function expYield(mon){const d=DEX[mon.id];const bst=d.bs.reduce((a,b)=>a+b,0);return Math.max(8,Math.floor(bst*mon.lvl/28));}

function hexRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function shade(h,f){const[r,g,b]=hexRGB(h);return`rgb(${clamp(r*f|0,0,255)},${clamp(g*f|0,0,255)},${clamp(b*f|0,0,255)})`;}
function rgbs(h){return`rgb(${hexRGB(h).join(',')})`;}

// ---- fakemon sprite generator: unique 16x16 mirrored pixel creature per species ----
// cell values: 0 empty, 1 body, 2 accent, 3 eye, 4 highlight-accent (type flair), 5 mouth
const monCache={};
function monSprite(id,shiny){
  const key=id+(shiny?'s':'');
  if(monCache[key])return monCache[key];
  const d=DEX[id],r=mulberry32(id*2654435761%2147483647+77);
  let c1=TYPE_COLORS[d.t[0]],c2=d.t[1]?TYPE_COLORS[d.t[1]]:'#f4e4c2';
  if(shiny){const t=c1;c1=d.t[1]?TYPE_COLORS[d.t[1]]:'#ffd76a';c2=t;}
  const t1=d.t[0],t2=d.t[1]||d.t[0];
  const W=16,H=16,g=[];
  for(let y=0;y<H;y++){g.push(new Array(W).fill(0));}
  // ---- body archetype ----
  const legendary=id>=149;
  let bodyTop=2+Math.floor(r()*3), bodyBot=12+Math.floor(r()*2);
  const headSize=3+Math.floor(r()*3);
  const fat=0.55+r()*0.4;
  const serpent=(t1==='DRA'||t2==='POI')&&r()<0.5;
  const ghost=t1==='GHO'||t2==='GHO';
  const bird=t1==='FLY'||t2==='FLY';
  const legs=!serpent&&!ghost&&r()<0.85;
  const ears=r()<0.6&&!bird, tail=r()<0.65, horn=(t1==='DRA'||t1==='ROC'||r()<0.25);
  for(let y=bodyTop;y<=bodyBot;y++){
    const t=(y-bodyTop)/(Math.max(1,bodyBot-bodyTop));
    let w;
    if(y<bodyTop+headSize) w=2.4+headSize*0.7*Math.sin(Math.PI*(y-bodyTop+0.5)/headSize);
    else if(serpent) w=2.2+1.4*Math.sin(y*1.7+id);           // sinuous column
    else w=2.0+4.4*fat*Math.sin(Math.PI*clamp((t-0.15)/0.85,0,1));
    w=clamp(w+(r()-0.5)*1.2,1.5,7.4);
    for(let x=0;x<8;x++){ if(7-x<w) g[y][x]=1; }
  }
  if(ears){const ey=bodyTop,ex=4-Math.floor(r()*2);
    if(ey>0){g[ey-1][ex]=1;if(ey>1&&r()<.6)g[ey-2][ex]=1;}}
  if(horn&&bodyTop>1){g[bodyTop-1][7]=1;g[Math.max(0,bodyTop-2)][7]=1;}
  if(legs){for(const lx of[3,6]){if(bodyBot+1<H)g[bodyBot+1][lx]=1;if(bodyBot+2<H)g[bodyBot+2][lx]=1;}}
  if(ghost){ // wispy trailing bottom instead of legs
    for(let x=2;x<8;x++){if((x+id)%2===0&&bodyBot+1<H)g[bodyBot+1][x]=1;}
  }
  if(tail&&!serpent){const ty=clamp(bodyBot-2-Math.floor(r()*3),1,H-2);
    for(let i=0;i<3;i++)g[ty][clamp(i,0,7)]=g[ty][clamp(i,0,7)]||1;}
  // smooth
  for(let y=1;y<H-1;y++)for(let x=1;x<7;x++){
    const n=g[y-1][x]+g[y+1][x]+g[y][x-1]+g[y][x+1];
    if(!g[y][x]&&n>=3)g[y][x]=1;
  }
  // ---- type flair (value 4 = bright accent) ----
  const midY=Math.floor((bodyTop+bodyBot)/2);
  const flair=(x,y)=>{if(y>=0&&y<H&&x>=0&&x<8)g[y][x]=4;};
  const solid=(x,y)=>{if(y>=0&&y<H&&x>=0&&x<8&&!g[y][x])g[y][x]=1;};
  switch(t1){
    case 'GRA':flair(7,bodyTop-1);flair(6,bodyTop-2);break;                 // leaf sprout
    case 'FIR':flair(7,bodyTop-1);flair(6,bodyTop-2);flair(7,bodyTop-3);break; // flame crest
    case 'WAT':flair(7,bodyTop-1);solid(1,midY);flair(1,midY);break;        // fin + side fin
    case 'ELE':flair(4,bodyTop-1);flair(3,bodyTop-2);break;                 // bolt ear
    case 'ICE':flair(5,bodyTop-1);flair(7,bodyTop-2);break;                 // crystal spikes
    case 'BUG':solid(5,bodyTop-1);solid(4,bodyTop-2);flair(4,bodyTop-2);break; // antennae
    case 'FLY':for(let i=0;i<3;i++){solid(0,midY+i);flair(0,midY+i);solid(1,midY+i);}break; // wing
    case 'ROC':case 'GRO':for(let x=3;x<8;x+=2)flair(x,bodyTop);break;      // rocky ridge
    case 'DRA':flair(5,bodyTop-1);flair(4,bodyTop-2);flair(7,bodyTop-2);break; // twin horns
    case 'PSY':flair(7,bodyTop+Math.max(0,Math.floor(headSize/2))-1);break; // forehead gem
    case 'GHO':flair(7,bodyBot+1);break;                                    // wisp
    case 'STE':for(let y=midY;y<bodyBot;y+=2)flair(5,y);break;              // rivets
    case 'FAI':flair(0,bodyTop);flair(2,bodyBot+1);break;                   // sparkle motes
    case 'DAR':flair(3,bodyTop-1);flair(2,bodyTop-2);break;                 // pointed ear
    case 'FIG':solid(0,midY);solid(0,midY+1);flair(0,midY);break;           // brawny arm
    case 'POI':flair(2,midY+1);flair(5,midY+2);break;                       // toxin spots
    case 'NOR':flair(3,bodyTop-1);break;                                    // ear tuft
  }
  if(legendary){for(let x=1;x<8;x+=2)flair(x,bodyTop-1);flair(0,midY);}     // crown of light

  if(g[eyeY+2]&&g[eyeY+2][7]===1)g[eyeY+2][7]=5; // mouth center pixel
  // ---- render mirrored with outline ----
  const cvv=document.createElement('canvas');cvv.width=W;cvv.height=H;
  const c=cvv.getContext('2d');
  const full=[];for(let y=0;y<H;y++){full.push([]);for(let x=0;x<W;x++){full[y][x]=x<8?g[y][x]:g[y][15-x];}}

    else if(v===5)col=shade(c1,0.35);
    else{
      col=rgbs(c1);
      if(y>0&&!full[y-1][x])col=shade(c1,1.35);
      else if(y<H-1&&!full[y+1][x])col=shade(c1,0.7);
    }
    c.fillStyle=col;c.fillRect(x,y,1,1);
  }
  c.fillStyle=dark;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(full[y][x])continue;
    const nb=(full[y-1]&&full[y-1][x])||(full[y+1]&&full[y+1][x])||full[y][x-1]||full[y][x+1];
    if(nb)c.fillRect(x,y,1,1);
  }
  monCache[key]=cvv;return cvv;
}
function drawMon(ctx,id,x,y,size,opts){
  opts=opts||{};
  const sp=monSprite(id,opts.shiny);
  ctx.save();ctx.imageSmoothingEnabled=false;
  if(opts.alpha!==undefined)ctx.globalAlpha=opts.alpha;
  if(opts.back){ctx.translate(x+size,y);ctx.scale(-1,1);ctx.drawImage(sp,0,0,16,16,0,0,size,size);}
  else ctx.drawImage(sp,0,0,16,16,x,y,size,size);
  ctx.restore();
}

function drawBall(ctx,x,y,s,rot,tier){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  const top=tier==='greatball'?'#3b5dc9':tier==='ultraball'?'#2a2139':'#e04a4a';
  ctx.fillStyle=top;ctx.beginPath();ctx.arc(0,0,s,Math.PI,0);ctx.fill();
  ctx.fillStyle='#f4f4f4';ctx.beginPath();ctx.arc(0,0,s,0,Math.PI);ctx.fill();
  if(tier==='ultraball'){ctx.fillStyle='#ffd76a';ctx.fillRect(-s*0.7,-s*0.55,s*0.5,s*0.25);ctx.fillRect(s*0.2,-s*0.55,s*0.5,s*0.25);}
  ctx.fillStyle='#141423';ctx.fillRect(-s,-s*0.14,s*2,s*0.28);
  ctx.beginPath();ctx.arc(0,0,s*0.32,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,s*0.18,0,7);ctx.fill();
  ctx.restore();
}

    ctx.fillStyle='#ffd76a';ctx.fillRect(-s*0.42,-s*0.08,s*0.16,s*0.16);ctx.fillRect(s*0.26,-s*0.08,s*0.16,s*0.16);ctx.restore();return;}
  if(it.tm){ctx.fillStyle=TYPE_COLORS[it.tmT]||'#94b0c2';ctx.beginPath();ctx.arc(0,0,s*0.36,0,7);ctx.fill();

  if(it.rod){ctx.strokeStyle='#8f5f30';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-s*0.35,s*0.35);ctx.lineTo(s*0.25,-s*0.35);ctx.stroke();
    ctx.strokeStyle='#c0cbdc';ctx.beginPath();ctx.moveTo(s*0.25,-s*0.35);ctx.lineTo(s*0.3,s*0.1);ctx.stroke();

  if(it.hold==='sitrus'){ctx.fillStyle='#e8b743';ctx.beginPath();ctx.arc(0,s*0.05,s*0.28,0,7);ctx.fill();

  if(it.hold==='phys'){ctx.fillStyle='#ef7d57';ctx.fillRect(-s*0.4,-s*0.12,s*0.8,s*0.24);
    ctx.fillStyle='#b13e53';ctx.fillRect(-s*0.4,-s*0.12,s*0.2,s*0.24);ctx.restore();return;}
  if(it.hold==='spec'){ctx.strokeStyle='#3b5dc9';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(-s*0.18,0,s*0.16,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(s*0.18,0,s*0.16,0,7);ctx.stroke();ctx.restore();return;}
  if(it.hold==='spe'){ctx.fillStyle='#73eff7';ctx.beginPath();
    ctx.moveTo(-s*0.3,s*0.35);ctx.quadraticCurveTo(-s*0.1,-s*0.4,s*0.35,-s*0.35);
    ctx.quadraticCurveTo(s*0.05,-s*0.1,-s*0.3,s*0.35);ctx.fill();ctx.restore();return;}

}
const BADGE_COLORS=['#c98850','#41a6f6','#f2c218','#5cb544','#9d67d0','#b1352c','#77cfd1','#6745ee'];
// eight unique badge shapes: rock, droplet, bolt, flower, crescent, fist-shield, snowflake, fang
function drawBadgeIcon(ctx,i,x,y,s,earned){
  ctx.save();ctx.translate(x+s/2,y+s/2);
  const col=earned?BADGE_COLORS[i]:'rgba(148,176,194,.35)';
  const dk=earned?shade(BADGE_COLORS[i],0.6):'rgba(120,140,160,.3)';
  ctx.fillStyle=col;
  if(i===0){ // TERRA: faceted hexagon
    ctx.beginPath();
    for(let k=0;k<6;k++){const a=k*Math.PI/3-Math.PI/2;
      ctx[k?'lineTo':'moveTo'](Math.cos(a)*s*0.42,Math.sin(a)*s*0.42);}
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=dk;ctx.lineWidth=Math.max(1,s*0.04);
    ctx.beginPath();ctx.moveTo(-s*0.42,0);ctx.lineTo(s*0.42,0);
    ctx.moveTo(-s*0.21,-s*0.36);ctx.lineTo(s*0.21,s*0.36);ctx.stroke();
  }else if(i===1){ // TIDE: water droplet
    ctx.beginPath();
    ctx.moveTo(0,-s*0.44);
    ctx.bezierCurveTo(s*0.34,-s*0.05,s*0.3,s*0.42,0,s*0.42);
    ctx.bezierCurveTo(-s*0.3,s*0.42,-s*0.34,-s*0.05,0,-s*0.44);
    ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath();ctx.arc(-s*0.1,s*0.12,s*0.09,0,7);ctx.fill();
  }else if(i===2){ // VOLT: lightning bolt
    ctx.beginPath();
    ctx.moveTo(s*0.1,-s*0.46);ctx.lineTo(-s*0.24,s*0.04);ctx.lineTo(-s*0.02,s*0.04);
    ctx.lineTo(-s*0.12,s*0.46);ctx.lineTo(s*0.26,-s*0.08);ctx.lineTo(s*0.02,-s*0.08);
    ctx.closePath();ctx.fill();
  }else if(i===3){ // BLOOM: five-petal flower
    for(let k=0;k<5;k++){const a=k*Math.PI*2/5-Math.PI/2;
      ctx.beginPath();ctx.arc(Math.cos(a)*s*0.24,Math.sin(a)*s*0.24,s*0.17,0,7);ctx.fill();}
    ctx.fillStyle=earned?'#f2c218':'rgba(180,190,200,.4)';
    ctx.beginPath();ctx.arc(0,0,s*0.13,0,7);ctx.fill();
  }else if(i===4){ // PHANTOM: crescent moon
    ctx.beginPath();ctx.arc(0,0,s*0.4,0,7);ctx.fill();
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();ctx.arc(s*0.18,-s*0.1,s*0.32,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }else if(i===5){ // FIST: knuckled shield
    ctx.beginPath();
    ctx.moveTo(-s*0.36,-s*0.34);ctx.lineTo(s*0.36,-s*0.34);ctx.lineTo(s*0.36,s*0.08);
    ctx.quadraticCurveTo(s*0.36,s*0.34,0,s*0.46);
    ctx.quadraticCurveTo(-s*0.36,s*0.34,-s*0.36,s*0.08);ctx.closePath();ctx.fill();
    ctx.fillStyle=dk;
    for(let k=0;k<3;k++)ctx.fillRect(-s*0.22+k*s*0.16,-s*0.26,s*0.1,s*0.14);
  }else if(i===6){ // FROST: snowflake
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.5,s*0.07);ctx.lineCap='round';
    for(let k=0;k<6;k++){const a=k*Math.PI/3;
      const dx=Math.cos(a),dy=Math.sin(a);
      ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(dx*s*0.42,dy*s*0.42);ctx.stroke();
      ctx.beginPath();ctx.moveTo(dx*s*0.26-dy*s*0.1,dy*s*0.26+dx*s*0.1);
      ctx.lineTo(dx*s*0.36,dy*s*0.36);
      ctx.lineTo(dx*s*0.26+dy*s*0.1,dy*s*0.26-dx*s*0.1);ctx.stroke();}
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,s*0.08,0,7);ctx.fill();
  }else{ // WYRM: dragon fang
    ctx.beginPath();
    ctx.moveTo(0,-s*0.46);ctx.lineTo(s*0.3,-s*0.1);ctx.lineTo(s*0.1,s*0.46);
    ctx.lineTo(0,s*0.2);ctx.lineTo(-s*0.1,s*0.46);ctx.lineTo(-s*0.3,-s*0.1);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=dk;ctx.fillRect(-s*0.05,-s*0.3,s*0.1,s*0.3);
  }
  if(earned&&i!==6){ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath();ctx.arc(-s*0.1,-s*0.14,s*0.08,0,7);ctx.fill();}
  ctx.restore();
}

// ---- people ----
// deterministic gender by name word — every named trainer/leader/staffer is pinned,
// so the overworld sprite and the battle-intro sprite always agree.
const FEM_WORDS=new Set([
 // titles & roles
 'joyce','mom','lady','lass','granny','widow','beauty','girl','woman','medium','picnicker',
 'swimmer','channeler','hex','maniac','sequoia','nurse','mother','sister','queen','empress',
 // given names
 'mia','june','iris','ada','elle','rose','vi','nora','vera','kim','yuki','zara','nyra','ida',
 'lila','may','marina','volta','fern','neve','raven','nyx','mira','ember','sable','jo','luna','ivy']);
const MALE_WORDS=new Set([
 'ben','tom','leo','cliff','roy','max','sam','kang','zed','ash','brine','kai','olm','dolan',
 'ohm','amp','sol','puck','bjorn','ryu','rome','vex','hale','watt','mason','titus','drake',
 'forge','rex','umbra','rater','referee','trader','teller','fisherman','gravekeeper','foreman',
 'grandpa','man','boy','guy','sir','mr','king','father','brother','dad']);
function isFemName(name){
  if(!name)return false;
  const words=String(name).toLowerCase().split(/[^a-z]+/);
  for(const w of words)if(MALE_WORDS.has(w))return false;   // an explicit male word wins
  for(const w of words)if(FEM_WORDS.has(w))return true;
  return false;
}
function drawPerson(ctx,px,py,seed,dir,frame,pal){
  const r=mulberry32(seed*97+11);
  const role=pal&&pal.role;
  const skin=pal&&pal.skin||pick2(r,['#f0c8a0','#d9a066','#8d5524','#ffdbac']);
  const hair=pal&&pal.hair||pick2(r,['#3a2c1e','#141423','#b13e53','#e8b743','#566c86','#7a4a2b','#e88fb0','#c0cbdc']);
  const shirt=pal&&pal.shirt||pick2(r,['#b13e53','#3b5dc9','#38b764','#9d47a0','#ef7d57','#566c86','#f75a87','#e8b743']);
  const pants=pal&&pal.pants||pick2(r,['#30346d','#3a2c1e','#566c86','#1a1c2c']);
  const fem=pal&&pal.fem!==undefined?!!pal.fem:(r()<0.42);
  // seeded accessories for townsfolk variety
  const accRoll=r();
  const acc=(!pal&&accRoll<0.18)?'cap':(!pal&&accRoll<0.32)?'glasses':(fem&&r()<0.5?'bow':null);
  const OUT='#20223a';
  const step=frame%2===1;
  const bob=step?1:0;
  const X=px+7,Y=py+5+bob;
  // ground shadow
  ctx.fillStyle='rgba(20,20,35,.22)';
  ctx.beginPath();ctx.ellipse(px+16,py+29,9,3.5,0,0,7);ctx.fill();
  // cape (leaders / boss) behind everything
  if(role==='leader'||role==='boss'){
    ctx.fillStyle=OUT;ctx.fillRect(X,Y+7,18,15);
    ctx.fillStyle=role==='boss'?'#2a2139':'#ffd76a';
    ctx.fillRect(X+1,Y+8,16,12);ctx.fillRect(X+2,Y+20,14,2);
    ctx.fillStyle=role==='boss'?'#1d1730':'#e0b040';ctx.fillRect(X+1,Y+16,16,2);
  }
  // long hair falls behind the body (females)
  if(fem&&dir!=='down'){
    ctx.fillStyle=OUT;ctx.fillRect(X+1,Y-1,16,15);
    ctx.fillStyle=hair;ctx.fillRect(X+2,Y,14,13);
  }
  // legs with walk cycle + shoes
  if(fem){
    ctx.fillStyle=OUT;
    if(step){ctx.fillRect(X+3,Y+17,5,5);ctx.fillRect(X+10,Y+17,5,7-bob);}
    else{ctx.fillRect(X+3,Y+17,5,7);ctx.fillRect(X+10,Y+17,5,7);}
    ctx.fillStyle=skin;
    if(step){ctx.fillRect(X+4,Y+18,3,3);ctx.fillRect(X+11,Y+18,3,4-bob);}
    else{ctx.fillRect(X+4,Y+18,3,4);ctx.fillRect(X+11,Y+18,3,4);}
    ctx.fillStyle='#8f2e40'; // shoes
    if(step){ctx.fillRect(X+4,Y+21,3,2);ctx.fillRect(X+11,Y+22-bob,3,2);}
    else{ctx.fillRect(X+4,Y+22,3,2);ctx.fillRect(X+11,Y+22,3,2);}
  }else{
    ctx.fillStyle=OUT;
    if(step){ctx.fillRect(X+2,Y+15,6,7);ctx.fillRect(X+10,Y+15,6,9-bob);}
    else{ctx.fillRect(X+2,Y+15,6,9);ctx.fillRect(X+10,Y+15,6,9);}
    ctx.fillStyle=pants;
    if(step){ctx.fillRect(X+3,Y+16,4,4);ctx.fillRect(X+11,Y+16,4,6-bob);}
    else{ctx.fillRect(X+3,Y+16,4,6);ctx.fillRect(X+11,Y+16,4,6);}
    ctx.fillStyle='#5a3a18'; // shoes
    if(step){ctx.fillRect(X+3,Y+20,4,2);ctx.fillRect(X+11,Y+21-bob,4,2);}
    else{ctx.fillRect(X+3,Y+21,4,2);ctx.fillRect(X+11,Y+21,4,2);}
  }
  // torso with outline + arms with hands
  ctx.fillStyle=OUT;ctx.fillRect(X+1,Y+8,16,10);
  ctx.fillRect(X-1,Y+9,4,8);ctx.fillRect(X+15,Y+9,4,8);
  ctx.fillStyle=shirt;ctx.fillRect(X+2,Y+9,14,8);
  ctx.fillRect(X,Y+10,3,5);ctx.fillRect(X+15,Y+10,3,5);
  ctx.fillStyle=shade(shirt,0.72);ctx.fillRect(X+2,Y+15,14,2); // shirt shading
  ctx.fillStyle=skin;ctx.fillRect(X,Y+14,3,2);ctx.fillRect(X+15,Y+14,3,2); // hands
  // flared skirt over the hips (females)
  if(fem){
    ctx.fillStyle=OUT;
    ctx.beginPath();ctx.moveTo(X+1,Y+14);ctx.lineTo(X+17,Y+14);ctx.lineTo(X+19,Y+20);ctx.lineTo(X-1,Y+20);ctx.closePath();ctx.fill();
    ctx.fillStyle=shade(shirt,0.88);
    ctx.beginPath();ctx.moveTo(X+2,Y+15);ctx.lineTo(X+16,Y+15);ctx.lineTo(X+18,Y+19);ctx.lineTo(X,Y+19);ctx.closePath();ctx.fill();
    ctx.fillStyle=shade(shirt,0.66);ctx.fillRect(X,Y+18,18,1);
  }
  if(role==='prof'){ctx.fillStyle='#f4f4f4';ctx.fillRect(X+1,Y+9,4,10);ctx.fillRect(X+13,Y+9,4,10);
    ctx.fillStyle=shirt;ctx.fillRect(X+6,Y+9,6,8);}
  if(role==='nurse'){ctx.fillStyle='#fff';ctx.fillRect(X+4,Y+11,10,6);}   // apron
  if(role==='mom'){ctx.fillStyle='#f4e4c2';ctx.fillRect(X+5,Y+12,8,5);}
  if(role==='grunt'){ctx.fillStyle='#9d67d0';ctx.fillRect(X+7,Y+11,4,4);} // E emblem
  if(role==='rival'){ctx.fillStyle='#e8f4f4';ctx.fillRect(X+2,Y+8,14,3);} // scarf
  // head with outline
  ctx.fillStyle=OUT;ctx.fillRect(X+2,Y-1,14,12);
  ctx.fillStyle=skin;ctx.fillRect(X+3,Y,12,10);
  ctx.fillStyle=shade(skin,0.82);ctx.fillRect(X+3,Y+8,12,2); // chin shading
  // hair
  ctx.fillStyle=hair;ctx.fillRect(X+2,Y-2,14,4);
  if(dir!=='up'){ctx.fillRect(X+2,Y-2,2,6);ctx.fillRect(X+14,Y-2,2,6);}
  if(fem&&dir!=='up'){ // long side strands + soft fringe
    ctx.fillRect(X+1,Y-1,3,14);ctx.fillRect(X+14,Y-1,3,14);
    ctx.fillRect(X+4,Y-1,3,2);ctx.fillRect(X+11,Y-1,3,2);
  }
  if(role==='rival'){
    ctx.fillRect(X+1,Y-3,3,3);ctx.fillRect(X+6,Y-4,3,3);ctx.fillRect(X+12,Y-3,3,3);
  }
  if(role==='boss'&&!fem){ctx.fillRect(X+2,Y-2,14,6);}
  if(dir==='up'){ctx.fillStyle=hair;
    if(fem)ctx.fillRect(X+2,Y,14,13);else ctx.fillRect(X+3,Y,12,7);}
  else{
    // eyes with whites (+ tiny lashes for females)
    if(dir==='down'){ctx.fillStyle='#fff';ctx.fillRect(X+4,Y+4,3,2);ctx.fillRect(X+11,Y+4,3,2);
      ctx.fillStyle='#141423';ctx.fillRect(X+5,Y+4,2,2);ctx.fillRect(X+11,Y+4,2,2);
      if(fem){ctx.fillRect(X+4,Y+3,3,1);ctx.fillRect(X+11,Y+3,3,1);}}
    if(dir==='left'){ctx.fillStyle='#fff';ctx.fillRect(X+3,Y+4,3,2);
      ctx.fillStyle='#141423';ctx.fillRect(X+3,Y+4,2,2);if(fem)ctx.fillRect(X+3,Y+3,3,1);}
    if(dir==='right'){ctx.fillStyle='#fff';ctx.fillRect(X+12,Y+4,3,2);
      ctx.fillStyle='#141423';ctx.fillRect(X+13,Y+4,2,2);if(fem)ctx.fillRect(X+12,Y+3,3,1);}
    if(role==='prof'&&dir==='down'){ctx.fillStyle='#30346d';ctx.fillRect(X+4,Y+3,4,1);ctx.fillRect(X+10,Y+3,4,1);ctx.fillRect(X+8,Y+4,2,1);}
    if(role==='boss'&&dir==='down'){ctx.fillStyle='#b13e53';ctx.fillRect(X+4,Y+4,10,1);}
    if(acc==='glasses'&&dir==='down'){ctx.fillStyle='#30346d';
      ctx.fillRect(X+4,Y+3,4,1);ctx.fillRect(X+10,Y+3,4,1);ctx.fillRect(X+8,Y+4,2,1);}
  }
  // headwear
  if(pal&&pal.hat){ctx.fillStyle=OUT;ctx.fillRect(X+1,Y-4,16,5);
    ctx.fillStyle=pal.hat;ctx.fillRect(X+2,Y-3,14,4);ctx.fillRect(X+1,Y+1,4,2);
    ctx.fillStyle='#f4f4f4';ctx.fillRect(X+7,Y-3,4,3);} // cap emblem
  if(acc==='cap'){ctx.fillStyle=OUT;ctx.fillRect(X+1,Y-4,16,5);
    ctx.fillStyle=pick2(mulberry32(seed*13+5),['#38b764','#3b5dc9','#e8b743','#566c86']);
    ctx.fillRect(X+2,Y-3,14,4);ctx.fillRect(X+1,Y+1,4,2);}
  if(acc==='bow'){ctx.fillStyle='#e04a4a';
    ctx.fillRect(X+10,Y-4,3,3);ctx.fillRect(X+14,Y-4,3,3);ctx.fillRect(X+12,Y-3,3,2);}
  if(role==='nurse'){ctx.fillStyle='#fff';ctx.fillRect(X+4,Y-4,10,3);
    ctx.fillStyle='#f75a87';ctx.fillRect(X+8,Y-4,2,3);ctx.fillRect(X+7,Y-3,4,1);}
  if(role==='leader'){ctx.fillStyle='#ffd76a';ctx.fillRect(X+3,Y-3,12,2);ctx.fillRect(X+8,Y-5,2,3);}

const AU={ctx:null,on:localStorage.getItem('pokemonClaudeSound')!=='off',cur:null,timer:null,nodes:[],
  mgain:null,sgain:null,echo:null,echoSend:null,noise:null,MVOL:0.26};

function ensureAudio(){
  if(!AU.ctx){
    try{
      AU.ctx=new(window.AudioContext||window.webkitAudioContext)();
      const lp=AU.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;
      lp.connect(AU.ctx.destination);
      AU.mgain=AU.ctx.createGain();AU.mgain.gain.value=AU.MVOL;AU.mgain.connect(lp);
      AU.sgain=AU.ctx.createGain();AU.sgain.gain.value=0.35;AU.sgain.connect(AU.ctx.destination);
      // echo send for depth
      AU.echo=AU.ctx.createDelay(1.0);AU.echo.delayTime.value=0.27;
      const fb=AU.ctx.createGain();fb.gain.value=0.32;
      const wet=AU.ctx.createGain();wet.gain.value=0.5;
      AU.echoSend=AU.ctx.createGain();AU.echoSend.gain.value=0;
      AU.echoSend.connect(AU.echo);AU.echo.connect(fb);fb.connect(AU.echo);
      AU.echo.connect(wet);wet.connect(AU.mgain);
      // shared noise buffer for percussion
      const len=AU.ctx.sampleRate*0.5;
      AU.noise=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);
      const d=AU.noise.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){return;}
  }
  if(AU.ctx.state==='suspended')AU.ctx.resume();
  if(AU.cur&&!AU.timer&&AU.on)musicLoop();
}

function noteF(n){
  const M={'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11};
  const oct=+n.slice(-1),k=M[n.slice(0,-1)];
  return 440*Math.pow(2,(k+(oct+1)*12-69)/12);
}
// ---- voices ----
function vLead(f,when,dur,vol,type){ // twin detuned oscillators = fat chorus lead
  if(!AU.ctx||!f)return;
  const g=AU.ctx.createGain();
  g.gain.setValueAtTime(0.0001,when);
  g.gain.linearRampToValueAtTime(vol,when+0.015);
  g.gain.setValueAtTime(vol,when+dur*0.55);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  g.connect(AU.mgain);g.connect(AU.echoSend);
  for(const det of[-5,5]){
    const o=AU.ctx.createOscillator();
    o.type=type||'square';o.frequency.value=f;o.detune.value=det;
    o.connect(g);o.start(when);o.stop(when+dur+0.03);AU.nodes.push(o);
  }
}
function vSoft(f,when,dur,vol,type){ // single-osc harmony / bass voice
  if(!AU.ctx||!f)return;
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,when);
  g.gain.linearRampToValueAtTime(vol,when+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(g);g.connect(AU.mgain);
  o.start(when);o.stop(when+dur+0.03);AU.nodes.push(o);
}
function drum(kind,when){
  if(!AU.ctx)return;
  if(kind==='K'){ // kick: sine drop
    const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(120,when);
    o.frequency.exponentialRampToValueAtTime(42,when+0.1);
    g.gain.setValueAtTime(0.5,when);g.gain.exponentialRampToValueAtTime(0.001,when+0.13);
    o.connect(g);g.connect(AU.mgain);o.start(when);o.stop(when+0.15);AU.nodes.push(o);
  }else{ // noise-based snare / hats
    const s=AU.ctx.createBufferSource();s.buffer=AU.noise;
    const bp=AU.ctx.createBiquadFilter();
    const g=AU.ctx.createGain();
    let dur=0.05,vol=0.08;
    if(kind==='S'){bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=0.8;dur=0.12;vol=0.22;}
    else if(kind==='O'){bp.type='highpass';bp.frequency.value=6000;dur=0.14;vol=0.07;}
    else{bp.type='highpass';bp.frequency.value=7000;dur=0.04;vol=0.055;} // 'h'
    g.gain.setValueAtTime(vol,when);g.gain.exponentialRampToValueAtTime(0.001,when+dur);
    s.connect(bp);bp.connect(g);g.connect(AU.mgain);
    s.start(when);s.stop(when+dur+0.02);AU.nodes.push(s);
    if(kind==='S'){const o=AU.ctx.createOscillator(),g2=AU.ctx.createGain();
      o.type='triangle';o.frequency.setValueAtTime(190,when);
      g2.gain.setValueAtTime(0.15,when);g2.gain.exponentialRampToValueAtTime(0.001,when+0.08);
      o.connect(g2);g2.connect(AU.mgain);o.start(when);o.stop(when+0.1);AU.nodes.push(o);}
  }
}

function ambientLoop(){
  if(!AU.ctx||!AU.on||!AU.cur)return;
  const A=AMBIENTS[AU.cur];if(!A)return;
  const t0=AU.ctx.currentTime+0.05;
  AU.echoSend.gain.setValueAtTime(A.echo,t0);
  const phraseN=A.phrase[0]+Math.floor(Math.random()*(A.phrase[1]-A.phrase[0]+1));
  let idx=1+Math.floor(Math.random()*(A.scale.length-2));
  let t=0;
  // soft root drone beneath the phrase
  const root=A.roots[Math.floor(Math.random()*A.roots.length)];
  vSoft(noteF(root),t0,phraseN*((A.note[0]+A.note[1])/2)+2,0.045,'triangle');
  for(let i=0;i<phraseN;i++){
    idx=clamp(idx+[-2,-1,-1,1,1,1,2][Math.floor(Math.random()*7)],0,A.scale.length-1);
    const dur=A.note[0]+Math.random()*(A.note[1]-A.note[0]);
    if(Math.random()<0.14){t+=dur;continue;} // a breath
    vLead(noteF(A.scale[idx]),t0+t,dur*0.95,0.032,A.lead);
    if(Math.random()<0.22&&idx>=2) // occasional soft harmony below
      vSoft(noteF(A.scale[idx-2]),t0+t+0.02,dur*0.85,0.018,'triangle');
    t+=dur;
  }
  const gap=A.gap[0]+Math.random()*(A.gap[1]-A.gap[0]);
  AU.timer=setTimeout(ambientLoop,(t+gap)*1000);
}

  if(AU.ctx&&AU.on&&AU.cur){ // brief crossfade
    const t=AU.ctx.currentTime;
    AU.mgain.gain.cancelScheduledValues(t);
    AU.mgain.gain.setTargetAtTime(0.001,t,0.06);
    setTimeout(()=>{
      musicHalt();AU.cur=name;
      if(AU.ctx){const t2=AU.ctx.currentTime;
        AU.mgain.gain.cancelScheduledValues(t2);
        AU.mgain.gain.setTargetAtTime(AU.MVOL,t2,0.1);}
      if(AU.on)musicLoop();
    },200);
    return;
  }
  musicHalt();AU.cur=name;
  if(AU.ctx&&AU.on)musicLoop();
}
function musicLoop(){
  if(!AU.ctx||!AU.on||!AU.cur)return;
  clearTimeout(AU.timer);
  if(!TRACKS[AU.cur]){if(AMBIENTS[AU.cur])ambientLoop();return;}
  const tr=TRACKS[AU.cur],spb=60/tr.bpm,t0=AU.ctx.currentTime+0.06;
  const total=seqBeats(tr.mel);
  AU.echoSend.gain.setValueAtTime(tr.echo||0,t0);
  // lead
  {let t=0;for(const[n,b]of tr.mel){if(n!=='-')vLead(noteF(n),t0+t*spb,b*spb*0.9,0.045,tr.lead);t+=b;}}
  // harmony / arp (loops)
  if(tr.harm&&tr.harm.length){let t=0,i=0;
    while(t<total-0.001){const[n,b]=tr.harm[i%tr.harm.length];
      if(n!=='-')vSoft(noteF(n),t0+t*spb,Math.min(b,total-t)*spb*0.92,0.028,'square');
      t+=b;i++;}}
  // bass (loops)
  if(tr.bass&&tr.bass.length){let t=0,i=0;
    while(t<total-0.001){const[n,b]=tr.bass[i%tr.bass.length];
      if(n!=='-')vSoft(noteF(n),t0+t*spb,Math.min(b,total-t)*spb*0.94,0.075,'triangle');
      t+=b;i++;}}
  // drums (loops, one char per half-beat)
  if(tr.drums&&tr.drums.length){
    const halves=Math.floor(total*2);
    for(let i=0;i<halves;i++){
      const ch=tr.drums[i%tr.drums.length];
      if(ch&&ch!=='.')drum(ch,t0+i*spb*0.5);
    }
  }
  AU.timer=setTimeout(musicLoop,Math.max(400,(total*spb-0.05)*1000));
}
function musicHalt(){
  clearTimeout(AU.timer);AU.timer=null;
  for(const o of AU.nodes){try{o.stop();}catch(e){}}
  AU.nodes=[];
}
function musicFor(m){
  if(!m)return AU.cur||'town';
  if(m.dark)return 'cave';
  if(!m.outdoor){
    const ind=String(m.indoor||'');
    if(ind.indexOf('gym')===0||ind==='league')return 'gymhall';
    return(TRACKS[AU.cur]||!AU.cur)?'town':AU.cur;
  }
  if(m.key&&(m.key.indexOf('route')===0||m.key==='meadow'||m.key==='victory'))return 'route';
  return MUSIC_TOWN[m.key]||'town';
}
// ---- sfx ----
function stone(f,dur,type,vol,delay,slideTo){
  if(!AU.ctx||!AU.on)return;
  const t=AU.ctx.currentTime+(delay||0);
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(vol||0.2,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AU.sgain);o.start(t);o.stop(t+dur+0.02);
}

const MAPS={};

function addMap(key,def){
  const rows=def.rows.map(r=>r);
  let w=0;for(const r of rows)w=Math.max(w,r.length);
  def.grid=rows.map(r=>r.padEnd(w,'#').split(''));
  def.w=w;def.h=rows.length;def.key=key;
  def.npcs=def.npcs||[];def.warps=def.warps||{};def.exits=def.exits||{};
  def.signs=def.signs||{};def.specials=def.specials||{};
  delete def.rows;
  MAPS[key]=def;
}
function tileAt(map,x,y){if(y<0||x<0||y>=map.h||x>=map.w)return'#';return map.grid[y][x];}

// ---------- procedural dungeon-style routes ----------
// winding path spine + side chambers + treasure (%=visible item, &=hidden item)
function makeRoute(key,name,w,h,vertical,seed,wild,exits,npcs,signText,theme,items,dark,cut,boulder){
  const r=mulberry32(seed);
  const cx=Math.floor(w/2)-1, cy=Math.floor(h/2)-1;
  const wall=(theme===THEMES.gravel||theme===THEMES.stone)?'^':'#';
  const g=[];for(let y=0;y<h;y++){g.push(new Array(w).fill(wall));}
  const ground=(x,y,ch)=>{if(x>0&&x<w-1&&y>0&&y<h-1)g[y][x]=ch||'.';};
  const loot={};
  const spineAt=[];
  if(vertical){
    let x=cx;
    for(let y=0;y<h;y++){
      if(y<3)x=cx;                              // lock the top to the opening
      else if(y>h-8){if(x<cx)x++;else if(x>cx)x--;} // glide back to center for the bottom opening
      else if(r()<0.5)x=clamp(x+(r()<0.5?-1:1),3,w-5);
      spineAt[y]=x;
      if(y===0||y===h-1){g[y][x]='=';g[y][x+1]='=';}
      else{ground(x,y,'=');ground(x+1,y,'=');}
    }
  }else{
    let y=cy;
    for(let x=0;x<w;x++){
      if(x<3)y=cy;
      else if(x>w-8){if(y<cy)y++;else if(y>cy)y--;}
      else if(r()<0.5)y=clamp(y+(r()<0.5?-1:1),3,h-5);
      spineAt[x]=y;
      if(x===0||x===w-1){g[y][x]='=';g[y+1][x]='=';}
      else{ground(x,y,'=');ground(x,y+1,'=');}
    }
  }
  // side chambers budding off the spine; their corners hold treasure
  const nRooms=3+Math.floor(r()*2)+(items?Math.max(0,items.length-2):0);
  const roomSpots=[];const roomCorridor=[];
  for(let i=0;i<nRooms;i++){
    const along=Math.floor((0.15+0.7*(i/(nRooms-1||1)))*(vertical?h:w));
    const t=clamp(along,3,(vertical?h:w)-4);
    const sp=spineAt[t];
    const side=r()<0.5?-1:1;
    const rw=3+Math.floor(r()*2),rh=2+Math.floor(r()*2);
    let rx,ry;
    if(vertical){rx=side<0?Math.max(1,sp-rw):Math.min(w-2-rw,sp+2);ry=clamp(t-1,1,h-2-rh);}
    else{rx=clamp(t-1,1,w-2-rw);ry=side<0?Math.max(1,sp-rh):Math.min(h-2-rh,sp+2);}
    for(let yy=ry;yy<ry+rh;yy++)for(let xx=rx;xx<rx+rw;xx++)
      ground(xx,yy,r()<0.62?'*':'.');
    // corridor connecting room to spine (2 tiles wide so nobody can plug it)
    if(vertical){const tx=clamp(side<0?rx+rw-1:rx,1,w-2);const step=sp<tx?1:-1;
      const t2=clamp(t+1,1,h-2);
      for(let xx=sp;xx!==tx;xx+=step){ground(xx,t);ground(xx,t2);if(i===0)roomCorridor.push([xx,t]);}}
    else{const ty=clamp(side<0?ry+rh-1:ry,1,h-2);const step=sp<ty?1:-1;
      const t2=clamp(t+1,1,w-2);
      for(let yy=sp;yy!==ty;yy+=step){ground(t,yy);ground(t2,yy);if(i===0)roomCorridor.push([t,yy]);}}
    roomSpots.push([clamp(rx+(side<0?0:rw-1),1,w-2),clamp(ry+(r()<0.5?0:rh-1),1,h-2)]);
  }
  // items: last in the list is hidden, the rest are visible pickups
  if(items&&items.length){
    for(let i=0;i<items.length&&i<roomSpots.length;i++){
      const hidden=(i===items.length-1);
      const[ix,iy]=roomSpots[i];
      g[iy][ix]=hidden?'&':'%';
      loot[ix+','+iy]=items[i];
    }
  }
  // CUT gate: scrappy trees ring the first treasure so only Cut reaches it
  if(cut&&items&&items.length&&roomSpots.length){
    const[ix,iy]=roomSpots[0];
    for(const[ddx,ddy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx2=ix+ddx,ny2=iy+ddy;
      if(nx2>0&&nx2<w-1&&ny2>0&&ny2<h-1&&g[ny2][nx2]!==wall&&g[ny2][nx2]!=='%'&&g[ny2][nx2]!=='&')
        g[ny2][nx2]='c';
    }
  }
  // STRENGTH boulders block the spine (Victory Road)
  if(boulder&&vertical){
    const by=Math.floor(h*0.4);
    g[by][spineAt[by]]='Z';g[by][spineAt[by]+1]='Z';
  }
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    if(g[y][x]==='.'&&hash2(x,y,seed)<0.10)g[y][x]=',';
  }
  const def={rows:g.map(row=>row.join('')),name,outdoor:true,wild,exits,npcs:npcs||[],signs:{},theme,loot,dark};
  addMap(key,def);
  const m=MAPS[key];
  // carve a 2-wide corridor from every NPC to the spine so nobody is walled in
  for(const n of m.npcs){
    m.grid[n.y][n.x]='.';
    if(vertical){const sp=spineAt[clamp(n.y,1,h-2)];const step=n.x<sp?1:-1;
      const y2=clamp(n.y+1,1,h-2);
      for(let xx=n.x;xx!==sp;xx+=step)if(xx>0&&xx<w-1){
        if(m.grid[n.y][xx]===wall)m.grid[n.y][xx]='.';
        if(m.grid[y2][xx]===wall)m.grid[y2][xx]='.';}
      if(n.fn==='trainer'&&!n.dir)n.dir=n.x<sp?'right':'left';}
    else{const sp=spineAt[clamp(n.x,1,w-2)];const step=n.y<sp?1:-1;
      const x2=clamp(n.x+1,1,w-2);
      for(let yy=n.y;yy!==sp;yy+=step)if(yy>0&&yy<h-1){
        if(m.grid[yy][n.x]===wall)m.grid[yy][n.x]='.';
        if(m.grid[yy][x2]===wall)m.grid[yy][x2]='.';}
      if(n.fn==='trainer'&&!n.dir)n.dir=n.y<sp?'down':'up';}
    // clear a full ring around the post: an NPC must never be able to wall a path
    for(let ddy=-1;ddy<=1;ddy++)for(let ddx=-1;ddx<=1;ddx++){
      const ax=n.x+ddx,ay=n.y+ddy;
      if(ax>0&&ax<w-1&&ay>0&&ay<h-1&&m.grid[ay][ax]===wall)m.grid[ay][ax]='.';
    }
  }
  if(signText){
    const sx=vertical?spineAt[4]-1:6,sy=vertical?4:spineAt[6]-1;
    if(sy>0&&sx>0&&m.grid[sy]&&m.grid[sy][sx]!==undefined){m.grid[sy][sx]='?';m.signs[sx+','+sy]=signText;}
  }
  return m;
}

// carve a 2-wide opening in a route's outer wall and tunnel inward until
// the tunnel meets the existing path network
function carveOpening(key,dir,pos){
  const m=MAPS[key];const wall=ch=>ch==='#'||ch==='^';
  if(dir==='right'||dir==='left'){
    const edge=dir==='right'?m.w-1:0,step=dir==='right'?-1:1;
    m.grid[pos][edge]='=';m.grid[pos+1][edge]='=';
    for(let x=edge+step;x>0&&x<m.w-1;x+=step){
      const hit=!wall(m.grid[pos][x])&&!wall(m.grid[pos+1][x]);
      if(wall(m.grid[pos][x]))m.grid[pos][x]='.';
      if(wall(m.grid[pos+1][x]))m.grid[pos+1][x]='.';
      if(hit)break;
    }
  }else{
    const edge=dir==='bottom'?m.h-1:0,step=dir==='bottom'?-1:1;
    m.grid[edge][pos]='=';m.grid[edge][pos+1]='=';
    for(let y=edge+step;y>0&&y<m.h-1;y+=step){
      const hit=!wall(m.grid[y][pos])&&!wall(m.grid[y][pos+1]);
      if(wall(m.grid[y][pos]))m.grid[y][pos]='.';
      if(wall(m.grid[y][pos+1]))m.grid[y][pos+1]='.';
      if(hit)break;
    }
  }
}
function autoSigns(key,text){
  const m=MAPS[key];
  for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++)
    if(m.grid[y][x]==='?'&&!m.signs[x+','+y])m.signs[x+','+y]=text;
}
// stamp a small office-tower facade onto a city grid with a '0' door
function stampTower(cityKey,x,y,warp){
  const m=MAPS[cityKey];
  const rows=['TTTT','IIII','IIII','W0WW'];
  for(let ry=0;ry<4;ry++)for(let rx=0;rx<4;rx++)m.grid[y+ry][x+rx]=rows[ry][rx];
  m.warps['0']=warp;
}

// ---------- input ----------
const held=new Set();
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
 w:'up',s:'down',a:'left',d:'right',z:'a',Z:'a',Enter:'a',' ':'a',x:'b',X:'b',Escape:'b',Backspace:'b',
 Shift:'start',p:'start',P:'start'};
document.addEventListener('keydown',e=>{
  const act=KEYMAP[e.key];if(!act)return;e.preventDefault();
  if(['up','down','left','right','b'].includes(act))held.add(act);
  if(e.repeat)return;
  onAction(act);
});
document.addEventListener('keyup',e=>{const act=KEYMAP[e.key];if(act)held.delete(act);});
// touch
function bindBtn(id,act){
  const el=$(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();
    if(['up','down','left','right','b'].includes(act))held.add(act);onAction(act);},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();held.delete(act);},{passive:false});
  el.addEventListener('mousedown',e=>{e.preventDefault();
    if(['up','down','left','right'].includes(act))held.add(act);onAction(act);});
  el.addEventListener('mouseup',()=>held.delete(act));
}

bindBtn('tA','a');bindBtn('tB','b');bindBtn('tS','start');

let dlgSkip=null, dlgNext=null;
function onAction(act){
  if(G.menus.length){menuNav(act);return;}
  if(G.dlgActive){if(act==='a'||act==='b'){if(dlgSkip)dlgSkip();else if(dlgNext)dlgNext();}return;}
  if(G.state==='decor'){decorNav(act);return;}
  if(G.state==='title'){titleNav(act);return;}
  if(G.state!=='play')return;
  if(act==='start'){if(!G.ilock)pauseMenu();return;}
  if(act==='a'){interact();return;}
  if(act==='b')return;
}

// ---------- dialog ----------
function say(pages){
  pages=Array.isArray(pages)?pages.slice():[pages];
  return new Promise(async res=>{
    G.dlgActive=true;$('dlg').classList.remove('hidden');
    for(const page of pages){await typePage(String(page));await waitAdvance();}
    $('dlg').classList.add('hidden');G.dlgActive=false;res();
  });
}
function typePage(text){
  return new Promise(res=>{
    const el=$('dlgtext');el.textContent='';$('dlgmore').style.visibility='hidden';
    let i=0;let done=false;
    const step=OPTS.txt===1?1:OPTS.txt===3?6:2;
    const ms=OPTS.txt===1?26:OPTS.txt===3?8:16;
    const iv=setInterval(()=>{
      i+=step;el.textContent=text.slice(0,i);
      if(i>=text.length){finish();}
    },ms);
    function finish(){if(done)return;done=true;clearInterval(iv);el.textContent=text;
      $('dlgmore').style.visibility='visible';dlgSkip=null;res();}
    dlgSkip=finish;
  });
}
function waitAdvance(){return new Promise(res=>{dlgNext=()=>{dlgNext=null;res();};});}

// ---------- menus ----------
function menu(items,opts){
  opts=opts||{};
  return new Promise(res=>{
    const el=document.createElement('div');el.className='win menu';
    if(opts.w)el.style.width=opts.w+'px';
    el.style.right=(opts.right!==undefined?opts.right:6)+'px';
    if(opts.left!==undefined){el.style.left=opts.left+'px';el.style.right='auto';}
    el.style.top=(opts.top!==undefined?opts.top:6)+'px';
    if(opts.bottom!==undefined){el.style.bottom=opts.bottom+'px';el.style.top='auto';}
    el.style.maxHeight=(opts.maxH||300)+'px';el.style.overflowY='auto';
    const m={items,sel:0,el,res,opts};
    items.forEach((it,i)=>{
      const d=document.createElement('div');d.className='mi'+(it.dim?' dim':'');
      if(it.icon){const c=document.createElement('canvas');c.width=20;c.height=20;
        drawMon(c.getContext('2d'),it.icon,0,0,20,{shiny:it.shiny});
        c.style.verticalAlign='middle';c.style.marginRight='4px';d.appendChild(c);}
      else if(it.iconItem){const c=document.createElement('canvas');c.width=20;c.height=20;
        drawItemIcon(c.getContext('2d'),it.iconItem,0,0,20);
        c.style.verticalAlign='middle';c.style.marginRight='4px';d.appendChild(c);}
      const sp=document.createElement('span');sp.textContent=it.label;d.appendChild(sp);
      if(it.sub){const s2=document.createElement('div');s2.style.fontSize='9px';s2.style.color='#566c86';
        s2.textContent=it.sub;d.appendChild(s2);}
      d.addEventListener('click',()=>{m.sel=i;closeMenu(m,i);});
      el.appendChild(d);
    });
    if(opts.note){const n=document.createElement('div');n.className='mnote';n.textContent=opts.note;el.appendChild(n);}
    $('uiroot').appendChild(el);
    G.menus.push(m);paintMenu(m);
  });
}
function paintMenu(m){
  [...m.el.querySelectorAll('.mi')].forEach((d,i)=>{d.classList.toggle('sel',i===m.sel);
    if(i===m.sel)d.scrollIntoView({block:'nearest'});});
  if(m.opts.onSel)m.opts.onSel(m.sel);
}
function closeMenu(m,val){
  G.menus.splice(G.menus.indexOf(m),1);m.el.remove();m.res(val);
}
function menuNav(act){
  const m=G.menus[G.menus.length-1];if(!m)return;
  if(act==='up'){sfx('blip');m.sel=(m.sel-1+m.items.length)%m.items.length;paintMenu(m);}
  else if(act==='down'){sfx('blip');m.sel=(m.sel+1)%m.items.length;paintMenu(m);}
  else if(act==='a'){sfx('confirm');closeMenu(m,m.sel);}
  else if(act==='b'&&m.opts.cancel!==false){sfx('cancel');closeMenu(m,-1);}
}
async function askYesNo(q){
  if(q)await say(q);
  const r=await menu([{label:'YES'},{label:'NO'}],{right:6,bottom:84,w:90});
  return r===0;
}

// ---------- map / movement ----------
function curMap(){return MAPS[G.map];}
function npcAt(x,y){
  for(const n of curMap().npcs){
    if(n.x===x&&n.y===y&&npcVisible(n))return n;
  }return null;
}
// resolve an NPC's look: base palette + gender (explicit flag beats name hint beats palette)
function npcPal(n){
  const base=PALS[n.pal];
  let fem;
  if(n.fem!==undefined)fem=!!n.fem;
  else if(isFemName(n.name))fem=true;
  else if(base&&base.fem!==undefined)fem=base.fem;
  // else: leave unset so drawPerson's seeded roll gives anonymous townsfolk variety
  const out=base?Object.assign({},base):{};
  if(fem!==undefined)out.fem=fem;
  return out;
}
function npcVisible(n){
  if(n.hideFlag&&flags()[n.hideFlag])return false;
  if(n.needFlag&&!flags()[n.needFlag])return false;
  return true;
}
// effective tile: cleared obstacles and collected items read as plain ground
function effTile(m,x,y){
  const ch=tileAt(m,x,y);
  if((ch==='c'||ch==='Z'||ch==='%')&&G.player.picked&&G.player.picked[m.key+'_'+x+'_'+y])
    return m.outdoor?'.':'f';
  return ch;
}
function passable(x,y){
  const m=curMap(),ch=effTile(m,x,y);
  if(ch==='~')return G.surfing&&!npcAt(x,y);
  if(isSolid(ch))return false;
  if(npcAt(x,y))return false;
  return true;
}
async function warpTo(map,x,y,banner){
  G.fadeDir=1;await sleep(220);
  G.map=map;G.x=x;G.y=y;G.mx=0;G.my=0;G.walking=false;
  // buddy arrives tucked behind you, then trails out naturally on your first step
  G.follow={x,y,ox:0,oy:0,dir:G.dir,walk:false};
  G.fadeDir=-1;
  const m=MAPS[map];
  if(banner!==false){G.mapBanner=m.name;G.bannerT=110;}
  if(!B.active)musicPlay(musicFor(m));
  updateHud();
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

let stepLock=false;
async function tryStep(dir){
  if(stepLock||G.walking)return;
  G.dir=dir;
  const dx=dir==='left'?-1:dir==='right'?1:0;
  const dy=dir==='up'?-1:dir==='down'?1:0;
  const nx=G.x+dx,ny=G.y+dy,m=curMap();
  // edge exits
  if(nx<0||ny<0||nx>=m.w||ny>=m.h){
    const ex=m.exits[dir];
    if(ex){
      if(ex.req){
        const r=ex.req;
        if(r.flag&&!flags()[r.flag]){stepLock=true;await say(r.msg);stepLock=false;return;}
        if(r.badges&&badgeCount()<r.badges){stepLock=true;await say(r.msg);stepLock=false;return;}
      }
      stepLock=true;await warpTo(ex.map,ex.x,ex.y);stepLock=false;
    }
    return;
  }
  const ch=tileAt(m,nx,ny);
  // interior exit mat (with a fallback so a save loaded indoors is never stranded)
  if(ch==='m'){
    stepLock=true;
    let ret=G.ret;
    if(!ret){
      if(G.map==='league'||G.map.indexOf('e4')===0)ret={map:'victory',x:9,y:5};
      else{
        const base=G.map.split('_')[0];
        ret=MAPS[base]&&MAPS[base].outdoor?{map:base,x:Math.floor(MAPS[base].w/2),y:Math.floor(MAPS[base].h/2)}
          :{map:'dewbrook',x:9,y:9};
      }
    }
    G.ret=null;
    await warpTo(ret.map,ret.x,ret.y,false);stepLock=false;return;
  }
  if(isDoor(ch)){
    const w=m.warps[ch];
    if(w){
      if(w[3]&&!flags()[w[3]]){ // sealed door (e.g. Elite Four gates)
        stepLock=true;await say(w[4]||"The door is sealed shut.");stepLock=false;return;
      }
      stepLock=true;
      if(m.outdoor)G.ret={map:G.map,x:nx,y:ny+1}; // only street doors set the way back out
      await warpTo(w[0],w[1],w[2]);stepLock=false;return;
    }
  }
  if(!passable(nx,ny))return;
  // animate (hold B to run)
  G.walking=true;
  const prevX=G.x,prevY=G.y;
  const spd=held.has('b')?8:4;
  const sx=dx*T,sy=dy*T;let prog=0;
  // the follower slides one tile behind, in lockstep with this same step
  const fFrom=G.follow?{x:G.follow.x,y:G.follow.y}:{x:prevX,y:prevY};
  const fdx=(fFrom.x-prevX)*T, fdy=(fFrom.y-prevY)*T;
  const fdir=fdx>0?'left':fdx<0?'right':fdy>0?'up':fdy<0?'down':(G.follow&&G.follow.dir)||G.dir;
  G.follow={x:prevX,y:prevY,ox:fdx,oy:fdy,dir:fdir,walk:true};
  await new Promise(res=>{
    const iv=setInterval(()=>{
      prog+=spd;
      const k=prog/T;
      G.mx=-sx+sx*k;G.my=-sy+sy*k;G.frame+=spd>4?2:1;
      if(G.follow){G.follow.ox=fdx*(1-k);G.follow.oy=fdy*(1-k);}
      if(prog>=T){clearInterval(iv);res();}
    },16);
    G.x=nx;G.y=ny;G.mx=-sx;G.my=-sy;
  });
  G.walking=false;G.mx=0;G.my=0;
  if(G.follow){G.follow.ox=0;G.follow.oy=0;G.follow.walk=false;}
  if(G.surfing&&effTile(m,nx,ny)!=='~'){G.surfing=false;} // stepped ashore
  await onStep(nx,ny);
}
async function onStep(x,y){
  const m=curMap(),ch=tileAt(m,x,y);
  if(ch==='%'){ // item pickup
    G.player.picked=G.player.picked||{};
    const k=G.map+'_'+x+'_'+y;
    if(!G.player.picked[k]){
      const itemId=(m.loot||{})[x+','+y];
      if(itemId){G.player.picked[k]=true;addItem(itemId,1);sfx('item');
        await say(G.player.name+" found a "+ITEMS[itemId].n+"!");}
    }
  }
  if(G.repel>0){G.repel--;if(G.repel===0){await say("The Repel wore off.");}}
  // daycare progress + egg incubation
  if(G.daycare&&G.daycare.mons.length){
    G.daycare.steps++;
    if(G.daycare.steps%150===0)for(const dm of G.daycare.mons){
      if(dm.lvl<100&&(dm._dc||0)<10){dm.lvl++;dm._dc=(dm._dc||0)+1;calcStats(dm);dm.hp=dm.maxhp;}}
    if(G.daycare.mons.length>=2&&!G.daycare.egg&&G.daycare.steps>300&&rnd()<0.012){
      G.daycare.egg=evoChainOf(pick(G.daycare.mons).id)[0];
    }
  }
  for(const p of G.party){
    if(p.egg){p.hatchSteps--;
      if(p.hatchSteps<=0){
        p.egg=false;delete p.hatchSteps;p.hp=p.maxhp;
        markDex(p.id,true);sfx('evolve');
        await say(["Huh?!","...","The Egg hatched into "+DEX[p.id].n+"!"]);
      }
    }
  }
  // surfing encounters
  if(ch==='~'&&G.surfing&&G.party.some(p=>p.hp>0&&!p.egg)){
    if(rnd()<0.09){
      const lvl=clamp(4+badgeCount()*4+ri(-2,3),3,46);
      await startBattle({kind:'wild',mon:makeMon(wpick(WATER_TABLE),lvl)});
      return;
    }
  }
  if(ch==='*'&&m.wild&&G.party.some(p=>p.hp>0)){
    const tb=WILD_TABLES[m.wild];
    if(rnd()<0.14){
      let id=wpick(tb.mons),lvl=ri(tb.lv[0],tb.lv[1]);
      // nocturnal species prowl at night
      if(m.outdoor&&dayPhase()==='night'&&rnd()<0.3)id=wpick(NIGHT_POOL);
      if(G.repel>0&&lvl<G.party[0].lvl)return;
      const wild=makeMon(id,lvl);
      await startBattle({kind:'wild',mon:wild});
      return;
    }
  }
  if(G.state==='play'&&!B.active)await checkTrainerLOS();
}

function dayPhase(){
  const h=new Date().getHours();
  if(h>=6&&h<17)return 'day';
  if(h>=17&&h<20)return 'dusk';
  if(h>=20||h<5)return 'night';
  return 'dawn';
}

function weatherOf(m){
  if(!m||!m.outdoor)return null;

async function checkTrainerLOS(){
  const m=curMap();
  for(const n of m.npcs){
    if(n.fn!=='trainer'||G.player.defeated[n.tid]||!npcVisible(n))continue;
    const d=n.dir||'down';
    const dx=d==='left'?-1:d==='right'?1:0, dy=d==='up'?-1:d==='down'?1:0;
    if(!dx&&!dy)continue;
    for(let i=1;i<=4;i++){
      const tx=n.x+dx*i,ty=n.y+dy*i;
      if(tx===G.x&&ty===G.y){await trainerAmbush(n,i,dx,dy);return;}
      if(isSolid(tileAt(m,tx,ty))||npcAt(tx,ty))break;
    }
  }
}
async function trainerAmbush(n,dist,dx,dy){
  if(G.ilock)return;
  G.ilock=true;
  const homeX=n.x,homeY=n.y,homeMap=G.map;
  try{
    sfx('spot');
    n.spotted=true;
    await sleep(550);
    for(let i=1;i<dist;i++){n.x+=dx;n.y+=dy;await sleep(230);}
    n.spotted=false;
    await npcInteract(n);
  }finally{
    G.ilock=false;n.spotted=false;
    // amble back to their post so narrow paths don't stay blocked
    (async()=>{
      let guard=0;
      while((n.x!==homeX||n.y!==homeY)&&guard++<12){
        if(G.map!==homeMap){n.x=homeX;n.y=homeY;break;} // player left; just snap home
        const sx2=Math.sign(homeX-n.x),sy2=Math.sign(homeY-n.y);
        const nx2=n.x+(sx2||0),ny2=sx2?n.y:n.y+(sy2||0);
        if(nx2===G.x&&ny2===G.y){await sleep(400);continue;} // wait for the player to move
        n.x=nx2;n.y=ny2;
        await sleep(200);
      }
    })();
  }
}

function facingTile(){

  const ch=effTile(m,fx,fy);
  if(ch==='c'){ // cuttable tree

  }
  if(ch==='Z'){ // strength boulder
    G.player.picked=G.player.picked||{};
    if(badgeCount()>=6){
      if(await askYesNo("A cracked boulder blocks the road.\nUse STRENGTH to shove it aside?")){
        sfx('superhit');G.player.picked[G.map+'_'+fx+'_'+fy]=true;
        await say(monName(G.party[0])+" heaved the boulder aside with a mighty shove!");
      }
    }else await say("A massive cracked boulder.\n(The Fist Badge would prove your Pokémon strong enough to move it.)");
    return;
  }
  if(ch==='&'){ // hidden item spot
    G.player.picked=G.player.picked||{};
    const k=G.map+'_'+fx+'_'+fy;
    if(!G.player.picked[k]){
      const itemId=(m.loot||{})[fx+','+fy];
      if(itemId){G.player.picked[k]=true;addItem(itemId,1);
        await say(["Hm? The ground looks disturbed here...","You dug up a hidden "+ITEMS[itemId].n+"!"]);return;}
    }
  }
  const dp=curDecor().find(p2=>p2.x===fx&&p2.y===fy);
  if(dp){await say(DECOR_FLAVOR[dp.d]||'A lovely piece.');return;}
  if(ch==='k'){ // talk across the counter
    const n2=npcAt(fx+(fx-G.x),fy+(fy-G.y));
    if(n2){await npcInteract(n2);return;}
  }
  if(ch==='P'){await openPC();return;}
  if(ch==='B'){await say("Books about Pokémon. \""+DEX[ri(1,150)].n+" — see dex entry.\"");return;}
  if(ch==='e'){
    if(inOwnApt()){
      if(await askYesNo('Your own bed. Take a rest?')){
        sfx('heal');healParty();G.lastHeal={map:G.map,x:G.x,y:G.y};
        await say(['You sink into your own mattress. Bliss.','Your team is fully rested!','(If you black out, you will wake up right here at home.)']);
        saveGame(true);
      }
    }else await say('A comfy bed. No time to nap — adventure awaits!');
    return;
  }
  if(ch==='z'){await say("A machine hums and blinks. Its lights pulse like a heartbeat.");return;}
  if(ch==='v'){await say("There's a show on TV. Four kids are walking along... wait, it's a nature documentary about Lopuff.");return;}
  if(ch==='t'){await say("A research table. Neat rows of Poké Balls sit under warm lamps.");return;}
  if(ch==='n'){await say("A cozy bench. Trainers have carved their team names into it.");return;}
  if(ch==='h'){await slotsGame();return;}
  if(ch==='j'){await say(["A massive vault door, polished to a mirror shine.","You can see your own greedy reflection in it."]);return;}
  if(ch==='~'){await waterAction(fx,fy);return;}
}

    else if(r<0.45){const s=pick(['7','◆','★','♪']);const o=pick(['♪','◆','★'].filter(x=>x!==s));
      reels=[s,s,o];msg="So close! Two of a kind — ₽100 back.";payout=100;}
    else{reels=[pick(['7','◆','★','♪']),pick(['◆','★','♪']),pick(['7','★','♪'])];

// ---------- render ----------
function render(){
  G.tick++;
  const m=curMap();if(!m||G.state==='title'||G.state==='boot'){requestAnimationFrame(render);return;}
  const camX=clamp(G.x*T+G.mx-VIEW_W*T/2+T/2,0,Math.max(0,m.w*T-VIEW_W*T));
  const camY=clamp(G.y*T+G.my-VIEW_H*T/2+T/2,0,Math.max(0,m.h*T-VIEW_H*T));
  ctx.fillStyle='#1a1c2c';ctx.fillRect(0,0,480,320);
  const x0=Math.floor(camX/T),y0=Math.floor(camY/T);
  for(let ty=y0;ty<=y0+VIEW_H;ty++)for(let tx=x0;tx<=x0+VIEW_W;tx++){
    let ch=effTile(m,tx,ty);
    if(ch==='&')ch=m.outdoor?'.':'f';   // hidden items look like plain ground
    drawTileC(ctx,ch,tx*T-camX,ty*T-camY,tx,ty,G.tick,m.outdoor?null:(m.indoor||'house'),m.theme);
  }
  // sprites sorted by y
  const sprites=[];
  for(const p of curDecor())sprites.push({y:p.y,draw:()=>drawDecor(ctx,p.d,p.x*T-camX,p.y*T-camY)});
  for(const n of m.npcs){if(npcVisible(n))sprites.push({y:n.y,draw:()=>{
    const px=n.x*T-camX,py=n.y*T-camY;
    drawPerson(ctx,px,py,n.seed||1,n.dir||'down',0,npcPal(n));
    if(n.fn==='trainer'&&!G.player.defeated[n.tid]){
      const bob=Math.sin(G.tick/9)*2.5;
      ctx.fillStyle='#141423';ctx.fillRect(px+11,py-13+bob,10,12);
      ctx.fillStyle='#ffd76a';ctx.font='bold 11px monospace';ctx.textAlign='center';
      ctx.fillText('!',px+16,py-3+bob);ctx.textAlign='left';}
  }});}
  // follower: your lead able Pokémon trots along behind, interpolated with the player
  const buddy=G.party.find(p=>!p.egg&&p.hp>0);
  if(G.follow&&buddy&&!G.surfing){
    const fp=G.follow;
    const fpix=fp.x*T+(fp.ox||0), fpiy=fp.y*T+(fp.oy||0);
    sprites.push({y:fpiy/T-0.01,draw:()=>{
      const fx2=fpix-camX,fy2=fpiy-camY;
      // hop while moving, gentle idle breathing when parked
      const hop=fp.walk?Math.abs(Math.sin(G.frame/3.2))*-2.5:Math.sin(G.tick/16)*0.8;
      ctx.fillStyle='rgba(20,20,35,.2)';
      ctx.beginPath();ctx.ellipse(fx2+16,fy2+28,8+(fp.walk?1:0),3,0,0,7);ctx.fill();
      drawMon(ctx,buddy.id,fx2+3,fy2+3+hop,26,{shiny:buddy.shiny});
    }});
  }
  sprites.push({y:G.y,draw:()=>{
    const ppx=G.x*T+G.mx-camX,ppy=G.y*T+G.my-camY;
    if(G.surfing){ // riding the waves on a Pokémon's back
      const sb=Math.sin(G.tick/8)*2;
      ctx.fillStyle='rgba(255,255,255,.55)';
      ctx.beginPath();ctx.ellipse(ppx+16,ppy+28+sb*0.4,15,5,0,0,7);ctx.fill();
      const mount=G.party.find(p2=>!p2.egg&&p2.hp>0);
      if(mount)drawMon(ctx,mount.id,ppx+2,ppy+10+sb,28,{shiny:mount.shiny});
      drawPerson(ctx,ppx,ppy-8+sb,0,G.dir,0,playerPal());
    }else{
      drawPerson(ctx,ppx,ppy,0,G.dir,G.walking?Math.floor(G.frame/4):0,playerPal());
    }
    // standing in tall grass: blades overlap the player's feet
    if(tileAt(m,G.x,G.y)==='*'){
      ctx.fillStyle='#2f6d28';
      for(let i=0;i<5;i++){const gx=ppx+4+i*6,sw=Math.sin(G.tick/10+i)>0?1:0;
        ctx.fillRect(gx+sw,ppy+22,3,10);ctx.fillRect(gx-1+sw,ppy+26,5,3);}
    }
  }});
  sprites.sort((a,b)=>a.y-b.y);
  for(const s of sprites)s.draw();
  if(G.state==='decor'&&G.dcur){
    const dcx=G.dcur.x*T-camX,dcy=G.dcur.y*T-camY;
    if(G.dcur.carry){ctx.globalAlpha=0.75;drawDecor(ctx,G.dcur.carry,dcx,dcy);ctx.globalAlpha=1;}
    ctx.strokeStyle=Math.floor(G.tick/8)%2?'#ffd76a':'#fff';ctx.lineWidth=3;ctx.strokeRect(dcx+2,dcy+2,T-4,T-4);
  }
  // weather particles by regional theme
  const wz=weatherOf(m);
  if(wz){
    if(WPARTS.kind!==wz){WPARTS.kind=wz;WPARTS.p=[];
      for(let i=0;i<44;i++)WPARTS.p.push({x:rnd()*480,y:rnd()*320,v:0.5+rnd(),ph:rnd()*7});}
    for(const pt of WPARTS.p){
      if(wz==='rain'){
        pt.y+=pt.v*7;pt.x-=pt.v*1.5;
        if(pt.y>320){pt.y=-8;pt.x=rnd()*520;}
        ctx.strokeStyle='rgba(160,200,255,.45)';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(pt.x+2,pt.y+9);ctx.stroke();
      }else if(wz==='snow'){
        pt.y+=pt.v*1.1;pt.x+=Math.sin(G.tick/30+pt.ph)*0.7;
        if(pt.y>320){pt.y=-4;pt.x=rnd()*480;}
        ctx.fillStyle='rgba(255,255,255,.85)';
        ctx.fillRect(pt.x,pt.y,pt.v>1?3:2,pt.v>1?3:2);
      }else{ // sparkle (fairy)
        pt.y-=pt.v*0.5;pt.x+=Math.sin(G.tick/22+pt.ph)*0.5;
        if(pt.y<-4){pt.y=324;pt.x=rnd()*480;}
        const tw=(Math.sin(G.tick/7+pt.ph)+1)/2;
        ctx.fillStyle='rgba('+(pt.ph>3.5?'237,161,228':'115,239,247')+','+(0.25+tw*0.5)+')';
        ctx.fillRect(pt.x,pt.y,2,2);
      }
    }
  }
  // cave darkness (Victory Road): a circle of light around the player
  if(m.dark&&G.state==='play'){
    const px=G.x*T+G.mx-camX+16,py=G.y*T+G.my-camY+16;
    const dg=ctx.createRadialGradient(px,py,42,px,py,135);
    dg.addColorStop(0,'rgba(8,8,18,0)');
    dg.addColorStop(0.75,'rgba(8,8,18,0.72)');
    dg.addColorStop(1,'rgba(8,8,18,0.94)');
    ctx.fillStyle=dg;ctx.fillRect(0,0,480,320);
  }
  // day/night tint (outdoors only; the real clock drives it)
  if(m.outdoor&&!m.dark){
    const ph=dayPhase();
    if(ph==='dusk'){ctx.fillStyle='rgba(255,140,60,0.14)';ctx.fillRect(0,0,480,320);}
    else if(ph==='night'){ctx.fillStyle='rgba(18,26,68,0.38)';ctx.fillRect(0,0,480,320);}
    else if(ph==='dawn'){ctx.fillStyle='rgba(255,180,120,0.12)';ctx.fillRect(0,0,480,320);}
  }
  // map banner
  if(G.bannerT>0){G.bannerT--;
    ctx.fillStyle='rgba(26,28,44,.85)';ctx.fillRect(150,10,180,26);
    ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(G.mapBanner,240,27);ctx.textAlign='left';}
  // fade
  if(G.fadeDir===1)G.fade=Math.min(1,G.fade+0.09);
  if(G.fadeDir===-1){G.fade=Math.max(0,G.fade-0.09);if(G.fade===0)G.fadeDir=0;}
  if(G.fade>0){ctx.fillStyle=`rgba(0,0,0,${G.fade})`;ctx.fillRect(0,0,480,320);}
  // movement polling
  if(G.state==='play'&&!G.dlgActive&&!G.menus.length&&!G.walking&&!stepLock&&!G.ilock){
    for(const d of['up','down','left','right'])if(held.has(d)){tryStep(d);break;}
  }
  requestAnimationFrame(render);
}

function decorPlacedAt(x,y){return decorList().find(p=>p.x===x&&p.y===y);}
async function decorNav(act){
  const d=G.dcur;if(!d)return;
  const m=curMap();
  if(act==='up')d.y=Math.max(1,d.y-1);
  else if(act==='down')d.y=Math.min(m.h-2,d.y+1);
  else if(act==='left')d.x=Math.max(1,d.x-1);
  else if(act==='right')d.x=Math.min(m.w-2,d.x+1);
  else if(act==='a'){
    if(d.carry){
      const t=tileAt(m,d.x,d.y);
      if(t==='f'&&!decorPlacedAt(d.x,d.y)&&!npcAt(d.x,d.y)&&!(d.x===G.x&&d.y===G.y)){
        decorList().push({d:d.carry,x:d.x,y:d.y});d.carry=null;sfx('confirm');
      }else sfx('cancel');
    }else{
      const ex=decorPlacedAt(d.x,d.y);
      if(ex){const lst=decorList();lst.splice(lst.indexOf(ex),1);d.carry=ex.d;sfx('blip');}
      else{
        G.player.furn=G.player.furn||{};
        const inv=Object.keys(G.player.furn).filter(k=>G.player.furn[k]>0);
        if(!inv.length){G.mapBanner='Storage empty! Visit a mall FURNISHER.';G.bannerT=160;return;}
        const c=await menu(inv.map(k=>({label:DECOR[k].n+' ×'+G.player.furn[k]})).concat([{label:'CANCEL'}]),{right:6,top:6,w:200});
        if(c>=0&&c<inv.length){G.player.furn[inv[c]]--;d.carry=inv[c];sfx('blip');}
      }
    }
  }else if(act==='b'){
    if(d.carry){G.player.furn[d.carry]=(G.player.furn[d.carry]||0)+1;d.carry=null;sfx('cancel');}
    else{G.state='play';G.mapBanner='';G.bannerT=0;saveGame(true);}
  }else if(act==='start'){
    if(d.carry)G.player.furn[d.carry]=(G.player.furn[d.carry]||0)+1;
    G.state='play';G.mapBanner='';G.bannerT=0;saveGame(true);
  }
  // keep the cursor inside the camera's view of the player
  d.x=clamp(d.x,G.x-7,G.x+7);d.y=clamp(d.y,G.y-4,G.y+5);
}

const B={active:false};

function stageMult(s){return s>=0?(2+s)/2:2/(2-s);}
function effAtk(mon,phys,stages){const base=phys?mon.atk:mon.spa;let v=base*stageMult(stages[phys?'atk':'spa']);
  if(mon.st==='BRN'&&phys)v*=0.5;return v;}
function effDef(mon,phys,stages){const base=phys?mon.def:mon.spd;return base*stageMult(stages[phys?'def':'spd']);}
function effSpe(mon,stages){let v=mon.spe*stageMult(stages.spe);if(mon.st==='PAR')v*=0.25;return v;}

function freshStages(){return{atk:0,def:0,spa:0,spd:0,spe:0};}

async function startBattle(cfg){
  if(B.active)return;
  B.active=true;
  const wasState=G.state;G.state='battle';
  const el=$('battle');el.classList.remove('hidden');el.innerHTML='';

  el.appendChild(scene);B.sc=scene.getContext('2d');

  const pp=document.createElement('div');pp.className='bpanel';pp.id='eply';el.appendChild(pp);
  B.foePanel=pf;B.plyPanel=pp;
  B.kind=cfg.kind;B.cfg=cfg;
  B.trainerParty=cfg.kind==='trainer'?cfg.party.map(([id,lvl])=>makeMon(id,lvl)):null;
  B.foeIdx=0;
  B.foe=cfg.kind==='trainer'?B.trainerParty[0]:cfg.mon;
  B.plyIdx=G.party.findIndex(p=>p.hp>0);
  B.ply=G.party[B.plyIdx];
  B.fStages=freshStages();B.pStages=freshStages();
  B.fSlp=0;B.pSlp=0;B.runTries=0;B.caught=false;B.result=null;B.brk=false;
  B.anim={pShake:0,fShake:0,pFlash:0,fFlash:0};
  B.foeOx=0;B.foeScale=1;B.plyScale=1;B.trainerX=null;B.flash=0;
  B.cBall=null;B.stars=0;B.foeShow=false;B.plyShow=false;
  B.showFoePanel=false;B.showPlyPanel=false;
  markDex(B.foe.id,false);
  B.fx=null;
  const wz2=weatherOf(curMap());
  B.weather=(wz2==='rain'||wz2==='snow')?wz2:null;
  B.wcos=wz2==='sparkle'?'sparkle':null;
  B.scene=battleSceneFor(curMap());
  B.sceneOutdoor=!!(curMap()&&curMap().outdoor&&!curMap().dark);
  B.phase=dayPhase();
  drawBattle();
  B.drawIv=setInterval(drawBattle,33);
  musicPlay(/champion/i.test(cfg.name||'')?'champion'
    :/elite|umbra/i.test(cfg.name||'')?'elite'
    :cfg.leader?'gymbattle':'battle');
  if(cfg.kind==='trainer'){
    // trainer strides in, talks, then throws their first ball
    B.trainerX=280;
    await tween(v=>B.trainerX=v,280,0,450);
    await say(cfg.name+" wants to battle!");
    await tween(v=>B.trainerX=v,0,300,320);
    B.trainerX=null;
    await sendFoe();
  }else{
    // wild: danger flashes, then it lunges in from the right
    B.flash=0.9;await sleep(90);B.flash=0;await sleep(70);
    B.flash=0.7;await sleep(80);B.flash=0;
    B.foeShow=true;B.foeOx=280;
    await tween(v=>B.foeOx=v,280,0,480);
    B.showFoePanel=true;
    await say("A wild "+DEX[B.foe.id].n+(B.foe.shiny?" ✨":"")+" appeared!"+(cfg.legend?" It radiates ancient power!":""));
  }
  if(B.weather==='rain')await say("Rain pours over the battlefield!");
  else if(B.weather==='snow')await say("Snow swirls through the air!");
  else if(B.wcos==='sparkle')await say("Fairy motes drift across the clearing...");
  else if(B.scene==='cave')await say("Your voices echo off the cavern walls...");
  else if(B.sceneOutdoor&&B.phase==='night')await say("The battle unfolds under a starlit sky.");
  await sendPly();
  await battleLoop();
  // teardown
  clearInterval(B.drawIv);
  el.classList.add('hidden');el.innerHTML='';
  B.active=false;G.state=wasState==='battle'?'play':wasState;
  updateHud();
  musicPlay(musicFor(curMap()));
  if(B.result==='blackout')await blackout();
  else if(B.result==='win'&&cfg.kind==='trainer'){
    sfx('victory');
    G.player.money+=cfg.money||0;
    await say([cfg.name+" was defeated!","You got ₽"+(cfg.money||0)+" for winning!"]);
    if(cfg.win)await say(cfg.win);
    updateHud();
  }
  return B.result;
}
// ---------- per-type move animations ----------
function playMoveFX(isPly,type,isStatus){
  if(!OPTS.fx)return Promise.resolve();
  return new Promise(res=>{
    const from=isPly?{x:150,y:210}:{x:315,y:115};
    const to=isPly?{x:339,y:110}:{x:132,y:215};
    B.fx={type,from,to,t0:performance.now(),dur:isStatus?450:560,status:isStatus,isPly};
    setTimeout(()=>{B.fx=null;res();},isStatus?470:600);
  });
}
function drawFX(c){
  const f=B.fx;if(!f)return;
  const k=clamp((performance.now()-f.t0)/f.dur,0,1);
  const col=TYPE_COLORS[f.type]||'#fff';
  if(f.status){
    c.strokeStyle=col;c.lineWidth=3;c.globalAlpha=1-k;
    c.beginPath();c.arc(f.from.x,f.from.y,10+k*44,0,7);c.stroke();
    c.beginPath();c.arc(f.from.x,f.from.y,4+k*26,0,7);c.stroke();
    c.globalAlpha=1;return;
  }
  const styleOf={ELE:'bolt',FIR:'proj',WAT:'proj3',GRA:'leaf',ICE:'shard',ROC:'lob',GRO:'lob',PSY:'ring',GHO:'ring',DAR:'ring',FAI:'ring'};
  const st=styleOf[f.type]||'slash';
  const dirS=f.isPly?1:-1;
  const kk=Math.min(k/0.7,1);
  const px=f.from.x+(f.to.x-f.from.x)*kk, py=f.from.y+(f.to.y-f.from.y)*kk;
  if(k<0.7){
    if(st==='bolt'){
      if(Math.floor(k*12)%2===0){
        c.strokeStyle='#ffd76a';c.lineWidth=4;c.beginPath();c.moveTo(f.to.x+16,0);
        for(let yy=14;yy<f.to.y;yy+=18)c.lineTo(f.to.x+((yy/18)%2?12:-10),yy);
        c.lineTo(f.to.x,f.to.y);c.stroke();
        c.strokeStyle='#fff';c.lineWidth=1.5;c.stroke();
      }
    }else if(st==='proj'){
      c.fillStyle=col;c.beginPath();c.arc(px,py-Math.sin(kk*Math.PI)*34,9,0,7);c.fill();
      c.fillStyle='#ffd76a';c.beginPath();c.arc(px-7*dirS,py-Math.sin(kk*Math.PI)*34,4,0,7);c.fill();
    }else if(st==='proj3'){
      c.fillStyle=col;
      for(let i=0;i<3;i++){c.beginPath();c.arc(px-i*15*dirS,py+(i%2)*10-5,6,0,7);c.fill();}
      c.fillStyle='#c8e8ff';c.beginPath();c.arc(px,py-3,3,0,7);c.fill();
    }else if(st==='leaf'){
      c.fillStyle=col;
      for(let i=0;i<3;i++){c.save();c.translate(px-i*13*dirS,py+(i%2)*9-4);c.rotate(k*14+i);c.fillRect(-6,-3,12,6);c.restore();}
    }else if(st==='shard'){
      c.fillStyle='#bfeef8';
      for(let i=0;i<3;i++){c.save();c.translate(px-i*13*dirS,py+(i%2)*10-5);c.rotate(0.8*dirS);c.fillRect(-3,-9,6,18);c.restore();}
    }else if(st==='lob'){
      const ly=py-Math.sin(kk*Math.PI)*72;
      c.fillStyle='#9a8060';c.beginPath();c.arc(px,ly,8,0,7);c.fill();
      c.fillStyle='#7a6248';c.fillRect(px-5,ly-2,10,5);
    }else if(st==='ring'){
      c.strokeStyle=col;c.globalAlpha=0.85;c.lineWidth=4;
      c.beginPath();c.arc(f.to.x,f.to.y,46*(1-kk)+6,0,7);c.stroke();
      c.lineWidth=2;c.beginPath();c.arc(f.to.x,f.to.y,30*(1-kk)+4,0,7);c.stroke();
      c.globalAlpha=1;
    }else if(k>0.3){ // slash
      c.strokeStyle=col;c.lineWidth=5;c.globalAlpha=1-(k-0.3);
      c.beginPath();c.moveTo(f.to.x-22,f.to.y-22);c.lineTo(f.to.x+22,f.to.y+22);c.stroke();
      c.beginPath();c.moveTo(f.to.x+18,f.to.y-24);c.lineTo(f.to.x-18,f.to.y+20);c.stroke();
      c.globalAlpha=1;
    }
  }else{
    const bk=(k-0.7)/0.3;
    c.globalAlpha=1-bk;
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      c.fillStyle=i%2?col:'#fff';
      c.fillRect(f.to.x+Math.cos(a)*32*bk-3,f.to.y+Math.sin(a)*32*bk-3,6,6);
    }
    c.globalAlpha=1;
  }
}

function tween(set,from,to,ms){
  return new Promise(res=>{
    const t0=performance.now();
    (function f(t){const k=clamp((t-t0)/ms,0,1);set(from+(to-from)*k);
      if(k<1)requestAnimationFrame(f);else res();})(t0);
  });
}
