<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Pokémon Claude</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#1a1c2c; touch-action:none;
  font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace; }
#wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
#game { position:relative; width:480px; height:320px; transform-origin:center center;
  background:#000; image-rendering:pixelated; }
canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
#cv { position:absolute; left:0; top:0; }

/* ---------- generic window ---------- */
.win { position:absolute; background:#f8f8f0; border:3px solid #30346d; border-radius:6px;
  box-shadow:0 2px 0 rgba(0,0,0,.4), inset 0 0 0 2px #94b0c2; color:#1a1c2c;
  font-weight:bold; font-size:11px; line-height:1.45; z-index:30; }
.hidden { display:none !important; }

/* ---------- dialog box ---------- */
#dlg { left:4px; right:4px; bottom:4px; height:74px; padding:8px 26px 8px 12px; z-index:40; }
#dlgtext { white-space:pre-wrap; font-size:12px; }
#dlgmore { position:absolute; right:8px; bottom:4px; animation:bob .6s infinite alternate; color:#b13e53; }
@keyframes bob { from{transform:translateY(0)} to{transform:translateY(3px)} }

/* ---------- menus ---------- */
.menu { padding:6px 10px; z-index:50; }
.menu .mi { padding:2px 4px 2px 14px; position:relative; white-space:nowrap; cursor:pointer; }
.menu .mi.sel::before { content:"▶"; position:absolute; left:0; font-size:9px; top:4px; color:#b13e53; }
.menu .mi.dim { color:#94a3b8; }
.menu .mnote { font-size:9px; color:#566c86; padding:2px 4px; border-top:2px solid #94b0c2; margin-top:4px; }

/* ---------- HUD ---------- */
#hud { position:absolute; left:4px; top:4px; z-index:20; background:rgba(26,28,44,.75); color:#f4f4f4;
  font-size:10px; font-weight:bold; padding:3px 8px; border-radius:4px; pointer-events:none; }

/* ---------- battle ---------- */
#battle { position:absolute; inset:0; z-index:35; overflow:hidden; }
#bscene { position:absolute; inset:0; }
.bpanel { position:absolute; background:#f8f8f0; border:3px solid #30346d; border-radius:6px;
  padding:5px 8px; font-size:11px; font-weight:bold; color:#1a1c2c; min-width:150px; }
#efoe  { left:8px; top:8px; }
#eply  { right:8px; bottom:84px; }
.hpout { background:#30346d; border-radius:4px; height:8px; margin-top:3px; padding:1px; }
.hpin  { background:#38b764; height:6px; border-radius:3px; width:100%; transition:width .35s; }
.expout{ background:#30346d; border-radius:3px; height:5px; margin-top:3px; padding:1px; }
.expin { background:#41a6f6; height:3px; border-radius:2px; width:0%; }
.stag  { display:inline-block; font-size:8px; padding:0 3px; border-radius:3px; color:#fff; margin-left:4px; vertical-align:2px; }

/* ---------- overlays ---------- */
.screen { position:absolute; inset:0; z-index:60; background:#f8f8f0; color:#1a1c2c;
  font-weight:bold; font-size:11px; overflow:hidden; }
.screen h2 { font-size:13px; background:#30346d; color:#fff; padding:5px 10px; }
.scrollbox { position:absolute; top:26px; bottom:24px; left:0; right:0; overflow-y:auto; }
.foot { position:absolute; bottom:0; left:0; right:0; background:#94b0c2; color:#1a1c2c;
  font-size:9px; padding:3px 10px; }
.row { display:flex; align-items:center; gap:6px; padding:3px 10px; cursor:pointer; }
.row.sel { background:#ffd76a; }
.row canvas { flex:0 0 auto; }

/* ---------- title ---------- */
#title { position:absolute; inset:0; z-index:70; background:linear-gradient(#1a1c2c,#30346d 60%,#3b5dc9);
  display:flex; flex-direction:column; align-items:center; color:#fff; }
#tlogo { margin-top:34px; text-align:center; }
#tlogo .big { font-size:40px; font-weight:900; letter-spacing:2px; color:#ffd76a;
  text-shadow:3px 3px 0 #b13e53, -2px -2px 0 #30346d; }
#tlogo .sub { font-size:16px; font-weight:900; color:#73eff7; letter-spacing:8px; text-shadow:2px 2px 0 #30346d; }
#tmon { margin-top:6px; }
#tmenu { margin-top:10px; text-align:center; font-size:13px; font-weight:bold; }
#tmenu div { padding:3px 18px; cursor:pointer; }
#tmenu div.sel { background:rgba(255,255,255,.18); border-radius:6px; }
#tfoot { position:absolute; bottom:4px; font-size:8px; color:#94b0c2; text-align:center; width:100%; }

/* ---------- touch controls ---------- */
#touch { position:fixed; inset:0; z-index:90; pointer-events:none; display:none; }
body.touch #touch { display:block; }
.tbtn { position:absolute; pointer-events:auto; background:rgba(148,176,194,.25);
  border:2px solid rgba(148,176,194,.5); color:rgba(255,255,255,.8); user-select:none;
  display:flex; align-items:center; justify-content:center; font-weight:900; }
.tbtn:active { background:rgba(148,176,194,.55); }
#dpad { position:absolute; left:12px; bottom:16px; width:132px; height:132px; pointer-events:none; }
#dpad .tbtn { width:44px; height:44px; font-size:16px; border-radius:8px; }
#tup{left:44px;top:0} #tdn{left:44px;bottom:0} #tlf{left:0;top:44px} #trt{right:0;top:44px}
#tA { right:16px; bottom:64px; width:58px; height:58px; border-radius:50%; font-size:20px; }
#tB { right:84px; bottom:22px; width:50px; height:50px; border-radius:50%; font-size:18px; }
#tS { right:24px; bottom:150px; width:64px; height:26px; border-radius:12px; font-size:10px; }
</style>
</head>

<script>

// ---------- RNG ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hash2(x,y,s){let h=(x*374761393+y*668265263+s*1442695041)|0;h=(h^(h>>>13))|0;h=Math.imul(h,1274126177);return((h^(h>>>16))>>>0)/4294967296;}
const rnd=Math.random;
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(arr){return arr[Math.floor(rnd()*arr.length)];}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function wpick(list){ // [[item,weight],...]
  let tot=0; for(const e of list)tot+=e[1];
  let r=rnd()*tot; for(const e of list){r-=e[1]; if(r<=0)return e[0];} return list[0][0];
}

// ---------- learnsets ----------
function learnset(id){
  const d=DEX[id],r=mulberry32(id*7919+13),t1=d.t[0],t2=d.t[1]||d.t[0];
  const tm1=TYPE_MOVES[t1],tm2=TYPE_MOVES[t2];
  const buffs=['harden','sharpen','agility','focusmind'];
  const ls=[[1,'tackle'],[1,tm1[0]]];
  ls.push([7,r()<.5?'growl':'leer']);
  ls.push([13,tm1[1]]);
  ls.push([18,t2!==t1?tm2[0]:'quickdash']);
  const st=TYPE_STATUS[t1]||TYPE_STATUS[t2];
  ls.push([24,(st&&r()<.65)?st:buffs[Math.floor(r()*buffs.length)]]);
  ls.push([30,tm1[2]]);
  ls.push([36,t2!==t1?tm2[1]:(r()<.5?'slam':'furyswipes')]);
  ls.push([42,tm1[3]]);
  ls.push([48,t2!==t1?tm2[2]:'hyperrush']);
  return ls;
}
function movesAtLevel(id,lvl){
  const known=[];
  for(const[l,m]of learnset(id)){if(l<=lvl&&!known.includes(m))known.push(m);}
  return known.slice(-4).map(m=>({m,pp:MOVES[m].pp}));
}

// ---------- monster instances ----------
function makeMon(id,lvl){
  const d=DEX[id];
  const ivs=[ri(0,15),ri(0,15),ri(0,15),ri(0,15),ri(0,15),ri(0,15)];
  const mon={id,lvl,exp:0,ivs,st:null,shiny:rnd()<1/384,moves:movesAtLevel(id,lvl)};
  calcStats(mon); mon.hp=mon.maxhp;
  return mon;
}
function calcStats(mon){
  const d=DEX[mon.id],b=d.bs,iv=mon.ivs,l=mon.lvl;
  mon.maxhp=Math.floor((2*b[0]+iv[0])*l/100)+l+10;
  mon.atk=Math.floor((2*b[1]+iv[1])*l/100)+5;
  mon.def=Math.floor((2*b[2]+iv[2])*l/100)+5;
  mon.spa=Math.floor((2*b[3]+iv[3])*l/100)+5;
  mon.spd=Math.floor((2*b[4]+iv[4])*l/100)+5;
  mon.spe=Math.floor((2*b[5]+iv[5])*l/100)+5;
}
function expNext(lvl){return lvl*lvl*2+20;}
function expYield(mon){const d=DEX[mon.id];const bst=d.bs.reduce((a,b)=>a+b,0);return Math.max(8,Math.floor(bst*mon.lvl/28));}

function shade(h,f){const[r,g,b]=hexRGB(h);return`rgb(${clamp(r*f|0,0,255)},${clamp(g*f|0,0,255)},${clamp(b*f|0,0,255)})`;}
function rgbs(h){return`rgb(${hexRGB(h).join(',')})`;}

// ---- fakemon sprite generator: unique 16x16 mirrored pixel creature per species ----
// cell values: 0 empty, 1 body, 2 accent, 3 eye, 4 highlight-accent (type flair), 5 mouth
const monCache={};
function monSprite(id,shiny){
  const key=id+(shiny?'s':'');
  if(monCache[key])return monCache[key];
  const d=DEX[id],r=mulberry32(id*2654435761%2147483647+77);
  let c1=TYPE_COLORS[d.t[0]],c2=d.t[1]?TYPE_COLORS[d.t[1]]:'#f4e4c2';
  if(shiny){const t=c1;c1=d.t[1]?TYPE_COLORS[d.t[1]]:'#ffd76a';c2=t;}
  const t1=d.t[0],t2=d.t[1]||d.t[0];
  const W=16,H=16,g=[];
  for(let y=0;y<H;y++){g.push(new Array(W).fill(0));}
  // ---- body archetype ----
  const legendary=id>=149;
  let bodyTop=2+Math.floor(r()*3), bodyBot=12+Math.floor(r()*2);
  const headSize=3+Math.floor(r()*3);
  const fat=0.55+r()*0.4;
  const serpent=(t1==='DRA'||t2==='POI')&&r()<0.5;
  const ghost=t1==='GHO'||t2==='GHO';
  const bird=t1==='FLY'||t2==='FLY';
  const legs=!serpent&&!ghost&&r()<0.85;
  const ears=r()<0.6&&!bird, tail=r()<0.65, horn=(t1==='DRA'||t1==='ROC'||r()<0.25);
  for(let y=bodyTop;y<=bodyBot;y++){
    const t=(y-bodyTop)/(Math.max(1,bodyBot-bodyTop));
    let w;
    if(y<bodyTop+headSize) w=2.4+headSize*0.7*Math.sin(Math.PI*(y-bodyTop+0.5)/headSize);
    else if(serpent) w=2.2+1.4*Math.sin(y*1.7+id);           // sinuous column
    else w=2.0+4.4*fat*Math.sin(Math.PI*clamp((t-0.15)/0.85,0,1));
    w=clamp(w+(r()-0.5)*1.2,1.5,7.4);
    for(let x=0;x<8;x++){ if(7-x<w) g[y][x]=1; }
  }
  if(ears){const ey=bodyTop,ex=4-Math.floor(r()*2);
    if(ey>0){g[ey-1][ex]=1;if(ey>1&&r()<.6)g[ey-2][ex]=1;}}
  if(horn&&bodyTop>1){g[bodyTop-1][7]=1;g[Math.max(0,bodyTop-2)][7]=1;}
  if(legs){for(const lx of[3,6]){if(bodyBot+1<H)g[bodyBot+1][lx]=1;if(bodyBot+2<H)g[bodyBot+2][lx]=1;}}
  if(ghost){ // wispy trailing bottom instead of legs
    for(let x=2;x<8;x++){if((x+id)%2===0&&bodyBot+1<H)g[bodyBot+1][x]=1;}
  }
  if(tail&&!serpent){const ty=clamp(bodyBot-2-Math.floor(r()*3),1,H-2);
    for(let i=0;i<3;i++)g[ty][clamp(i,0,7)]=g[ty][clamp(i,0,7)]||1;}
  // smooth
  for(let y=1;y<H-1;y++)for(let x=1;x<7;x++){
    const n=g[y-1][x]+g[y+1][x]+g[y][x-1]+g[y][x+1];
    if(!g[y][x]&&n>=3)g[y][x]=1;
  }
  // ---- type flair (value 4 = bright accent) ----
  const midY=Math.floor((bodyTop+bodyBot)/2);
  const flair=(x,y)=>{if(y>=0&&y<H&&x>=0&&x<8)g[y][x]=4;};
  const solid=(x,y)=>{if(y>=0&&y<H&&x>=0&&x<8&&!g[y][x])g[y][x]=1;};
  switch(t1){
    case 'GRA':flair(7,bodyTop-1);flair(6,bodyTop-2);break;                 // leaf sprout
    case 'FIR':flair(7,bodyTop-1);flair(6,bodyTop-2);flair(7,bodyTop-3);break; // flame crest
    case 'WAT':flair(7,bodyTop-1);solid(1,midY);flair(1,midY);break;        // fin + side fin
    case 'ELE':flair(4,bodyTop-1);flair(3,bodyTop-2);break;                 // bolt ear
    case 'ICE':flair(5,bodyTop-1);flair(7,bodyTop-2);break;                 // crystal spikes
    case 'BUG':solid(5,bodyTop-1);solid(4,bodyTop-2);flair(4,bodyTop-2);break; // antennae
    case 'FLY':for(let i=0;i<3;i++){solid(0,midY+i);flair(0,midY+i);solid(1,midY+i);}break; // wing
    case 'ROC':case 'GRO':for(let x=3;x<8;x+=2)flair(x,bodyTop);break;      // rocky ridge
    case 'DRA':flair(5,bodyTop-1);flair(4,bodyTop-2);flair(7,bodyTop-2);break; // twin horns
    case 'PSY':flair(7,bodyTop+Math.max(0,Math.floor(headSize/2))-1);break; // forehead gem
    case 'GHO':flair(7,bodyBot+1);break;                                    // wisp
    case 'STE':for(let y=midY;y<bodyBot;y+=2)flair(5,y);break;              // rivets
    case 'FAI':flair(0,bodyTop);flair(2,bodyBot+1);break;                   // sparkle motes
    case 'DAR':flair(3,bodyTop-1);flair(2,bodyTop-2);break;                 // pointed ear
    case 'FIG':solid(0,midY);solid(0,midY+1);flair(0,midY);break;           // brawny arm
    case 'POI':flair(2,midY+1);flair(5,midY+2);break;                       // toxin spots
    case 'NOR':flair(3,bodyTop-1);break;                                    // ear tuft
  }
  if(legendary){for(let x=1;x<8;x+=2)flair(x,bodyTop-1);flair(0,midY);}     // crown of light
  // ---- pattern (value 2) ----
  const pat=Math.floor(r()*3);
  for(let y=0;y<H;y++)for(let x=0;x<8;x++){
    if(g[y][x]!==1)continue;
    if(pat===0&&x>4&&y>bodyTop+headSize)g[y][x]=2;
    else if(pat===1&&((x+y*2)%4===0))g[y][x]=2;
    else if(pat===2&&hash2(x,y,id)<0.22)g[y][x]=2;
  }
  // ---- face ----
  const eyeY=bodyTop+Math.max(1,Math.floor(headSize/2)),eyeX=5;
  if(g[eyeY]&&g[eyeY][eyeX])g[eyeY][eyeX]=3;
  else{for(let x=7;x>=2;x--){if(g[eyeY]&&g[eyeY][x]===1){g[eyeY][x]=3;break;}}}
  if(g[eyeY+2]&&g[eyeY+2][7]===1)g[eyeY+2][7]=5; // mouth center pixel
  // ---- render mirrored with outline ----
  const cvv=document.createElement('canvas');cvv.width=W;cvv.height=H;
  const c=cvv.getContext('2d');
  const full=[];for(let y=0;y<H;y++){full.push([]);for(let x=0;x<W;x++){full[y][x]=x<8?g[y][x]:g[y][15-x];}}
  const dark=shade(c1,0.42);
  const flairCol=shiny?'#73eff7':shade(c2==='#f4e4c2'?c1:c2,1.5);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const v=full[y][x];if(!v)continue;
    let col;
    if(v===2)col=rgbs(c2);
    else if(v===3)col='#141423';
    else if(v===4)col=flairCol;
    else if(v===5)col=shade(c1,0.35);
    else{
      col=rgbs(c1);
      if(y>0&&!full[y-1][x])col=shade(c1,1.35);
      else if(y<H-1&&!full[y+1][x])col=shade(c1,0.7);
    }
    c.fillStyle=col;c.fillRect(x,y,1,1);
  }
  c.fillStyle=dark;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(full[y][x])continue;
    const nb=(full[y-1]&&full[y-1][x])||(full[y+1]&&full[y+1][x])||full[y][x-1]||full[y][x+1];
    if(nb)c.fillRect(x,y,1,1);
  }
  monCache[key]=cvv;return cvv;
}
function drawMon(ctx,id,x,y,size,opts){
  opts=opts||{};
  const sp=monSprite(id,opts.shiny);
  ctx.save();ctx.imageSmoothingEnabled=false;
  if(opts.alpha!==undefined)ctx.globalAlpha=opts.alpha;
  if(opts.back){ctx.translate(x+size,y);ctx.scale(-1,1);ctx.drawImage(sp,0,0,16,16,0,0,size,size);}
  else ctx.drawImage(sp,0,0,16,16,x,y,size,size);
  ctx.restore();
}

// ---- pokéball / item / badge icons ----
function drawBall(ctx,x,y,s,rot,tier){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  const top=tier==='greatball'?'#3b5dc9':tier==='ultraball'?'#2a2139':'#e04a4a';
  ctx.fillStyle=top;ctx.beginPath();ctx.arc(0,0,s,Math.PI,0);ctx.fill();
  ctx.fillStyle='#f4f4f4';ctx.beginPath();ctx.arc(0,0,s,0,Math.PI);ctx.fill();
  if(tier==='ultraball'){ctx.fillStyle='#ffd76a';ctx.fillRect(-s*0.7,-s*0.55,s*0.5,s*0.25);ctx.fillRect(s*0.2,-s*0.55,s*0.5,s*0.25);}
  ctx.fillStyle='#141423';ctx.fillRect(-s,-s*0.14,s*2,s*0.28);
  ctx.beginPath();ctx.arc(0,0,s*0.32,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,s*0.18,0,7);ctx.fill();
  ctx.restore();
}
function drawItemIcon(ctx,id,x,y,s){
  const it=ITEMS[id];ctx.save();ctx.translate(x+s/2,y+s/2);
  if(it.ball){drawBall(ctx,0,0,s*0.42,0,id);ctx.restore();return;}
  if(it.heal){const col=id==='potion'?'#c47ae0':id==='superpotion'?'#e0a03a':id==='hyperpotion'?'#5a8de0':'#38b764';
    ctx.fillStyle=col;ctx.fillRect(-s*0.22,-s*0.28,s*0.44,s*0.6);
    ctx.fillStyle='#f4f4f4';ctx.fillRect(-s*0.12,-s*0.44,s*0.24,s*0.18);
    ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(-s*0.16,-s*0.2,s*0.12,s*0.4);ctx.restore();return;}
  if(it.revive){ctx.fillStyle='#ffd76a';ctx.beginPath();
    ctx.moveTo(0,-s*0.4);ctx.lineTo(s*0.35,0);ctx.lineTo(0,s*0.4);ctx.lineTo(-s*0.35,0);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e8b743';ctx.fillRect(-s*0.1,-s*0.1,s*0.2,s*0.2);ctx.restore();return;}
  if(it.cure){ctx.fillStyle='#73eff7';ctx.fillRect(-s*0.18,-s*0.35,s*0.36,s*0.7);
    ctx.fillStyle='#30346d';ctx.fillRect(-s*0.26,-s*0.42,s*0.52,s*0.16);ctx.restore();return;}
  if(it.pp){ctx.fillStyle='#f2c218';ctx.fillRect(-s*0.16,-s*0.3,s*0.32,s*0.6);
    ctx.fillStyle='#b13e53';ctx.fillRect(-s*0.16,-s*0.42,s*0.32,s*0.14);ctx.restore();return;}
  if(it.repel){ctx.fillStyle='#9d47a0';ctx.fillRect(-s*0.18,-s*0.32,s*0.36,s*0.64);
    ctx.fillStyle='#f4f4f4';ctx.fillRect(-s*0.1,-s*0.44,s*0.2,s*0.14);ctx.restore();return;}
  if(it.candy){ctx.fillStyle='#f75a87';ctx.beginPath();ctx.arc(0,0,s*0.26,0,7);ctx.fill();
    ctx.fillStyle='#ffd76a';ctx.fillRect(-s*0.42,-s*0.08,s*0.16,s*0.16);ctx.fillRect(s*0.26,-s*0.08,s*0.16,s*0.16);ctx.restore();return;}
  ctx.fillStyle='#94b0c2';ctx.fillRect(-s*0.25,-s*0.25,s*0.5,s*0.5);ctx.restore();
}
const BADGE_COLORS=['#c98850','#41a6f6','#f2c218','#5cb544','#9d67d0','#b1352c','#77cfd1','#6745ee'];
function drawBadgeIcon(ctx,i,x,y,s,earned){
  ctx.save();ctx.translate(x+s/2,y+s/2);
  ctx.fillStyle=earned?BADGE_COLORS[i]:'rgba(148,176,194,.35)';
  ctx.beginPath();
  const spikes=[3,4,5,6,8,3,4,5][i]+2;
  for(let k=0;k<spikes*2;k++){
    const rr=k%2===0?s*0.46:s*0.24, a=k*Math.PI/spikes-Math.PI/2;
    ctx[k?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr);
  }
  ctx.closePath();ctx.fill();
  if(earned){ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(-s*0.08,-s*0.08,s*0.1,0,7);ctx.fill();}
  ctx.restore();
}

// ---- people ----
function drawPerson(ctx,px,py,seed,dir,frame,pal){
  const r=mulberry32(seed*97+11);
  const role=pal&&pal.role;
  const skin=pal&&pal.skin||pick2(r,['#f0c8a0','#d9a066','#8d5524','#ffdbac']);
  const hair=pal&&pal.hair||pick2(r,['#3a2c1e','#141423','#b13e53','#e8b743','#566c86','#7a4a2b']);
  const shirt=pal&&pal.shirt||pick2(r,['#b13e53','#3b5dc9','#38b764','#9d47a0','#ef7d57','#566c86']);
  const pants=pal&&pal.pants||pick2(r,['#30346d','#3a2c1e','#566c86','#1a1c2c']);
  const OUT='#20223a';
  const step=frame%2===1;
  const bob=step?1:0;
  const X=px+7,Y=py+5+bob;
  // ground shadow
  ctx.fillStyle='rgba(20,20,35,.22)';
  ctx.beginPath();ctx.ellipse(px+16,py+29,9,3.5,0,0,7);ctx.fill();
  // cape (leaders / boss) behind everything
  if(role==='leader'||role==='boss'){
    ctx.fillStyle=OUT;ctx.fillRect(X,Y+7,18,15);
    ctx.fillStyle=role==='boss'?'#2a2139':'#ffd76a';
    ctx.fillRect(X+1,Y+8,16,12);ctx.fillRect(X+2,Y+20,14,2);
    ctx.fillStyle=role==='boss'?'#1d1730':'#e0b040';ctx.fillRect(X+1,Y+16,16,2);
  }
  // legs with walk cycle + shoes
  ctx.fillStyle=OUT;
  if(step){ctx.fillRect(X+2,Y+15,6,7);ctx.fillRect(X+10,Y+15,6,9-bob);}
  else{ctx.fillRect(X+2,Y+15,6,9);ctx.fillRect(X+10,Y+15,6,9);}
  ctx.fillStyle=pants;
  if(step){ctx.fillRect(X+3,Y+16,4,4);ctx.fillRect(X+11,Y+16,4,6-bob);}
  else{ctx.fillRect(X+3,Y+16,4,6);ctx.fillRect(X+11,Y+16,4,6);}
  ctx.fillStyle='#5a3a18'; // shoes
  if(step){ctx.fillRect(X+3,Y+20,4,2);ctx.fillRect(X+11,Y+21-bob,4,2);}
  else{ctx.fillRect(X+3,Y+21,4,2);ctx.fillRect(X+11,Y+21,4,2);}
  // torso with outline + arms with hands
  ctx.fillStyle=OUT;ctx.fillRect(X+1,Y+8,16,10);
  ctx.fillRect(X-1,Y+9,4,8);ctx.fillRect(X+15,Y+9,4,8);
  ctx.fillStyle=shirt;ctx.fillRect(X+2,Y+9,14,8);
  ctx.fillRect(X,Y+10,3,5);ctx.fillRect(X+15,Y+10,3,5);
  ctx.fillStyle=shade(shirt,0.72);ctx.fillRect(X+2,Y+15,14,2); // shirt shading
  ctx.fillStyle=skin;ctx.fillRect(X,Y+14,3,2);ctx.fillRect(X+15,Y+14,3,2); // hands
  if(role==='prof'){ctx.fillStyle='#f4f4f4';ctx.fillRect(X+1,Y+9,4,10);ctx.fillRect(X+13,Y+9,4,10);
    ctx.fillStyle=shirt;ctx.fillRect(X+6,Y+9,6,8);}
  if(role==='nurse'){ctx.fillStyle='#fff';ctx.fillRect(X+4,Y+11,10,6);}   // apron
  if(role==='mom'){ctx.fillStyle='#f4e4c2';ctx.fillRect(X+5,Y+12,8,5);}
  if(role==='grunt'){ctx.fillStyle='#9d67d0';ctx.fillRect(X+7,Y+11,4,4);} // E emblem
  if(role==='rival'){ctx.fillStyle='#e8f4f4';ctx.fillRect(X+2,Y+8,14,3);} // scarf
  // head with outline
  ctx.fillStyle=OUT;ctx.fillRect(X+2,Y-1,14,12);
  ctx.fillStyle=skin;ctx.fillRect(X+3,Y,12,10);
  ctx.fillStyle=shade(skin,0.82);ctx.fillRect(X+3,Y+8,12,2); // chin shading
  // hair
  ctx.fillStyle=hair;ctx.fillRect(X+2,Y-2,14,4);
  if(dir!=='up'){ctx.fillRect(X+2,Y-2,2,6);ctx.fillRect(X+14,Y-2,2,6);}
  if(role==='rival'){
    ctx.fillRect(X+1,Y-3,3,3);ctx.fillRect(X+6,Y-4,3,3);ctx.fillRect(X+12,Y-3,3,3);
  }
  if(role==='boss'){ctx.fillRect(X+2,Y-2,14,6);}
  if(dir==='up'){ctx.fillStyle=hair;ctx.fillRect(X+3,Y,12,7);}
  else{
    // eyes with whites
    if(dir==='down'){ctx.fillStyle='#fff';ctx.fillRect(X+4,Y+4,3,2);ctx.fillRect(X+11,Y+4,3,2);
      ctx.fillStyle='#141423';ctx.fillRect(X+5,Y+4,2,2);ctx.fillRect(X+11,Y+4,2,2);}
    if(dir==='left'){ctx.fillStyle='#fff';ctx.fillRect(X+3,Y+4,3,2);
      ctx.fillStyle='#141423';ctx.fillRect(X+3,Y+4,2,2);}
    if(dir==='right'){ctx.fillStyle='#fff';ctx.fillRect(X+12,Y+4,3,2);
      ctx.fillStyle='#141423';ctx.fillRect(X+13,Y+4,2,2);}
    if(role==='prof'&&dir==='down'){ctx.fillStyle='#30346d';ctx.fillRect(X+4,Y+3,4,1);ctx.fillRect(X+10,Y+3,4,1);ctx.fillRect(X+8,Y+4,2,1);}
    if(role==='boss'&&dir==='down'){ctx.fillStyle='#b13e53';ctx.fillRect(X+4,Y+4,10,1);}
  }
  // headwear
  if(pal&&pal.hat){ctx.fillStyle=OUT;ctx.fillRect(X+1,Y-4,16,5);
    ctx.fillStyle=pal.hat;ctx.fillRect(X+2,Y-3,14,4);ctx.fillRect(X+1,Y+1,4,2);
    ctx.fillStyle='#f4f4f4';ctx.fillRect(X+7,Y-3,4,3);} // cap emblem
  if(role==='nurse'){ctx.fillStyle='#fff';ctx.fillRect(X+4,Y-4,10,3);
    ctx.fillStyle='#f75a87';ctx.fillRect(X+8,Y-4,2,3);ctx.fillRect(X+7,Y-3,4,1);}
  if(role==='leader'){ctx.fillStyle='#ffd76a';ctx.fillRect(X+3,Y-3,12,2);ctx.fillRect(X+8,Y-5,2,3);}
}
function pick2(r,arr){return arr[Math.floor(r()*arr.length)];}
const PAL_PLAYER={skin:'#f0c8a0',hair:'#3a2c1e',shirt:'#b13e53',pants:'#30346d',hat:'#b13e53'};
const PAL_NURSE={skin:'#ffdbac',hair:'#f75a87',shirt:'#f7c8d8',pants:'#f7c8d8',role:'nurse'};
const PAL_CLERK={skin:'#d9a066',hair:'#141423',shirt:'#3b5dc9',pants:'#30346d'};
const PAL_GRUNT={skin:'#f0c8a0',hair:'#141423',shirt:'#2a2139',pants:'#141423',hat:'#4d3b63',role:'grunt'};
const PAL_MOM={skin:'#ffdbac',hair:'#7a4a2b',shirt:'#e8a640',pants:'#8f563b',role:'mom'};
const PAL_PROF={skin:'#f0c8a0',hair:'#c0cbdc',shirt:'#3fb0a0',pants:'#566c86',role:'prof'};
const PAL_RIVAL={skin:'#f0c8a0',hair:'#41a6f6',shirt:'#38b764',pants:'#3a2c1e',role:'rival'};
const PAL_LEADER={skin:'#f0c8a0',hair:'#e8b743',shirt:'#b13e53',pants:'#30346d',role:'leader'};
const PAL_BOSS={skin:'#e6b8a2',hair:'#4d3b63',shirt:'#141423',pants:'#2a2139',role:'boss'};
const PALS={mom:PAL_MOM,prof:PAL_PROF,rival:PAL_RIVAL,nurse:PAL_NURSE,clerk:PAL_CLERK,
  grunt:PAL_GRUNT,leader:PAL_LEADER,boss:PAL_BOSS};

// ---- tiles (32 px) ----
const T=32;
function drawTileC(ctx,ch,sx,sy,wx,wy,tick,indoor){
  const h=hash2(wx,wy,7);
  const sway=Math.sin(tick/22+wx*1.3+wy*0.7)>0?1:0; // gentle world sway
  switch(ch){
    case '.':{ctx.fillStyle=h<0.5?'#4e9a3f':'#529f43';ctx.fillRect(sx,sy,T,T);
      if(h>0.72){ctx.fillStyle='#5db14e';ctx.fillRect(sx+8,sy+10,3,3);ctx.fillRect(sx+20,sy+22,3,3);}break;}
    case '*':{ctx.fillStyle='#3e8534';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#2f6d28';
      for(let i=0;i<4;i++){const gx=sx+3+i*8+((i+wx)%2?sway:0),gy=sy+6+((h*13+i)%3)*4;
        ctx.fillRect(gx,gy,3,14);ctx.fillRect(gx-2,gy+4,7,3);}
      ctx.fillStyle='#4e9a3f';for(let i=0;i<3;i++)ctx.fillRect(sx+6+i*9+sway,sy+18,2,10);break;}
    case '=':{ctx.fillStyle='#d8c078';ctx.fillRect(sx,sy,T,T);ctx.fillStyle='#c9b06a';

const MAPS={};

function addMap(key,def){
  const rows=def.rows.map(r=>r);
  let w=0;for(const r of rows)w=Math.max(w,r.length);
  def.grid=rows.map(r=>r.padEnd(w,'#').split(''));
  def.w=w;def.h=rows.length;def.key=key;
  def.npcs=def.npcs||[];def.warps=def.warps||{};def.exits=def.exits||{};
  def.signs=def.signs||{};def.specials=def.specials||{};
  delete def.rows;
  MAPS[key]=def;
}
function tileAt(map,x,y){if(y<0||x<0||y>=map.h||x>=map.w)return'#';return map.grid[y][x];}

// ---------- procedural routes ----------
function makeRoute(key,name,w,h,vertical,seed,wild,exits,npcs,signText){
  const rows=[];
  const cx=Math.floor(w/2)-1, cy=Math.floor(h/2)-1;
  for(let y=0;y<h;y++){
    let row='';
    for(let x=0;x<w;x++){
      const border=(x===0||y===0||x===w-1||y===h-1);
      const onPath=vertical?(x===cx||x===cx+1):(y===cy||y===cy+1);
      if(onPath&&(vertical?(true):(true))){row+= border?(vertical&&(y===0||y===h-1)?'=':(!vertical&&(x===0||x===w-1)?'=':'#')):'=';continue;}
      if(border){row+='#';continue;}
      const r=hash2(x,y,seed);
      if(r<0.30)row+='*';else if(r<0.36)row+='#';else if(r<0.40)row+=',';else row+='.';
    }
    rows.push(row);
  }
  const def={rows,name,outdoor:true,wild,exits,npcs:npcs||[],signs:{}};
  addMap(key,def);
  const m=MAPS[key];
  // clear tiles around npcs & sign
  for(const n of m.npcs){for(let dx=-1;dx<=1;dx++){const tx=n.x+dx;if(tx>0&&tx<w-1&&m.grid[n.y][tx]==='#')m.grid[n.y][tx]='.';}
    m.grid[n.y][n.x]=m.grid[n.y][n.x]==='#'?'.':m.grid[n.y][n.x];}
  if(signText){const sx=vertical?cx-2:6,sy=vertical?4:cy-2;m.grid[sy][sx]='?';m.signs[sx+','+sy]=signText;}
  return m;
}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const VIEW_W=15,VIEW_H=10;
const $=id=>document.getElementById(id);

const G={
  state:'boot', map:'dewbrook', x:6, y:4, dir:'down',
  mx:0,my:0,       // pixel offset while walking
  walking:false, frame:0, tick:0, ilock:false,
  player:{name:'Skye',money:3000,badges:[0,0,0,0,0,0,0,0],flags:{},defeated:{}},
  party:[],box:[],bag:{pokeball:5,potion:3},
  dex:{seen:{},caught:{}},
  repel:0, lastHeal:{map:'home',x:6,y:6}, ret:null,
  fade:0, fadeDir:0, mapBanner:'', bannerT:0,
  dlgActive:false, menus:[], starterId:0, playMin:0,
};
const flags=()=>G.player.flags;
function badgeCount(){return G.player.badges.reduce((a,b)=>a+(b?1:0),0);}

// ---------- input ----------
const held=new Set();
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
 w:'up',s:'down',a:'left',d:'right',z:'a',Z:'a',Enter:'a',' ':'a',x:'b',X:'b',Escape:'b',Backspace:'b',
 Shift:'start',p:'start',P:'start'};
document.addEventListener('keydown',e=>{
  const act=KEYMAP[e.key];if(!act)return;e.preventDefault();
  if(['up','down','left','right'].includes(act))held.add(act);
  onAction(act);
});
document.addEventListener('keyup',e=>{const act=KEYMAP[e.key];if(act)held.delete(act);});
// touch
function bindBtn(id,act){
  const el=$(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();
    if(['up','down','left','right'].includes(act))held.add(act);onAction(act);},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();held.delete(act);},{passive:false});
  el.addEventListener('mousedown',e=>{e.preventDefault();
    if(['up','down','left','right'].includes(act))held.add(act);onAction(act);});
  el.addEventListener('mouseup',()=>held.delete(act));
}
bindBtn('tup','up');bindBtn('tdn','down');bindBtn('tlf','left');bindBtn('trt','right');
bindBtn('tA','a');bindBtn('tB','b');bindBtn('tS','start');
if('ontouchstart'in window)document.body.classList.add('touch');

let dlgSkip=null, dlgNext=null;
function onAction(act){
  if(G.menus.length){menuNav(act);return;}
  if(G.dlgActive){if(act==='a'||act==='b'){if(dlgSkip)dlgSkip();else if(dlgNext)dlgNext();}return;}
  if(G.state==='title'){titleNav(act);return;}
  if(G.state!=='play')return;
  if(act==='start'){if(!G.ilock)pauseMenu();return;}
  if(act==='a'){interact();return;}
  if(act==='b')return;
}

// ---------- dialog ----------
function say(pages){
  pages=Array.isArray(pages)?pages.slice():[pages];
  return new Promise(async res=>{
    G.dlgActive=true;$('dlg').classList.remove('hidden');
    for(const page of pages){await typePage(String(page));await waitAdvance();}
    $('dlg').classList.add('hidden');G.dlgActive=false;res();
  });
}
function typePage(text){
  return new Promise(res=>{
    const el=$('dlgtext');el.textContent='';$('dlgmore').style.visibility='hidden';
    let i=0;let done=false;
    const iv=setInterval(()=>{
      i+=2;el.textContent=text.slice(0,i);
      if(i>=text.length){finish();}
    },16);
    function finish(){if(done)return;done=true;clearInterval(iv);el.textContent=text;
      $('dlgmore').style.visibility='visible';dlgSkip=null;res();}
    dlgSkip=finish;
  });
}
function waitAdvance(){return new Promise(res=>{dlgNext=()=>{dlgNext=null;res();};});}

// ---------- menus ----------
function menu(items,opts){
  opts=opts||{};
  return new Promise(res=>{
    const el=document.createElement('div');el.className='win menu';
    if(opts.w)el.style.width=opts.w+'px';
    el.style.right=(opts.right!==undefined?opts.right:6)+'px';
    if(opts.left!==undefined){el.style.left=opts.left+'px';el.style.right='auto';}
    el.style.top=(opts.top!==undefined?opts.top:6)+'px';
    if(opts.bottom!==undefined){el.style.bottom=opts.bottom+'px';el.style.top='auto';}
    el.style.maxHeight=(opts.maxH||300)+'px';el.style.overflowY='auto';
    const m={items,sel:0,el,res,opts};
    items.forEach((it,i)=>{
      const d=document.createElement('div');d.className='mi'+(it.dim?' dim':'');
      if(it.icon){const c=document.createElement('canvas');c.width=20;c.height=20;
        drawMon(c.getContext('2d'),it.icon,0,0,20,{shiny:it.shiny});
        c.style.verticalAlign='middle';c.style.marginRight='4px';d.appendChild(c);}
      else if(it.iconItem){const c=document.createElement('canvas');c.width=20;c.height=20;
        drawItemIcon(c.getContext('2d'),it.iconItem,0,0,20);
        c.style.verticalAlign='middle';c.style.marginRight='4px';d.appendChild(c);}
      const sp=document.createElement('span');sp.textContent=it.label;d.appendChild(sp);
      if(it.sub){const s2=document.createElement('div');s2.style.fontSize='9px';s2.style.color='#566c86';
        s2.textContent=it.sub;d.appendChild(s2);}
      d.addEventListener('click',()=>{m.sel=i;closeMenu(m,i);});
      el.appendChild(d);
    });
    if(opts.note){const n=document.createElement('div');n.className='mnote';n.textContent=opts.note;el.appendChild(n);}
    $('uiroot').appendChild(el);
    G.menus.push(m);paintMenu(m);
  });
}
function paintMenu(m){
  [...m.el.querySelectorAll('.mi')].forEach((d,i)=>{d.classList.toggle('sel',i===m.sel);
    if(i===m.sel)d.scrollIntoView({block:'nearest'});});
}
function closeMenu(m,val){
  G.menus.splice(G.menus.indexOf(m),1);m.el.remove();m.res(val);
}
function menuNav(act){
  const m=G.menus[G.menus.length-1];if(!m)return;
  if(act==='up'){m.sel=(m.sel-1+m.items.length)%m.items.length;paintMenu(m);}
  else if(act==='down'){m.sel=(m.sel+1)%m.items.length;paintMenu(m);}
  else if(act==='a'){closeMenu(m,m.sel);}
  else if(act==='b'&&m.opts.cancel!==false){closeMenu(m,-1);}
}
async function askYesNo(q){
  if(q)await say(q);
  const r=await menu([{label:'YES'},{label:'NO'}],{right:6,bottom:84,w:90});
  return r===0;
}

// ---------- map / movement ----------
function curMap(){return MAPS[G.map];}
function npcAt(x,y){
  for(const n of curMap().npcs){
    if(n.x===x&&n.y===y&&npcVisible(n))return n;
  }return null;
}
function npcVisible(n){
  if(n.hideFlag&&flags()[n.hideFlag])return false;
  if(n.needFlag&&!flags()[n.needFlag])return false;
  return true;
}
function passable(x,y){
  const m=curMap(),ch=tileAt(m,x,y);
  if(isSolid(ch))return false;
  if(npcAt(x,y))return false;
  return true;
}
async function warpTo(map,x,y,banner){
  G.fadeDir=1;await sleep(220);
  G.map=map;G.x=x;G.y=y;G.mx=0;G.my=0;G.walking=false;
  G.fadeDir=-1;
  const m=MAPS[map];
  if(banner!==false){G.mapBanner=m.name;G.bannerT=110;}
  updateHud();
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

let stepLock=false;
async function tryStep(dir){
  if(stepLock||G.walking)return;
  G.dir=dir;
  const dx=dir==='left'?-1:dir==='right'?1:0;
  const dy=dir==='up'?-1:dir==='down'?1:0;
  const nx=G.x+dx,ny=G.y+dy,m=curMap();
  // edge exits
  if(nx<0||ny<0||nx>=m.w||ny>=m.h){
    const ex=m.exits[dir];
    if(ex){
      if(ex.req){
        const r=ex.req;
        if(r.flag&&!flags()[r.flag]){stepLock=true;await say(r.msg);stepLock=false;return;}
        if(r.badges&&badgeCount()<r.badges){stepLock=true;await say(r.msg);stepLock=false;return;}
      }
      stepLock=true;await warpTo(ex.map,ex.x,ex.y);stepLock=false;
    }
    return;
  }
  const ch=tileAt(m,nx,ny);
  // interior exit mat
  if(ch==='m'&&G.ret){
    stepLock=true;const ret=G.ret;G.ret=null;
    await warpTo(ret.map,ret.x,ret.y,false);stepLock=false;return;
  }
  if(isDoor(ch)){
    const w=m.warps[ch];
    if(w){stepLock=true;G.ret={map:G.map,x:nx,y:ny+1};
      await warpTo(w[0],w[1],w[2]);stepLock=false;return;}
  }
  if(!passable(nx,ny))return;
  // animate
  G.walking=true;
  const sx=dx*T,sy=dy*T;let prog=0;
  await new Promise(res=>{
    const iv=setInterval(()=>{
      prog+=4;G.mx=-sx+sx*prog/T;G.my=-sy+sy*prog/T;G.frame++;
      if(prog>=T){clearInterval(iv);res();}
    },16);
    G.x=nx;G.y=ny;G.mx=-sx;G.my=-sy;
  });
  G.walking=false;G.mx=0;G.my=0;
  await onStep(nx,ny);
}
async function onStep(x,y){
  const m=curMap(),ch=tileAt(m,x,y);
  if(G.repel>0){G.repel--;if(G.repel===0){await say("The Repel wore off.");}}
  if(ch==='*'&&m.wild&&G.party.some(p=>p.hp>0)){
    const tb=WILD_TABLES[m.wild];
    if(rnd()<0.14){
      const id=wpick(tb.mons),lvl=ri(tb.lv[0],tb.lv[1]);
      if(G.repel>0&&lvl<G.party[0].lvl)return;
      const wild=makeMon(id,lvl);
      await startBattle({kind:'wild',mon:wild});
    }
  }
}

// ---------- interaction ----------
function facingTile(){
  const dx=G.dir==='left'?-1:G.dir==='right'?1:0;
  const dy=G.dir==='up'?-1:G.dir==='down'?1:0;
  return[G.x+dx,G.y+dy];
}
async function interact(){
  if(G.state!=='play'||G.walking||stepLock||G.ilock)return;
  G.ilock=true;
  try{await interactInner();}finally{G.ilock=false;}
}
async function interactInner(){
  const[fx,fy]=facingTile(),m=curMap();
  const n=npcAt(fx,fy);
  if(n){await npcInteract(n);return;}
  const key=fx+','+fy;
  if(m.signs[key]){await say(m.signs[key]);return;}
  if(m.specials[key]){await runSpecial(m.specials[key]);return;}
  const ch=tileAt(m,fx,fy);
  if(ch==='k'){ // talk across the counter
    const n2=npcAt(fx+(fx-G.x),fy+(fy-G.y));
    if(n2){await npcInteract(n2);return;}
  }
  if(ch==='P'){await openPC();return;}
  if(ch==='B'){await say("Books about Pokémon. \""+DEX[ri(1,150)].n+" — see dex entry.\"");return;}
  if(ch==='e'){await say("A comfy bed. No time to nap — adventure awaits!");return;}
  if(ch==='z'){await say("A machine hums and blinks. Its lights pulse like a heartbeat.");return;}
  if(ch==='v'){await say("There's a show on TV. Four kids are walking along... wait, it's a nature documentary about Fluffit.");return;}
  if(ch==='t'){await say("A research table. Neat rows of Poké Balls sit under warm lamps.");return;}
  if(ch==='n'){await say("A cozy bench. Trainers have carved their team names into it.");return;}
}
async function npcInteract(n){
  // face the player
  const od=n.dir;n.dir=G.dir==='up'?'down':G.dir==='down'?'up':G.dir==='left'?'right':'left';
  const fn=n.fn;
  if(!fn){await say(n.dlg.length?n.dlg:["..."]);n.dir=od;return;}
  const handlers={mom,prof,rivalLab,rival2,rival3,nurse,shop:shopFn,trainer:trainerFn,leader:leaderFn,
    elite:eliteFn,champion:championFn,admin:adminFn,umbra:umbraFn};
  if(handlers[fn])await handlers[fn](n);
  n.dir=od;
}
async function runSpecial(sp){
  if(sp==='moonshrine'){
    if(flags().luneth){await say("The Moon Shrine sleeps peacefully.");return;}
    if(!flags().umbra){await say(["A crescent is carved into the stone.","It is utterly still... as if waiting for a shadow to pass."]);return;}
    await say(["The crescent blazes silver!","LUNETH, the Moonfall Dragon, descends!"]);
    const mon=makeMon(150,50);
    const res=await startBattle({kind:'wild',mon,legend:'luneth'});
    if(res==='caught'){flags().luneth=true;}
    else await say("Luneth soars away... but the shrine still glimmers. It may return.");
    return;
  }
  if(sp==='sunshrine'){
    if(flags().solivern){await say("The Sun Shrine radiates gentle warmth.");return;}
    if(!flags().champion){await say(["A sun is carved into the stone.","It waits for a true Champion's touch."]);return;}
    await say(["The sun-mark erupts in golden light!","SOLIVERN, the Sunrise Lion, appears!"]);
    const mon=makeMon(149,55);
    const res=await startBattle({kind:'wild',mon,legend:'solivern'});
    if(res==='caught'){flags().solivern=true;}
    else await say("Solivern bounds into the light... the shrine still glows warm.");
    return;
  }
}

// ---------- NPC handlers ----------
async function mom(n){
  if(!flags().starter){
    await say(["Mom: Good morning, sweetheart!","Professor Sequoia stopped by — she wants to see you at the lab!","It's the teal-roofed building south of the path. Exciting!!"]);
    return;
  }
  await say(["Mom: Welcome home, "+G.player.name+"!","Let me look at your team... oh, they're wonderful.","Rest up a moment."]);
  healParty();G.lastHeal={map:'home',x:6,y:6};
  await say("Mom: There! Everyone's fighting fit. Dad would be so proud of you.");
  if(!flags().momItem){flags().momItem=true;addItem('potion',3);
    await say("Mom: Take these Potions too. A mother worries!\n(Received 3 Potions!)");}
}
async function prof(n){
  if(!flags().starter){
    await say(["Sequoia: "+G.player.name+"! Welcome to my lab!","I study the bonds between people and Pokémon — and I need field researchers.","On that table are three rare Pokémon I raised myself.","Go on — choose your partner!"]);
    await chooseStarter();
    return;
  }
  if(flags().champion){await say(["Sequoia: My finest field researcher — and our Champion!","The Claude region will tell your story for generations."]);return;}
  const seen=Object.keys(G.dex.seen).length,caught=Object.keys(G.dex.caught).length;
  await say(["Sequoia: How goes the research?","Pokédex: "+seen+" seen, "+caught+" caught.","Every entry helps. Keep at it!"]);
}
async function chooseStarter(){
  const opts=[{label:'Sproutle',icon:1,sub:'Grass — calm & clever'},
    {label:'Embercub',icon:4,sub:'Fire — bold & warm'},
    {label:'Aquafin',icon:7,sub:'Water — playful & loyal'},
    {label:'(Let me think...)'}];
  const c=await menu(opts,{left:8,top:8,w:200,cancel:true});
  if(c<0||c===3){await say("Sequoia: Take your time! A partner is for life.");return;}
  const id=[1,4,7][c];
  const ok=await askYesNo("Choose "+DEX[id].n+", the "+TYPE_NAMES[DEX[id].t[0]]+" type?");
  if(!ok){await chooseStarter();return;}
  const mon=makeMon(id,5);
  G.party.push(mon);markDex(id,true);

// ---------- render ----------
function render(){
  G.tick++;
  const m=curMap();if(!m||G.state==='title'||G.state==='boot'){requestAnimationFrame(render);return;}
  const camX=clamp(G.x*T+G.mx-VIEW_W*T/2+T/2,0,Math.max(0,m.w*T-VIEW_W*T));
  const camY=clamp(G.y*T+G.my-VIEW_H*T/2+T/2,0,Math.max(0,m.h*T-VIEW_H*T));
  ctx.fillStyle='#1a1c2c';ctx.fillRect(0,0,480,320);
  const x0=Math.floor(camX/T),y0=Math.floor(camY/T);
  for(let ty=y0;ty<=y0+VIEW_H;ty++)for(let tx=x0;tx<=x0+VIEW_W;tx++){
    const ch=tileAt(m,tx,ty);
    drawTileC(ctx,ch,tx*T-camX,ty*T-camY,tx,ty,G.tick,m.outdoor?null:(m.indoor||'house'));
  }
  // sprites sorted by y
  const sprites=[];
  for(const n of m.npcs){if(npcVisible(n))sprites.push({y:n.y,draw:()=>{
    const px=n.x*T-camX,py=n.y*T-camY;
    drawPerson(ctx,px,py,n.seed||1,n.dir||'down',0,PALS[n.pal]);
    if(n.fn==='trainer'&&!G.player.defeated[n.tid]){
      const bob=Math.sin(G.tick/9)*2.5;
      ctx.fillStyle='#141423';ctx.fillRect(px+11,py-13+bob,10,12);
      ctx.fillStyle='#ffd76a';ctx.font='bold 11px monospace';ctx.textAlign='center';
      ctx.fillText('!',px+16,py-3+bob);ctx.textAlign='left';}
  }});}
  sprites.push({y:G.y,draw:()=>{
    const ppx=G.x*T+G.mx-camX,ppy=G.y*T+G.my-camY;
    drawPerson(ctx,ppx,ppy,0,G.dir,G.walking?Math.floor(G.frame/4):0,PAL_PLAYER);
    // standing in tall grass: blades overlap the player's feet
    if(tileAt(m,G.x,G.y)==='*'){
      ctx.fillStyle='#2f6d28';
      for(let i=0;i<5;i++){const gx=ppx+4+i*6,sw=Math.sin(G.tick/10+i)>0?1:0;
        ctx.fillRect(gx+sw,ppy+22,3,10);ctx.fillRect(gx-1+sw,ppy+26,5,3);}
    }
  }});
  sprites.sort((a,b)=>a.y-b.y);
  for(const s of sprites)s.draw();
  // map banner
  if(G.bannerT>0){G.bannerT--;
    ctx.fillStyle='rgba(26,28,44,.85)';ctx.fillRect(150,10,180,26);
    ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.textAlign='center';
    ctx.fillText(G.mapBanner,240,27);ctx.textAlign='left';}
  // fade
  if(G.fadeDir===1)G.fade=Math.min(1,G.fade+0.09);
  if(G.fadeDir===-1){G.fade=Math.max(0,G.fade-0.09);if(G.fade===0)G.fadeDir=0;}
  if(G.fade>0){ctx.fillStyle=`rgba(0,0,0,${G.fade})`;ctx.fillRect(0,0,480,320);}
  // movement polling
  if(G.state==='play'&&!G.dlgActive&&!G.menus.length&&!G.walking&&!stepLock&&!G.ilock){
    for(const d of['up','down','left','right'])if(held.has(d)){tryStep(d);break;}
  }
  requestAnimationFrame(render);
}

// BATTLE SYSTEM
// ============================================================
const B={active:false};

function stageMult(s){return s>=0?(2+s)/2:2/(2-s);}
function effAtk(mon,phys,stages){const base=phys?mon.atk:mon.spa;let v=base*stageMult(stages[phys?'atk':'spa']);
  if(mon.st==='BRN'&&phys)v*=0.5;return v;}
function effDef(mon,phys,stages){const base=phys?mon.def:mon.spd;return base*stageMult(stages[phys?'def':'spd']);}
function effSpe(mon,stages){let v=mon.spe*stageMult(stages.spe);if(mon.st==='PAR')v*=0.25;return v;}

function freshStages(){return{atk:0,def:0,spa:0,spd:0,spe:0};}

async function startBattle(cfg){
  if(B.active)return;
  B.active=true;
  const wasState=G.state;G.state='battle';
  const el=$('battle');el.classList.remove('hidden');el.innerHTML='';
  // scene
  const scene=document.createElement('canvas');scene.width=480;scene.height=320;scene.id='bscene';
  el.appendChild(scene);B.sc=scene.getContext('2d');
  const pf=document.createElement('div');pf.className='bpanel';pf.id='efoe';el.appendChild(pf);
  const pp=document.createElement('div');pp.className='bpanel';pp.id='eply';el.appendChild(pp);
  B.foePanel=pf;B.plyPanel=pp;
  B.kind=cfg.kind;B.cfg=cfg;
  B.trainerParty=cfg.kind==='trainer'?cfg.party.map(([id,lvl])=>makeMon(id,lvl)):null;
  B.foeIdx=0;
  B.foe=cfg.kind==='trainer'?B.trainerParty[0]:cfg.mon;
  B.plyIdx=G.party.findIndex(p=>p.hp>0);
  B.ply=G.party[B.plyIdx];
  B.fStages=freshStages();B.pStages=freshStages();
  B.fSlp=0;B.pSlp=0;B.runTries=0;B.caught=false;B.result=null;
  B.anim={pShake:0,fShake:0,pFlash:0,fFlash:0};
  B.foeOx=0;B.foeScale=1;B.plyScale=1;B.trainerX=null;B.flash=0;
  B.cBall=null;B.stars=0;B.foeShow=false;B.plyShow=false;
  B.showFoePanel=false;B.showPlyPanel=false;
  markDex(B.foe.id,false);
  drawBattle();
  B.drawIv=setInterval(drawBattle,33);
  if(cfg.kind==='trainer'){
    // trainer strides in, talks, then throws their first ball
    B.trainerX=280;
    await tween(v=>B.trainerX=v,280,0,450);
    await say(cfg.name+" wants to battle!");
    await tween(v=>B.trainerX=v,0,300,320);
    B.trainerX=null;
    await sendFoe();
  }else{
    // wild: danger flashes, then it lunges in from the right
    B.flash=0.9;await sleep(90);B.flash=0;await sleep(70);
    B.flash=0.7;await sleep(80);B.flash=0;
    B.foeShow=true;B.foeOx=280;
    await tween(v=>B.foeOx=v,280,0,480);
    B.showFoePanel=true;
    await say("A wild "+DEX[B.foe.id].n+(B.foe.shiny?" ✨":"")+" appeared!"+(cfg.legend?" It radiates ancient power!":""));
  }
  await sendPly();
  await battleLoop();
  // teardown
  clearInterval(B.drawIv);
  el.classList.add('hidden');el.innerHTML='';
  B.active=false;G.state=wasState==='battle'?'play':wasState;
  updateHud();
  if(B.result==='blackout')await blackout();
  else if(B.result==='win'&&cfg.kind==='trainer'){
    G.player.money+=cfg.money||0;
    await say([cfg.name+" was defeated!","You got ₽"+(cfg.money||0)+" for winning!"]);
    if(cfg.win)await say(cfg.win);
    updateHud();
  }
  return B.result;
}

function tween(set,from,to,ms){
  return new Promise(res=>{
    const t0=performance.now();
    (function f(t){const k=clamp((t-t0)/ms,0,1);set(from+(to-from)*k);
      if(k<1)requestAnimationFrame(f);else res();})(t0);
  });
}
// trainer's ball flies in from the right, foe pops out

  B.foeShow=false;B.foeScale=0;B.showFoePanel=false;
  B.cBall={x:470,y:150,rot:0,tier:'pokeball'};

function hpBarHtml(mon,stages,isPly){
  const pct=Math.max(0,mon.hp/mon.maxhp*100);
  const col=pct>50?'#38b764':pct>20?'#e8b743':'#b13e53';
  let st=mon.st?`<span class="stag" style="background:${STATUS_COLORS[mon.st]}">${mon.st}</span>`:'';
  let hp=isPly?`<div style="text-align:right;font-size:10px">${mon.hp} / ${mon.maxhp}</div>`:'';
  let exp='';
  if(isPly){const need=expNext(mon.lvl);exp=`<div class="expout"><div class="expin" style="width:${clamp(mon.exp/need*100,0,100)}%"></div></div>`;}
  return `<div>${DEX[mon.id].n}${mon.shiny?' ✨':''}${st}<span style="float:right">Lv${mon.lvl}</span></div>
  <div class="hpout"><div class="hpin" style="width:${pct}%;background:${col}"></div></div>${hp}${exp}`;
}
function drawBattle(){
  if(!B.active)return;
  const c=B.sc;if(!c)return;
  // backdrop varies: wild = meadow, trainer = arena, leader/elite = grand hall
  const grad=c.createLinearGradient(0,0,0,320);
  if(B.cfg&&B.cfg.leader){grad.addColorStop(0,'#e8d5a0');grad.addColorStop(.55,'#f0e4c0');grad.addColorStop(1,'#c9a418');}
  else if(B.kind==='trainer'){grad.addColorStop(0,'#a7c4f0');grad.addColorStop(.55,'#d8e4c8');grad.addColorStop(1,'#b0a878');}
  else{grad.addColorStop(0,'#a7d8f0');grad.addColorStop(.55,'#cfefb8');grad.addColorStop(1,'#8fce74');}
  c.fillStyle=grad;c.fillRect(0,0,480,320);
  c.fillStyle='rgba(255,255,255,.5)';
  c.beginPath();c.ellipse(340,155,95,26,0,0,7);c.fill();
  c.beginPath();c.ellipse(130,270,105,30,0,0,7);c.fill();
  const a=B.anim;
  // foe (anchored to bottom-center of its platform)
  if(B.foe&&B.foeShow&&B.foeScale>0.01&&B.foe.hp>0&&!B.caught){
    const ox=(a.fShake?ri(-4,4):0)+(B.foeOx||0);
    const s=128*B.foeScale;
    if(!(a.fFlash&&G.tick%4<2))drawMon(c,B.foe.id,339-s/2+ox,168-s,s,{shiny:B.foe.shiny});
  }
  // trainer sprite (battle intro)
  if(B.trainerX!==null&&B.trainerX!==undefined&&B.cfg){
    c.save();c.translate(300+B.trainerX,48);c.scale(3.4,3.4);
    drawPerson(c,0,0,B.cfg.seed||5,'down',0,PALS[B.cfg.pal]);
    c.restore();
  }
  // player mon
  if(B.ply&&B.plyShow&&B.plyScale>0.01&&B.ply.hp>0){
    const ox=a.pShake?ri(-4,4):0;
    const s=144*B.plyScale;
    if(!(a.pFlash&&G.tick%4<2))drawMon(c,B.ply.id,132-s/2+ox,284-s,s,{back:true,shiny:B.ply.shiny});
  }
  // flying / wobbling ball
  if(B.cBall){drawBall(c,B.cBall.x,B.cBall.y,11,B.cBall.rot,B.cBall.tier);}
  // catch stars
  if(B.stars&&B.cBall){
    c.fillStyle='#ffd76a';c.font='bold 16px monospace';c.textAlign='center';
    const t=G.tick/6;
    c.fillText('★',B.cBall.x-22,B.cBall.y-14-Math.sin(t)*4);
    c.fillText('★',B.cBall.x,B.cBall.y-24-Math.sin(t+1)*4);
    c.fillText('★',B.cBall.x+22,B.cBall.y-14-Math.sin(t+2)*4);
    c.textAlign='left';
  }
  // screen flash
  if(B.flash>0){c.fillStyle=`rgba(255,255,255,${B.flash})`;c.fillRect(0,0,480,320);}
  if(a.fShake>0)a.fShake--;if(a.pShake>0)a.pShake--;
  if(a.fFlash>0)a.fFlash--;if(a.pFlash>0)a.pFlash--;
  B.foePanel.style.visibility=B.showFoePanel?'visible':'hidden';
  B.plyPanel.style.visibility=B.showPlyPanel?'visible':'hidden';
  B.foePanel.innerHTML=hpBarHtml(B.foe,B.fStages,false);
  B.plyPanel.innerHTML=hpBarHtml(B.ply,B.pStages,true);
}

async function battleLoop(){
  for(;;){
    const act=await playerAction();
    if(act.type==='run'){
      const fSpe=effSpe(B.foe,B.fStages),pSpe=effSpe(B.ply,B.pStages);
      B.runTries++;
      const odds=pSpe>=fSpe?1:(pSpe*32/fSpe+30*B.runTries)/256;
      if(rnd()<odds){await say("Got away safely!");B.result='run';return;}
      await say("Can't escape!");
      if(await foeTurn())return;continue;
    }
    if(act.type==='ball'){
      if(await throwBall(act.item))return;
      if(await foeTurn())return;continue;
    }
    if(act.type==='item'){
      if(await foeTurn())return;continue;
    }
    if(act.type==='switch'){
      await say("Come back, "+DEX[B.ply.id].n+"!");
      await tween(v=>B.plyScale=v,1,0,200);
      B.plyIdx=act.idx;B.ply=G.party[act.idx];B.pStages=freshStages();
      await say("Go, "+DEX[B.ply.id].n+"!");
      await tween(v=>B.plyScale=v,0,1,240);
      if(await foeTurn())return;continue;
    }
    if(act.type==='move'){
      const mv=B.ply.moves[act.idx];
      const pFirst=effSpe(B.ply,B.pStages)>=effSpe(B.foe,B.fStages);
      const fmv=aiPickMove();
      const first=(MOVES[mv.m].fx.prio||0)>(MOVES[fmv?fmv.m:'tackle'].fx.prio||0)?true:
                  (MOVES[fmv?fmv.m:'tackle'].fx.prio||0)>(MOVES[mv.m].fx.prio||0)?false:pFirst;
      if(first){
        if(await doMove(true,mv))return;
        if(B.foe.hp>0){if(await execFoeMove(fmv))return;}
      }else{
        if(await execFoeMove(fmv))return;
        if(B.ply.hp>0){if(await doMove(true,mv))return;}
      }
      // end of turn poison/burn
      if(await endTurnStatus())return;
    }
  }
}

async function battleBag(){
  const ids=Object.keys(G.bag).filter(k=>G.bag[k]>0);
  if(!ids.length){await say("The bag is empty!");return null;}
  ids.sort((a,b)=>BAG_ORDER.indexOf(a)-BAG_ORDER.indexOf(b));
  const items=ids.map(k=>({label:ITEMS[k].n+' ×'+G.bag[k],sub:ITEMS[k].d,iconItem:k}));
  const c=await menu(items,{right:6,bottom:84,w:200});
  if(c<0)return null;
  const id=ids[c],it=ITEMS[id];
  if(it.ball){
    if(B.kind==='trainer'){await say("You can't catch a trainer's Pokémon!");return null;}
    G.bag[id]--;return{type:'ball',item:id};
  }
  const used=await useItemOn(id,true);
  return used?{type:'item'}:null;
}
async function useItemOn(id,inBattle){

  const idx=await choosePartyMon("Use "+it.n+" on which Pokémon?",true);

    if(!mon.st){await say("It has no status problem!");return false;}

  }

    mon.hp=Math.floor(mon.maxhp*it.revive);mon.st=null;G.bag[id]--;
    await say(DEX[mon.id].n+" came back to its senses!");return true;

async function throwBall(itemId){
  const it=ITEMS[itemId];
  await say(G.player.name+" threw a "+it.n+"!");
  const d=DEX[B.foe.id];
  // arc toward the foe
  B.cBall={x:60,y:295,rot:0,tier:itemId};
  await tween(k=>{B.cBall.x=60+(339-60)*k;B.cBall.y=295+(92-295)*k-Math.sin(Math.PI*k)*85;B.cBall.rot=k*12;},0,1,520);
  // absorb: foe dissolves into the ball with a flash
  B.flash=0.55;
  await tween(v=>B.foeScale=v,1,0,260);
  B.flash=0;B.foeShow=false;
  // ball drops to the ground
  await tween(k=>{B.cBall.y=92+k*62;B.cBall.rot=0;},0,1,180);
  const stBonus=B.foe.st==='SLP'||B.foe.st==='FRZ'?2:B.foe.st?1.5:1;
  const a=(3*B.foe.maxhp-2*B.foe.hp)*d.cr*it.ball*stBonus/(3*B.foe.maxhp);
  const shakes=a>=255?4:Math.floor(4*Math.pow(a/255,0.4));
  const success=shakes>=4||rnd()*255<a;
  // wobble... wobble... wobble...
  for(let i=0;i<(success?3:Math.min(shakes,3));i++){
    await sleep(300);
    await tween(v=>B.cBall.rot=v,0,-0.38,110);
    await tween(v=>B.cBall.rot=v,-0.38,0.38,150);
    await tween(v=>B.cBall.rot=v,0.38,0,110);
  }
  if(success){
    await sleep(260);
    B.stars=1;B.caught=true;
    await say("Gotcha! "+d.n+" was caught!");
    B.stars=0;B.cBall=null;
    markDex(B.foe.id,true);
    if(G.party.length<6){G.party.push(B.foe);await say(d.n+" joined your party!");}
    else{G.box.push(B.foe);await say(d.n+" was sent to the PC Box!");}
    await grantExp();
    B.result='caught';return true;
  }
  // burst free
  await sleep(200);
  B.flash=0.6;B.cBall=null;B.foeShow=true;
  await tween(v=>B.foeScale=v,0,1,220);
  B.flash=0;

  return false;
}
function aiPickMove(){
  const usable=B.foe.moves.filter(m=>m.pp>0);
  if(!usable.length)return{m:'struggle',pp:1};
  // prefer effective damaging moves
  let best=null,bestScore=-1;
  for(const mv of usable){
    const M2=MOVES[mv.m];let score=rnd()*20;
    if(M2.p>0){score+=M2.p*typeMult(M2.t,DEX[B.ply.id].t)*(DEX[B.foe.id].t.includes(M2.t)?1.5:1)/2;}
    else score+=15;
    if(score>bestScore){bestScore=score;best=mv;}
  }
  return best;
}
async function execFoeMove(fmv){return await doMove(false,fmv);}
async function doMove(isPly,mv){
  const user=isPly?B.ply:B.foe, targ=isPly?B.foe:B.ply;
  const uStages=isPly?B.pStages:B.fStages, tStages=isPly?B.fStages:B.pStages;
  const uName=(isPly?'':'Wild ')+DEX[user.id].n;
  // pre-move status
  if(user.st==='SLP'){
    const key=isPly?'pSlp':'fSlp';
    if(B[key]>0){B[key]--;await say(uName+" is fast asleep!");return false;}
    user.st=null;await say(uName+" woke up!");
  }
  if(user.st==='FRZ'){
    if(rnd()<0.2){user.st=null;await say(uName+" thawed out!");}
    else{await say(uName+" is frozen solid!");return false;}
  }
  if(user.st==='PAR'&&rnd()<0.25){await say(uName+" is paralyzed! It can't move!");return false;}
  if(mv&&mv.idx===-1)mv=null;
  let mdef;
  if(!mv||(isPly&&B.ply.moves.every(m=>m.pp<=0)&&mv.m===undefined)){mdef=MOVES.struggle;}
  else{mdef=MOVES[mv.m];if(mv.pp!==undefined&&mv.pp<999)mv.pp=Math.max(0,mv.pp-1);}
  if(!mdef)mdef=MOVES.struggle;
  await say(uName+" used "+mdef.n+"!");
  if(mdef.acc<100&&rnd()*100>mdef.acc){await say("The attack missed!");return false;}
  const fx=mdef.fx||{};
  if(mdef.p>0){
    const phys=PHYS.has(mdef.t);
    const atk=effAtk(user,phys,uStages),def=Math.max(1,effDef(targ,phys,tStages));
    const stab=DEX[user.id].t.includes(mdef.t)?1.5:1;
    const tm=typeMult(mdef.t,DEX[targ.id].t);
    if(tm===0){await say("It doesn't affect "+DEX[targ.id].n+"...");return false;}
    const crit=rnd()<(fx.crit?0.125:0.0625)?1.75:1;
    let dmg=Math.floor(((2*user.lvl/5+2)*mdef.p*atk/def)/50+2);
    dmg=Math.max(1,Math.floor(dmg*stab*tm*crit*(0.85+rnd()*0.15)));
    targ.hp=Math.max(0,targ.hp-dmg);
    if(isPly)B.anim.fShake=6;else B.anim.pShake=6;
    drawBattle();
    if(crit>1)await say("A critical hit!");
    if(tm>1)await say("It's super effective!");
    if(tm<1)await say("It's not very effective...");
    if(fx.drain){const h=Math.max(1,Math.floor(dmg*fx.drain));user.hp=Math.min(user.maxhp,user.hp+h);
      await say(uName+" drained energy!");}
    if(fx.recoil){user.hp=Math.max(0,user.hp-Math.floor(dmg*fx.recoil));await say(uName+" is hit with recoil!");}
    if(targ.hp<=0)return await handleFaint(!isPly);
    // secondary status
    if(!targ.st){
      for(const s of['brn','psn','par','frz'])
        if(fx[s]&&rnd()*100<fx[s]){targ.st=s.toUpperCase();
          if(targ.st==='BRN')await say(DEX[targ.id].n+" was burned!");
          if(targ.st==='PSN')await say(DEX[targ.id].n+" was poisoned!");
          if(targ.st==='PAR')await say(DEX[targ.id].n+" is paralyzed!");
          if(targ.st==='FRZ')await say(DEX[targ.id].n+" was frozen solid!");break;}
      if(fx.slp&&rnd()*100<fx.slp){targ.st='SLP';B[isPly?'fSlp':'pSlp']=ri(1,3);
        await say(DEX[targ.id].n+" fell asleep!");}
    }
    if(fx.stat&&rnd()*100<fx.stat[3]){
      const[who,stat,delta]=fx.stat;
      const st2=who==='self'?uStages:tStages;
      st2[stat]=clamp(st2[stat]+delta,-6,6);
      await say((who==='self'?uName:DEX[targ.id].n)+"'s "+stat.toUpperCase()+(delta>0?" rose!":" fell!"));
    }
    if(user.hp<=0)return await handleFaint(isPly);
    return false;
  }
  // pure status move
  if(fx.heal){user.hp=Math.min(user.maxhp,user.hp+Math.floor(user.maxhp*fx.heal));
    await say(uName+" recovered health!");return false;}
  if(fx.stat){
    const[who,stat,delta,ch]=fx.stat;
    const st2=who==='self'?uStages:tStages;
    st2[stat]=clamp(st2[stat]+delta,-6,6);
    await say((who==='self'?uName:DEX[targ.id].n)+"'s "+stat.toUpperCase()+(delta>0?" rose!":" fell!"));
    return false;
  }
  if(targ.st){await say("But it failed!");return false;}
  for(const s of['brn','psn','par'])
    if(fx[s]){targ.st=s.toUpperCase();
      await say(DEX[targ.id].n+(s==='brn'?" was burned!":s==='psn'?" was poisoned!":" is paralyzed!"));return false;}
  if(fx.slp){targ.st='SLP';B[isPly?'fSlp':'pSlp']=ri(1,3);await say(DEX[targ.id].n+" fell asleep!");return false;}
  await say("But it failed!");return false;
}
async function foeTurn(){

async function endTurnStatus(){
  for(const[mon,isPly]of[[B.ply,true],[B.foe,false]]){
    if(mon.hp<=0)continue;
    if(mon.st==='PSN'||mon.st==='BRN'){
      mon.hp=Math.max(0,mon.hp-Math.max(1,Math.floor(mon.maxhp/8)));
      drawBattle();
      await say(DEX[mon.id].n+(mon.st==='PSN'?" is hurt by poison!":" is hurt by its burn!"));
      if(mon.hp<=0){if(await handleFaint(isPly))return true;}
    }
  }
  return false;
}
// returns true if battle over
async function handleFaint(plyFainted){
  if(plyFainted){
    await say(DEX[B.ply.id].n+" fainted!");
    const alive=G.party.findIndex(p=>p.hp>0);
    if(alive<0){
      if(B.kind==='trainer'&&B.cfg.lose){await say(B.cfg.lose);}
      B.result='blackout';return true;
    }
    let idx=-1;
    while(idx<0||G.party[idx].hp<=0){
      idx=await choosePartyMon("Send out which Pokémon?",false);
      if(idx>=0&&G.party[idx].hp<=0){await say("It has no energy left!");idx=-1;}
    }
    B.plyIdx=idx;B.ply=G.party[idx];B.pStages=freshStages();
    await say("Go! "+DEX[B.ply.id].n+"!");
    B.plyScale=0;await tween(v=>B.plyScale=v,0,1,240);
    return false;
  }
  // foe fainted
  await say((B.kind==='trainer'?'':'Wild ')+DEX[B.foe.id].n+" fainted!");
  await grantExp();
  if(B.kind==='trainer'){
    B.foeIdx++;
    if(B.foeIdx<B.trainerParty.length){
      B.foe=B.trainerParty[B.foeIdx];B.fStages=freshStages();
      markDex(B.foe.id,false);
      await say(B.cfg.name+" sent out "+DEX[B.foe.id].n+"!");
      await sendFoe();
      return false;
    }
    B.result='win';return true;
  }
  B.result='win';return true;
}
async function grantExp(){
  const exp=Math.floor(expYield(B.foe)*(B.kind==='trainer'?1.5:1));
  const mon=B.ply;
  if(mon.hp<=0||mon.lvl>=100)return;
  await say(DEX[mon.id].n+" gained "+exp+" EXP!");
  mon.exp+=exp;
  while(mon.exp>=expNext(mon.lvl)&&mon.lvl<100){
    mon.exp-=expNext(mon.lvl);
    await gainLevel(mon);
  }
}
async function gainLevel(mon){
  mon.lvl++;
  const oldMax=mon.maxhp;calcStats(mon);
  mon.hp=Math.min(mon.maxhp,mon.hp+(mon.maxhp-oldMax));
  await say(DEX[mon.id].n+" grew to Lv"+mon.lvl+"!");
  if(B.active)drawBattle();
  // learn moves
  for(const[l,mid]of learnset(mon.id)){
    if(l===mon.lvl&&!mon.moves.some(mv=>mv.m===mid)){
      if(mon.moves.length<4){mon.moves.push({m:mid,pp:MOVES[mid].pp});
        await say(DEX[mon.id].n+" learned "+MOVES[mid].n+"!");}
      else{
        const ok=await askYesNo(DEX[mon.id].n+" wants to learn "+MOVES[mid].n+"!\nForget an old move to make room?");
        if(ok){
          const items=mon.moves.map(mv=>({label:MOVES[mv.m].n,sub:TYPE_NAMES[MOVES[mv.m].t]+' pow '+MOVES[mv.m].p}));
          const c=await menu(items,{right:6,bottom:84,w:180});
          if(c>=0){await say("1, 2 and... poof! "+MOVES[mon.moves[c].m].n+" was forgotten.");
            mon.moves[c]={m:mid,pp:MOVES[mid].pp};
            await say(DEX[mon.id].n+" learned "+MOVES[mid].n+"!");}
          else await say(DEX[mon.id].n+" did not learn "+MOVES[mid].n+".");
        } else await say(DEX[mon.id].n+" did not learn "+MOVES[mid].n+".");
      }
    }
  }
  // evolution
  const d=DEX[mon.id];
  if(d.ev&&mon.lvl>=d.el&&!B.active){await evolve(mon);}
  else if(d.ev&&mon.lvl>=d.el){mon.pendingEvo=true;}
}
async function evolve(mon){
  const d=DEX[mon.id],to=DEX[d.ev];
  const ok=await askYesNo("What? "+d.n+" is evolving!\n(Press YES to let it evolve, NO to stop it.)");
  if(!ok){await say(d.n+" stopped evolving. (It will try again next level.)");mon.pendingEvo=false;return;}
  await say("Congratulations! Your "+d.n+" evolved into "+to.n+"!");
  mon.id=d.ev;mon.pendingEvo=false;
  const hpPct=mon.hp/mon.maxhp;calcStats(mon);mon.hp=Math.max(1,Math.floor(mon.maxhp*hpPct));
  markDex(mon.id,true);
  // learn moves of new form at this level? keep current moves
}

  for(const mon of G.party){

    if((mon.pendingEvo||(d.ev&&mon.lvl>=d.el))&&d.ev){await evolve(mon);}

  return new Promise(res=>{
    const div=document.createElement('div');div.className='win';
    div.style.cssText='left:40px;top:26px;width:400px;height:250px;z-index:80;overflow:hidden;'+
      'background:linear-gradient(135deg,#ffd76a 0%,#f4e4c2 30%,#f8f8f0 100%)';
    const caught=Object.keys(G.dex.caught).length,seen=Object.keys(G.dex.seen).length;
    div.innerHTML=
      '<div style="background:#30346d;color:#fff;padding:5px 12px;font-size:12px;letter-spacing:1px">TRAINER CARD'+
      (flags().champion?'  <span style="color:#ffd76a">★ CHAMPION</span>':'')+'</div>'+
      '<div style="display:flex;gap:12px;padding:10px 14px">'+
      '<canvas id="tcplayer" width="64" height="64" style="background:#c8e4f0;border:2px solid #30346d;border-radius:6px"></canvas>'+
      '<div style="font-size:12px;line-height:1.8">'+
      '<div style="font-size:15px;font-weight:900">'+G.player.name+'</div>'+
      '<div>Money <b>₽'+G.player.money+'</b></div>'+
      '<div>Pokédex <b>'+caught+'</b> caught · <b>'+seen+'</b> seen</div>'+
      '<div>Play time <b>'+Math.floor(G.playMin/60)+'h '+(G.playMin%60)+'m</b></div>'+
      '</div></div>'+
      '<div style="padding:2px 14px;font-size:10px;color:#566c86">BADGES</div>'+
      '<canvas id="tcbadges" width="372" height="58" style="margin:0 14px"></canvas>'+
      '<div style="text-align:center;font-size:9px;color:#566c86;margin-top:4px">press A / B to close</div>';
    $('uiroot').appendChild(div);
    const pc=div.querySelector('#tcplayer').getContext('2d');
    pc.save();pc.translate(16,14);pc.scale(1.1,1.1);drawPerson(pc,0,0,0,'down',0,PAL_PLAYER);pc.restore();
    const bc=div.querySelector('#tcbadges').getContext('2d');
    for(let i=0;i<8;i++){
      drawBadgeIcon(bc,i,8+i*46,2,34,!!G.player.badges[i]);
      bc.fillStyle=G.player.badges[i]?'#30346d':'#94a3b8';
      bc.font='bold 8px monospace';bc.textAlign='center';
      bc.fillText(BADGE_NAMES[i],25+i*46,50);bc.textAlign='left';
    }
    const h=e=>{const act=KEYMAP[e.key];
      if(act==='a'||act==='b'){e.stopPropagation();cleanup();}};
    const cleanup=()=>{document.removeEventListener('keydown',h,true);div.remove();res();};
    document.addEventListener('keydown',h,true);
    div.addEventListener('click',cleanup);
  });
}
// ---------- party ----------
async function partyScreen(){
  for(;;){
    if(!G.party.length){await say("You have no Pokémon yet!");return;}
    const idx=await choosePartyMon("Your party",true);
    if(idx<0)return;
    const mon=G.party[idx];
    const c=await menu([{label:'SUMMARY'},{label:'MOVES'},{label:'REORDER'},{label:'BACK'}],{right:6,top:60,w:110});
    if(c===0){
      const d=DEX[mon.id];
      await say([
        d.n+(mon.shiny?' ✨':'')+"  Lv"+mon.lvl+"  "+d.t.map(t=>TYPE_NAMES[t]).join('/'),
        "HP "+mon.hp+"/"+mon.maxhp+"  ATK "+mon.atk+"  DEF "+mon.def+"\nSpA "+mon.spa+"  SpD "+mon.spd+"  SPE "+mon.spe+(mon.st?"\nStatus: "+mon.st:''),
        "EXP to next: "+(expNext(mon.lvl)-mon.exp),
        "DEX: "+d.dx]);
    }
    if(c===1){
      await say(mon.moves.map(mv=>{const M2=MOVES[mv.m];
        return M2.n+"  ("+TYPE_NAMES[M2.t]+")\nPower "+(M2.p||'—')+"  Acc "+M2.acc+"  PP "+mv.pp+"/"+M2.pp;}));
    }
    if(c===2){
      if(G.party.length<2){await say("Only one Pokémon in the party!");continue;}
      const j=await choosePartyMon("Swap with which Pokémon?",true);
      if(j>=0&&j!==idx){const t=G.party[idx];G.party[idx]=G.party[j];G.party[j]=t;
        await say("Party order changed!");}
    }
  }
}
// ---------- bag ----------
async function bagScreen(){
  for(;;){
    const ids=Object.keys(G.bag).filter(k=>G.bag[k]>0);
    if(!ids.length){await say("The bag is empty!");return;}
    ids.sort((a,b)=>BAG_ORDER.indexOf(a)-BAG_ORDER.indexOf(b));
    const items=ids.map(k=>({label:ITEMS[k].n+' ×'+G.bag[k],sub:ITEMS[k].d,iconItem:k,dim:!!ITEMS[k].ball}));
    const c=await menu(items,{right:6,top:6,w:220,note:'BAG  ·  ₽'+G.player.money+'  —  B to close'});
    if(c<0)return;
    const id=ids[c];
    if(ITEMS[id].ball){await say("Better save that for a wild Pokémon battle!");continue;}
    await useItemOn(id,false);
  }
}
// ---------- pokédex ----------
async function dexScreen(god){
  const items=[];
  for(let i=1;i<=150;i++){
    const seen=god||G.dex.seen[i],caught=G.dex.caught[i];
    items.push({label:String(i).padStart(3,'0')+' '+(seen?DEX[i].n:'?????'),
      icon:seen?i:undefined,
      sub:god?DEX[i].t.map(t=>TYPE_NAMES[t]).join('/')+(caught?' · ● caught':''):(caught?'● caught':(seen?'◌ seen':'')),
      dim:!seen});
  }
  const seenN=Object.keys(G.dex.seen).length,caughtN=Object.keys(G.dex.caught).length;
  const note=god?'⚡ FULL POKéDEX — all 150 species — B to close'
    :'POKéDEX  '+seenN+' seen · '+caughtN+' caught — B to close';
  for(;;){
    const c=await menu(items,{left:8,top:6,w:god?240:220,maxH:280,note});
    if(c<0)return;
    const id=c+1;
    if(!god&&!G.dex.seen[id]){await say("No data yet. Go find it!");continue;}
    const d=DEX[id];
    const evo=d.ev?('\nEvolves into '+DEX[d.ev].n+' at Lv'+d.el+'.'):'';
    const bst=d.bs.reduce((a,b)=>a+b,0);
    await say([String(id).padStart(3,'0')+' '+d.n+'  —  '+d.t.map(t=>TYPE_NAMES[t]).join('/')+
      (god?'\nHP '+d.bs[0]+' ATK '+d.bs[1]+' DEF '+d.bs[2]+' SpA '+d.bs[3]+' SpD '+d.bs[4]+' SPE '+d.bs[5]+' (BST '+bst+')'+evo:''),
      d.dx]);
  }
}
// ---------- PC box ----------
async function openPC(){
  await say("Booted up the PC. \"Sequoia Storage System\" online!");
  for(;;){
    const c=await menu([{label:'WITHDRAW  ('+G.box.length+' in box)'},{label:'DEPOSIT  ('+G.party.length+' in party)'},{label:'LOG OFF'}],
      {left:8,top:8,w:210});
    if(c<0||c===2)return;
    if(c===0){
      if(!G.box.length){await say("The box is empty.");continue;}
      if(G.party.length>=6){await say("Your party is full!");continue;}
      const items=G.box.map(p=>({label:DEX[p.id].n+'  Lv'+p.lvl,icon:p.id,shiny:p.shiny,sub:'HP '+p.hp+'/'+p.maxhp}));
      const i=await menu(items,{left:8,top:8,w:210,maxH:260,note:'Withdraw which?'});
      if(i<0)continue;
      const mon=G.box.splice(i,1)[0];G.party.push(mon);
      await say(DEX[mon.id].n+" joined the party!");
    }
    if(c===1){
      if(G.party.length<=1){await say("You can't deposit your last Pokémon!");continue;}
      const i=await choosePartyMon("Deposit which?",true);
      if(i<0)continue;
      const mon=G.party.splice(i,1)[0];G.box.push(mon);
      await say(DEX[mon.id].n+" was stored in the box. Be good!");
    }
  }
}
// ---------- shop ----------
async function openShop(stock){
  await say("Clerk: Welcome! How can I help you?");
  for(;;){
    const c=await menu([{label:'BUY'},{label:'SELL'},{label:'QUIT'}],{right:6,top:6,w:100,note:'₽'+G.player.money});
    if(c<0||c===2){await say("Clerk: Come again!");return;}
    if(c===0){
      for(;;){
        const items=stock.map(k=>({label:ITEMS[k].n+'  ₽'+ITEMS[k].price,sub:ITEMS[k].d,iconItem:k,dim:G.player.money<ITEMS[k].price}));
        const i=await menu(items,{right:6,top:6,w:220,note:'₽'+G.player.money+' — B to stop buying'});
        if(i<0)break;
        const id=stock[i],it=ITEMS[id];
        if(G.player.money<it.price){await say("Clerk: Not enough money, friend.");continue;}
        let qty=1;
        const qc=await menu([{label:'×1  ₽'+it.price},{label:'×5  ₽'+it.price*5,dim:G.player.money<it.price*5},
          {label:'×10  ₽'+it.price*10,dim:G.player.money<it.price*10}],{right:6,top:110,w:140});
        if(qc<0)continue;
        qty=[1,5,10][qc];
        if(G.player.money<it.price*qty){await say("Clerk: Not enough for that many!");continue;}
        G.player.money-=it.price*qty;addItem(id,qty);updateHud();
        await say("Clerk: "+it.n+" ×"+qty+"! Anything else?");
      }
    }
    if(c===1){
      for(;;){
        const ids=Object.keys(G.bag).filter(k=>G.bag[k]>0&&ITEMS[k].price>0);
        if(!ids.length){await say("Clerk: Nothing I can buy from you today!");break;}
        const items=ids.map(k=>({label:ITEMS[k].n+' ×'+G.bag[k]+'  →  ₽'+Math.floor(ITEMS[k].price/2),sub:ITEMS[k].d,iconItem:k}));
        const i=await menu(items,{right:6,top:6,w:230,note:'Selling at half price — B to stop'});
        if(i<0)break;
        const id=ids[i];G.bag[id]--;G.player.money+=Math.floor(ITEMS[id].price/2);updateHud();
        await say("Clerk: Pleasure doing business!");
      }
    }
  }
}
// ---------- save / load ----------
const SAVE_KEY='pokemonClaudeSaveV1';
function saveGame(silent){
  const data={player:G.player,party:G.party,box:G.box,bag:G.bag,dex:G.dex,
    map:G.map,x:G.x,y:G.y,dir:G.dir,lastHeal:G.lastHeal,ret:G.ret,repel:G.repel,
    starterId:G.starterId,playMin:G.playMin,v:1};
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(data));}catch(e){console.error(e);}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;
    const d=JSON.parse(raw);
    Object.assign(G,{player:d.player,party:d.party,box:d.box,bag:d.bag,dex:d.dex,
      map:d.map,x:d.x,y:d.y,dir:d.dir,lastHeal:d.lastHeal,ret:d.ret,repel:d.repel||0,
      starterId:d.starterId,playMin:d.playMin||0});
    return true;
  }catch(e){console.error(e);return false;}
}
// ---------- title ----------
let titleSel=0,titleItems=[];
function showTitle(){
  G.state='title';
  $('title').classList.remove('hidden');$('hud').classList.add('hidden');
  titleItems=localStorage.getItem(SAVE_KEY)?['CONTINUE','NEW GAME']:['NEW GAME'];
  titleSel=0;paintTitle();
  const tc=$('tmon').getContext('2d');tc.clearRect(0,0,192,64);
  drawMon(tc,1,4,4,56);drawMon(tc,4,68,4,56);drawMon(tc,7,132,4,56);
}
function paintTitle(){
  const tm=$('tmenu');tm.innerHTML='';
  titleItems.forEach((t,i)=>{
    const d=document.createElement('div');d.textContent=(i===titleSel?'▶ ':'')+t;
    d.classList.toggle('sel',i===titleSel);
    d.addEventListener('click',()=>{titleSel=i;titlePick();});
    tm.appendChild(d);
  });
}
function titleNav(act){
  if(act==='up'){titleSel=(titleSel-1+titleItems.length)%titleItems.length;paintTitle();}
  else if(act==='down'){titleSel=(titleSel+1)%titleItems.length;paintTitle();}
  else if(act==='a')titlePick();
}
async function titlePick(){
  const choice=titleItems[titleSel];
  if(choice==='CONTINUE'){
    if(loadGame()){
      $('title').classList.add('hidden');G.state='play';
      G.mapBanner=curMap().name;G.bannerT=110;updateHud();
      await say("Welcome back, "+G.player.name+"!");
    }
    return;
  }
  if(choice==='NEW GAME'){
    if(localStorage.getItem(SAVE_KEY)){
      G.state='play';const ok=await askYesNo("Start a NEW game? The old save will be erased!");
      G.state='title';
      if(!ok)return;
      localStorage.removeItem(SAVE_KEY);
    }
    await newGame();
  }
}
async function newGame(){
  $('title').classList.add('hidden');
  const name=await nameInput();
  G.player={name:name||'Skye',money:3000,badges:[0,0,0,0,0,0,0,0],flags:{},defeated:{}};
  G.party=[];G.box=[];G.bag={pokeball:5,potion:3};G.dex={seen:{},caught:{}};
  G.repel=0;G.lastHeal={map:'home',x:6,y:6};G.ret={map:'dewbrook',x:4,y:6};
  G.map='home';G.x=6;G.y=4;G.dir='down';G.starterId=0;G.playMin=0;
  G.state='play';updateHud();
  await say([
    "SEQUOIA: Ahem! Welcome to the world of POKéMON!",
    "SEQUOIA: This region — the CLAUDE region — is home to 150 species found nowhere else on earth.",
    "SEQUOIA: Some are partners. Some are legends. All of them are waiting for someone like you, "+G.player.name+".",
    "SEQUOIA: Your very own tale of grass, gyms and glory is about to unfold!",
    "SEQUOIA: Come see me at my lab when you're ready. Let's make this a story worth telling!",
    "(Mom is downstairs — er, across the room. Talk to her, then head to the teal-roofed lab!)"]);
  G.mapBanner='Your House';G.bannerT=110;
  saveGame(true);
}
function nameInput(){
  return new Promise(res=>{
    G.state='naming';
    const div=document.createElement('div');div.className='win';
    div.style.cssText='left:90px;top:100px;width:300px;padding:14px;z-index:80';
    div.innerHTML='<div style="margin-bottom:8px">What\'s your name, trainer?</div>';
    const inp=document.createElement('input');
    inp.style.cssText='width:100%;font:bold 14px monospace;padding:6px;border:2px solid #30346d;border-radius:4px';
    inp.maxLength=10;inp.value='';inp.placeholder='Skye';
    const btn=document.createElement('button');btn.textContent='OK!';
    btn.style.cssText='margin-top:8px;font:bold 12px monospace;padding:6px 22px;background:#38b764;color:#fff;border:2px solid #30346d;border-radius:4px;cursor:pointer';
    div.appendChild(inp);div.appendChild(btn);
    $('uiroot').appendChild(div);
    setTimeout(()=>inp.focus(),50);
    const done=()=>{const v=inp.value.trim().slice(0,10);div.remove();G.state='play';res(v||'Skye');};
    btn.addEventListener('click',done);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')done();e.stopPropagation();});
  });
}
// stop game keys while typing name (capture phase runs before bubble handler)
document.addEventListener('keydown',e=>{if(G.state==='naming'&&e.target.tagName!=='INPUT'){}},true);

// ---------- credits ----------
function creditsRoll(){
  return new Promise(res=>{
    const div=document.createElement('div');div.className='screen';
    div.style.cssText+=';background:#1a1c2c;color:#f4f4f4;z-index:100';
    const inner=document.createElement('div');
    inner.style.cssText='position:absolute;left:0;right:0;top:320px;text-align:center;font-size:12px;line-height:2';
    let html='<div style="font-size:20px;color:#ffd76a;font-weight:900">POKéMON CLAUDE</div>'+
      '<div style="font-size:14px;color:#73eff7">HALL OF FAME</div><br>';
    for(const p of G.party){
      html+='<div>'+DEX[p.id].n+(p.shiny?' ✨':'')+'  Lv'+p.lvl+'</div>';
    }
    html+='<br><div>CHAMPION '+G.player.name.toUpperCase()+'</div><br><br>'+
      '<div style="color:#94b0c2">A fan-made parody adventure<br>150 original Pokémon<br>Made with ❤ (and one very large HTML file)</div>'+
      '<br><div style="color:#ffd76a">THE END</div><br><div style="font-size:10px;color:#566c86">...press A</div>';
    inner.innerHTML=html;
    div.appendChild(inner);document.getElementById('game').appendChild(div);
    let y=320;
    const iv=setInterval(()=>{y-=0.6;inner.style.top=y+'px';if(y<-360)y=-360;},16);
    const h=e=>{
      const act=KEYMAP[e.key];
      if(act==='a'||act==='b'){clearInterval(iv);div.remove();document.removeEventListener('keydown',h,true);res();}
    };
    document.addEventListener('keydown',h,true);
    div.addEventListener('click',()=>{clearInterval(iv);div.remove();document.removeEventListener('keydown',h,true);res();});
  });
}
// ---------- scaling ----------
function rescale(){
  const s=Math.min(window.innerWidth/480,window.innerHeight/320);
  $('game').style.transform='scale('+Math.max(0.5,s*0.98)+')';
}
window.addEventListener('resize',rescale);

// ---------- error guard ----------
window.onerror=function(msg,src,line){
  console.error('GAME ERROR:',msg,line);
  return false;
};

// ---------- boot ----------
buildWorld();
rescale();
setInterval(()=>{if(G.state==='play')G.playMin++;},60000);
showTitle();
requestAnimationFrame(render);
</script>
