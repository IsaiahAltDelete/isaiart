<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON | ISAIART</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500&family=Barlow+Condensed:wght@300;400;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #07070a;
      --panel:   #0c0c10;
      --rule:    rgba(255,255,255,0.08);
      --rule-hi: rgba(255,255,255,0.18);
      --white:   #f2f2f0;
      --off:     #888882;
      --dim:     #3a3a38;
      --ok:      #7dd487;
      --err:     #e06a6a;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(var(--rule) 1px, transparent 1px),
        linear-gradient(90deg, var(--rule) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: 0.14;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--dim); }
    ::-webkit-scrollbar-thumb:hover { background: var(--off); }

    .msy {
      font-family: 'Material Symbols Outlined';
      font-size: 1rem;
      line-height: 1;
      vertical-align: -2px;
    }

    /* NAV */
    nav {
      position: relative; z-index: 10;
      display: flex; align-items: stretch;
      height: 52px; flex-shrink: 0;
      border-bottom: 1px solid var(--rule-hi);
      background: rgba(7,7,10,0.88);
      backdrop-filter: blur(12px);
    }

    .nav-brand {
      display: flex; align-items: center; gap: 18px;
      padding: 0 24px;
      border-right: 1px solid var(--rule-hi);
    }

    .brand-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.05rem; font-weight: 900;
      letter-spacing: 0.28em; text-transform: uppercase;
      color: var(--white); text-decoration: none;
    }
    .brand-name:hover { color: var(--off); }

    .brand-tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.56rem; font-weight: 400;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--dim);
      border-left: 1px solid var(--rule); padding-left: 18px;
    }

    .nav-status {
      flex: 1;
      display: flex; align-items: center; justify-content: flex-end;
      gap: 20px; padding: 0 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--dim);
      overflow: hidden; white-space: nowrap;
    }

    #status-badge { color: var(--dim); transition: color 0.2s; }
    #status-badge.ok  { color: var(--ok); }
    #status-badge.err { color: var(--err); }

    /* TOOLBAR */
    .toolbar {
      position: relative; z-index: 10;
      display: flex; align-items: stretch; flex-wrap: wrap;
      border-bottom: 1px solid var(--rule);
      background: rgba(7,7,10,0.7);
      flex-shrink: 0;
    }

    .toolbar button, .toolbar .fname-wrap {
      appearance: none; border: none; background: transparent;
      color: var(--off);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.68rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 12px 18px;
      border-right: 1px solid var(--rule);
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: color 0.15s, background 0.15s;
    }

    .toolbar button:hover { color: var(--white); background: rgba(255,255,255,0.04); }

    .toolbar button.primary { color: var(--white); }
    .toolbar button.primary:hover { background: rgba(255,255,255,0.08); }

    .toolbar .spacer { flex: 1; border-right: none; }

    .fname-wrap { cursor: default; gap: 10px; }
    .fname-wrap:hover { background: transparent; }

    #fname {
      background: transparent; border: none; outline: none;
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem; font-weight: 400;
      letter-spacing: 0.08em;
      width: 9ch;
      border-bottom: 1px solid var(--rule-hi);
      padding-bottom: 1px;
      text-align: center;
    }
    .fname-ext { color: var(--dim); font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: none; }

    #btn-dice { padding: 12px 12px; }

    /* EDITOR */
    .editor-wrap {
      position: relative; z-index: 5;
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .gutter {
      flex-shrink: 0;
      padding: 16px 0;
      width: 52px;
      overflow: hidden;
      text-align: right;
      background: var(--panel);
      border-right: 1px solid var(--rule);
      color: var(--dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem; font-weight: 300;
      line-height: 1.55;
      user-select: none;
    }
    .gutter div { padding-right: 12px; }
    .gutter div.err-line { color: var(--err); }

    #editor {
      flex: 1;
      background: transparent;
      border: none; outline: none; resize: none;
      color: var(--white);
      caret-color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem; font-weight: 300;
      line-height: 1.55;
      padding: 16px 20px;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }
    #editor::placeholder { color: var(--dim); }
    #editor::selection { background: rgba(255,255,255,0.18); }

    /* FOOTER */
    footer {
      position: relative; z-index: 10;
      display: flex; align-items: center;
      height: 34px; flex-shrink: 0;
      border-top: 1px solid var(--rule);
      background: rgba(7,7,10,0.88);
      padding: 0 24px;
      gap: 24px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--dim);
      overflow: hidden; white-space: nowrap;
    }
    #err-msg { color: var(--err); overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.08em; text-transform: none; font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; }
    footer .f-spacer { flex: 1; }

    /* TOAST */
    #toast {
      position: fixed; bottom: 54px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      z-index: 100;
      background: var(--panel);
      border: 1px solid var(--rule-hi);
      color: var(--white);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 10px 22px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .brand-tag { display: none; }
      .nav-status { display: none; }
      .toolbar button span.lbl { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-brand">
      <a class="brand-name" href="../">Isaiart</a>
      <span class="brand-tag">JSON // Paste · Edit · Export</span>
    </div>
    <div class="nav-status">
      <span id="stat-size">0 B</span>
      <span id="stat-lines">0 lines</span>
      <span id="status-badge">— Empty</span>
    </div>
  </nav>

  <div class="toolbar">
    <button id="btn-paste" title="Paste from clipboard (replaces content)"><span class="msy">content_paste</span><span class="lbl">Paste</span></button>
    <button id="btn-format" title="Pretty-print (Ctrl+Shift+F)"><span class="msy">format_align_left</span><span class="lbl">Format</span></button>
    <button id="btn-minify" title="Minify to one line"><span class="msy">compress</span><span class="lbl">Minify</span></button>
    <button id="btn-sort" title="Sort object keys A–Z (recursive)"><span class="msy">sort_by_alpha</span><span class="lbl">Sort Keys</span></button>
    <button id="btn-copy" title="Copy all to clipboard"><span class="msy">content_copy</span><span class="lbl">Copy</span></button>
    <button id="btn-clear" title="Clear editor"><span class="msy">backspace</span><span class="lbl">Clear</span></button>
    <div class="spacer"></div>
    <div class="fname-wrap" title="Filename — click dice to re-roll">
      <input id="fname" spellcheck="false" maxlength="8" />
      <span class="fname-ext">.json</span>
    </div>
    <button id="btn-dice" title="Randomize filename"><span class="msy">casino</span></button>
    <button id="btn-export" class="primary" title="Download .json (Ctrl+S)"><span class="msy">download</span><span class="lbl">Export</span></button>
  </div>

  <div class="editor-wrap">
    <div class="gutter" id="gutter"><div>1</div></div>
    <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"
      placeholder='Paste JSON here…&#10;&#10;{ "hello": "world" }'></textarea>
  </div>

  <footer>
    <span>Ctrl+S Export</span>
    <span>Ctrl+Shift+F Format</span>
    <span class="f-spacer"></span>
    <span id="err-msg"></span>
  </footer>

  <div id="toast"></div>

  <script>
    const editor  = document.getElementById('editor');
    const gutter  = document.getElementById('gutter');
    const fname   = document.getElementById('fname');
    const badge   = document.getElementById('status-badge');
    const errMsg  = document.getElementById('err-msg');
    const statSz  = document.getElementById('stat-size');
    const statLn  = document.getElementById('stat-lines');
    const toast   = document.getElementById('toast');

    /* ---------- filename ---------- */
    const CHARS = 'abcdefghjkmnpqrstuvwxyz23456789'; // no confusable 0/o/1/l/i
    function randomName() {
      const buf = new Uint32Array(8);
      crypto.getRandomValues(buf);
      let s = '';
      for (const n of buf) s += CHARS[n % CHARS.length];
      return s;
    }
    fname.value = randomName();

    document.getElementById('btn-dice').addEventListener('click', () => {
      fname.value = randomName();
      showToast('New name: ' + fname.value + '.json');
    });

    /* ---------- validation + stats ---------- */
    let errLine = -1;

    function validate() {
      const text = editor.value;
      errLine = -1;
      if (!text.trim()) {
        badge.textContent = '— Empty';
        badge.className = '';
        errMsg.textContent = '';
        return null;
      }
      try {
        const parsed = JSON.parse(text);
        badge.textContent = '● Valid JSON';
        badge.className = 'ok';
        errMsg.textContent = '';
        return parsed;
      } catch (e) {
        badge.textContent = '● Invalid';
        badge.className = 'err';
        errMsg.textContent = e.message;
        const m = e.message.match(/line (\d+)/);
        if (m) {
          errLine = +m[1];
        } else {
          const p = e.message.match(/position (\d+)/);
          if (p) errLine = text.slice(0, +p[1]).split('\n').length;
        }
        return undefined;
      }
    }

    function updateStats() {
      const text = editor.value;
      const bytes = new Blob([text]).size;
      statSz.textContent = bytes < 1024 ? bytes + ' B'
        : bytes < 1048576 ? (bytes / 1024).toFixed(1) + ' KB'
        : (bytes / 1048576).toFixed(2) + ' MB';
      statLn.textContent = (text ? text.split('\n').length : 0) + ' lines';
    }

    function updateGutter() {
      const lines = editor.value.split('\n').length || 1;
      let html = '';
      for (let i = 1; i <= lines; i++) {
        html += '<div' + (i === errLine ? ' class="err-line"' : '') + '>' + i + '</div>';
      }
      gutter.innerHTML = html;
      syncScroll();
    }

    function syncScroll() {
      gutter.scrollTop = editor.scrollTop;
      gutter.firstChild && (gutter.style.paddingTop = '');
      gutter.scrollTo(0, editor.scrollTop);
    }
    editor.addEventListener('scroll', () => { gutter.scrollTop = editor.scrollTop; });

    let debounce;
    function refresh(immediate) {
      clearTimeout(debounce);
      const run = () => { validate(); updateStats(); updateGutter(); };
      immediate ? run() : debounce = setTimeout(run, 200);
    }
    editor.addEventListener('input', () => refresh(false));

    /* ---------- transforms ---------- */
    function getParsedOrToast() {
      const parsed = validate();
      if (parsed === undefined) { showToast('Fix JSON errors first'); return; }
      if (parsed === null && !editor.value.trim()) { showToast('Nothing to do — editor is empty'); return; }
      return parsed;
    }

    document.getElementById('btn-format').addEventListener('click', formatJson);
    function formatJson() {
      const parsed = getParsedOrToast();
      if (parsed === undefined) return;
      editor.value = JSON.stringify(parsed, null, 2);
      refresh(true);
      showToast('Formatted');
    }

    document.getElementById('btn-minify').addEventListener('click', () => {
      const parsed = getParsedOrToast();
      if (parsed === undefined) return;
      editor.value = JSON.stringify(parsed);
      refresh(true);
      showToast('Minified');
    });

    function sortKeysDeep(v) {
      if (Array.isArray(v)) return v.map(sortKeysDeep);
      if (v && typeof v === 'object') {
        const out = {};
        for (const k of Object.keys(v).sort()) out[k] = sortKeysDeep(v[k]);
        return out;
      }
      return v;
    }
    document.getElementById('btn-sort').addEventListener('click', () => {
      const parsed = getParsedOrToast();
      if (parsed === undefined) return;
      editor.value = JSON.stringify(sortKeysDeep(parsed), null, 2);
      refresh(true);
      showToast('Keys sorted');
    });

    /* ---------- clipboard ---------- */
    document.getElementById('btn-paste').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (!text) { showToast('Clipboard is empty'); return; }
        editor.value = text;
        refresh(true);
        // auto-format if it parses
        try { editor.value = JSON.stringify(JSON.parse(text), null, 2); refresh(true); } catch {}
        showToast('Pasted');
      } catch {
        showToast('Clipboard blocked — press Ctrl+V in the editor');
        editor.focus();
      }
    });

    document.getElementById('btn-copy').addEventListener('click', async () => {
      if (!editor.value) { showToast('Nothing to copy'); return; }
      try {
        await navigator.clipboard.writeText(editor.value);
        showToast('Copied');
      } catch { showToast('Copy failed'); }
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      editor.value = '';
      refresh(true);
      editor.focus();
      showToast('Cleared');
    });

    /* ---------- export ---------- */
    document.getElementById('btn-export').addEventListener('click', exportJson);
    function exportJson() {
      if (!editor.value.trim()) { showToast('Nothing to export'); return; }
      if (validate() === undefined) { showToast('Warning: exporting invalid JSON'); }
      const name = (fname.value.trim() || randomName()) + '.json';
      const blob = new Blob([editor.value], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Exported ' + name);
      fname.value = randomName(); // fresh name for the next export
    }

    /* ---------- keyboard ---------- */
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        exportJson();
      }
      if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f') {
        e.preventDefault();
        formatJson();
      }
    });

    // Tab inserts two spaces instead of leaving the editor
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = editor.selectionStart, en = editor.selectionEnd;
        editor.setRangeText('  ', s, en, 'end');
        refresh(false);
      }
    });

    /* ---------- toast ---------- */
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    refresh(true);
  </script>
</body>
</html>
