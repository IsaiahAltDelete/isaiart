<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>404 — No Object At This Coordinate | ISAIART</title>
<meta name="description" content="The page you asked for isn't here. Return to isaiart.com." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #06070b;
    --rule:    rgba(255,255,255,0.10);
    --rule-hi: rgba(255,255,255,0.22);
    --white:   #f4f4f2;
    --off:     #adada8;
    --dim:     #9a9a95;
    --accent:  #8fb4ff;
    --bar-h:   56px;
  }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--white);
    font-family: 'Barlow', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ── canvas layers ───────────────────────────────────────────────────
     #sky holds the lensed star chart and the two bent rules. #lens holds
     the warped numerals. Page chrome sits above both, so nothing is ever
     drawn across the way home. */
  #sky, #lens {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; pointer-events: none;
  }
  #sky  { z-index: 0; }
  #lens { z-index: 2; }

  /* ── the two hairline rules ──────────────────────────────────────────
     Real DOM by default (correct with no JS). Once the canvas takes over
     it draws them bent, and these are hidden. */
  .bar {
    position: relative; z-index: 3;
    flex: 0 0 auto; height: var(--bar-h);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(18px, 3vw, 56px);
  }
  .bar-top { border-bottom: 1px solid var(--rule); }
  .bar-bot { border-top:    1px solid var(--rule); }
  html.lens-live .bar-top { border-bottom-color: transparent; }
  html.lens-live .bar-bot { border-top-color: transparent; }

  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.15rem; font-weight: 900;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--white); text-decoration: none;
  }
  .brand:hover { color: var(--accent); }

  .micro {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem; font-weight: 400;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--dim);
  }
  .path {
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 46vw;
  }

  /* ── centre stack ────────────────────────────────────────────────── */
  main {
    position: relative; z-index: 3;
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px clamp(18px, 3vw, 56px);
    text-align: center;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(5.5rem, 24vw, 18rem);
    font-weight: 900; line-height: 0.82;
    letter-spacing: -0.02em;
    color: var(--white);
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) both;
  }
  /* the canvas redraws the numerals once it is live — keep the element in
     layout so the lens stays registered to it, just stop painting the text */
  html.lens-live h1 { color: transparent; }

  .sub {
    margin-top: 20px;
    font-size: 0.98rem; color: var(--off);
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .06s both;
  }

  .cta {
    position: relative;
    margin-top: 30px;
    display: inline-flex; align-items: center; gap: 12px;
    min-height: 48px; padding: 14px 26px;
    border: 1px solid var(--rule-hi);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.86rem; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--white); text-decoration: none;
    transition: background .18s;
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .12s both;
  }
  .cta:hover, .cta:focus-visible { background: rgba(255,255,255,0.05); }
  .cta .arw { transition: transform .18s; }
  .cta:hover .arw, .cta:focus-visible .arw { transform: translateX(-3px); }

  /* corner marks, quoted from the homepage's project cards */
  .cta::before, .cta::after {
    content: ''; position: absolute;
    width: 11px; height: 11px;
    border-color: var(--accent); border-style: solid;
    opacity: 0; transition: opacity .18s;
  }
  .cta::before { top: -1px;    left: -1px;  border-width: 1px 0 0 1px; }
  .cta::after  { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }
  .cta:hover::before, .cta:hover::after,
  .cta:focus-visible::before, .cta:focus-visible::after { opacity: 1; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .brand { font-size: 0.95rem; }
    .micro { font-size: 0.62rem; letter-spacing: 0.16em; }
    .path  { max-width: 60vw; }
    .cta   { width: 100%; justify-content: center; }
  }
  /* short landscape — let the stack scroll rather than clip */
  @media (max-height: 430px) {
    :root { --bar-h: 42px; }
    body { overflow-y: auto; }
    h1 { font-size: clamp(3rem, 13vh, 5.5rem); }
    .sub { margin-top: 12px; }
    .cta { margin-top: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1, .sub, .cta { animation: none; }
  }
</style>
</head>
<body>

<canvas id="sky"  aria-hidden="true"></canvas>
<canvas id="lens" aria-hidden="true"></canvas>

<header class="bar bar-top">
  <a class="brand" href="/">ISAIART</a>
  <span class="micro">Error 404</span>
</header>

<main>
  <h1 id="glyphs">404<span class="sr-only"> — page not found</span></h1>
  <p class="sub">No object at this coordinate.</p>
  <a class="cta" href="/"><span class="arw" aria-hidden="true">←</span>Back to Isaiart</a>
</main>

<footer class="bar bar-bot">
  <span class="micro path" id="path">Path · not found</span>
  <span class="micro">© 2026 Isaiah</span>
</footer>

<script>
/* ══════════════════════════════════════════════════════════════════════
   APPARENT POSITION
   An invisible point mass transits the page. Everything it passes — the
   star chart, the two hairline rules, the numerals themselves — is drawn
   at its APPARENT position rather than its true one. The 404 never moves.
   Canvas 2D only; the homepage owns the WebGL.
   ══════════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var docEl  = document.documentElement;
  var skyC   = document.getElementById('sky');
  var lensC  = document.getElementById('lens');
  var h1     = document.getElementById('glyphs');
  var pathEl = document.getElementById('path');

  // the requested path is attacker-controlled — textContent only, never innerHTML
  try {
    var p = (location && location.pathname) || '/';
    try { p = decodeURIComponent(p); } catch (e0) { /* malformed escapes */ }
    p = p.replace(/[\u0000-\u001f\u007f-\u009f]/g, '');
    if (p.length > 44) p = p.slice(0, 43) + '…';
    if (pathEl) pathEl.textContent = 'Path · ' + p;
  } catch (e) { /* leave the authored default */ }

  if (!skyC || !lensC || !h1) return;
  var sctx = skyC.getContext  ? skyC.getContext('2d')  : null;
  var lctx = lensC.getContext ? lensC.getContext('2d') : null;
  if (!sctx || !lctx) { skyC.style.display = 'none'; lensC.style.display = 'none'; return; }

  var mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduce = mq ? mq.matches : false;

  var W = 0, H = 0, dpr = 1;
  var thE = 120;                 // Einstein radius, derived from the type
  var gx0 = 0, gy0 = 0, gW = 0, gH = 0;   // numerals' box, CSS px
  var glyph = null;              // offscreen bitmap of "404"

  /* ── deterministic star chart, so a resize never reshuffles the sky ── */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var SN = 900, snx = new Float32Array(SN), sny = new Float32Array(SN),
      ssz = new Float32Array(SN), sal = new Float32Array(SN);
  (function buildStars() {
    var r = mulberry32(0x404);
    for (var i = 0; i < SN; i++) {
      snx[i] = r(); sny[i] = r();
      ssz[i] = r() < 0.20 ? 2 : 1;
      sal[i] = 0.18 + r() * 0.46;
    }
  })();
  // dense enough that the arcs around the hole are legible as a bent sky,
  // not just a handful of dots that happen to have moved
  function starCount() {
    var n = Math.round(W * H / 1900);
    return Math.max(260, Math.min(SN, n));
  }

  /* ── the lens ────────────────────────────────────────────────────────
     One point-mass solution, used by the stars, the rules and the glyphs.
       disp = ½(√(β² + 4θE²) − β)     applied radially outward
     No singularity: → θE as β → 0, → θE²/β far away. */
  function disp(b) {
    return 0.5 * (Math.sqrt(b * b + 4 * thE * thE) - b);
  }

  /* ── sizing ─────────────────────────────────────────────────────────── */
  function sizeAll() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, W < 700 ? 1.5 : 2);
    [skyC, lensC].forEach(function (c) {
      c.width  = Math.round(W * dpr);
      c.height = Math.round(H * dpr);
    });
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var r = h1.getBoundingClientRect();
    gx0 = r.left; gy0 = r.top; gW = r.width; gH = r.height;
    thE = Math.max(58, Math.min(210, gW * 0.42));
    buildGlyph();
  }

  /* ── render "404" once into an offscreen bitmap ──────────────────────
     Per-frame we displace strips of THIS, which is why no font outline
     extraction is needed: the real glyphs bend, at any font, at any size. */
  function buildGlyph() {
    glyph = null;
    if (!(gW > 4) || !(gH > 4)) return;
    var cv = document.createElement('canvas');
    cv.width  = Math.max(1, Math.round(gW * dpr));
    cv.height = Math.max(1, Math.round(gH * dpr));
    var g = cv.getContext ? cv.getContext('2d') : null;
    if (!g) return;
    var cs = getComputedStyle(h1);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#f4f4f2';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    // letter-spacing where supported; harmless where not
    try { g.letterSpacing = cs.letterSpacing; } catch (e) {}
    g.fillText('404', gW / 2, gH / 2);
    glyph = cv;
  }

  /* ── the drift ───────────────────────────────────────────────────────
     The hole bounces around inside the viewport, reflecting off all four
     edges, so it crosses the numerals from a different angle every time
     and never settles into a loop. */
  var mx = 0, my = 0;
  var bvx = 0, bvy = 0, lastT = 0, seeded = false;

  function seedMass() {
    mx = W * 0.5; my = H * 0.34;
    var sp = Math.max(64, Math.min(132, W * 0.085));   // px per second
    bvx = Math.cos(2.20) * sp;                          // fixed angle: no RNG,
    bvy = Math.sin(2.20) * sp;                          // so it is reproducible
    seeded = true;
  }

  function computeMass(now) {
    // reduced motion gets ONE still frame, so park the hole just off the
    // numerals' right edge: the peel is clearly visible, the 404 stays legible
    if (reduce) { mx = gx0 + gW * 1.12; my = gy0 + gH * 0.52; return; }
    if (!seeded) seedMass();
    var dt = lastT ? Math.min((now - lastT) / 1000, 0.05) : 0;
    lastT = now;
    mx += bvx * dt; my += bvy * dt;
    // the centre reflects off the edges, so the hole clips half off the page
    // at the turns — intentional, it keeps the drift from feeling boxed in
    if (mx < 0) { mx = 0; bvx =  Math.abs(bvx); }
    if (mx > W) { mx = W; bvx = -Math.abs(bvx); }
    if (my < 0) { my = 0; bvy =  Math.abs(bvy); }
    if (my > H) { my = H; bvy = -Math.abs(bvy); }
  }

  /* ── draw ───────────────────────────────────────────────────────────── */
  var TAU = Math.PI * 2;

  /* One lensed image of a star: an arc of radius `r` centred on the hole,
     `arcLen` px long around it and `w` px thick. Stretched images curve
     around the void instead of pointing at it — that is the whole read. */
  function drawImageArc(r, phi, arcLen, w, a) {
    if (!(a > 0.02) || !(r > 0.5)) return;
    if (a > 0.95) a = 0.95;
    sctx.strokeStyle = 'rgba(244,244,242,' + a.toFixed(3) + ')';
    // cap the sweep hard: long arcs from many stars at similar radii stack up
    // into concentric rings and read as a bullseye instead of a lensed sky
    var half = Math.min(0.26, arcLen / (2 * r));
    if (half < 0.004) {                     // too short to bend — a point
      sctx.fillStyle = 'rgba(244,244,242,' + a.toFixed(3) + ')';
      sctx.fillRect(mx + Math.cos(phi) * r, my + Math.sin(phi) * r,
                    Math.max(1, w), Math.max(1, w));
      return;
    }
    sctx.lineWidth = Math.max(0.7, w);
    sctx.beginPath();
    sctx.arc(mx, my, r, phi - half, phi + half);
    sctx.stroke();
  }

  function drawSky() {
    sctx.clearRect(0, 0, W, H);

    var n = starCount(), i;
    for (i = 0; i < n; i++) {
      var sx = snx[i] * W, sy = sny[i] * H;
      var dx = sx - mx, dy = sy - my;
      var b = Math.sqrt(dx * dx + dy * dy);
      if (b < 0.001) b = 0.001;
      var root = Math.sqrt(b * b + 4 * thE * thE);
      var phi  = Math.atan2(dy, dx);

      // primary image: pushed out to th+, stretched tangentially by th/b and
      // squeezed radially by dth/db — which is exactly what draws an arc
      var th = 0.5 * (b + root);
      var mt = th / b;
      var mr = 0.5 * (1 + b / root);
      drawImageArc(th, phi, ssz[i] * mt, ssz[i] * mr, sal[i] * Math.min(3.4, mt * mr));

      // the counter-image: the second, inverted picture of the same star,
      // wrapped around the far side of the hole inside the Einstein radius
      var thm = 0.5 * (root - b);
      var mt2 = thm / b, mr2 = 0.5 * (b / root - 1) + 0.5;
      drawImageArc(thm, phi + Math.PI, ssz[i] * mt2, ssz[i] * Math.abs(mr2),
                   sal[i] * Math.min(1.2, Math.abs(mt2 * mr2)) * 0.85);
    }

    // The void. No body is ever drawn — this is the shadow, i.e. the region
    // no image can reach, so it has a hard edge and nothing inside it.
    var sh = sctx.createRadialGradient(mx, my, thE * 0.32, mx, my, thE * 0.88);
    sh.addColorStop(0,    'rgba(6,7,11,1)');
    sh.addColorStop(0.74, 'rgba(6,7,11,0.97)');
    sh.addColorStop(1,    'rgba(6,7,11,0)');
    sctx.fillStyle = sh;
    sctx.beginPath(); sctx.arc(mx, my, thE * 0.88, 0, TAU); sctx.fill();

    // The photon ring, at the Einstein radius — clear of the shadow above so
    // it stays crisp. Wide soft pass first, hairline over it.
    sctx.strokeStyle = 'rgba(143,180,255,0.13)';
    sctx.lineWidth = 7;
    sctx.beginPath(); sctx.arc(mx, my, thE * 0.98, 0, TAU); sctx.stroke();
    sctx.strokeStyle = 'rgba(214,228,255,0.55)';
    sctx.lineWidth = 1.3;
    sctx.beginPath(); sctx.arc(mx, my, thE * 0.98, 0, TAU); sctx.stroke();

    // the site's own two hairlines, pushed through the same field
    drawRule(56);
    drawRule(H - 56);
  }

  function drawRule(y) {
    var STEPS = 180, i, x, dx, dy, b, d, u, px, py, first = true;
    sctx.beginPath();
    for (i = 0; i <= STEPS; i++) {
      x = i / STEPS * W;
      dx = x - mx; dy = y - my;
      b = Math.sqrt(dx * dx + dy * dy);
      if (b < 0.001) b = 0.001;
      d = disp(b); u = d / b;
      px = x + dx * u; py = y + dy * u;
      if (first) { sctx.moveTo(px, py); first = false; } else sctx.lineTo(px, py);
    }
    sctx.strokeStyle = 'rgba(255,255,255,0.16)';
    sctx.lineWidth = 1;
    sctx.stroke();
  }

  /* The numerals, redrawn as narrow vertical strips, each pushed to its own
     apparent position. Columns near the mass are shoved apart while the rest
     stay put, so the glyphs stretch around it instead of sliding as a block.
     Strips are drawn 1px wider than their source so neighbours overlap and
     no seam opens up when adjacent offsets differ. */
  function drawGlyphs() {
    lctx.clearRect(0, 0, W, H);
    if (!glyph) return;
    var STRIP = 2, cols = Math.ceil(gW / STRIP), i;
    var cy = gy0 + gH * 0.5;
    for (i = 0; i < cols; i++) {
      var sx = i * STRIP;
      var cx = gx0 + sx + STRIP * 0.5;
      var dx = cx - mx, dy = cy - my;
      var b = Math.sqrt(dx * dx + dy * dy);
      if (b < 0.001) b = 0.001;
      // full-strength deflection — the numerals shear hard as the mass goes
      // by. Deliberately extreme: the smearing is the whole point.
      var d = disp(b), u = d / b;
      lctx.drawImage(
        glyph,
        sx * dpr, 0, STRIP * dpr, glyph.height,
        gx0 + sx + dx * u, gy0 + dy * u, STRIP + 1, gH
      );
    }
  }

  /* ── loop ───────────────────────────────────────────────────────────── */
  var raf = 0, running = false;

  function frame(now) {
    computeMass(now);
    drawSky();
    drawGlyphs();
    if (reduce) { running = false; raf = 0; return; }   // one still frame
    raf = requestAnimationFrame(frame);
  }
  function start() {
    if (running || document.hidden) return;
    running = true;
    raf = requestAnimationFrame(frame);
  }
  function stop() {
    if (!running) return;
    cancelAnimationFrame(raf); running = false; raf = 0;
  }

  function boot() {
    sizeAll();
    docEl.className += ' lens-live';
    start();
  }

  // wait for the webfont so the canvas numerals match the DOM metrics
  var booted = false;
  function once() { if (!booted) { booted = true; boot(); } }
  setTimeout(once, 2500);
  try {
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(once, once);
    else once();
  } catch (e) { once(); }

  var rz = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () { sizeAll(); start(); }, 150);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else start();
  });

  if (mq) {
    var onMotion = function () { reduce = mq.matches; start(); };
    if (mq.addEventListener) mq.addEventListener('change', onMotion);
    else if (mq.addListener) mq.addListener(onMotion);
  }
})();
</script>
</body>
</html>
