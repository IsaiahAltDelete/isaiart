<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone · isaiart</title>
<!-- Real SF Pro is used when it's installed locally (Apple ships it with Xcode /
     developer.apple.com/fonts). Otherwise Inter — the closest free match to SF —
     is pulled from Google Fonts, falling back to Segoe UI Variable offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/iphone.css?v=iphone-mom-a">
</head>
<body>

<div id="rig">
<aside id="panel" aria-label="Simulator controls"><div class="deck-inner"></div></aside>

<div id="stage">
  <button id="deckTab" aria-controls="panel" aria-expanded="false" aria-label="Show simulator controls" title="Simulator controls"></button>
  <div class="device">
    <button class="btn-side" id="bMute" aria-label="Action button" title="Action button"></button>
    <button class="btn-side" id="bUp" aria-label="Volume up" title="Volume up"></button>
    <button class="btn-side" id="bDown" aria-label="Volume down" title="Volume down"></button>
    <button class="btn-side" id="bPower" aria-label="Lock or wake" title="Lock or wake"></button>
    <div class="screen" id="screen">
      <div id="wall" class="wp-0"></div>

      <!-- Home screen -->
      <div id="home">
        <div id="pages"></div>
        <div id="dots"></div>
        <div id="dock"></div>
      </div>
      <button id="doneJiggle">Done</button>

      <!-- Apps -->
      <div id="applayer"></div>

      <!-- Lock screen -->
      <div id="lock">
        <div id="lk-wall"></div>
        <div id="lk-lockicon"></div>
        <div class="lk-time">
          <div id="lk-date"></div>
          <div id="lk-clock"></div>
        </div>
        <div class="lk-widgets">
          <div class="lk-w"><b>Weather</b><s id="lk-temp">78°</s><div class="sm">Partly Cloudy · H:91 L:74</div></div>
          <div class="lk-w"><b>Battery</b><s id="lk-batt">86%</s><div class="sm" id="lk-battsub">iPhone</div></div>
        </div>
        <div class="lk-notifs" id="lk-notifs"></div>
        <div class="lk-bottom">
          <div class="lk-btn" id="lkTorch"></div>
          <div class="lk-btn" id="lkCam"></div>
        </div>
        <div id="lk-hint">Swipe up to open</div>
      </div>

      <!-- Control Center -->
      <div id="cc"></div>

      <!-- App switcher -->
      <div id="switcher"></div>

      <!-- Call -->
      <div id="callui"></div>

      <!-- Overlays -->
      <div id="overlay"></div>

      <!-- Status bar -->
      <div id="status">
        <div class="left" id="st-time">9:41</div>
        <div class="right" id="st-right"></div>
      </div>
      <div id="island"><div class="il-content"></div></div>

      <div id="homebar"></div>
      <div id="homezone"></div>
      <div id="dim"></div>

      <div id="boot">
        <div class="apple"><svg viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg></div>
        <div id="bootbar"><i></i></div>
      </div>
    </div>
  </div>
</div>
</div>

<script src="scripts/iphone.js?v=iphone-mom-a"></script>
</body>
</html>
