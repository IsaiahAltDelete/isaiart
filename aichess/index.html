<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080b">
<title>Engine vs Engine — Chess</title>
<meta name="description" content="Two small chess engines, Nexus and Hydra, playing each other on a loop, with clocks and running commentary.">

<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/kit.css?v=1">
<script src="../assets/kit.js?v=1"></script>
<script src="../assets/sky.js?v=1" defer></script>
<style>
/* ── The board palette: shared with ../chess/ ───────────────────────────────
   A quiet set photographed at night: two close cool greys, near-white and
   near-black pieces with a thin opposite edge, and a breath of the
   iridescent band for the last move. */
:root {
    --sq-lt: #575c68;
    --sq-dk: #363942;
    --board-edge: rgb(255 255 255 / 0.10);
    --coord: #b3b4bb;
    --pc-w: #f4f3ef;  --pc-w-edge: #17181c;
    --pc-b: #121317;  --pc-b-edge: rgb(236 236 234 / 0.6);
    --pc-shadow: drop-shadow(0 2px 3px rgb(0 0 0 / 0.45));
    --sq-dot: rgb(255 255 255 / 0.24);
    --sel-a: 0.42;
    --last-a: 0.22;
}
@media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
        --sq-lt: #f2f1ec; --sq-dk: #cbc9c1;
        --board-edge: rgb(20 20 30 / 0.14);
        --coord: #6c6b66;
        --pc-w: #fdfdfb; --pc-w-edge: #26272d;
        --pc-b: #1b1c21; --pc-b-edge: rgb(255 255 255 / 0.75);
        --pc-shadow: drop-shadow(0 1.5px 2px rgb(20 20 40 / 0.26));
        --sq-dot: rgb(20 20 30 / 0.16);
        --sel-a: 0.3;
        --last-a: 0.34;
    }
}
:root[data-theme="light"] {
    --sq-lt: #f2f1ec; --sq-dk: #cbc9c1;
    --board-edge: rgb(20 20 30 / 0.14);
    --coord: #6c6b66;
    --pc-w: #fdfdfb; --pc-w-edge: #26272d;
    --pc-b: #1b1c21; --pc-b-edge: rgb(255 255 255 / 0.75);
    --pc-shadow: drop-shadow(0 1.5px 2px rgb(20 20 40 / 0.26));
    --sq-dot: rgb(20 20 30 / 0.16);
    --sel-a: 0.3;
    --last-a: 0.34;
}

/* ── Layout: the board is the hero, the panel sits to its right ─────────── */
.game {
    display: grid;
    grid-template-columns: auto minmax(340px, 1fr);
    grid-template-areas: "board side" "notes side";
    gap: 16px 28px;
    justify-content: stretch;
    align-items: start;
}
.stage {
    grid-area: board;
    --board: max(360px, min(720px, calc(100vh - 186px), calc(100vw - 440px)));
    --sq: calc(var(--board) / 8);
    min-width: 0;
}
.side { grid-area: side; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.frame {
    padding: 14px;
    border: 1px solid var(--rule);
    border-radius: var(--r-l);
    background: var(--panel);
    box-shadow: var(--lift);
    -webkit-backdrop-filter: blur(14px) saturate(1.1); backdrop-filter: blur(14px) saturate(1.1);
}
.board-wrap { position: relative; width: var(--board); height: var(--board); }
/* the faint inlay line a few millimetres out from the squares */
.board-wrap::before {
    content: ''; position: absolute; inset: -7px;
    border: 1px solid var(--rule); border-radius: 9px; pointer-events: none;
}
.chessboard {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%; height: 100%;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--board-edge);
}

/* ── Squares ─────────────────────────────────────────────────────────────── */
.sq { position: relative; display: flex; align-items: center; justify-content: center; }
.sq.light { background-color: var(--sq-lt); }
.sq.dark  { background-color: var(--sq-dk); }
.sq::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }
.sq.hl::before { background: var(--iris); opacity: var(--last-a); }
.sq.chk::before {
    background: radial-gradient(circle at 50% 54%, var(--alert) 0, color-mix(in srgb, var(--alert) 45%, transparent) 36%, transparent 72%);
    opacity: .8;
}
/* coordinates sit in the corners of the edge squares */
.sq .coord {
    position: absolute; z-index: 3; pointer-events: none; user-select: none;
    font-family: var(--f-display); font-weight: 600;
    font-size: clamp(10px, calc(var(--sq) * 0.14), 11.5px);
    letter-spacing: .08em; text-transform: uppercase; line-height: 1;
    color: var(--coord);
}
.coord-file { right: 6px; bottom: 5px; }
.coord-rank { left: 6px; top: 5px; }

/* ── Pieces: Unicode glyphs, filled, with a thin edge in the opposite tone ── */
.pc, .glyph, .cap-piece {
    font-family: 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'Noto Sans Symbols', 'DejaVu Sans', 'Apple Symbols', serif;
    line-height: 1;
    paint-order: stroke fill;
    font-variant-emoji: text;
    user-select: none;
}
.pc {
    position: relative; z-index: 2;
    font-size: calc(var(--sq) * 0.74);
    -webkit-text-stroke: max(1.2px, calc(var(--sq) * 0.024)) transparent;
}
.pc-w, .glyph.w, #cap-w .cap-piece { color: var(--pc-w); -webkit-text-stroke-color: var(--pc-w-edge); filter: var(--pc-shadow); }
.pc-b, .glyph.b, #cap-b .cap-piece { color: var(--pc-b); -webkit-text-stroke-color: var(--pc-b-edge); filter: var(--pc-shadow); }
/* off the board the black pieces take an ink edge, so they read on the panel in both themes */
.glyph.b, #cap-b .cap-piece { -webkit-text-stroke-color: var(--ink-soft); }
.pc.moved { animation: land .32s var(--ease); }
@keyframes land { from { transform: scale(.86) translateY(-4px); opacity: .4; } }

/* ── Advantage: the band, filled to White's share ───────────────────────── */
.eval { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 0 2px; }
.eval .lbl { font-size: 12px; letter-spacing: .14em; }
.eval-bar-wrap { position: relative; flex: 1; height: 4px; border-radius: 999px; background: var(--rule-hi); overflow: hidden; }
.eval-bar-wrap::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ground); opacity: .7; }
.eval-bar-fill { height: 100%; width: 50%; border-radius: inherit; background: var(--iris); transition: width .6s var(--ease); }

/* ── Side panel ──────────────────────────────────────────────────────────── */
.side .panel, .notes .panel { padding: 18px 20px 20px; }
.panel-h { margin-bottom: 14px; }
.panel-h .aside { font-size: 12.5px; }
.panel-h .aside b { font-family: var(--f-mono); font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--ink); }

.players { display: flex; flex-direction: column; gap: 6px; }
.engine-card {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    grid-template-areas: "badge who timer" "badge cap cap" "badge think think";
    column-gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: var(--r-m);
    /* no transition: the turn marker moves the instant the turn does */
}
.engine-card.active-white, .engine-card.active-black { background: var(--tint); border-color: color-mix(in srgb, var(--accent) 26%, transparent); }
.badge {
    grid-area: badge; align-self: start;
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--well); border: 1px solid var(--rule);
}
.glyph { font-size: 26px; -webkit-text-stroke: .8px transparent; }
.who { grid-area: who; display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.who b { font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
.who span { font-size: 13px; color: var(--ink-faint); }
.engine-card.active-white .who span, .engine-card.active-black .who span { color: var(--accent); }
.engine-timer { grid-area: timer; font-family: var(--f-mono); font-size: 18px; font-weight: 500; color: var(--ink-faint); font-variant-numeric: tabular-nums; transition: color .3s; }
.engine-card.active-white .engine-timer, .engine-card.active-black .engine-timer { color: var(--ink); }
.engine-timer.low-time { color: var(--alert) !important; animation: breathe 1.6s ease-in-out infinite; }
.captured-row { grid-area: cap; display: flex; flex-wrap: wrap; gap: 0 1px; min-height: 28px; align-items: center; }
.cap-piece { font-size: 22px; -webkit-text-stroke: 1px transparent; }
.engine-thinking { grid-area: think; min-height: 18px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-faint); }
.engine-thinking:empty { min-height: 0; }
.thinking-dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
@keyframes breathe { 50% { opacity: .4; } }

.status-bar {
    display: flex; align-items: center; gap: 11px;
    margin-top: 14px;
    padding: 11px 14px;
    border: 1px solid var(--rule); border-radius: var(--r-m);
    background: var(--well);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ink-faint); transition: background .2s; }
.status-dot.live { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 16%, transparent); animation: breathe 2.4s ease-in-out infinite; }
.status-dot.ended { background: var(--alert); box-shadow: 0 0 0 4px color-mix(in srgb, var(--alert) 16%, transparent); }
.status-text { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-soft); }
.status-text strong { color: var(--ink); font-weight: 600; }
.move-counter { font-family: var(--f-display); font-size: 12.5px; font-weight: 500; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); white-space: nowrap; }

.controls-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.controls-row .btn-go { grid-column: 1 / -1; order: -1; }
.btn.active-toggle { background: var(--tint); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

/* move list: the log's inline spans fall into a three-column grid */
.move-log-body {
    display: grid; grid-template-columns: 2.8em 1fr 1fr; column-gap: 6px; row-gap: 2px;
    max-height: 236px; overflow-y: auto;
    font-family: var(--f-mono); font-size: 13px; line-height: 1.5;
}
.move-log-body > span { padding: 3px 0; }
.move-log-body:empty { display: block; }
.move-log-body:empty::before { content: 'No moves yet. Press Start.'; font-family: var(--f-text); font-size: 13.5px; color: var(--ink-faint); }
.move-num { color: var(--ink-faint); padding-left: 8px !important; }
.move-w { color: var(--ink); }
.move-b { color: var(--ink-soft); }

/* settings */
.setting-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.setting-group:last-child { margin-bottom: 0; }
.setting-label { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--f-display); font-size: 13px; font-weight: 500; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint); }
.setting-value { font-family: var(--f-mono); font-size: 12.5px; letter-spacing: 0; text-transform: none; color: var(--ink); }

/* ── Commentary: under the board ────────────────────────────────────────── */
.notes { grid-area: notes; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 0; min-width: 100%; }
.analysis-box { transition: border-color .3s, background .3s; }
.analysis-box.active-w, .analysis-box.active-b { border-color: color-mix(in srgb, var(--accent) 28%, var(--rule)); }
.analysis-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.analysis-header .ah-title { font-family: var(--f-display); font-size: 14px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 10px; }
.analysis-header .ah-title::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); opacity: .5; }
.analysis-box.active-w .ah-title::before, .analysis-box.active-b .ah-title::before { background: var(--accent); opacity: 1; }
.eval-badge { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; padding: 2px 9px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.analysis-body { max-height: 180px; overflow-y: auto; font-size: 14px; line-height: 1.55; color: var(--ink-soft); }
.analysis-line { margin-bottom: 10px; padding-left: 12px; border-left: 2px solid var(--rule-hi); }
.analysis-line:last-child { margin-bottom: 0; }
.analysis-box.active-w .analysis-line, .analysis-box.active-b .analysis-line { border-left-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.analysis-line .al-label { display: block; margin-bottom: 1px; font-family: var(--f-display); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
.al-wait { font-size: 13.5px; color: var(--ink-faint); }

/* ── Narrower screens: board first, panel, then commentary ──────────────── */
@media (max-width: 900px) {
    .game { grid-template-columns: minmax(0, 1fr); grid-template-areas: "board" "side" "notes"; justify-items: center; gap: 18px; }
    .stage { --board: min(640px, calc(100vw - 58px)); }
    .side, .notes { width: 100%; max-width: 670px; min-width: 0; }
}
/* phones: tiny coordinates tucked into the very corners, clear of the pieces */
@media (max-width: 480px) {
    .sq .coord { font-size: 8px; letter-spacing: .02em; opacity: .75; }
    .coord-file { right: 3px; bottom: 2px; }
    .coord-rank { left: 3px; top: 2px; }
    .pc { font-size: calc(var(--sq) * 0.7); }
}
@media (max-width: 680px) {
    .stage { --board: calc(100vw - 48px); }
    .frame { padding: 7px 7px 12px; border-radius: var(--r-m); }
    .board-wrap::before { display: none; }
    .eval { margin-top: 12px; padding: 0 5px; }
    .side .panel, .notes .panel { padding: 16px; }
    .notes { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<quiet-sky></quiet-sky>

<main class="kit-page">

    <header class="top">
        <a class="brand" href="./">Chess <small>two engines, on a loop</small></a>
        <nav class="tabs" aria-label="Mode">
            <a href="../chess/">Vs AI</a>
            <a href="../aichess/" aria-current="page">Engine vs engine</a>
        </nav>
        <div class="top-actions">
            <a class="icon-btn" href="/" aria-label="isaiart.com home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v8.5h11V10"/></svg></a>
            <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle light / dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
        </div>
    </header>

    <div class="game">

        <!-- Board -->
        <section class="stage" aria-label="Board">
            <div class="frame">
                <div class="board-wrap">
                    <div class="chessboard" id="board"></div>
                </div>
                <div class="eval" aria-label="Advantage">
                    <span class="lbl">Nexus</span>
                    <div class="eval-bar-wrap"><div class="eval-bar-fill" id="eval-bar"></div></div>
                    <span class="lbl">Hydra</span>
                </div>
            </div>
        </section>

        <!-- Panel -->
        <aside class="side">
            <section class="panel">
                <h2 class="panel-h">Match <span class="aside">Score <b id="score-w">0</b> : <b id="score-b">0</b></span></h2>
                <div class="players">
                    <div class="engine-card black-engine" id="card-b">
                        <span class="badge"><span class="engine-piece glyph b">&#9818;</span></span>
                        <div class="who"><b class="engine-label">Hydra</b><span>Black</span></div>
                        <div class="engine-timer" id="timer-b">05:00</div>
                        <div class="captured-row" id="cap-b" aria-label="Black pieces lost"></div>
                        <div class="engine-thinking" id="think-b"></div>
                    </div>
                    <div class="engine-card white-engine" id="card-w">
                        <span class="badge"><span class="engine-piece glyph w">&#9818;</span></span>
                        <div class="who"><b class="engine-label">Nexus</b><span>White</span></div>
                        <div class="engine-timer" id="timer-w">05:00</div>
                        <div class="captured-row" id="cap-w" aria-label="White pieces lost"></div>
                        <div class="engine-thinking" id="think-w"></div>
                    </div>
                </div>
                <div class="status-bar" role="status">
                    <div class="status-dot" id="status-dot"></div>
                    <div class="status-text" id="status-text">Press <strong>Start</strong> to begin the battle.</div>
                    <div class="move-counter" id="move-counter"></div>
                </div>
                <div class="controls-row">
                    <button class="btn btn-go" id="btn-start" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>Start</button>
                    <button class="btn" id="btn-pause" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>Pause</button>
                    <button class="btn" id="btn-infinite" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18.2 8c5 0 5 8 0 8H12m-6.2 0c-5 0-5-8 0-8H12"/></svg>Loop</button>
                </div>
            </section>

            <section class="panel move-log">
                <h2 class="panel-h move-log-header">Moves</h2>
                <div class="move-log-body" id="move-log"></div>
            </section>

            <section class="panel settings-card">
                <h2 class="panel-h">Parameters</h2>
                <div class="setting-group">
                    <label class="setting-label" for="entropy-slider"><span>Entropy</span><span class="setting-value" id="entropy-val">0.20</span></label>
                    <input class="range" type="range" id="entropy-slider" min="0" max="100" value="20">
                </div>
                <div class="setting-group">
                    <label class="setting-label" for="depth-slider"><span>Knowledge depth</span><span class="setting-value" id="depth-val">3</span></label>
                    <input class="range" type="range" id="depth-slider" min="1" max="5" value="3">
                </div>
                <div class="setting-group">
                    <label class="setting-label" for="speed-slider"><span>Speed</span><span class="setting-value" id="speed-val">Normal</span></label>
                    <input class="range" type="range" id="speed-slider" min="0" max="2" value="1">
                </div>
            </section>
        </aside>

        <!-- Commentary -->
        <section class="notes" aria-label="Analysis">
            <div class="panel analysis-box" id="analysis-w">
                <div class="analysis-header"><span class="ah-title">Nexus analysis</span><span class="eval-badge" id="eval-w">0.0</span></div>
                <div class="analysis-body" id="analysis-body-w"><div class="al-wait">Waiting for game…</div></div>
            </div>
            <div class="panel analysis-box" id="analysis-b">
                <div class="analysis-header"><span class="ah-title">Hydra analysis</span><span class="eval-badge" id="eval-b">0.0</span></div>
                <div class="analysis-body" id="analysis-body-b"><div class="al-wait">Waiting for game…</div></div>
            </div>
        </section>
    </div>

</main>

    r:[[0,0,0,0,0,0,0,0],[5,10,10,10,10,10,10,5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[0,0,0,5,5,0,0,0]],
    q:[[-20,-10,-10,-5,-5,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,5,5,5,0,-10],[-5,0,5,5,5,5,0,-5],[0,0,5,5,5,5,0,-5],[-10,5,5,5,5,5,0,-10],[-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]],
    k:[[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-20,-30,-30,-40,-40,-30,-30,-20],[-10,-20,-20,-20,-20,-20,-20,-10],[20,20,0,0,0,0,20,20],[20,30,10,0,0,10,30,20]],
    k_end:[[-50,-40,-30,-20,-20,-30,-40,-50],[-30,-20,-10,0,0,-10,-20,-30],[-30,-10,20,30,30,20,-10,-30],[-30,-10,30,40,40,30,-10,-30],[-30,-10,30,40,40,30,-10,-30],[-30,-10,20,30,30,20,-10,-30],[-30,-30,0,0,0,0,-30,-30],[-50,-30,-30,-30,-30,-30,-30,-50]]
};
const V={p:100,n:320,b:330,r:500,q:900,k:20000};
const CO={p:1,n:3,b:3,r:5,q:9,k:0};

function evaluate(ch){
    let s=0,tm=0;const bd=ch.board();
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
        const p=bd[r][c];if(!p)continue;
        const v=V[p.type];if(p.type!=='k')tm+=v;
        let t=PST[p.type];if(p.type==='k'&&tm<2600)t=PST.k_end;
        const row=p.color==='w'?r:7-r;
        const pv=t?t[row][c]:0;
        s+=(p.color==='w'?1:-1)*(v+pv);
    }
    s+=(ch.turn()==='w'?1:-1)*ch.moves().length*1.5;
    return s;
}

function orderMoves(moves){
    return moves.sort((a,b)=>{
        let sa=0,sb=0;
        if(a.san.includes('#'))sa+=200;if(b.san.includes('#'))sb+=200;
        if(a.captured)sa+=10*(CO[a.captured]||0)-(CO[a.piece]||0);
        if(b.captured)sb+=10*(CO[b.captured]||0)-(CO[b.piece]||0);
        if(a.san.includes('+'))sa+=5;if(b.san.includes('+'))sb+=5;
        return sb-sa;
    });
}

function quiesce(ch,a,b,isMax){
    const sp=evaluate(ch);
    if(isMax){if(sp>=b)return b;if(sp>a)a=sp;}
    else{if(sp<=a)return a;if(sp<b)b=sp;}
    const caps=ch.moves({verbose:true}).filter(m=>m.captured);
    if(!caps.length)return sp;
    orderMoves(caps);
    const lim=caps.slice(0,5);
    for(const m of lim){
        ch.move(m);const sc=quiesce(ch,a,b,!isMax);ch.undo();
        if(isMax){if(sc>a)a=sc;if(a>=b)return b;}
        else{if(sc<b)b=sc;if(a>=b)return a;}
    }
    return isMax?a:b;
}

let nodeCount=0;
const NODE_LIMIT=30000;

function minimax(ch,depth,a,b,isMax,entropy){
    nodeCount++;
    if(nodeCount>NODE_LIMIT)return evaluate(ch);
    if(depth<=0||ch.game_over())return quiesce(ch,a,b,isMax);
    let moves=ch.moves({verbose:true});
    if(!moves.length)return evaluate(ch);
    orderMoves(moves);
    if(depth>=2&&moves.length>12)moves=moves.slice(0,12);

    if(isMax){
        let best=-Infinity;
        for(const m of moves){
            ch.move(m);
            let ev=minimax(ch,depth-1,a,b,false,entropy);
            ch.undo();
            if(depth<=1)ev+=(Math.random()-0.5)*entropy*60;
            if(ev>best)best=ev;if(ev>a)a=ev;if(a>=b)break;
        }
        return best;
    }else{
        let best=Infinity;
        for(const m of moves){
            ch.move(m);
            let ev=minimax(ch,depth-1,a,b,true,entropy);
            ch.undo();
            if(depth<=1)ev+=(Math.random()-0.5)*entropy*60;
            if(ev<best)best=ev;if(ev<b)b=ev;if(a>=b)break;
        }
        return best;
    }
}

const BOOK={
    start:['e4','d4','Nf3','c4'],
    e4:{e5:['Nf3','Bc4','Nc3'],c5:['Nf3','Nc3','c3'],e6:['d4','Nf3'],c6:['d4','Nc3'],Nf6:['e5','Nc3']},
    d4:{d5:['c4','Nf3','Bf4'],Nf6:['c4','Nf3','Bf4'],f5:['c4','Nf3'],e6:['c4','Nf3']},
    Nf3:{Nf6:['c4','d4','g3'],d5:['d4','c4','g3']},
    c4:{e5:['Nc3','g3'],Nf6:['Nc3','Nf3']}
};

function getBookMove(ch){
    const h=ch.history(),leg=ch.moves({verbose:true});let choices=null;
    if(!h.length)choices=BOOK.start;
    else if(h.length===1){const r=BOOK[h[0]];if(r)choices=Object.keys(r);}
    else if(h.length<=5){const r=BOOK[h[0]];if(r&&r[h[1]])choices=r[h[1]];}
    if(choices){
        const shuf=choices.sort(()=>Math.random()-0.5);
        for(const san of shuf){const f=leg.find(m=>m.san===san);if(f)return f;}
    }
    return null;
}

self.onmessage=function(e){
    const{fen,depth,entropy,id}=e.data;
    const ch=new Chess(fen);
    const moves=ch.moves({verbose:true});
    if(!moves.length){self.postMessage({id,result:null});return;}

    // Opening book
    if(ch.history().length<10&&Math.random()>entropy*0.5){
        const bm=getBookMove(ch);
        if(bm){self.postMessage({id,result:{move:bm,eval:0}});return;}
    }

    // Adaptive depth based on move count
    let d=depth;
    if(moves.length>35&&d>2)d=2;
    else if(moves.length>25&&d>3)d=3;

    const isW=ch.turn()==='w';
    orderMoves(moves);
    nodeCount=0;
    let bestMove=moves[0],bestEval=isW?-Infinity:Infinity;

    for(const m of moves){
        ch.move(m);
        const ev=minimax(ch,d-1,-Infinity,Infinity,!isW,entropy);
        ch.undo();
        if(isW?(ev>bestEval):(ev<bestEval)){bestEval=ev;bestMove=m;}
        if(nodeCount>NODE_LIMIT)break;
    }
    self.postMessage({id,result:{move:bestMove,eval:bestEval}});
};
</script>

<script>
// ==================== MAIN THREAD — UI ONLY, ZERO AI WORK ====================
const PM={wP:'♟',wR:'♜',wN:'♞',wB:'♝',wQ:'♛',wK:'♚',bP:'♟',bR:'♜',bN:'♞',bB:'♝',bQ:'♛',bK:'♚'};
const PN={p:'Pawn',r:'Rook',n:'Knight',b:'Bishop',q:'Queen',k:'King'};
const FILES='abcdefgh'.split('');
const $=id=>document.getElementById(id);

// Create worker from inline blob
const worker=new Worker(URL.createObjectURL(new Blob([document.getElementById('worker-src').textContent],{type:'application/javascript'})));
let pendingResolve=null, searchId=0;
worker.onmessage=e=>{if(pendingResolve&&e.data.id===searchId){pendingResolve(e.data.result);pendingResolve=null;}};

function requestAI(fen,depth,entropy){
    return new Promise(resolve=>{searchId++;pendingResolve=resolve;worker.postMessage({fen,depth,entropy,id:searchId});});
}

// Load chess.js for the main thread (board state only)
const chessScript=document.createElement('script');
chessScript.src='https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js';
chessScript.onload=init;
document.head.appendChild(chessScript);

const G={
    chess:null,running:false,paused:false,infinite:false,
    wins:{w:0,b:0},timers:{w:300,b:300},timerInterval:null,
    entropy:0.2,depth:3,speed:1,highlights:[],
    captured:{w:[],b:[]},moveTimeout:null,gameNum:0,lastEval:0
};
const SPEED_CFG=[
    {think:[1200,3000],delay:600},
    {think:[500,1400],delay:300},
    {think:[100,400],delay:80}
];

// Pre-built board squares — never recreated
let sqEls=[];

function buildBoard(){
    const b=$('board');b.innerHTML='';sqEls=[];
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
        const s=document.createElement('div');
        s.className=`sq ${(r+c)%2===0?'light':'dark'}`;
        s.dataset.r=r;s.dataset.c=c;
        if(r===7){const f=document.createElement('span');f.className='coord coord-file';f.textContent=FILES[c];s.appendChild(f);}
        if(c===0){const rk=document.createElement('span');rk.className='coord coord-rank';rk.textContent=8-r;s.appendChild(rk);}
        b.appendChild(s);sqEls.push(s);
    }
}

function updateBoard(){
    const bd=G.chess.board();
    const chkSide=G.chess.in_check()?G.chess.turn():null; // soft glow on the king in check
    for(let r=0;r<8;r++)for(let c=0;c<8;c++){
        const idx=r*8+c,s=sqEls[idx],nota=FILES[c]+(8-r);
        const isHL=G.highlights.includes(nota);
        const base=(r+c)%2===0?'light':'dark';
        const p=bd[r][c];
        const isChk=!!(p&&chkSide&&p.type==='k'&&p.color===chkSide);
        s.className=`sq ${base}${isHL?' hl':''}${isChk?' chk':''}`;
        const old=s.querySelector('.pc');if(old)old.remove();
        if(p){
            const e=document.createElement('span');
            e.className=`pc pc-${p.color==='w'?'w':'b'}`;
            e.textContent=PM[p.color+p.type.toUpperCase()];
            if(G.highlights[1]===nota)e.classList.add('moved');
            s.appendChild(e);
        }
    }
}

function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function updateTimers(){
    $('timer-w').textContent=fmt(G.timers.w);$('timer-b').textContent=fmt(G.timers.b);
    $('timer-w').classList.toggle('low-time',G.timers.w<=30);
    $('timer-b').classList.toggle('low-time',G.timers.b<=30);
}

function startTimer(c){
    stopTimer();if(G.paused)return;
    $('card-w').classList.toggle('active-white',c==='w');
    $('card-b').classList.toggle('active-black',c==='b');
    $('analysis-w').classList.toggle('active-w',c==='w');$('analysis-w').classList.remove('active-b');
    $('analysis-b').classList.toggle('active-b',c==='b');$('analysis-b').classList.remove('active-w');
    G.timerInterval=setInterval(()=>{G.timers[c]--;updateTimers();if(G.timers[c]<=0)endGame(c==='w'?'b':'w','timeout');},1000);
}
function stopTimer(){if(G.timerInterval){clearInterval(G.timerInterval);G.timerInterval=null;}}

function updateCaptured(){
    const ord={q:0,r:1,b:2,n:3,p:4};
    ['w','b'].forEach(c=>{
        $(`cap-${c}`).innerHTML=[...G.captured[c]].sort((a,b)=>ord[a]-ord[b]).map(t=>`<span class="cap-piece">${PM[c+t.toUpperCase()]}</span>`).join('');
    });
}

function updateMoveLog(){
    const h=G.chess.history();let html='';
    for(let i=0;i<h.length;i+=2){
        html+=`<span class="move-num">${Math.floor(i/2)+1}.</span> <span class="move-w">${h[i]}</span>`;
        if(h[i+1])html+=` <span class="move-b">${h[i+1]}</span>`;
        html+=' ';
    }
    const el=$('move-log');el.innerHTML=html;el.scrollTop=el.scrollHeight;
}

function updateEvalBar(cp){$('eval-bar').style.width=(50+Math.max(-5,Math.min(5,cp))/5*50)+'%';}

function genAnalysis(color,move,ev){
    const el=$(color==='w'?'analysis-body-w':'analysis-body-b');
    const eel=$(color==='w'?'eval-w':'eval-b');
    const cp=ev/100;
    eel.textContent=(cp>=0?'+':'')+cp.toFixed(1);
    updateEvalBar(cp);
    const lines=[{label:'Move',text:descMove(move)}];
    const pos=posNote();if(pos)lines.push({label:'Position',text:pos});
    lines.push({label:'Plan',text:planNote()});
    el.innerHTML=lines.map(l=>`<div class="analysis-line"><span class="al-label">${l.label}</span>${l.text}</div>`).join('');
}

function descMove(m){
    if(m.san.includes('#'))return 'Checkmate!';
    if(m.san.includes('+')&&m.captured)return `Captures the ${PN[m.captured].toLowerCase()} with check.`;
    if(m.san.includes('+'))return 'Delivers check, forcing a response.';
    if(m.captured){
        const v={p:1,n:3,b:3,r:5,q:9,k:0},vict=PN[m.captured].toLowerCase();
        if(v[m.captured]>v[m.piece])return `Wins the ${vict} — favorable exchange.`;
        if(v[m.captured]===v[m.piece])return `Trades ${PN[m.piece].toLowerCase()} for ${vict}.`;
        return `Captures the ${vict}.`;
    }
    if(m.flags&&(m.flags.includes('k')||m.flags.includes('q')))return 'Castles to secure king safety.';
    return ['Improving piece coordination.','Prophylactic — preventing counterplay.','Preparing a strategic breakthrough.','Maintaining pressure.','Subtle positional improvement.','Consolidating the position.'][Math.floor(Math.random()*6)];
}

function posNote(){
    return [
        'Piece activity is the priority here.','Pawn structure remains balanced.',
        'Control of key central squares is strong.','Rook connectivity will matter soon.',
        'Bishop pair could prove decisive.',null,null
    ][Math.floor(Math.random()*7)];
}

function planNote(){
    return ['Aiming to improve pawn structure.','Looking to open files for the rooks.','Planning a kingside expansion.','Building pressure on the queenside.','Preparing a central break.','Optimizing piece placement.','Seeking tactical complications.','Consolidating before pressing.'][Math.floor(Math.random()*8)];
}

// ==================== GAME LOOP ====================
async function makeMove(){
    if(!G.running||G.paused)return;
    const turn=G.chess.turn();
    const thEl=$(turn==='w'?'think-w':'think-b');
    thEl.innerHTML='<span class="thinking-dots">Calculating</span>';

    const cfg=SPEED_CFG[G.speed];
    const delay=cfg.think[0]+Math.random()*(cfg.think[1]-cfg.think[0]);

    // Run AI in worker + visual delay in parallel
    const[result]=await Promise.all([requestAI(G.chess.fen(),G.depth,G.entropy),new Promise(r=>setTimeout(r,delay))]);
    if(!G.running||G.paused)return;
    if(!result||!result.move)return;

    const move=result.move;
    thEl.textContent=`Played ${move.san}`;
    G.lastEval=result.eval;

    if(move.captured)G.captured[turn==='w'?'b':'w'].push(move.captured);

    // Apply move (try SAN first, fallback to from/to)
    if(!G.chess.move(move.san)){
        if(!G.chess.move({from:move.from,to:move.to,promotion:move.promotion||'q'})){
            console.error('Move failed:',move);return;
        }
    }

    G.highlights=[move.from,move.to];
    updateBoard();updateMoveLog();updateCaptured();
    genAnalysis(turn,move,result.eval);

    $('move-counter').textContent=`Move ${Math.ceil(G.chess.history().length/2)}`;
    $('status-text').innerHTML=`<strong>${turn==='w'?'Nexus':'Hydra'}</strong> plays ${move.san}`;

    if(G.chess.game_over()){
        if(G.chess.in_checkmate())endGame(turn,'checkmate');
        else endGame(null,'draw');
        return;
    }
    startTimer(G.chess.turn());
    G.moveTimeout=setTimeout(makeMove,cfg.delay);
}

function startGame(){
    if(G.moveTimeout)clearTimeout(G.moveTimeout);
    stopTimer();searchId++;pendingResolve=null;

    G.chess=new Chess();G.running=true;G.paused=false;
    G.timers={w:300,b:300};G.highlights=[];G.captured={w:[],b:[]};G.lastEval=0;G.gameNum++;

    updateBoard();updateTimers();updateCaptured();
    $('move-log').innerHTML='';
    $('analysis-body-w').innerHTML='<div class="al-wait">Thinking…</div>';
    $('analysis-body-b').innerHTML='<div class="al-wait">Waiting…</div>';
    $('eval-w').textContent='0.0';$('eval-b').textContent='0.0';$('eval-bar').style.width='50%';
    $('status-dot').className='status-dot live';
    $('status-text').innerHTML=`Game #${G.gameNum} — <strong>Nexus</strong> to move.`;
    $('move-counter').textContent='';
    setKeys();
    startTimer('w');makeMove();
}

// The primary key is always the next sensible action: Start when stopped or
// finished, Pause while a match runs, Resume while it is paused.
const ICON={
    play:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>`,
    pause:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`,
    reset:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 2v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>`
};
function setKeys(){
    const live=G.running,st=$('btn-start'),pa=$('btn-pause');
    st.classList.toggle('btn-go',!live);pa.classList.toggle('btn-go',live);
    st.innerHTML=live?`${ICON.reset} Reset`:`${ICON.play} Start`;
    pa.innerHTML=live&&G.paused?`${ICON.play} Resume`:`${ICON.pause} Pause`;
    pa.disabled=!live;
}

function endGame(winner,reason){
    G.running=false;stopTimer();
    if(G.moveTimeout)clearTimeout(G.moveTimeout);
    searchId++;pendingResolve=null;
    $('status-dot').className='status-dot ended';
    if(winner){G.wins[winner]++;$('score-w').textContent=G.wins.w;$('score-b').textContent=G.wins.b;}
    let msg='';
    if(reason==='checkmate')msg=`Checkmate! <strong>${winner==='w'?'Nexus':'Hydra'}</strong> wins.`;
    else if(reason==='timeout')msg=`Time out — <strong>${winner==='w'?'Nexus':'Hydra'}</strong> wins.`;
    else msg='Game drawn.';
    $('status-text').innerHTML=msg;$('btn-pause').disabled=true;setKeys();
    $('think-w').textContent='';$('think-b').textContent='';
    $('card-w').className='engine-card white-engine';$('card-b').className='engine-card black-engine';
    $('analysis-w').className='analysis-box';$('analysis-b').className='analysis-box';
    if(G.infinite)setTimeout(startGame,2500);
}

function togglePause(){
    if(!G.running)return;G.paused=!G.paused;
    setKeys();
    if(G.paused){
        stopTimer();if(G.moveTimeout)clearTimeout(G.moveTimeout);searchId++;pendingResolve=null;
        $('status-text').innerHTML='<strong>Paused</strong>';
    }else{
        startTimer(G.chess.turn());makeMove();
    }
}

function toggleInfinite(){
    G.infinite=!G.infinite;const btn=$('btn-infinite');
    btn.classList.toggle('active-toggle',G.infinite);
    btn.innerHTML=G.infinite
        ?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18.2 8c5 0 5 8 0 8H12m-6.2 0c-5 0-5-8 0-8H12"/></svg> Loop: ON`
        :`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18.2 8c5 0 5 8 0 8H12m-6.2 0c-5 0-5-8 0-8H12"/></svg> Loop`;
}

$('entropy-slider').addEventListener('input',e=>{G.entropy=e.target.value/100;$('entropy-val').textContent=G.entropy.toFixed(2);});
$('depth-slider').addEventListener('input',e=>{G.depth=parseInt(e.target.value);$('depth-val').textContent=G.depth;});
$('speed-slider').addEventListener('input',e=>{G.speed=parseInt(e.target.value);$('speed-val').textContent=['Slow','Normal','Fast'][G.speed];});
$('btn-start').addEventListener('click',startGame);
$('btn-pause').addEventListener('click',togglePause);
$('btn-infinite').addEventListener('click',toggleInfinite);

function init(){G.chess=new Chess();buildBoard();updateBoard();}
</script>
</body>
