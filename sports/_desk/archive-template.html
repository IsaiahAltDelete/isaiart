<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daily Sports Desk Archive</title>
  <meta name="description" content="Previous editions of the Daily Sports Desk, listed newest first.">
  <!-- Generated by sports/_desk/build.py from sports/_desk/archive-template.html. Do not hand-edit. -->
  <style>
    :root{--paper:#f5f2eb;--ink:#20201e;--muted:#6d6b65;--rule:#c9c6bd;--card:#fff}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.42 Arial,Helvetica,sans-serif}
    .wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:24px 0 38px}
    header{border-top:4px solid var(--ink);border-bottom:1px solid var(--rule);padding:14px 0 12px;display:flex;justify-content:space-between;align-items:end;gap:16px}
    .kicker,.label{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    .label{color:var(--muted)}
    h1{font-size:30px;line-height:1;margin:5px 0 7px;letter-spacing:-.035em}
    .intro{margin:0;color:var(--muted);font-size:11px}
    .archive-button{display:inline-flex;align-items:center;min-height:31px;padding:5px 10px;border:1px solid var(--rule);background:#ebe7df;color:var(--ink);font-size:11px;font-weight:750;letter-spacing:.08em;line-height:1;text-decoration:none;text-transform:uppercase;white-space:nowrap}
    .archive-button:hover,.archive-button:focus-visible{background:#e1ddd4;outline:none}
    .archive-list{display:grid;gap:8px;margin-top:18px}
    .archive-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 14px;border:1px solid #d4d1ca;border-left:3px solid #7d8582;background:var(--card);color:var(--ink);text-decoration:none}
    .archive-card:hover,.archive-card:focus-visible{border-color:#aaa79f;outline:none}
    .archive-date{display:block;margin-top:3px;font-size:15px;font-weight:750}
    .archive-meta{color:var(--muted);font-size:11px;text-align:right;white-space:nowrap}
    footer{margin-top:22px;border-top:1px solid var(--rule);padding-top:10px;color:var(--muted);font-size:10px}footer a{color:inherit}
    @media(max-width:560px){.wrap{width:min(100% - 20px,760px)}header{display:block}.archive-button{margin-top:8px}.archive-card{grid-template-columns:1fr}.archive-meta{text-align:left}}
  </style>
</head>
<body>
<main class="wrap">
  <header>
    <div><div class="kicker">Previous editions</div><h1>Daily Sports Desk Archive</h1><p class="intro">Completed desks are preserved here, newest first.</p></div>
    <a class="archive-button" href="/sports/">Current desk</a>
  </header>
  <section class="archive-list" aria-label="Archived Daily Sports Desks">
{{ITEMS}}
  </section>
  <footer>Each entry is a preserved edition. The current desk is always at <a href="/sports/">isaiart.com/sports</a>.</footer>
</main>
</body>
</html>
