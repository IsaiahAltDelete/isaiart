<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("khr-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page Not Found | Key HR</title>
<!-- Without JavaScript, fall back to a plain timed redirect to the directory. -->
<noscript><meta http-equiv="refresh" content="5;url=/demo/"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff;--surface:#ffffff;color-scheme:light;--ink:#17201d;--ink-2:#4a5752;--ink-3:#77837e;--line:#d9e0dc;
  --red:#b8322c;--red-soft:#f6e3e1;
  --font-display:"Zilla Slab",Rockwell,Georgia,serif;
  --font-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{--bg:#101614;--surface:#18201d;--ink:#e8eeeb;--ink-2:#b4c0bb;--ink-3:#85928d;--line:#2a3532;--red:#ec6a60;--red-soft:#3a1f1d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--font-body);-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:520px;text-align:center;display:grid;gap:14px;justify-items:center}
.logo{display:block;width:170px;height:auto}
.code{font:700 clamp(4.5rem,18vw,7rem)/1 var(--font-display);color:var(--red);margin:4px 0 0}
h1{font:700 clamp(1.7rem,5vw,2.2rem)/1.15 var(--font-display);margin:0}
p{margin:0;color:var(--ink-2);max-width:42ch}
p b{color:var(--ink);font-variant-numeric:tabular-nums}
/* drains over the countdown */
.bar{width:100%;max-width:280px;height:4px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.bar span{display:block;height:100%;width:100%;background:var(--red);transform-origin:left;transition:transform 1s linear}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;align-items:center}
.go{font:600 .95rem/1 var(--font-body);color:var(--bg);background:var(--red);border-radius:999px;padding:12px 20px;text-decoration:none}
.go:hover{filter:brightness(1.08)}
.stay{all:unset;cursor:pointer;font:600 .9rem/1 var(--font-body);color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.go:focus-visible,.stay:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.stay[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.bar span{transition:none}}
</style>
</head>
<body>
<main>
  <img class="logo" id="logo" src="/demo/images/keyhr-logo.png" alt="Key HR" width="590" height="404">
  <div class="code" aria-hidden="true">404</div>
  <h1>Page not found</h1>
  <p id="msg">This page doesn't exist or has moved. Taking you to the Demo Directory in <b id="secs">5</b> seconds.</p>
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>
  <div class="actions">
    <a class="go" id="go" href="/demo/">Go to the Demo Directory</a>
    <button type="button" class="stay" id="stay">Stay on this page</button>
  </div>
</main>
<script>
/* Count down, then send visitors to the directory. The site lives under /demo/ on GitHub Pages and at / when served locally. */
(function(){
  var base = /^\/demo(\/|$)/.test(location.pathname) ? "/demo/" : "/";
  var go = document.getElementById("go"), secs = document.getElementById("secs"), bar = document.getElementById("bar"),
      stay = document.getElementById("stay"), msg = document.getElementById("msg"), left = 5, total = left;
  go.href = base;
  document.getElementById("logo").src = base + "images/keyhr-logo.png";
  function tick(){
    left--;
    secs.textContent = left;
    bar.style.transform = "scaleX(" + left / total + ")";
    if (left <= 0) { clearInterval(timer); location.replace(base); }
  }
  var timer = setInterval(tick, 1000);
  stay.addEventListener("click", function(){
    clearInterval(timer);
    msg.textContent = "Redirect stopped. Use the button below whenever you're ready.";
    bar.parentNode.hidden = true; stay.hidden = true; go.focus();
  });
})();
</script>
</body>
</html>
