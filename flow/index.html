<!DOCTYPE html>
<html lang="en" data-style="default" data-color="orange" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Flow Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;700&family=VT323&family=Silkscreen:wght@400;700&family=Cinzel:wght@400;600&family=MedievalSharp&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        /* ════════════════════ BASE DARK (neutral) ════════════════════ */
        :root {
            --accent:#F59E0B;--accent-hover:#D97706;--accent-trans:rgba(245,158,11,0.14);--accent-text:#1A1305;
            --success:#22C55E;--danger:#EF4444;--danger-hover:#DC2626;
            --bg:#0E0F13;--text:#E5E7EB;--subtle:#6B7280;
            --card-bg:rgba(30,33,42,0.62);--border:rgba(255,255,255,0.09);
            --hover-bg:rgba(255,255,255,0.06);--input-bg:rgba(255,255,255,0.05);
            --dropdown-bg:#15171C;--shadow:rgba(0,0,0,0.45);
            --panel-radius:1.5rem;--btn-radius:0.5rem;--font-main:'Poppins',sans-serif;
        }
        /* ════════════════════ BASE LIGHT (neutral) ════════════════════ */
        html[data-mode="light"] {
            --bg:#F0F2F5;--text:#1F2937;--subtle:#6B7280;
            --card-bg:rgba(255,255,255,0.72);--border:rgba(0,0,0,0.08);
            --hover-bg:rgba(0,0,0,0.05);--input-bg:rgba(0,0,0,0.04);
            --dropdown-bg:#FFFFFF;--shadow:rgba(0,0,0,0.12);
            --accent:#D97706;--accent-hover:#B45309;--accent-trans:rgba(217,119,6,0.10);--accent-text:#FFFFFF;--success:#16A34A;--danger:#DC2626;
        }
        /* ════════════════════ COLOR = ACCENT ONLY (soft styles keep neutral bg) ════════════════════ */
        /* DARK */
        html[data-mode="dark"][data-color="dark"]   { --accent:#D4D7DD;--accent-hover:#AEB2BC;--accent-trans:rgba(212,215,221,0.12);--accent-text:#15171C; }
        html[data-mode="dark"][data-color="white"]  { --accent:#818CF8;--accent-hover:#6366F1;--accent-trans:rgba(129,140,248,0.14);--accent-text:#FFFFFF; }
        html[data-mode="dark"][data-color="blue"]   { --accent:#38BDF8;--accent-hover:#0EA5E9;--accent-trans:rgba(56,189,248,0.14);--accent-text:#062330; }
        html[data-mode="dark"][data-color="green"]  { --accent:#34D399;--accent-hover:#10B981;--accent-trans:rgba(52,211,153,0.14);--accent-text:#04261A; }
        html[data-mode="dark"][data-color="pink"]   { --accent:#F472B6;--accent-hover:#EC4899;--accent-trans:rgba(244,114,182,0.14);--accent-text:#FFFFFF; }
        html[data-mode="dark"][data-color="orange"] { --accent:#F59E0B;--accent-hover:#D97706;--accent-trans:rgba(245,158,11,0.14);--accent-text:#1A1305; }
        /* LIGHT */
        html[data-mode="light"][data-color="dark"]   { --accent:#334155;--accent-hover:#1E293B;--accent-trans:rgba(51,65,85,0.10);--accent-text:#FFFFFF; }
        html[data-mode="light"][data-color="white"]  { --accent:#4F46E5;--accent-hover:#4338CA;--accent-trans:rgba(79,70,229,0.10);--accent-text:#FFFFFF; }
        html[data-mode="light"][data-color="blue"]   { --accent:#0284C7;--accent-hover:#0369A1;--accent-trans:rgba(2,132,199,0.10);--accent-text:#FFFFFF; }
        html[data-mode="light"][data-color="green"]  { --accent:#059669;--accent-hover:#047857;--accent-trans:rgba(5,150,105,0.10);--accent-text:#FFFFFF; }
        html[data-mode="light"][data-color="pink"]   { --accent:#DB2777;--accent-hover:#BE185D;--accent-trans:rgba(219,39,119,0.10);--accent-text:#FFFFFF; }
        html[data-mode="light"][data-color="orange"] { --accent:#D97706;--accent-hover:#B45309;--accent-trans:rgba(217,119,6,0.10);--accent-text:#FFFFFF; }

        /* ══════════════════════════ STYLE THEMES ══════════════════════════ */

        /* ── GLASSMORPHIC ── */
        html[data-style="glass"] #gradientBg { display:block !important; }
        html[data-style="glass"] #trackerPanel { background:rgba(255,255,255,0.06) !important; border-color:rgba(255,255,255,0.16) !important; backdrop-filter:blur(34px) saturate(190%) !important; -webkit-backdrop-filter:blur(34px) saturate(190%) !important; }
        html[data-style="glass"] #reminderControls,html[data-style="glass"] #themePanel { background:rgba(255,255,255,0.08) !important; border:1px solid rgba(255,255,255,0.16) !important; backdrop-filter:blur(24px) saturate(170%) !important; -webkit-backdrop-filter:blur(24px) saturate(170%) !important; }
        html[data-style="glass"] .sound-card { background:rgba(255,255,255,0.07) !important; border:1px solid rgba(255,255,255,0.12) !important; }
        html[data-mode="light"][data-style="glass"] #trackerPanel { background:rgba(255,255,255,0.42) !important; border-color:rgba(255,255,255,0.6) !important; }
        html[data-mode="light"][data-style="glass"] #reminderControls,html[data-mode="light"][data-style="glass"] #themePanel { background:rgba(255,255,255,0.5) !important; border-color:rgba(255,255,255,0.6) !important; }

        /* ── NEUMORPHIC ── */
        html[data-style="neumorphic"] { --panel-radius:1.75rem; }
        html[data-mode="dark"][data-style="neumorphic"]  { --bg:#1C2028;--card-bg:#1C2028;--input-bg:#1C2028;--dropdown-bg:#1C2028;--border:transparent;--hover-bg:#181C24;--text:#D2D7E2;--subtle:#717A8C; }
        html[data-mode="light"][data-style="neumorphic"] { --bg:#E0E5EC;--card-bg:#E0E5EC;--input-bg:#E0E5EC;--dropdown-bg:#E0E5EC;--border:transparent;--hover-bg:#D6DBE3;--text:#42485A;--subtle:#8A93A6; }
        html[data-mode="dark"][data-style="neumorphic"] #trackerPanel { background:var(--bg)!important; backdrop-filter:none!important; -webkit-backdrop-filter:none!important; border:none!important; box-shadow:12px 12px 24px rgba(8,10,16,0.7),-12px -12px 24px rgba(46,52,68,0.35)!important; }
        html[data-mode="dark"][data-style="neumorphic"] #reminderControls,html[data-mode="dark"][data-style="neumorphic"] #themePanel { background:var(--bg)!important; border:none!important; box-shadow:10px 10px 20px rgba(8,10,16,0.65),-10px -10px 20px rgba(46,52,68,0.3)!important; }
        html[data-mode="dark"][data-style="neumorphic"] .sound-card { background:var(--bg)!important; border:none!important; box-shadow:5px 5px 10px rgba(8,10,16,0.55),-5px -5px 10px rgba(46,52,68,0.28)!important; }
        html[data-mode="dark"][data-style="neumorphic"] .sound-card.selected { box-shadow:inset 3px 3px 7px rgba(8,10,16,0.6),inset -3px -3px 7px rgba(46,52,68,0.3)!important; }
        html[data-mode="light"][data-style="neumorphic"] #trackerPanel { background:var(--bg)!important; backdrop-filter:none!important; -webkit-backdrop-filter:none!important; border:none!important; box-shadow:14px 14px 28px rgba(163,177,198,0.6),-14px -14px 28px rgba(255,255,255,0.9)!important; }
        html[data-mode="light"][data-style="neumorphic"] #reminderControls,html[data-mode="light"][data-style="neumorphic"] #themePanel { background:var(--bg)!important; border:none!important; box-shadow:10px 10px 20px rgba(163,177,198,0.5),-10px -10px 20px rgba(255,255,255,0.75)!important; }
        html[data-mode="light"][data-style="neumorphic"] .sound-card { background:var(--bg)!important; border:none!important; box-shadow:5px 5px 10px rgba(163,177,198,0.5),-5px -5px 10px rgba(255,255,255,0.8)!important; }
        html[data-mode="light"][data-style="neumorphic"] .sound-card.selected { box-shadow:inset 3px 3px 7px rgba(163,177,198,0.55),inset -3px -3px 7px rgba(255,255,255,0.85)!important; }

        /* ── MINIMAL ── */
        html[data-style="minimal"] { --panel-radius:0.5rem;--btn-radius:0.25rem; }
        html[data-mode="dark"][data-style="minimal"]  { --bg:#0B0C0F;--card-bg:#121317;--input-bg:#15171C;--dropdown-bg:#15171C; }
        html[data-mode="light"][data-style="minimal"] { --bg:#FFFFFF;--card-bg:#FFFFFF;--input-bg:#FFFFFF;--dropdown-bg:#FFFFFF;--border:rgba(0,0,0,0.1); }
        html[data-style="minimal"] #trackerPanel { background:var(--card-bg)!important; backdrop-filter:none!important; -webkit-backdrop-filter:none!important; border:1px solid var(--border)!important; box-shadow:none!important; }
        html[data-style="minimal"] #reminderControls,html[data-style="minimal"] #themePanel { border-radius:0.5rem!important; box-shadow:0 8px 30px var(--shadow)!important; }
        html[data-style="minimal"] .sound-card { border-radius:0.25rem!important; box-shadow:none!important; border:1px solid var(--border)!important; }

        /* ── CYBERPUNK ── */
        html[data-style="cyberpunk"] { --font-main:'VT323',monospace;--panel-radius:0px;--btn-radius:0px; }
        html[data-mode="dark"][data-style="cyberpunk"] { --bg:#080809;--card-bg:#0B0B0D;--input-bg:#000;--dropdown-bg:#0B0B0D;--text:#33FF66;--subtle:#1C7A3A;--border:var(--accent);--hover-bg:rgba(255,255,255,0.06);--success:var(--accent); }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="dark"],html[data-mode="dark"][data-style="cyberpunk"][data-color="green"] { --text:#33FF66;--accent:#33FF66;--accent-hover:#00CC44;--accent-text:#001a08; }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="white"]  { --text:#C8C8FF;--accent:#C8C8FF;--accent-hover:#9090DD;--accent-text:#0b0b22; }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="blue"]   { --text:#33CCFF;--accent:#33CCFF;--accent-hover:#0099CC;--accent-text:#021a26; }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="pink"]   { --text:#FF66CC;--accent:#FF66CC;--accent-hover:#CC3399;--accent-text:#26021a; }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="orange"] { --text:#FF9933;--accent:#FF9933;--accent-hover:#CC6600;--accent-text:#261202; }
        html[data-mode="light"][data-style="cyberpunk"] { --bg:#E9E9EC;--card-bg:#DCDCE0;--input-bg:#FFFFFF;--dropdown-bg:#DCDCE0;--text:#141417;--subtle:#555;--border:var(--accent); }
        html[data-style="cyberpunk"] #matrixCanvas { display:block !important; }
        html[data-style="cyberpunk"] #trackerPanel { background:var(--bg)!important; backdrop-filter:none!important; -webkit-backdrop-filter:none!important; border:2px solid var(--accent)!important; box-shadow:6px 6px 0 var(--accent)!important; }
        html[data-style="cyberpunk"] #reminderControls,html[data-style="cyberpunk"] #themePanel { background:var(--card-bg)!important; border:2px solid var(--accent)!important; box-shadow:6px 6px 0 var(--accent)!important; }
        html[data-style="cyberpunk"] .sound-card { border:1px solid var(--accent)!important; }
        html[data-style="cyberpunk"] .sound-card.selected { box-shadow:3px 3px 0 var(--accent); }
        html[data-style="cyberpunk"] #addCallBtn { border-radius:0!important; }
        html[data-style="cyberpunk"] h1 { font-size:1.8rem!important; letter-spacing:3px; }

        /* ── PIXEL ART ── */
        html[data-style="pixelart"] { --font-main:'Silkscreen',monospace;--panel-radius:0px;--btn-radius:0px; }
        html[data-mode="dark"][data-style="pixelart"]  { --bg:#1a1c2c;--card-bg:#2d2b55;--input-bg:#1a1c2c;--dropdown-bg:#2d2b55;--text:#f4f4f4;--subtle:#8b8bc4;--border:#6b6bae;--hover-bg:rgba(107,107,174,0.2); }
        html[data-mode="dark"][data-style="pixelart"][data-color="dark"],html[data-mode="dark"][data-style="pixelart"][data-color="orange"] { --accent:#ffa300;--accent-hover:#cc8200;--accent-text:#1a1c2c; }
        html[data-mode="dark"][data-style="pixelart"][data-color="white"]  { --accent:#fff1e8;--accent-hover:#d4c8bc;--accent-text:#1a1c2c; }
        html[data-mode="dark"][data-style="pixelart"][data-color="blue"]   { --accent:#29adff;--accent-hover:#1a8ecc;--accent-text:#06121c; }
        html[data-mode="dark"][data-style="pixelart"][data-color="green"]  { --accent:#00e436;--accent-hover:#00b82c;--accent-text:#04200d; }
        html[data-mode="dark"][data-style="pixelart"][data-color="pink"]   { --accent:#ff77a8;--accent-hover:#cc4477;--accent-text:#2a0014; }
        html[data-mode="light"][data-style="pixelart"]  { --bg:#e8f0e8;--card-bg:#d2e2cc;--input-bg:#fff;--dropdown-bg:#d2e2cc;--text:#1a2c0a;--subtle:#4a6a3a;--border:#4a6a3a;--hover-bg:rgba(74,106,58,0.15); }
        html[data-mode="light"][data-style="pixelart"][data-color="dark"],html[data-mode="light"][data-style="pixelart"][data-color="green"] { --accent:#2c6a10;--accent-hover:#1a4a08;--accent-text:#fff; }
        html[data-mode="light"][data-style="pixelart"][data-color="white"]  { --accent:#3a3a6a;--accent-hover:#272750;--accent-text:#fff; }
        html[data-mode="light"][data-style="pixelart"][data-color="blue"]   { --accent:#2a3a8a;--accent-hover:#1a2870;--accent-text:#fff; }
        html[data-mode="light"][data-style="pixelart"][data-color="pink"]   { --accent:#8a2a4a;--accent-hover:#6a1a38;--accent-text:#fff; }
        html[data-mode="light"][data-style="pixelart"][data-color="orange"] { --accent:#a85a00;--accent-hover:#804500;--accent-text:#fff; }
        html[data-style="pixelart"] #pixelArtBg { display:block !important; }
        html[data-style="pixelart"] #crtOverlay { display:block !important; }
        html[data-style="pixelart"] #trackerPanel { background:var(--card-bg)!important; backdrop-filter:none!important; -webkit-backdrop-filter:none!important; border:4px solid var(--border)!important; box-shadow:4px 4px 0 var(--border),8px 8px 0 rgba(0,0,0,0.4)!important; }
        html[data-style="pixelart"] #reminderControls { background:var(--card-bg)!important; border:3px solid var(--border)!important; box-shadow:4px 4px 0 var(--border)!important; font-family:'Poppins',sans-serif!important; }
        html[data-style="pixelart"] #reminderControls * { font-family:'Poppins',sans-serif!important; }
        html[data-style="pixelart"] #themePanel { background:var(--card-bg)!important; border:3px solid var(--border)!important; box-shadow:6px 6px 0 rgba(0,0,0,0.4)!important; font-family:'Poppins',sans-serif!important; }
        html[data-style="pixelart"] #themePanel * { font-family:'Poppins',sans-serif!important; }
        html[data-style="pixelart"] .sound-card { border:2px solid var(--border)!important; box-shadow:3px 3px 0 rgba(0,0,0,0.3); }
        html[data-style="pixelart"] .sound-card.selected { box-shadow:3px 3px 0 var(--accent); }
        html[data-style="pixelart"] #addCallBtn { border-radius:0!important; box-shadow:3px 3px 0 rgba(0,0,0,0.5)!important; }
        html[data-style="pixelart"] #addCallBtn:active { transform:translate(2px,2px)!important; box-shadow:1px 1px 0 rgba(0,0,0,0.5)!important; }
        html[data-style="pixelart"] h1 { font-size:0.95rem!important; letter-spacing:1px; line-height:1.5; }
        html[data-style="pixelart"] .text-2xl { font-size:0.95rem!important; }
        html[data-style="pixelart"] .text-sm { font-size:0.6rem!important; line-height:1.6; }
        html[data-style="pixelart"] .text-xs { font-size:0.5rem!important; line-height:1.6; }
        html[data-style="pixelart"] .toggle-switch .slider,html[data-style="pixelart"] .toggle-switch .slider:before { border-radius:0; }

        /* ── RETRO WINDOWS ── */
        html[data-style="retro"] { --panel-radius:0px;--btn-radius:0px;--font-main:'Roboto Mono',monospace;--bg:#008080;--card-bg:#C0C0C0;--input-bg:#FFFFFF;--dropdown-bg:#FFFFFF;--text:#000;--subtle:#444;--border:#808080;--hover-bg:#A8A8A8;--accent:#000080;--accent-hover:#000060;--accent-text:#fff;--success:#008000; }
        html[data-mode="light"][data-style="retro"] { --bg:#3A6EA5; }
        html[data-style="retro"][data-color="green"]  { --bg:#1A7A6A;--accent:#006040;--accent-hover:#004830; }
        html[data-style="retro"][data-color="pink"]   { --bg:#7A4A6A;--accent:#800060;--accent-hover:#600048; }
        html[data-style="retro"][data-color="orange"] { --bg:#8A6A2A;--accent:#804000;--accent-hover:#602800; }
        html[data-style="retro"][data-color="blue"]   { --accent:#000090;--accent-hover:#000070; }
        html[data-style="retro"][data-color="dark"]   { --bg:#5A5A5A;--accent:#303030;--accent-hover:#1a1a1a; }
        html[data-style="retro"] #trackerPanel { background:#C0C0C0!important; backdrop-filter:none!important; -webkit-backdrop-filter:none!important; border:none!important; box-shadow:inset -2px -2px 0 #000,inset 2px 2px 0 #fff,inset -4px -4px 0 #808080,inset 4px 4px 0 #DFDFDF!important; }
        html[data-style="retro"] #retroTitleBar { display:flex !important; }
        html[data-style="retro"] #reminderControls,html[data-style="retro"] #themePanel { background:#C0C0C0!important; border:none!important; box-shadow:inset -2px -2px 0 #000,inset 2px 2px 0 #fff,inset -4px -4px 0 #808080,inset 4px 4px 0 #DFDFDF!important; }
        html[data-style="retro"] .sound-card { background:#C0C0C0!important; color:#000!important; border:none!important; box-shadow:inset -2px -2px 0 #000,inset 2px 2px 0 #fff,inset -4px -4px 0 #808080,inset 4px 4px 0 #DFDFDF!important; }
        html[data-style="retro"] .sound-card:hover { background:#C0C0C0!important; }
        html[data-style="retro"] .sound-card.selected { box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #fff,inset 4px 4px 0 #808080,inset -4px -4px 0 #DFDFDF!important; }
        html[data-style="retro"] #addCallBtn { background:#C0C0C0!important; color:#000!important; border-radius:0!important; box-shadow:inset -2px -2px 0 #000,inset 2px 2px 0 #fff,inset -4px -4px 0 #808080,inset 4px 4px 0 #DFDFDF!important; }
        html[data-style="retro"] #addCallBtn:active { box-shadow:inset 2px 2px 0 #000,inset -2px -2px 0 #fff,inset 4px 4px 0 #808080,inset -4px -4px 0 #DFDFDF!important; }
        html[data-style="retro"] input[type=range]::-webkit-slider-runnable-track { background:#fff; border:1px inset #888; }
        html[data-style="retro"] input[type=range]::-webkit-slider-thumb { background:#C0C0C0; box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 #fff; border-radius:0; }
        html[data-style="retro"] h1 { font-size:1.1rem!important; letter-spacing:0; }
        html[data-style="retro"] .toggle-switch .slider,html[data-style="retro"] .toggle-switch .slider:before { border-radius:0; }

        /* ── MEDIEVAL ── */
        html[data-style="medieval"] { --font-main:'Cinzel',serif;--panel-radius:0.25rem;--btn-radius:0.125rem; }
        html[data-mode="dark"][data-style="medieval"]  { --bg:#100c08;--card-bg:rgba(34,24,15,0.94);--input-bg:rgba(20,14,8,0.85);--dropdown-bg:#1c140c;--text:#e6c690;--subtle:#9a7846;--border:#7a5a1e;--hover-bg:rgba(212,175,114,0.1);--accent:#c8962a;--accent-hover:#a07820;--accent-text:#1a1206;--success:#6fa83a; }
        html[data-mode="dark"][data-style="medieval"][data-color="dark"]   { --accent:#c8962a;--accent-hover:#a07820; }
        html[data-mode="dark"][data-style="medieval"][data-color="white"]  { --accent:#9aa0d8;--accent-hover:#787fb8;--accent-text:#0d0f24; }
        html[data-mode="dark"][data-style="medieval"][data-color="blue"]   { --accent:#5a7ec0;--accent-hover:#46689e;--accent-text:#06101f; }
        html[data-mode="dark"][data-style="medieval"][data-color="green"]  { --accent:#6fa83a;--accent-hover:#578a2c;--accent-text:#0a1e04; }
        html[data-mode="dark"][data-style="medieval"][data-color="pink"]   { --accent:#c25878;--accent-hover:#a04460;--accent-text:#2a0a16; }
        html[data-mode="dark"][data-style="medieval"][data-color="orange"] { --accent:#e08a2a;--accent-hover:#bc6e18;--accent-text:#23110a; }
        html[data-mode="light"][data-style="medieval"]  { --bg:#5a3e1e;--card-bg:#f4e7c4;--input-bg:#fbf3da;--dropdown-bg:#f4e7c4;--text:#3a2410;--subtle:#7a5a34;--border:#9a6a32;--hover-bg:rgba(139,94,60,0.1);--accent:#8b1a1a;--accent-hover:#6a1010;--accent-text:#fff;--success:#3a7a1a; }
        html[data-mode="light"][data-style="medieval"][data-color="dark"]   { --accent:#5a3a1a;--accent-hover:#42280f; }
        html[data-mode="light"][data-style="medieval"][data-color="white"]  { --accent:#3a3a72;--accent-hover:#272750; }
        html[data-mode="light"][data-style="medieval"][data-color="blue"]   { --accent:#1f4a96;--accent-hover:#163a76; }
        html[data-mode="light"][data-style="medieval"][data-color="green"]  { --accent:#3a6a1a;--accent-hover:#2a4e12; }

                <div class="style-preview" style="background:#1a1c2c;border:3px solid #6b6bae;image-rendering:pixelated;"><div style="position:absolute;top:4px;left:4px;right:4px;height:4px;background:#ffa300;"></div><div style="position:absolute;bottom:4px;left:4px;width:7px;height:7px;background:#00e436;"></div><div style="position:absolute;bottom:4px;left:14px;width:7px;height:7px;background:#29adff;"></div></div>
                <span>Pixel Art</span>
            </button>

                <div class="style-preview" style="background:#C0C0C0;box-shadow:inset -2px -2px 0 #000,inset 2px 2px 0 #fff;"><div style="position:absolute;top:0;left:0;right:0;height:10px;background:#000080;display:flex;align-items:center;justify-content:flex-end;padding-right:3px;"><div style="width:7px;height:6px;background:#C0C0C0;box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 #fff;"></div></div></div>
                <span>Retro Win</span>

            <button class="style-btn" data-style="medieval">
                <div class="style-preview" style="background:radial-gradient(ellipse at 50% 30%,#a87a3a,#4a2e14);"><div style="position:absolute;inset:3px;background:rgba(244,231,196,0.9);border:1px solid #9a6a32;display:flex;align-items:center;justify-content:center;font-size:13px;color:#5a3a1a;">&#9876;</div></div>
                <span>Medieval</span>
            </button>
            <button class="style-btn" data-style="brutalist">
                <div class="style-preview" style="background:#e8e8e0;border:3px solid #0a0a0a;box-shadow:4px 4px 0 #0a0a0a;"><div style="position:absolute;top:4px;left:4px;right:4px;height:6px;background:#ff0000;"></div><div style="position:absolute;bottom:4px;left:4px;right:4px;height:3px;background:#0a0a0a;"></div></div>

            <button class="color-dot"          data-color="blue"   style="background:linear-gradient(135deg,#0284C7,#38BDF8);" title="Blue"></button>
            <button class="color-dot"          data-color="green"  style="background:linear-gradient(135deg,#059669,#34D399);" title="Green"></button>

        </div>
    </div>

    <div id="scene">
        <main id="trackerPanel">
            <div id="retroTitleBar">
                <span>&#128222; Call Flow Tracker</span>
                <div style="display:flex;"><span class="retro-win-btn">_</span><span class="retro-win-btn">&#9633;</span><span class="retro-win-btn">&#10005;</span></div>

                            </div>
                            <div class="mb-3">
                                <div class="flex items-center justify-between mb-1">

                                        <button id="randomizeSoundBtn" class="flex items-center gap-1" style="font-size:0.62rem;padding:3px 7px;border-radius:0.375rem;background:var(--hover-bg);color:var(--subtle);border:1px solid var(--border)" title="Randomize"><span class="material-symbols-outlined" style="font-size:13px">shuffle</span><span>Random</span></button>
                                        <button id="previewSoundBtn" style="padding:3px 6px;border-radius:0.375rem;background:var(--hover-bg);color:var(--subtle);border:1px solid var(--border)" title="Preview"><span class="material-symbols-outlined" style="font-size:13px">play_arrow</span></button>

                <button id="addCallBtn" class="accent-bg font-bold px-4 py-2 transition-all flex items-center gap-2 shadow-md hover:shadow-lg hover:scale-105 active:scale-100" style="border-radius:var(--btn-radius)">

    <div id="resetConfirmModal"  class="fixed inset-0 z-[80] flex items-center justify-center p-4 hidden" style="background:rgba(0,0,0,0.55);backdrop-filter:blur(6px)"></div>
    <div id="deleteConfirmModal" class="fixed inset-0 z-[80] flex items-center justify-center p-4 hidden" style="background:rgba(0,0,0,0.55);backdrop-filter:blur(6px)"></div>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const html=document.documentElement, panel=document.getElementById('trackerPanel');

        // 3D DRAG
        let isDragging=false,prevX,prevY,rotX=0,rotY=0;
        panel.addEventListener('mousedown',e=>{if(e.target.closest('button,input,a,.sound-card,.slider'))return;isDragging=true;prevX=e.clientX;prevY=e.clientY;panel.style.transition='transform 0.05s linear';});
        document.addEventListener('mousemove',e=>{if(!isDragging)return;rotY+=(e.clientX-prevX)*0.25;rotX-=(e.clientY-prevY)*0.25;rotX=Math.max(-15,Math.min(15,rotX));panel.style.transform=`rotateX(${rotX}deg) rotateY(${rotY}deg)`;prevX=e.clientX;prevY=e.clientY;});
        document.addEventListener('mouseup',()=>{if(!isDragging)return;isDragging=false;panel.style.transition='transform 0.6s cubic-bezier(0.25,0.1,0.25,1)';panel.style.transform='rotateX(0deg) rotateY(0deg)';rotX=0;rotY=0;});
        panel.ondragstart=()=>false;

        // MATRIX RAIN
        const matrixCanvas=document.getElementById('matrixCanvas');
        const mCtx=matrixCanvas.getContext('2d');
        const MCHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*!?+-=><アイウエオカキクケコサシスセソタチツテトナニヌネノ';
        let matrixAnimId=null, mDrops=[];
        function mResize(){matrixCanvas.width=window.innerWidth;matrixCanvas.height=window.innerHeight;const cols=Math.floor(matrixCanvas.width/14);mDrops=Array.from({length:cols},()=>Math.random()*-matrixCanvas.height);}
        function mTick(){
            const accent=getComputedStyle(html).getPropertyValue('--accent').trim()||'#33FF66';
            mCtx.fillStyle='rgba(0,0,0,0.045)';
            mCtx.fillRect(0,0,matrixCanvas.width,matrixCanvas.height);
            mCtx.font='14px VT323,monospace';
            mDrops.forEach((y,i)=>{
                const ch=MCHARS[Math.floor(Math.random()*MCHARS.length)];
                mCtx.fillStyle=Math.random()>0.92?'#ffffff':accent;
                mCtx.fillText(ch,i*14,y);
                if(y>matrixCanvas.height&&Math.random()>0.975)mDrops[i]=0;
                mDrops[i]+=14;
            });
            matrixAnimId=requestAnimationFrame(mTick);
        }
        function startMatrix(){if(matrixAnimId)return;mResize();mTick();}
        function stopMatrix(){if(matrixAnimId){cancelAnimationFrame(matrixAnimId);matrixAnimId=null;}mCtx.clearRect(0,0,matrixCanvas.width,matrixCanvas.height);}
        window.addEventListener('resize',()=>{if(currentStyle==='cyberpunk')mResize();});

        // THEME SYSTEM
        let appReady=false;
        let currentStyle=localStorage.getItem('cft-style')||'default';
        let currentColor=localStorage.getItem('cft-color')||'orange';
        let currentMode =localStorage.getItem('cft-mode') ||'dark';

        function applyMode(mode){currentMode=mode;html.setAttribute('data-mode',mode);localStorage.setItem('cft-mode',mode);document.getElementById('modeDark').classList.toggle('active',mode==='dark');document.getElementById('modeLight').classList.toggle('active',mode==='light');if(appReady)render();}
        function applyStyle(style){
            currentStyle=style;html.setAttribute('data-style',style);localStorage.setItem('cft-style',style);
            document.querySelectorAll('.style-btn').forEach(b=>b.classList.toggle('selected',b.dataset.style===style));
            if(style==='cyberpunk')startMatrix(); else stopMatrix();
            if(appReady)render();
        }
        function applyColor(color){currentColor=color;html.setAttribute('data-color',color);localStorage.setItem('cft-color',color);document.querySelectorAll('.color-dot').forEach(d=>d.classList.toggle('selected',d.dataset.color===color));if(appReady)render();}

        // THEMED COMPLETION METER
        function renderRateMeter(pct){
            const m=document.getElementById('progressMeter');if(!m)return;
            const p=Math.max(0,Math.min(100,pct));
            m.className='rate-meter';m.innerHTML='';
            if(['pixelart','cyberpunk','retro','brutalist'].includes(currentStyle)){
                m.classList.add('seg-meter');const N=20,filled=Math.round(p/5);
                for(let i=0;i<N;i++){const s=document.createElement('span');s.className='seg'+(i<filled?' on':'');m.appendChild(s);}
            }else if(currentStyle==='medieval'){
                m.classList.add('heart-meter');const N=10,full=Math.round(p/10);
                for(let i=0;i<N;i++){const h=document.createElement('span');h.className='heart'+(i<full?' on':'');h.textContent='♥';m.appendChild(h);}
            }else{
                const f=document.createElement('div');f.className='meter-fill';f.style.width='0%';m.appendChild(f);
                void f.offsetWidth;f.style.width=p+'%';
            }
        }

        applyMode(currentMode);applyStyle(currentStyle);applyColor(currentColor);

        const themePanel=document.getElementById('themePanel');
        document.getElementById('themePickerBtn').addEventListener('click',e=>{e.stopPropagation();themePanel.classList.toggle('visible');});
        document.getElementById('closePanelBtn').addEventListener('click',()=>themePanel.classList.remove('visible'));
        document.getElementById('modeDark').addEventListener('click',()=>applyMode('dark'));
        document.getElementById('modeLight').addEventListener('click',()=>applyMode('light'));
        document.querySelectorAll('.style-btn').forEach(b=>b.addEventListener('click',()=>applyStyle(b.dataset.style)));
        document.querySelectorAll('.color-dot').forEach(d=>d.addEventListener('click',()=>applyColor(d.dataset.color)));
        document.addEventListener('click',e=>{if(!themePanel.contains(e.target)&&!document.getElementById('themePickerBtn').contains(e.target))themePanel.classList.remove('visible');});

        // AUDIO ENGINE
        const Audio={
            ctx:null,init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();},
            _osc(freq,type,dur,vol=0.1,at=null){const t=at??this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur);},
            play(type){
                this.init();const ctx=this.ctx,now=ctx.currentTime;
                switch(type){
                    case 'glass':this._osc(1200,'sine',0.55,0.12);break;
                    case 'digital':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(700,now);o.frequency.exponentialRampToValueAtTime(120,now+0.15);g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.15);o.start(now);o.stop(now+0.15);break;}
                    case 'chime':this._osc(523.25,'sine',0.55,0.1,now);this._osc(659.25,'sine',0.55,0.09,now+0.06);this._osc(783.99,'sine',0.55,0.08,now+0.12);break;
                    case 'sonar':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(820,now);g.gain.setValueAtTime(0.18,now);g.gain.exponentialRampToValueAtTime(0.0001,now+1.2);o.start(now);o.stop(now+1.2);setTimeout(()=>{const o2=ctx.createOscillator(),g2=ctx.createGain();o2.connect(g2);g2.connect(ctx.destination);o2.frequency.setValueAtTime(820,ctx.currentTime);g2.gain.setValueAtTime(0.06,ctx.currentTime);g2.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.9);o2.start();o2.stop(ctx.currentTime+0.9);},320);break;}
                    case 'arcade':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(220,now);o.frequency.linearRampToValueAtTime(880,now+0.22);g.gain.setValueAtTime(0.05,now);g.gain.linearRampToValueAtTime(0.0001,now+0.22);o.start(now);o.stop(now+0.22);break;}
                    case 'cash':{this._osc(1568,'sine',0.07,0.15,now);this._osc(1976,'sine',0.15,0.2,now+0.06);const buf=ctx.createBuffer(1,ctx.sampleRate*0.04,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.25));const src=ctx.createBufferSource(),gn=ctx.createGain();src.buffer=buf;src.connect(gn);gn.connect(ctx.destination);gn.gain.setValueAtTime(0.35,now+0.16);src.start(now+0.16);break;}
                    case 'zen':[220,440,660,880].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(f,now);const v=0.12/(i+1);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v,now+0.05);g.gain.exponentialRampToValueAtTime(0.0001,now+3.0);o.start(now);o.stop(now+3.0);});break;
                    case 'laser':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(2200,now);o.frequency.exponentialRampToValueAtTime(150,now+0.28);g.gain.setValueAtTime(0.09,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.28);o.start(now);o.stop(now+0.28);break;}
                    case 'retro8':[330,392,523,659].forEach((n,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(n,now+i*0.075);g.gain.setValueAtTime(0.06,now+i*0.075);g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.075+0.065);o.start(now+i*0.075);o.stop(now+i*0.075+0.065);});break;
                    case 'wood':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(420,now);o.frequency.exponentialRampToValueAtTime(180,now+0.09);g.gain.setValueAtTime(0.25,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.1);o.start(now);o.stop(now+0.1);break;}
                    case 'alarm':for(let i=0;i<4;i++){const f=i%2===0?880:660,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(f,now+i*0.13);g.gain.setValueAtTime(0.045,now+i*0.13);g.gain.setValueAtTime(0.045,now+i*0.13+0.11);g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.13+0.13);o.start(now+i*0.13);o.stop(now+i*0.13+0.13);}break;
                    case 'pop':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(350,now);o.frequency.linearRampToValueAtTime(600,now+0.04);o.frequency.linearRampToValueAtTime(280,now+0.11);g.gain.setValueAtTime(0.22,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.12);o.start(now);o.stop(now+0.12);break;}
                    case 'wind':[0,0.1,0.22].forEach(delay=>{const base=[523,659,784,1047,1319],f=base[Math.floor(Math.random()*base.length)],o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(f,now+delay);g.gain.setValueAtTime(0,now+delay);g.gain.linearRampToValueAtTime(0.09,now+delay+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.8);o.start(now+delay);o.stop(now+delay+0.8);});break;
                    case 'blip':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(900,now);o.frequency.setValueAtTime(700,now+0.03);g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.07);o.start(now);o.stop(now+0.07);break;}
                    default:this._osc(1200,'sine',0.55,0.12);
                }
            }
        };

        const SOUNDS=[{value:'glass',emoji:'\uD83D\uDD14',name:'Glass'},{value:'digital',emoji:'\uD83D\uDCBB',name:'Digital'},{value:'chime',emoji:'\uD83C\uDFB5',name:'Chime'},{value:'sonar',emoji:'\uD83D\uDCE1',name:'Sonar'},{value:'arcade',emoji:'\uD83D\uDFB9',name:'Arcade'},{value:'cash',emoji:'\uD83D\uDCB0',name:'Ca-Ching'},{value:'zen',emoji:'\uD83E\uDED4',name:'Zen Bowl'},{value:'laser',emoji:'\u26A1',name:'Laser'},{value:'retro8',emoji:'\uD83D\uDC7E',name:'8-Bit'},{value:'wood',emoji:'\uD83E\uDEB5',name:'Wood Block'},{value:'alarm',emoji:'\u23F0',name:'Old Alarm'},{value:'pop',emoji:'\uD83D\uDCAC',name:'Pop'},{value:'wind',emoji:'\uD83C\uDF2C',name:'Wind'},{value:'blip',emoji:'\uD83D\uDD35',name:'UI Blip'}];

        function buildSoundGrid(){const g=document.getElementById('soundGrid');g.innerHTML='';SOUNDS.forEach(s=>{const c=document.createElement('div');c.className='sound-card'+(state.soundPreference===s.value?' selected':'');c.dataset.value=s.value;c.innerHTML='<span class="s-emoji">'+s.emoji+'</span><span class="s-name">'+s.name+'</span>';c.addEventListener('click',()=>{Audio.init();state.soundPreference=s.value;document.querySelectorAll('.sound-card').forEach(x=>x.classList.toggle('selected',x.dataset.value===s.value));Audio.play(s.value);saveState();});g.appendChild(c);});}

        const MSGS=[{text:"Feed the log monster!",emoji:"\uD83E\uDD96"},{text:"Ring ring! Log that thing!",emoji:"\u260E"},{text:"Ghosting your tracker?",emoji:"\uD83D\uDC7B"},{text:"Stats or it didn't happen.",emoji:"\uD83D\uDCC9"},{text:"Your logs are lonely.",emoji:"\uD83D\uDE22"},{text:"Donut forget to log!",emoji:"\uD83C\uDF69"},{text:"You're on fire!",emoji:"\uD83D\uDD25"},{text:"Level up!",emoji:"\uD83C\uDD99"},{text:"Keep metrics updated.",emoji:"\uD83D\uDCCA"},{text:"Consistency is key.",emoji:"\uD83D\uDD11"},{text:"Track your progress.",emoji:"\uD83D\uDE80"}];

        const callList=document.getElementById('callListContainer'),emptyState=document.getElementById('emptyState'),progressText=document.getElementById('progressText'),addCallBtn=document.getElementById('addCallBtn'),resetDataBtn=document.getElementById('resetDataBtn'),lastUpdTxt=document.getElementById('lastUpdatedText'),rateChart=document.getElementById('rateChart'),reminderBtn=document.getElementById('reminderToggleBtn'),reminderCtrl=document.getElementById('reminderControls'),reminderSldr=document.getElementById('reminderSlider'),reminderLbl=document.getElementById('reminderTimeLabel'),setReminderB=document.getElementById('setReminderBtn'),previewBtn=document.getElementById('previewSoundBtn'),randomBtn=document.getElementById('randomizeSoundBtn');

        const initState=()=>({calls:[],lastUpdated:null,reminderInterval:0,reminderTimerId:null,soundPreference:'glass'});
        let state=initState();
        function loadState(){const s=localStorage.getItem('callFlowV8');if(s)state={...initState(),...JSON.parse(s),reminderTimerId:null};}
        function saveState(){state.lastUpdated=new Date().toISOString();const{reminderTimerId,...save}=state;localStorage.setItem('callFlowV8',JSON.stringify(save));}
        function relTime(d){if(!d)return'No updates yet.';const sc=Math.round((Date.now()-new Date(d))/1000),mn=Math.round(sc/60);if(sc<10)return'just now';if(sc<60)return sc+'s ago';if(mn<60)return mn+'m ago';return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

        function renderChart(){const dp=[];let done=0;const sorted=[...state.calls].sort((a,b)=>a.number-b.number);sorted.forEach((c,i)=>{if(c.completed)done++;dp.push((done/(i+1))*100);});const W=500,H=100,P=5;rateChart.innerHTML='<defs><linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.3"/><stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs><line class="grid-line" x1="0" y1="'+(H/2)+'" x2="'+W+'" y2="'+(H/2)+'"/>';if(dp.length<2)return;const pts=dp.map((r,i)=>((i/(dp.length-1))*W)+','+(((H-P*2)-(r/100)*(H-P*2)+P))).join(' ');const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');poly.setAttribute('class','chart-line');poly.setAttribute('points',pts);rateChart.appendChild(poly);dp.forEach((r,i)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','chart-point');c.setAttribute('cx',(i/(dp.length-1))*W);c.setAttribute('cy',(H-P*2)-(r/100)*(H-P*2)+P);c.setAttribute('r',4);rateChart.appendChild(c);});}

        function render(){const total=state.calls.length,done=state.calls.filter(c=>c.completed).length,pct=total>0?(done/total)*100:0;progressText.textContent=pct.toFixed(0)+'%';renderRateMeter(pct);lastUpdTxt.textContent='Updated '+relTime(state.lastUpdated);callList.innerHTML='';if(total===0){callList.appendChild(emptyState);emptyState.style.display='flex';}else{emptyState.style.display='none';[...state.calls].reverse().forEach(call=>{const el=document.createElement('div');el.className='call-item flex items-center justify-between p-3 rounded-lg transition-all duration-300 '+(call.completed?'opacity-50':'opacity-100');el.dataset.id=call.id;const time=new Date(call.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});el.innerHTML='<div class="flex-grow pr-2"><p class="'+(call.completed?'line-through subtle-text':'')+'">Call #'+call.number+'</p><p class="text-xs subtle-text">'+time+'</p></div><div class="flex items-center gap-2"><button class="delete-btn p-2 rounded-full transition-colors" style="color:var(--subtle)" onmouseover="this.style.background=\'var(--danger)\';this.style.color=\'#fff\'" onmouseout="this.style.background=\'\';this.style.color=\'var(--subtle)\'" data-id="'+call.id+'" data-number="'+call.number+'"><span class="material-symbols-outlined" style="font-size:16px">delete</span></button><label class="toggle-switch"><input type="checkbox" '+(call.completed?'checked':'')+'><span class="slider"></span></label></div>';callList.appendChild(el);});}reminderSldr.value=state.reminderInterval;reminderLbl.textContent=state.reminderInterval>0?state.reminderInterval+' min':'Off';reminderBtn.style.color=state.reminderInterval>0?'var(--accent)':'var(--subtle)';buildSoundGrid();renderChart();saveState();}

        function nextNum(){return state.calls.length===0?1:Math.max(...state.calls.map(c=>c.number))+1;}
        function addCall(){state.calls.push({id:Date.now(),number:nextNum(),completed:false,createdAt:new Date().toISOString()});render();callList.scrollTop=0;}
        function toggleCall(id){const c=state.calls.find(c=>c.id==id);if(c){c.completed=!c.completed;render();}}
        function deleteCall(id){state.calls=state.calls.filter(c=>c.id!=id);render();}
        function resetAll(){cancelReminder();state=initState();render();}
        function notify(){panel.classList.add('is-reminding');panel.addEventListener('animationend',()=>panel.classList.remove('is-reminding'),{once:true});Audio.play(state.soundPreference||'glass');const msg=MSGS[Math.floor(Math.random()*MSGS.length)];if(Notification.permission==='granted')new Notification('Call Flow Reminder',{body:msg.text});setReminder(state.reminderInterval);}
        function setReminder(mins){cancelReminder();state.reminderInterval=mins;if(mins>0)state.reminderTimerId=setTimeout(notify,mins*60*1000);render();}
        function cancelReminder(){if(state.reminderTimerId){clearTimeout(state.reminderTimerId);state.reminderTimerId=null;}}

        callList.addEventListener('click',e=>{const d=e.target.closest('.delete-btn');if(d)openDeleteModal(d.dataset.id,d.dataset.number);});
        callList.addEventListener('change',e=>{if(e.target.matches('input[type="checkbox"]'))toggleCall(e.target.closest('.call-item').dataset.id);});
        addCallBtn.addEventListener('click',addCall);resetDataBtn.addEventListener('click',openResetModal);
        reminderBtn.addEventListener('click',()=>reminderCtrl.classList.toggle('visible'));
        reminderSldr.addEventListener('input',e=>{reminderLbl.textContent=e.target.value>0?e.target.value+' min':'Off';});
        previewBtn.addEventListener('click',()=>{Audio.init();Audio.play(state.soundPreference||'glass');});
        randomBtn.addEventListener('click',()=>{Audio.init();const s=SOUNDS[Math.floor(Math.random()*SOUNDS.length)];state.soundPreference=s.value;buildSoundGrid();Audio.play(s.value);saveState();});
        setReminderB.addEventListener('click',()=>{const m=parseInt(reminderSldr.value,10);Audio.init();if(m>0&&Notification.permission==='default'){Notification.requestPermission().then(p=>{if(p==='granted')setReminder(m);});}else setReminder(m);reminderCtrl.classList.remove('visible');});
        document.addEventListener('click',e=>{if(!reminderBtn.contains(e.target)&&!reminderCtrl.contains(e.target))reminderCtrl.classList.remove('visible');});

        const resetModal=document.getElementById('resetConfirmModal'),deleteModal=document.getElementById('deleteConfirmModal');
        function mHTML(title,icon,body,cid,clabel){return '<div style="background:var(--card-bg);border:1px solid var(--danger);backdrop-filter:blur(20px)" class="rounded-xl p-6 w-full max-w-md space-y-4 shadow-2xl"><h3 class="text-base font-semibold flex items-center gap-2" style="color:var(--danger)"><span class="material-symbols-outlined">'+icon+'</span>'+title+'</h3><p class="subtle-text text-sm">'+body+'</p><div class="flex justify-end gap-3"><button class="cancel-btn px-4 py-2 rounded-lg text-sm custom-hover" style="color:var(--text)">Cancel</button><button id="'+cid+'" class="text-white font-bold px-4 py-2 rounded-lg text-sm" style="background:var(--danger)">'+clabel+'</button></div></div>';}
        function openResetModal(){resetModal.innerHTML=mHTML('Reset All','warning','Are you sure? All calls will be permanently deleted.','confirmReset','Yes, Reset');resetModal.classList.remove('hidden');resetModal.querySelector('.cancel-btn').addEventListener('click',()=>resetModal.classList.add('hidden'));resetModal.querySelector('#confirmReset').addEventListener('click',()=>{resetAll();resetModal.classList.add('hidden');});}
        function openDeleteModal(id,num){deleteModal.innerHTML=mHTML('Delete Call','delete','Delete <strong>Call #'+num+'</strong>? This cannot be undone.','confirmDelete','Yes, Delete');deleteModal.classList.remove('hidden');deleteModal.querySelector('.cancel-btn').addEventListener('click',()=>deleteModal.classList.add('hidden'));deleteModal.querySelector('#confirmDelete').addEventListener('click',()=>{deleteCall(id);deleteModal.classList.add('hidden');});}

        loadState();appReady=true;setReminder(state.reminderInterval);render();

        (function showNewThemesToast(){
            if(localStorage.getItem('cft-newThemesToastSeen'))return;
            const t=document.getElementById('newThemesToast');if(!t)return;
            setTimeout(()=>{
                t.classList.add('show');
                localStorage.setItem('cft-newThemesToastSeen','1');
                setTimeout(()=>t.classList.remove('show'),4500);
            },900);
        })();
    });
    </script>
</body>
</html>
