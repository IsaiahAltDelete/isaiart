<!DOCTYPE html>
<html lang="en" data-style="default" data-color="auto" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Flow Tracker</title>

    <!-- Restore the saved theme before first paint so there's no flash. -->
    <script>
    (function () {
        try {
            var s = JSON.parse(localStorage.getItem('smt-theme') || 'null') || {};
            var d = document.documentElement;
            if (s.style) d.setAttribute('data-style', s.style);
            if (s.color) d.setAttribute('data-color', s.color);
            if (s.mode)  d.setAttribute('data-mode',  s.mode);
        } catch (e) {}
    })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=VT323&family=Share+Tech+Mono&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Shared theme system — same file the Transfer Rate Tracker loads. -->
    <link rel="stylesheet" href="../smt/theme.css">

    <style>
        /* ── App-specific layout only. Everything themed lives in theme.css. ── */
        body { overflow: hidden; }

        #scene {
            perspective: 1500px;
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 1rem;
            transition: padding var(--dur-mid) var(--ease-out);
        }

        #trackerPanel {
            width: 100%; max-width: 550px; height: 80vh; max-height: 750px;
            padding: 1.5rem 0.5rem 1.5rem 1.5rem;
            cursor: grab; user-select: none;
            border-radius: var(--panel-radius);
            box-shadow: 0 25px 60px -10px var(--shadow);
            background: var(--card-bg);
            backdrop-filter: blur(var(--panel-blur));
            -webkit-backdrop-filter: blur(var(--panel-blur));
            border: var(--panel-border-width) solid var(--border);
            display: flex; flex-direction: column;
        }
        #trackerPanel:active { cursor: grabbing; }
        #trackerPanel.tt-tilting .depth-1 { transform: translateZ(10px); }
        #trackerPanel.tt-tilting .depth-2 { transform: translateZ(20px); }
        #trackerPanel.tt-tilting .depth-3 { transform: translateZ(30px); }
        .depth-1, .depth-2, .depth-3 { transition: transform var(--dur-mid) var(--ease-out); }

        #callListContainer::-webkit-scrollbar { width: 5px; }
        #callListContainer::-webkit-scrollbar-track { background: transparent; }

        #chartContainer { padding: 0.75rem 0; height: 120px; }
        #rateChart .grid-line  { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2,4; }
        #rateChart .chart-line { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: url(#chartGradient); transition: stroke var(--dur-mid); }
        #rateChart .chart-point { fill: var(--accent); stroke: var(--card-bg); stroke-width: 2; transition: r 0.2s; }
        #rateChart .chart-point:hover { r: 6; }

        .is-reminding { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%,90%{transform:translate3d(-1px,0,0)} 20%,80%{transform:translate3d(2px,0,0)} 30%,50%,70%{transform:translate3d(-4px,0,0)} 40%,60%{transform:translate3d(4px,0,0)} }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; cursor: pointer; background: var(--hover-bg); border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; margin-top: -6px; border: 2px solid var(--bg); }

        #reminderControls {
            position: absolute; bottom: 100%; left: 0; width: 340px;
            background: var(--dropdown-bg); border: 1px solid var(--border);
            border-radius: 0.875rem; padding: 1.1rem; margin-bottom: 0.5rem;
            box-shadow: 0 12px 32px var(--shadow);
            opacity: 0; transform: translateY(10px) scale(0.97); pointer-events: none;
            transition: opacity var(--dur-mid) var(--ease-out), transform var(--dur-mid) var(--ease-spring);
            z-index: 50;
        }
        #reminderControls.visible { opacity: 1; transform: none; pointer-events: auto; }

        .sound-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; margin-top: 6px; }
        .sound-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            padding: 6px 3px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 0.5rem;
            cursor: pointer; font-family: var(--font-main);
            transition: transform var(--dur-fast) var(--ease-spring), background-color var(--dur-fast), border-color var(--dur-fast); }
        .sound-card:hover { background: var(--hover-bg); border-color: var(--accent); transform: translateY(-2px); }
        .sound-card.selected { background: var(--accent-trans); border-color: var(--accent); }
        .sound-card .s-emoji { font-size: 1.15rem; line-height: 1; }
        .sound-card .s-name { font-size: 0.55rem; color: var(--subtle); text-align: center; line-height: 1.2; }
        .sound-card.selected .s-name { color: var(--accent); font-weight: 600; }

        #newThemesToast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(120px);
            z-index: 90; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 14px;
            background: var(--dropdown-bg); color: var(--text); border: 1px solid var(--border);
            box-shadow: 0 10px 30px var(--shadow); font-family: var(--font-main); font-size: 0.9rem; font-weight: 600;
            opacity: 0; pointer-events: none;
            transition: transform var(--dur-slow) var(--ease-spring), opacity var(--dur-slow) ease; }
        #newThemesToast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        #newThemesToast .material-symbols-outlined { color: var(--accent); font-size: 1.3rem; }
    </style>
</head>
<body>

    <div id="newThemesToast"><span class="material-symbols-outlined">palette</span><span>3 new themes — try Goop &amp; Newsroom</span></div>

    <div id="scene">
        <main id="trackerPanel">
            <header class="px-4 pb-4 space-y-3 depth-2 tt-divider" style="border-bottom:1px solid var(--border)">
                <h1 class="text-2xl font-bold">Call Flow Tracker</h1>
                <div class="space-y-2">
                    <div class="flex justify-between items-center text-sm"><p class="subtle-text">Overall Completion</p><p id="progressText" class="font-medium">0%</p></div>
                    <div id="progressMeter" class="tt-meter"></div>
                </div>
            </header>

            <div id="chartContainer" class="px-4 depth-3"><svg id="rateChart" width="100%" height="100%" viewBox="0 0 500 100" preserveAspectRatio="none"></svg></div>

            <div id="callListContainer" class="flex-grow overflow-y-auto pr-4 py-2 depth-1" style="border-top:1px solid var(--border)">
                <div id="emptyState" class="flex flex-col items-center justify-center h-full text-center p-4 subtle-text">
                    <span class="material-symbols-outlined mb-2" style="font-size:3rem">phone_in_talk</span>
                    <p class="font-medium">Ready for calls!</p>
                    <p class="text-sm">Add a new call to get started.</p>
                </div>
            </div>

            <footer class="px-4 pt-4 flex items-center justify-between depth-2" style="border-top:1px solid var(--border)">
                <div class="flex items-center gap-2">
                    <button id="resetDataBtn" class="p-2 rounded-full custom-hover transition-colors" style="color:var(--subtle)"><span class="material-symbols-outlined" style="font-size:18px">restart_alt</span></button>
                    <div class="relative">
                        <button id="reminderToggleBtn" class="p-2 rounded-full custom-hover transition-colors" style="color:var(--subtle)"><span class="material-symbols-outlined" style="font-size:18px">notifications</span></button>
                        <div id="reminderControls" class="tt-surface">
                            <div class="mb-3">
                                <label class="tp-label">Reminder Interval</label>
                                <div class="flex items-center gap-3"><input type="range" id="reminderSlider" min="0" max="30" step="1" value="0" class="flex-grow"><span id="reminderTimeLabel" class="text-sm font-medium" style="width:48px;text-align:right">Off</span></div>
                            </div>
                            <div class="mb-3">
                                <div class="flex items-center justify-between mb-1">
                                    <label class="tp-label" style="margin-bottom:0">Notification Sound</label>
                                    <div class="flex items-center gap-1">
                                        <button id="randomizeSoundBtn" class="flex items-center gap-1" style="font-size:0.62rem;padding:3px 7px;border-radius:0.375rem;background:var(--hover-bg);color:var(--subtle);border:1px solid var(--border)" title="Randomize"><span class="material-symbols-outlined" style="font-size:13px">shuffle</span><span>Random</span></button>
                                        <button id="previewSoundBtn" style="padding:3px 6px;border-radius:0.375rem;background:var(--hover-bg);color:var(--subtle);border:1px solid var(--border)" title="Preview"><span class="material-symbols-outlined" style="font-size:13px">play_arrow</span></button>
                                    </div>
                                </div>
                                <div class="sound-grid" id="soundGrid"></div>
                            </div>
                            <button id="setReminderBtn" class="w-full accent-bg tt-btn text-sm font-semibold py-2" style="border-radius:0.375rem">Set Reminder</button>
                        </div>
                    </div>
                    <div class="hidden md:flex items-center gap-1 subtle-text text-xs ml-1"><span class="material-symbols-outlined" style="font-size:14px">history</span><span id="lastUpdatedText"></span></div>
                </div>
                <button id="addCallBtn" class="accent-bg tt-btn font-bold px-4 py-2 flex items-center gap-2 shadow-md" style="border-radius:var(--btn-radius)">
                    <span class="material-symbols-outlined" style="font-size:18px">add_call</span>
                    <span class="hidden sm:inline text-sm">Add New Call</span>
                </button>
            </footer>
        </main>
    </div>

    <div id="resetConfirmModal"  class="fixed inset-0 z-[80] flex items-center justify-center p-4 hidden" style="background:rgba(0,0,0,0.55);backdrop-filter:blur(6px)"></div>
    <div id="deleteConfirmModal" class="fixed inset-0 z-[80] flex items-center justify-center p-4 hidden" style="background:rgba(0,0,0,0.55);backdrop-filter:blur(6px)"></div>

    <script src="../smt/theme.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const panel = document.getElementById('trackerPanel');

        // AUDIO ENGINE
        const Audio={
            ctx:null,init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();},
            _osc(freq,type,dur,vol=0.1,at=null){const t=at??this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur);},
            play(type){
                this.init();const ctx=this.ctx,now=ctx.currentTime;
                switch(type){
                    case 'glass':this._osc(1200,'sine',0.55,0.12);break;
                    case 'digital':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(700,now);o.frequency.exponentialRampToValueAtTime(120,now+0.15);g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.15);o.start(now);o.stop(now+0.15);break;}
                    case 'chime':this._osc(523.25,'sine',0.55,0.1,now);this._osc(659.25,'sine',0.55,0.09,now+0.06);this._osc(783.99,'sine',0.55,0.08,now+0.12);break;
                    case 'sonar':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(820,now);g.gain.setValueAtTime(0.18,now);g.gain.exponentialRampToValueAtTime(0.0001,now+1.2);o.start(now);o.stop(now+1.2);setTimeout(()=>{const o2=ctx.createOscillator(),g2=ctx.createGain();o2.connect(g2);g2.connect(ctx.destination);o2.frequency.setValueAtTime(820,ctx.currentTime);g2.gain.setValueAtTime(0.06,ctx.currentTime);g2.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.9);o2.start();o2.stop(ctx.currentTime+0.9);},320);break;}
                    case 'arcade':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(220,now);o.frequency.linearRampToValueAtTime(880,now+0.22);g.gain.setValueAtTime(0.05,now);g.gain.linearRampToValueAtTime(0.0001,now+0.22);o.start(now);o.stop(now+0.22);break;}
                    case 'cash':{this._osc(1568,'sine',0.07,0.15,now);this._osc(1976,'sine',0.15,0.2,now+0.06);const buf=ctx.createBuffer(1,ctx.sampleRate*0.04,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*0.25));const src=ctx.createBufferSource(),gn=ctx.createGain();src.buffer=buf;src.connect(gn);gn.connect(ctx.destination);gn.gain.setValueAtTime(0.35,now+0.16);src.start(now+0.16);break;}
                    case 'zen':[220,440,660,880].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(f,now);const v=0.12/(i+1);g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v,now+0.05);g.gain.exponentialRampToValueAtTime(0.0001,now+3.0);o.start(now);o.stop(now+3.0);});break;
                    case 'laser':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(2200,now);o.frequency.exponentialRampToValueAtTime(150,now+0.28);g.gain.setValueAtTime(0.09,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.28);o.start(now);o.stop(now+0.28);break;}
                    case 'retro8':[330,392,523,659].forEach((n,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(n,now+i*0.075);g.gain.setValueAtTime(0.06,now+i*0.075);g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.075+0.065);o.start(now+i*0.075);o.stop(now+i*0.075+0.065);});break;
                    case 'wood':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(420,now);o.frequency.exponentialRampToValueAtTime(180,now+0.09);g.gain.setValueAtTime(0.25,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.1);o.start(now);o.stop(now+0.1);break;}
                    case 'alarm':for(let i=0;i<4;i++){const f=i%2===0?880:660,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(f,now+i*0.13);g.gain.setValueAtTime(0.045,now+i*0.13);g.gain.setValueAtTime(0.045,now+i*0.13+0.11);g.gain.exponentialRampToValueAtTime(0.0001,now+i*0.13+0.13);o.start(now+i*0.13);o.stop(now+i*0.13+0.13);}break;
                    case 'pop':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(350,now);o.frequency.linearRampToValueAtTime(600,now+0.04);o.frequency.linearRampToValueAtTime(280,now+0.11);g.gain.setValueAtTime(0.22,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.12);o.start(now);o.stop(now+0.12);break;}
                    case 'wind':[0,0.1,0.22].forEach(delay=>{const base=[523,659,784,1047,1319],f=base[Math.floor(Math.random()*base.length)],o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(f,now+delay);g.gain.setValueAtTime(0,now+delay);g.gain.linearRampToValueAtTime(0.09,now+delay+0.02);g.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.8);o.start(now+delay);o.stop(now+delay+0.8);});break;
                    case 'blip':{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(900,now);o.frequency.setValueAtTime(700,now+0.03);g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.0001,now+0.07);o.start(now);o.stop(now+0.07);break;}
                    default:this._osc(1200,'sine',0.55,0.12);
                }
            }
        };

        const SOUNDS=[{value:'glass',emoji:'🔔',name:'Glass'},{value:'digital',emoji:'💻',name:'Digital'},{value:'chime',emoji:'🎵',name:'Chime'},{value:'sonar',emoji:'📡',name:'Sonar'},{value:'arcade',emoji:'🞹',name:'Arcade'},{value:'cash',emoji:'💰',name:'Ca-Ching'},{value:'zen',emoji:'🫔',name:'Zen Bowl'},{value:'laser',emoji:'⚡',name:'Laser'},{value:'retro8',emoji:'👾',name:'8-Bit'},{value:'wood',emoji:'🪵',name:'Wood Block'},{value:'alarm',emoji:'⏰',name:'Old Alarm'},{value:'pop',emoji:'💬',name:'Pop'},{value:'wind',emoji:'🌬',name:'Wind'},{value:'blip',emoji:'🔵',name:'UI Blip'}];

        function buildSoundGrid(){const g=document.getElementById('soundGrid');g.innerHTML='';SOUNDS.forEach(s=>{const c=document.createElement('div');c.className='sound-card tt-card'+(state.soundPreference===s.value?' selected':'');c.dataset.value=s.value;c.innerHTML='<span class="s-emoji">'+s.emoji+'</span><span class="s-name">'+s.name+'</span>';c.addEventListener('click',()=>{Audio.init();state.soundPreference=s.value;document.querySelectorAll('.sound-card').forEach(x=>x.classList.toggle('selected',x.dataset.value===s.value));Audio.play(s.value);saveState();});g.appendChild(c);});}

        const MSGS=[{text:"Feed the log monster!",emoji:"🦖"},{text:"Ring ring! Log that thing!",emoji:"☎"},{text:"Ghosting your tracker?",emoji:"👻"},{text:"Stats or it didn't happen.",emoji:"📉"},{text:"Your logs are lonely.",emoji:"😢"},{text:"Donut forget to log!",emoji:"🍩"},{text:"You're on fire!",emoji:"🔥"},{text:"Level up!",emoji:"🆙"},{text:"Keep metrics updated.",emoji:"📊"},{text:"Consistency is key.",emoji:"🔑"},{text:"Track your progress.",emoji:"🚀"}];

        const callList=document.getElementById('callListContainer'),emptyState=document.getElementById('emptyState'),progressText=document.getElementById('progressText'),progressMeter=document.getElementById('progressMeter'),addCallBtn=document.getElementById('addCallBtn'),resetDataBtn=document.getElementById('resetDataBtn'),lastUpdTxt=document.getElementById('lastUpdatedText'),rateChart=document.getElementById('rateChart'),reminderBtn=document.getElementById('reminderToggleBtn'),reminderCtrl=document.getElementById('reminderControls'),reminderSldr=document.getElementById('reminderSlider'),reminderLbl=document.getElementById('reminderTimeLabel'),setReminderB=document.getElementById('setReminderBtn'),previewBtn=document.getElementById('previewSoundBtn'),randomBtn=document.getElementById('randomizeSoundBtn');

        const initState=()=>({calls:[],lastUpdated:null,reminderInterval:0,reminderTimerId:null,soundPreference:'glass'});
        let state=initState();
        let shownPct = 0;

        function loadState(){const s=localStorage.getItem('callFlowV8');if(s)state={...initState(),...JSON.parse(s),reminderTimerId:null};}
        function saveState(){state.lastUpdated=new Date().toISOString();const{reminderTimerId,...save}=state;localStorage.setItem('callFlowV8',JSON.stringify(save));}
        function relTime(d){if(!d)return'No updates yet.';const sc=Math.round((Date.now()-new Date(d))/1000),mn=Math.round(sc/60);if(sc<10)return'just now';if(sc<60)return sc+'s ago';if(mn<60)return mn+'m ago';return new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}

        function renderChart(){const dp=[];let done=0;const sorted=[...state.calls].sort((a,b)=>a.number-b.number);sorted.forEach((c,i)=>{if(c.completed)done++;dp.push((done/(i+1))*100);});const W=500,H=100,P=5;rateChart.innerHTML='<defs><linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:var(--accent);stop-opacity:0.3"/><stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs><line class="grid-line" x1="0" y1="'+(H/2)+'" x2="'+W+'" y2="'+(H/2)+'"/>';if(dp.length<2)return;const pts=dp.map((r,i)=>((i/(dp.length-1))*W)+','+(((H-P*2)-(r/100)*(H-P*2)+P))).join(' ');const poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');poly.setAttribute('class','chart-line');poly.setAttribute('points',pts);rateChart.appendChild(poly);
            // draw the line on rather than snapping it in
            if(!SMTTheme.reduceMotion){const len=poly.getTotalLength?poly.getTotalLength():0;if(len){poly.style.strokeDasharray=len;poly.style.strokeDashoffset=len;poly.getBoundingClientRect();poly.style.transition='stroke-dashoffset 700ms cubic-bezier(0.22,1,0.36,1)';poly.style.strokeDashoffset=0;}}
            dp.forEach((r,i)=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','chart-point');c.setAttribute('cx',(i/(dp.length-1))*W);c.setAttribute('cy',(H-P*2)-(r/100)*(H-P*2)+P);c.setAttribute('r',4);rateChart.appendChild(c);});}

        function render(){
            const total=state.calls.length,done=state.calls.filter(c=>c.completed).length,pct=total>0?(done/total)*100:0;
            if(Math.abs(pct-shownPct)>0.4) SMTTheme.countUp(progressText,pct,{decimals:0,suffix:'%'});
            else progressText.textContent=pct.toFixed(0)+'%';
            shownPct=pct;
            SMTTheme.renderMeter(progressMeter,pct,{segments:20,hearts:10});
            lastUpdTxt.textContent='Updated '+relTime(state.lastUpdated);
            callList.innerHTML='';
            if(total===0){callList.appendChild(emptyState);emptyState.style.display='flex';}
            else{
                emptyState.style.display='none';
                [...state.calls].reverse().forEach(call=>{
                    const el=document.createElement('div');
                    el.className='call-item flex items-center justify-between p-3 rounded-lg transition-all duration-300 '+(call.completed?'opacity-50':'opacity-100');
                    el.dataset.id=call.id;
                    const time=new Date(call.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
                    el.innerHTML='<div class="flex-grow pr-2"><p class="'+(call.completed?'line-through subtle-text':'')+'">Call #'+call.number+'</p><p class="text-xs subtle-text">'+time+'</p></div><div class="flex items-center gap-2"><button class="delete-btn p-2 rounded-full transition-colors" style="color:var(--subtle)" onmouseover="this.style.background=\'var(--danger)\';this.style.color=\'#fff\'" onmouseout="this.style.background=\'\';this.style.color=\'var(--subtle)\'" data-id="'+call.id+'" data-number="'+call.number+'"><span class="material-symbols-outlined" style="font-size:16px">delete</span></button><label class="toggle-switch"><input type="checkbox" '+(call.completed?'checked':'')+'><span class="slider"></span></label></div>';
                    callList.appendChild(el);
                });
                SMTTheme.stagger(callList.children);
            }
            reminderSldr.value=state.reminderInterval;
            reminderLbl.textContent=state.reminderInterval>0?state.reminderInterval+' min':'Off';
            reminderBtn.style.color=state.reminderInterval>0?'var(--accent)':'var(--subtle)';
            buildSoundGrid();renderChart();saveState();
        }

        function nextNum(){return state.calls.length===0?1:Math.max(...state.calls.map(c=>c.number))+1;}
        function addCall(){state.calls.push({id:Date.now(),number:nextNum(),completed:false,createdAt:new Date().toISOString()});render();callList.scrollTop=0;}
        function toggleCall(id){const c=state.calls.find(c=>c.id==id);if(c){c.completed=!c.completed;render();}}
        function deleteCall(id){state.calls=state.calls.filter(c=>c.id!=id);render();}
        function resetAll(){cancelReminder();state=initState();shownPct=0;render();}
        function notify(){panel.classList.add('is-reminding');panel.addEventListener('animationend',()=>panel.classList.remove('is-reminding'),{once:true});Audio.play(state.soundPreference||'glass');const msg=MSGS[Math.floor(Math.random()*MSGS.length)];if(Notification.permission==='granted')new Notification('Call Flow Reminder',{body:msg.text});setReminder(state.reminderInterval);}
        function setReminder(mins){cancelReminder();state.reminderInterval=mins;if(mins>0)state.reminderTimerId=setTimeout(notify,mins*60*1000);render();}
        function cancelReminder(){if(state.reminderTimerId){clearTimeout(state.reminderTimerId);state.reminderTimerId=null;}}

        callList.addEventListener('click',e=>{const d=e.target.closest('.delete-btn');if(d)openDeleteModal(d.dataset.id,d.dataset.number);});
        callList.addEventListener('change',e=>{if(e.target.matches('input[type="checkbox"]'))toggleCall(e.target.closest('.call-item').dataset.id);});
        addCallBtn.addEventListener('click',addCall);resetDataBtn.addEventListener('click',openResetModal);
        reminderBtn.addEventListener('click',()=>reminderCtrl.classList.toggle('visible'));
        reminderSldr.addEventListener('input',e=>{reminderLbl.textContent=e.target.value>0?e.target.value+' min':'Off';});
        previewBtn.addEventListener('click',()=>{Audio.init();Audio.play(state.soundPreference||'glass');});
        randomBtn.addEventListener('click',()=>{Audio.init();const s=SOUNDS[Math.floor(Math.random()*SOUNDS.length)];state.soundPreference=s.value;buildSoundGrid();Audio.play(s.value);saveState();});
        setReminderB.addEventListener('click',()=>{const m=parseInt(reminderSldr.value,10);Audio.init();if(m>0&&Notification.permission==='default'){Notification.requestPermission().then(p=>{if(p==='granted')setReminder(m);});}else setReminder(m);reminderCtrl.classList.remove('visible');});
        document.addEventListener('click',e=>{if(!reminderBtn.contains(e.target)&&!reminderCtrl.contains(e.target))reminderCtrl.classList.remove('visible');});

        const resetModal=document.getElementById('resetConfirmModal'),deleteModal=document.getElementById('deleteConfirmModal');
        function mHTML(title,icon,body,cid,clabel){return '<div style="background:var(--dropdown-bg);border:1px solid var(--danger)" class="tt-surface rounded-xl p-6 w-full max-w-md space-y-4 shadow-2xl"><h3 class="text-base font-semibold flex items-center gap-2" style="color:var(--danger)"><span class="material-symbols-outlined">'+icon+'</span>'+title+'</h3><p class="subtle-text text-sm">'+body+'</p><div class="flex justify-end gap-3"><button class="cancel-btn px-4 py-2 rounded-lg text-sm custom-hover" style="color:var(--text)">Cancel</button><button id="'+cid+'" class="text-white font-bold px-4 py-2 rounded-lg text-sm" style="background:var(--danger)">'+clabel+'</button></div></div>';}
        function openResetModal(){resetModal.innerHTML=mHTML('Reset All','warning','Are you sure? All calls will be permanently deleted.','confirmReset','Yes, Reset');resetModal.classList.remove('hidden');resetModal.querySelector('.cancel-btn').addEventListener('click',()=>resetModal.classList.add('hidden'));resetModal.querySelector('#confirmReset').addEventListener('click',()=>{resetAll();resetModal.classList.add('hidden');});}
        function openDeleteModal(id,num){deleteModal.innerHTML=mHTML('Delete Call','delete','Delete <strong>Call #'+num+'</strong>? This cannot be undone.','confirmDelete','Yes, Delete');deleteModal.classList.remove('hidden');deleteModal.querySelector('.cancel-btn').addEventListener('click',()=>deleteModal.classList.add('hidden'));deleteModal.querySelector('#confirmDelete').addEventListener('click',()=>{deleteCall(id);deleteModal.classList.add('hidden');});}

        loadState();

        // ════════════════════ THEME ════════════════════
        SMTTheme.init({
            app: 'flow',
            title: 'Call Flow Tracker',
            emoji: '📞',
            sibling: { label: 'Transfer Rate Tracker', href: 'https://isaiart.com/transfer' },
            legacy: { style: 'cft-style', color: 'cft-color', mode: 'cft-mode' },
            onChange: render
        });
        SMTTheme.tilt(panel, { max: 15, excludeScroll: () => callList });

        setReminder(state.reminderInterval);
        render();

        (function showNewThemesToast(){
            if(localStorage.getItem('smt-newThemesToast-v2'))return;
            const t=document.getElementById('newThemesToast');if(!t)return;
            setTimeout(()=>{
                t.classList.add('show');
                localStorage.setItem('smt-newThemesToast-v2','1');
                setTimeout(()=>t.classList.remove('show'),5000);
            },1100);
        })();
    });
    </script>
</body>
</html>
