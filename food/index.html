<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Food</title>
<meta name="description" content="Six spinning 3D foods. Click one to inspect it: what it is, what it is in code, and its D&amp;D stat block.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">

<style>
/* One white stage, six turntables. Selecting an object pulls it forward and opens a black-ink readout beside it. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --ink-2: rgba(0,0,0,.58);
  --ink-3: rgba(0,0,0,.34);
  --line: rgba(0,0,0,.14);
  --mono: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22,.8,.24,1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--mono); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
canvas#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
canvas#stage.hover { cursor: pointer; }
canvas#stage.drag { cursor: grabbing; }

/* Screen-reader / keyboard entry points that mirror the six objects. */
.picker { position: fixed; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.picker:focus-within { clip-path: none; width: auto; height: auto; left: 16px; bottom: 16px; top: auto; display: flex; gap: 6px; z-index: 5; }
.picker button { font: inherit; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 4px 8px; }

/* The readout. */
.panel {
  position: fixed; z-index: 4; top: 0; right: 0; bottom: 0;
  width: min(520px, 46vw);
  padding: 48px 48px 40px 8px;
  overflow-y: auto; overscroll-behavior: contain;
  pointer-events: none; opacity: 0; visibility: hidden;
  transition: opacity .25s var(--ease), visibility 0s linear .25s;
  scrollbar-width: thin;
}
.panel.open { pointer-events: auto; opacity: 1; visibility: visible; transition: opacity .2s var(--ease); }
.panel .ln { opacity: 0; transform: translateX(10px); }
.panel.open .ln { animation: ln .34s var(--ease) forwards; animation-delay: calc(var(--i) * 28ms + 120ms); }
@keyframes ln { to { opacity: 1; transform: none; } }

.prompt { color: var(--ink-2); font-size: 13px; letter-spacing: .02em; }
.prompt b { color: var(--ink); font-weight: 400; }
.prompt .cur { display: inline-block; width: .6em; height: 1.05em; background: var(--ink); vertical-align: -2px; margin-left: 2px; animation: blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
h1 { font-size: clamp(30px, 3.4vw, 44px); font-weight: 400; line-height: 1; margin: 10px 0 4px; letter-spacing: .04em; text-transform: uppercase; }
.sig { font-size: 13px; color: var(--ink); margin: 0 0 22px; word-break: break-word; }
.sig .k { color: var(--ink-2); }

.sec { margin: 20px 0 6px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
p { margin: 0; }
.lit { font-size: 15px; line-height: 1.55; text-wrap: pretty; }
pre.code {
  margin: 0; font: 13.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word;
  border-left: 2px solid var(--ink); padding: 2px 0 2px 14px;
}
pre.code .c { color: var(--ink-2); }

.stat { border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 10px 0 12px; margin-top: 8px; }
.stat .type { font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.stat .row { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; font-size: 14px; }
.stat .row span:first-child { color: var(--ink-2); }
.abil { display: grid; grid-template-columns: repeat(6, 1fr); margin: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 0; text-align: center; }
.abil div { font-size: 14px; line-height: 1.3; }
.abil small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--ink-2); }
.feat { font-size: 14px; line-height: 1.5; margin-top: 8px; text-wrap: pretty; }
.feat b { font-weight: 400; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.feat.hd { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin-top: 14px; }

.nav { display: flex; gap: 8px; margin-top: 26px; font-size: 13px; }
.nav button {
  font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--ink);
  padding: 6px 12px; cursor: pointer; letter-spacing: .04em;
}
.nav button:hover { background: var(--ink); color: var(--paper); }
.nav button:focus-visible, .x:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.nav .hint { margin-left: auto; align-self: center; color: var(--ink-3); }
.x {
  position: fixed; z-index: 6; top: 16px; right: 16px;
  font: 14px/1 var(--mono); color: var(--ink); background: var(--paper); border: 1px solid var(--ink);
  padding: 8px 10px; cursor: pointer; opacity: 0; visibility: hidden; transition: opacity .2s;
}
.x.open { opacity: 1; visibility: visible; }
.x:hover { background: var(--ink); color: var(--paper); }

@media (max-width: 760px), (max-aspect-ratio: 1/1) {
  .panel {
    top: auto; left: 0; width: auto; height: 66vh; height: 66dvh;
    padding: 14px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(rgba(255,255,255,0), #fff 18px);
  }
  h1 { font-size: 28px; margin-top: 6px; }
  .sig { margin-bottom: 12px; }
  .sec { margin-top: 14px; }
  .lit { font-size: 14px; }
  .nav .hint { display: none; }
  pre.code { white-space: pre; overflow-x: auto; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .panel.open .ln { animation: none; opacity: 1; transform: none; }
  .prompt .cur { animation: none; }
}

/* ───────────────────────── renderer ───────────────────────── */

const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xffffff, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

const CAM_Z = 22, FOV = 30;
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
camera.position.set(0, 0, CAM_Z);

/* Toon light: one key from upper left, a flat fill so shadow bands never go muddy. */
scene.add(new THREE.AmbientLight(0xffffff, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(-6, 9, 10);
scene.add(key);

/* ───────────────────────── helpers ───────────────────────── */

const V2 = (x, y) => new THREE.Vector2(x, y);
/* Three hard bands: shadow, mid, lit. Nearest filtering keeps the steps crisp. */
const RAMP = (() => {
  const t = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
  return t;
})();
const TOON_KEYS = ["map", "side", "transparent", "opacity", "depthWrite"];
function mat(color, o = {}) {
  const p = { color, gradientMap: RAMP };
  TOON_KEYS.forEach((k) => { if (k in o) p[k] = o[k]; });
  const m = new THREE.MeshToonMaterial(p);
  if (o.noOutline) m.userData.noOutline = true;
  if (o.ink) m.userData.ink = o.ink;
  return m;
}

/* Ink outline: an inverted hull pushed out along the normal in screen space, so every object gets the same pen width. */
const uRes = { value: new THREE.Vector2(1, 1) };
const OUTLINE_VS = `
  uniform float uWidth; uniform vec2 uRes;
  void main() {
    vec4 p = vec4(position, 1.0); vec3 n = normal;
    #ifdef USE_INSTANCING
      p = instanceMatrix * p; n = mat3(instanceMatrix) * n;
    #endif
    vec4 clip = projectionMatrix * modelViewMatrix * p;
    vec2 dir = (projectionMatrix * vec4(normalize(normalMatrix * n), 0.0)).xy;
    float len = length(dir);
    if (len > 1e-5) clip.xy += dir / len * uWidth * clip.w * 2.0 / uRes;
    gl_Position = clip;
  }`;
/* Pen widths in CSS px. Small toppings get a finer, tinted line so they do not turn into black dots. */
const inkCache = new Map();
function ink([w, c] = [2.2, 0x000000]) {
  const k = w + ":" + c;
  if (!inkCache.has(k)) inkCache.set(k, new THREE.ShaderMaterial({
    uniforms: { uWidth: { value: w }, uRes, uColor: { value: new THREE.Color(c) } },
    side: THREE.BackSide, vertexShader: OUTLINE_VS,
    fragmentShader: `uniform vec3 uColor; void main() { gl_FragColor = vec4(uColor, 1.0); }`,
  }));
  return inkCache.get(k);
}
/* Hull for hard-edged solids: every corner gets the plain average of the distinct face directions that meet there.
   Area-weighted normals let big caps drown thin walls, which turns the ink inward on vertical edges. */
function cornerHull(geo) {
  const src = geo.index ? geo.toNonIndexed() : geo, p = src.attributes.position, seen = new Map();
  const key = (i) => p.getX(i).toFixed(4) + "," + p.getY(i).toFixed(4) + "," + p.getZ(i).toFixed(4);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let f = 0; f < p.count; f += 3) {
    a.fromBufferAttribute(p, f); b.fromBufferAttribute(p, f + 1); c.fromBufferAttribute(p, f + 2);
    const n = c.clone().sub(b).cross(a.clone().sub(b));
    if (n.lengthSq() < 1e-12) continue;
    n.normalize();
    for (let k = f; k < f + 3; k++) {
      const list = seen.get(key(k)) || [];
      if (!list.some((m) => m.dot(n) > 0.999)) list.push(n);
      seen.set(key(k), list);
    }
  }
  const nrm = new Float32Array(p.count * 3), sum = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    sum.set(0, 0, 0); (seen.get(key(i)) || []).forEach((m) => sum.add(m)); sum.normalize();
    nrm.set([sum.x, sum.y, sum.z], i * 3);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", p.clone());
  out.setAttribute("normal", new THREE.BufferAttribute(nrm, 3));
  return out;
}
function addOutlines(root) {
  const list = [];
  root.traverse((o) => { if (o.isMesh && !o.isInstancedMesh && !o.material.userData?.noOutline && !o.userData.noOutline && o.material.isMeshToonMaterial) list.push(o); });
  list.forEach((o) => { const h = new THREE.Mesh(o.userData.hull || o.geometry, ink(o.material.userData.ink)); h.userData.outline = true; h.raycast = () => {}; o.add(h); });
}

/* Smooth, cheap pseudo-noise: enough for lumps and wobble. */
function n3(x, y, z) {
  return (Math.sin(x * 1.7 + Math.sin(y * 2.3 + z)) * Math.cos(y * 1.3 + z * 2.1)
        + Math.sin(z * 1.9 + x * 0.7 + Math.cos(y * 1.1))) * 0.5;
}

/* Displace every vertex along its normal by fn(position). Works on indexed geometry so seams stay closed. */
function displace(geo, fn) {
  if (!geo.index) { geo.deleteAttribute("normal"); geo.deleteAttribute("uv"); geo = mergeVertices(geo); geo.computeVertexNormals(); }
  const p = geo.attributes.position, nrm = geo.attributes.normal, v = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); n.fromBufferAttribute(nrm, i);
    const d = fn(v, n);
    p.setXYZ(i, v.x + n.x * d, v.y + n.y * d, v.z + n.z * d);
  }
  geo.computeVertexNormals();
  return geo;
}
function blob(r, detail, fn) {
  return displace(new THREE.IcosahedronGeometry(r, detail), fn);
}
/* Lathe a profile; points are [radius, y]. */
function lathe(pts, segs = 96) {
  return new THREE.LatheGeometry(pts.map(([x, y]) => V2(x, y)), segs);
}
/* Profile of a disc with rounded top and bottom edges. */
function roundDisc(r, h, b, steps = 8) {
  const pts = [[0, 0]];
  for (let i = 0; i <= steps; i++) { const a = -Math.PI / 2 + (i / steps) * Math.PI / 2; pts.push([r - b + Math.cos(a) * b, b + Math.sin(a) * b]); }
  for (let i = 0; i <= steps; i++) { const a = (i / steps) * Math.PI / 2; pts.push([r - b + Math.cos(a) * b, h - b + Math.sin(a) * b]); }
  pts.push([0, h]);
  return pts;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function mesh(geo, m, x = 0, y = 0, z = 0) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); return o; }

/* Seeded random so the sesame seeds and sprinkles land the same way every visit. */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ───────────────────────── models ───────────────────────── */

function strawberry(s = 1) {
  const g = new THREE.Group();
  const prof = [];
  for (let i = 0; i <= 20; i++) { const t = i / 20; prof.push([Math.sin(t * Math.PI) * (0.5 + 0.5 * t) * 0.17, t * 0.34]); }
  const body = displace(lathe(prof, 40), (v) => 0.004 * Math.sin(v.y * 90) * Math.sin(Math.atan2(v.x, v.z) * 14));
  g.add(mesh(body, mat(0xd21f33, { ink: [1.4, 0x3a0408] })));
  const leaf = mat(0x3f8a2e, { side: THREE.DoubleSide, noOutline: true });
  for (let i = 0; i < 6; i++) {
    const l = mesh(new THREE.ConeGeometry(0.045, 0.16, 4), leaf);
    l.scale.set(1, 1, 0.25);
    const a = (i / 6) * Math.PI * 2;
    l.position.set(Math.sin(a) * 0.06, 0.335, Math.cos(a) * 0.06);
    l.rotation.set(0, a, 0); l.rotateX(Math.PI / 2 + 0.35);
    g.add(l);
  }
  g.add(mesh(new THREE.CylinderGeometry(0.008, 0.012, 0.07, 6), leaf, 0, 0.37, 0));
  g.scale.setScalar(s);
  return g;
}

function rosette(color, s = 1) {
  const prof = [];
  for (let i = 0; i <= 24; i++) { const t = i / 24; prof.push([Math.max(0.001, Math.pow(1 - t, 1.3) * 0.17 * (1 + 0.35 * Math.sin(t * Math.PI))), t * 0.17]); }
  const geo = displace(lathe(prof, 64), (v) => {
    const th = Math.atan2(v.x, v.z);
    const r = Math.hypot(v.x, v.z);
    return r * 0.12 * Math.cos(th * 7 + v.y * 34);
  });
  const m = mesh(geo, mat(color));
  m.userData.hull = lathe(prof.map(([r, y]) => [r * 1.1, y]), 32);
  m.scale.setScalar(s);
  return m;
}

function plate(r) {
  const prof = [[0, 0], [r * 0.6, 0], [r * 0.64, 0.025], [r * 0.7, 0.04], [r * 0.96, 0.09], [r, 0.11], [r * 0.99, 0.125], [r * 0.95, 0.12], [r * 0.7, 0.065], [0, 0.065]];
  return mesh(lathe(prof, 128), mat(0xdfe5ec));
}

function makeBurger() {
  const g = new THREE.Group();
  const bunMat = mat(0xc77a33);
  const crumbMat = mat(0xf0d9a8, { noOutline: true });

  // bottom bun: golden sides, pale crumb on top where it was cut
  const bot = mesh(lathe(roundDisc(1.0, 0.34, 0.16)), bunMat);
  g.add(bot);
  g.add(mesh(new THREE.CylinderGeometry(0.93, 0.93, 0.02, 96), crumbMat, 0, 0.34, 0));

  // patty: lumpy, charred
  const pattyGeo = displace(lathe(roundDisc(1.07, 0.3, 0.12), 128), (v) => 0.03 * n3(v.x * 6, v.y * 6, v.z * 6) + 0.015 * n3(v.x * 17, v.y * 17, v.z * 17));
  g.add(mesh(pattyGeo, mat(0x4a2716), 0, 0.35, 0));

  // cheese: a square slice whose corners slump over the patty
  const cheeseGeo = new THREE.BoxGeometry(1.8, 0.06, 1.8, 48, 1, 48);
  const cp = cheeseGeo.attributes.position;
  for (let i = 0; i < cp.count; i++) {
    const x = cp.getX(i), z = cp.getZ(i), r = Math.hypot(x, z);
    const over = Math.max(0, r - 0.92);
    cp.setY(i, cp.getY(i) - over * over * 2.4 - over * 0.25 + 0.01 * n3(x * 4, 0, z * 4));
  }
  cheeseGeo.computeVertexNormals();
  const cheese = mesh(cheeseGeo, mat(0xf2ae2e), 0, 0.67, 0);
  cheese.rotation.y = 0.35;
  g.add(cheese);

  // tomato: two thick slices
  const tomMat = mat(0xd8321f, { ink: [1.8, 0x000000] });
  const tomIn = mat(0xf06a4a, { noOutline: true });
  [[0.38, 0.12], [-0.36, -0.2]].forEach(([x, z]) => {
    g.add(mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.1, 64), tomMat, x, 0.89, z));
    g.add(mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.102, 48), tomIn, x, 0.89, z));
  });

  // lettuce: one ruffled leaf ring larger than the bun
  let let1 = new THREE.CylinderGeometry(1.2, 1.2, 0.035, 220, 1);
  let1.deleteAttribute("normal"); let1.deleteAttribute("uv");
  let1 = mergeVertices(let1);
  const lp = let1.attributes.position;
  for (let i = 0; i < lp.count; i++) {
    const x = lp.getX(i), z = lp.getZ(i), y = lp.getY(i), r = Math.hypot(x, z), th = Math.atan2(z, x);
    const k = Math.pow(r / 1.2, 2.5);
    const saw = Math.abs(((th * 72 / Math.PI) % 2 + 2) % 2 - 1);   // 0..1 triangle wave, 72 teeth
    const rr = 1 + k * (0.045 * Math.sin(th * 7) + 0.03 * Math.sin(th * 19) + 0.03 * saw);
    lp.setXYZ(i, x * rr, y + k * (0.05 * Math.sin(th * 13) + 0.02 * Math.sin(th * 41)) - k * 0.07, z * rr);
  }
  let1.computeVertexNormals();
  g.add(mesh(let1, mat(0x6fb33b, { ink: [1.8, 0x1d3d0e] }), 0, 0.82, 0));

  // top bun: dome with a glaze and seeds
  const dome = [[0, 0.0]];
  for (let i = 0; i <= 28; i++) {
    const a = (i / 28) * Math.PI / 2;
    dome.push([1.04 * Math.pow(Math.cos(a), 0.7), 0.08 + 0.74 * Math.pow(Math.sin(a), 0.9)]);
  }
  dome.splice(1, 0, [0.98, 0.0], [1.03, 0.03]);
  const top = mesh(lathe(dome, 128), bunMat, 0, 0.95, 0);
  g.add(top);

  const seedGeo = new THREE.SphereGeometry(1, 10, 6);
  const seeds = new THREE.InstancedMesh(seedGeo, mat(0xf6e7c4), 70);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < 70; i++) {
    const t = (i + 0.5) / 70;
    const a = Math.asin(0.25 + 0.72 * Math.sqrt(t));     // stay on the upper dome
    const th = i * 2.399963 + rnd() * 0.3;
    const rad = 1.04 * Math.pow(Math.cos(a), 0.7), y = 0.08 + 0.74 * Math.pow(Math.sin(a), 0.9);
    const p = new THREE.Vector3(Math.sin(th) * rad * 0.997, y * 0.997 + 0.95, Math.cos(th) * rad * 0.997);
    const nrm = new THREE.Vector3(Math.sin(th) * Math.sin(Math.PI / 2 - a), Math.cos(Math.PI / 2 - a) * 1.4, Math.cos(th) * Math.sin(Math.PI / 2 - a)).normalize();
    q.setFromUnitVectors(up, nrm);
    const spin = new THREE.Quaternion().setFromAxisAngle(up, rnd() * 3);
    q.multiply(spin);
    m4.compose(p, q, new THREE.Vector3(0.042, 0.014, 0.024));
    seeds.setMatrixAt(i, m4);
  }
  g.add(seeds);
  return g;
}

function makePizza() {
  const g = new THREE.Group();

  ch.computeVertexNormals();

  for (let i = 0; i < 4; i++) {

  spots.forEach(([x, z]) => { const p = mesh(pepGeo, pepMat, x * 0.84, 0.128, z * 0.84); p.rotation.set((rnd() - 0.5) * 0.12, rnd() * 6, (rnd() - 0.5) * 0.12); g.add(p); });
  // basil

  [[0.32, 0.35, 0.4], [-0.45, -0.28, 2.2], [0.62, -0.62, 4.1], [-0.18, 0.88, 1.2]].forEach(([x, z, r]) => {
    const b = mesh(new THREE.SphereGeometry(0.12, 16, 8), basilMat, x * 0.84, 0.15, z * 0.84);
    b.scale.set(1, 0.08, 0.55); b.rotation.y = r; g.add(b);

function makeIceCream() {
  const g = new THREE.Group();
  const waffle = canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = "#d9a05e"; c.fillRect(0, 0, w, h);
    c.strokeStyle = "#a9672b"; c.lineWidth = 16;
    for (let i = -w; i < w * 2; i += 64) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i + h, h); c.stroke();
      c.beginPath(); c.moveTo(i, h); c.lineTo(i + h, 0); c.stroke();
    }
    c.strokeStyle = "rgba(255,230,180,.45)"; c.lineWidth = 4;
    for (let i = -w; i < w * 2; i += 64) { c.beginPath(); c.moveTo(i + 9, 0); c.lineTo(i + h + 9, h); c.stroke(); }
  }, [5, 3]);
  const coneMat = mat(0xffffff, { map: waffle });
  const cone = mesh(new THREE.ConeGeometry(0.52, 1.55, 64, 1, true), coneMat, 0, 0.775, 0);
  cone.rotation.x = Math.PI;
  g.add(cone);
  const rimRing = mesh(new THREE.TorusGeometry(0.52, 0.055, 16, 64), mat(0xb97a3c), 0, 1.55, 0);
  rimRing.rotation.x = Math.PI / 2;
  g.add(rimRing);

  // a scoop: lumpy ball with a melting skirt around its base
  function scoop(r, color, y, phase) {
    const geo = blob(r, 6, (v) => {
      let d = r * 0.05 * n3(v.x * 7 + phase, v.y * 7, v.z * 7);
      const below = Math.max(0, -v.y / r - 0.15);
      const th = Math.atan2(v.x, v.z);
      d += below * r * (0.16 + 0.1 * Math.sin(th * 6 + phase));
      return d;
    });
    const m = mesh(geo, mat(color), 0, y, 0);
    m.scale.y = 0.9;
    return m;
  }
  g.add(scoop(0.58, 0xf6ead0, 1.78, 0));
  g.add(scoop(0.5, 0xf3a2b6, 2.42, 2));
  // the melty lip where each scoop slumps over what is under it
  function lip(r, color, y, phase) {
    const geo = displace(new THREE.TorusGeometry(r, r * 0.16, 14, 120), (v) => {
      const th = Math.atan2(v.y, v.x);
      return r * 0.07 * Math.sin(th * 9 + phase) + r * 0.03 * Math.sin(th * 23);
    });
    const m = mesh(geo, mat(color), 0, y, 0);
    m.rotation.x = Math.PI / 2;
    return m;
  }
  g.add(lip(0.55, 0xf6ead0, 1.6, 0));
  g.add(lip(0.46, 0xf3a2b6, 2.1, 1.3));

  // sprinkles on the top scoop
  const sprCols = [0xe8443a, 0xf2c230, 0x3a9ee8, 0x56c26a, 0xffffff, 0xa65be0];
  const sprGeo = new THREE.CapsuleGeometry(0.022, 0.085, 3, 8);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  sprCols.forEach((col, ci) => {
    const inst = new THREE.InstancedMesh(sprGeo, mat(col), 6);
    for (let i = 0; i < 6; i++) {
      const n = ci * 6 + i, t = (n + 0.5) / 36;
      const th = n * 2.399963 + rnd() * 0.4, ph = Math.acos(1 - t * (1 - Math.cos(1.25)));   // equal-area over the cap
      const dir = new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
      const p = dir.clone().multiplyScalar(0.515).add(new THREE.Vector3(0, 2.42, 0));
      p.y = 2.42 + (p.y - 2.42) * 0.9;
      q.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      q.multiply(new THREE.Quaternion().setFromEuler(e.set(Math.PI / 2, rnd() * 6, 0)));
      m4.compose(p, q, new THREE.Vector3(1, 1, 1));
      inst.setMatrixAt(i, m4);
    }
    g.add(inst);
  });

  // cherry with stem
  g.add(mesh(new THREE.SphereGeometry(0.13, 32, 16), mat(0xb3061e), 0.04, 2.97, 0.02));
  const stem = new THREE.CatmullRomCurve3([new THREE.Vector3(0.04, 3.06, 0.02), new THREE.Vector3(0.06, 3.2, 0.02), new THREE.Vector3(0.16, 3.32, 0.0)]);
  g.add(mesh(new THREE.TubeGeometry(stem, 16, 0.012, 6), mat(0x5c3a1a, { noOutline: true })));
  return g;
}

function makeCake() {
  const g = new THREE.Group();

  const H = 1.0, R = 1.05, base = 0.065;

  g.add(mesh(new THREE.CylinderGeometry(R + 0.01, R + 0.01, 0.04, 128), choc, 0, base + H + 0.005, 0));
  const drip = new THREE.CylinderGeometry(R + 0.012, R + 0.012, 1, 256, 24, true);
  const dp = drip.attributes.position;
  for (let i = 0; i < dp.count; i++) {
    const x = dp.getX(i), z = dp.getZ(i), y = dp.getY(i), th = Math.atan2(x, z);
    const t = 0.5 - y; // 0 at top, 1 at bottom
    const s = 0.5 + 0.5 * Math.sin(th * 9) * Math.cos(th * 4 + 1);
    const len = 0.08 + 0.38 * Math.pow(Math.max(0, s), 4);
    const bulge = 1 + 0.012 * Math.sin(t * Math.PI);
    dp.setXYZ(i, x * bulge, base + H + 0.02 - t * len, z * bulge);
  }
  drip.computeVertexNormals();

    const sb = strawberry(0.62); sb.position.set(Math.sin(a + 0.31) * 0.6, base + H + 0.02, Math.cos(a + 0.31) * 0.6); sb.rotation.set(0.5, a + 0.31, 0, "YXZ"); g.add(sb);

  for (let i = 0; i < 48; i++) { const a = (i / 48) * Math.PI * 2; m4.makeTranslation(Math.sin(a) * (R + 0.01), base + 0.05, Math.cos(a) * (R + 0.01)); beads.setMatrixAt(i, m4); }
  g.add(beads);
  // the candle
  const stripes = canvasTex(64, 256, (c, w, h) => {
    c.fillStyle = "#f7f3ec"; c.fillRect(0, 0, w, h);
    c.fillStyle = "#4a8fd9";
    for (let y = -h; y < h * 2; y += 48) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y + 32); c.lineTo(w, y + 52); c.lineTo(0, y + 20); c.fill(); }
  });
  g.add(mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.5, 24), mat(0xffffff, { map: stripes }), 0, base + H + 0.27, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.05, 6), mat(0x222222, { noOutline: true }), 0, base + H + 0.545, 0));
  const flame = new THREE.Group();
  const f1 = mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffb02e, toneMapped: false }));
  f1.scale.set(0.8, 1.9, 0.8);
  const f2 = mesh(new THREE.SphereGeometry(0.028, 12, 10), new THREE.MeshBasicMaterial({ color: 0xfff6c8, toneMapped: false }), 0, -0.02, 0);
  f2.scale.set(0.8, 1.6, 0.8);
  flame.add(f1, f2);
  flame.position.set(0, base + H + 0.64, 0);

  const glow = new THREE.PointLight(0xffa040, 0.6, 2.5);
  glow.position.copy(flame.position);
  g.add(glow);
  return g;
}

function makeSlice() {
  const g = new THREE.Group();
  g.add(plate(1.05));
  const A = THREE.MathUtils.degToRad(50), R = 1.5, base = 0.065;
  const sponge = canvasTex(256, 256, (c, w, h) => {
    c.fillStyle = "#efcf8f"; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 1400; i++) {
      const x = rnd() * w, y = rnd() * h, r = 0.6 + rnd() * 2.2;
      c.fillStyle = rnd() < 0.6 ? "rgba(176,128,58,.35)" : "rgba(255,240,200,.5)";
      c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    }
  }, [2, 1]);
  const sMat = mat(0xffffff, { map: sponge });
  const cream = mat(0xfff7ec);
  const jam = mat(0xb5132f);

  const shape = new THREE.Shape();
  shape.moveTo(0, 0); shape.lineTo(R, 0); shape.absarc(0, 0, R, 0, A, false); shape.lineTo(0, 0);
  function layer(h, m, y, inset = 0) {
    const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 48 });
    geo.rotateX(-Math.PI / 2);
    const o = mesh(geo, m, 0, y, 0);
    o.userData.noOutline = true;
    if (inset) o.scale.set(1 - inset, 1, 1 - inset);
    return o;
  }
  const layers = [[0.26, sMat], [0.055, cream], [0.26, sMat], [0.05, jam], [0.26, sMat]];
  let y = base + 0.005;
  layers.forEach(([h, m]) => { g.add(layer(h, m, y, m === sMat ? 0 : 0.012)); y += h; });
  g.add(layer(0.07, cream, y)); y += 0.07;
  // frosting skin round the back
  const skin = mesh(new THREE.CylinderGeometry(R + 0.02, R + 0.02, y - base - 0.005, 64, 1, true, Math.PI / 2, A), mat(0xfdf1e2, { side: THREE.DoubleSide, noOutline: true }), 0, (y + base + 0.005) / 2, 0);
  g.add(skin);
  // an invisible wedge the size of the whole slice carries its one clean outline
  const outer = new THREE.Shape();
  outer.moveTo(0, 0); outer.lineTo(R + 0.02, 0); outer.absarc(0, 0, R + 0.02, 0, A, false); outer.lineTo(0, 0);
  const proxyGeo = new THREE.ExtrudeGeometry(outer, { depth: y - base - 0.005, bevelEnabled: false, curveSegments: 48 });
  proxyGeo.rotateX(-Math.PI / 2);
  const proxy = mesh(proxyGeo, new THREE.MeshToonMaterial({ colorWrite: false, depthWrite: false }), 0, base + 0.005, 0);
  proxy.userData.hull = cornerHull(proxyGeo);
  g.add(proxy);
  // topping
  const mid = A / 2, tr = R * 0.78;
  const ro = rosette(0xfff7ec, 1.05); ro.position.set(Math.cos(mid) * tr, y, -Math.sin(mid) * tr); g.add(ro);
  const sb = strawberry(0.85); sb.position.set(Math.cos(mid) * tr * 0.62, y, -Math.sin(mid) * tr * 0.62); sb.rotation.set(0.9, Math.PI / 2 - mid, 0, "YXZ"); g.add(sb);
  // rotate so the slice is centred on its own axis of spin
  g.children.slice(1).forEach((c) => { c.position.x -= Math.cos(mid) * R * 0.62; c.position.z += Math.sin(mid) * R * 0.62; });
  return g;
}

function makeBottle() {
  const g = new THREE.Group();

  const prof = [[0, 0.02], [0.3, 0], [0.4, 0.05], [0.43, 0.14]];
  for (let y = 0.18; y <= 2.0; y += 0.02) {
    let r = 0.44;
    const inLabel = y > 0.72 && y < 1.32;
    if (!inLabel && y < 1.62) r -= 0.018 * Math.pow(Math.abs(Math.sin(y * 18)), 0.6);

    prof.push([r, y]);

  // drawn opaque, toon style: water-blue up to the fill line, pale empty plastic above it

    c.fillText("500 mL", w / 2, h / 2 + 58);
    // three drops on the back, so the far side is not blank
    c.fillStyle = "#1d5fae";
    [934, 0, 90].forEach((x) => { c.beginPath(); c.moveTo(x, 80); c.quadraticCurveTo(x + 34, 150, x, 176); c.quadraticCurveTo(x - 34, 150, x, 80); c.fill(); });

  const lab = mesh(new THREE.CylinderGeometry(0.432, 0.432, 0.56, 96, 1, true), mat(0xffffff, { map: label, noOutline: true }), 0, 1.02, 0);
  lab.rotation.y = Math.PI;   // centre of the canvas faces the camera at angle 0
  g.add(lab);
  // cap with grip ridges
  const capGeo = displace(new THREE.CylinderGeometry(0.19, 0.19, 0.22, 96, 4), (v, n) => (Math.abs(n.y) < 0.5 ? 0.008 * Math.sign(Math.sin(Math.atan2(v.x, v.z) * 32)) : 0));
  g.add(mesh(capGeo, mat(0x1f6fd1), 0, 2.27, 0));
  g.add(mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.04, 64), mat(0x1f6fd1), 0, 2.15, 0));
  return g;
}

function buttercream(color) { return mat(color); }

const BUILDERS = { cheeseburger: makeBurger, pizza: makePizza, icecream: makeIceCream, cake: makeCake, cakeslice: makeSlice, water: makeBottle };
const MASS = { cheeseburger: 1, pizza: 1, icecream: 1.14, cake: 1, cakeslice: 0.84, water: 1.12 };
const TILT = { cheeseburger: 0.28, pizza: 0.82, icecream: 0.12, cake: 0.32, cakeslice: 0.38, water: 0.1 };

/* Soft contact shadow, one per object. */
const shadowTex = canvasTex(256, 256, (c, w, h) => {
  const gr = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, "rgba(0,0,0,.12)"); gr.addColorStop(0.66, "rgba(0,0,0,.12)"); gr.addColorStop(0.68, "rgba(0,0,0,0)");
  c.fillStyle = gr; c.fillRect(0, 0, w, h);
});

const items = FOODS.map((f, i) => {
  const root = new THREE.Group(), tilt = new THREE.Group(), spin = new THREE.Group();
  const content = BUILDERS[f.id]();
  const box = new THREE.Box3().setFromObject(content);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  content.position.sub(center);
  spin.add(content);
  tilt.add(spin);
  tilt.rotation.x = TILT[f.id];
  root.add(tilt);
  const foot = Math.max(size.x, size.z);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, toneMapped: false }));
  sh.rotation.x = -Math.PI / 2;
  sh.scale.set(foot * 1.25, foot * 1.25, 1);
  sh.position.y = -size.y / 2 - 0.01;
  tilt.add(sh);
  const t = TILT[f.id], foot2 = Math.max(size.x, size.z);
  const fitW = foot2, fitH = size.y * Math.cos(t) + foot2 * Math.sin(t);
  addOutlines(content);
  content.traverse((o) => { if (o.isMesh) o.userData.item = i; });
  scene.add(root);
  return {
    f, root, spin, content, fitW, fitH, flames: [], shadow: sh,
    pos: new THREE.Vector3(), scl: 0.001, tPos: new THREE.Vector3(), tScl: 1,
    vel: 0.5, angle: i * 1.1, hover: 0 };
});
items.forEach((it) => it.content.traverse((o) => { if (o.userData.flame) it.flames.push(o); }));

/* ───────────────────────── layout ───────────────────────── */

let W = 1, H = 1, viewH = 1, viewW = 1, focused = -1, narrow = false;
function screenToWorld(fx, fy) { return new THREE.Vector3((fx - 0.5) * viewW, (0.5 - fy) * viewH, 0); }

function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  uRes.value.set(W, H);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  viewH = 2 * CAM_Z * Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  viewW = viewH * camera.aspect;
  narrow = W <= 760 || W / H <= 1;
  const cols = narrow ? 2 : 3, rows = narrow ? 3 : 2;
  const padX = narrow ? 0.04 : 0.08, padY = narrow ? 0.16 : 0.1;
  const cw = (1 - padX * 2) / cols, chh = (1 - padY * 2) / rows;
  items.forEach((it, i) => {
    const c = i % cols, r = Math.floor(i / cols);
    const fx = padX + cw * (c + 0.5), fy = padY + chh * (r + 0.5);
    it.gridPos = screenToWorld(fx, fy);
    it.gridScl = (narrow ? 1 : MASS[it.f.id]) * Math.min((cw * viewW * 0.6) / it.fitW, (chh * viewH * 0.6) / it.fitH);
  });
  const focusPos = narrow ? screenToWorld(0.5, 0.17) : screenToWorld(0.3, 0.5);
  const fw = narrow ? viewW * 0.66 : viewW * 0.42, fh = narrow ? viewH * 0.26 : viewH * 0.62;
  items.forEach((it) => { it.focusPos = focusPos; it.focusScl = Math.min(fw / it.fitW, fh / it.fitH); });
  applyTargets();
}

function applyTargets() {
  items.forEach((it, i) => {
    if (focused < 0) { it.tPos.copy(it.gridPos); it.tScl = it.gridScl; }
    else if (i === focused) { it.tPos.copy(it.focusPos); it.tScl = it.focusScl; }
    else { it.tPos.copy(it.gridPos); it.tScl = 0.0001; }
  });
}

/* ───────────────────────── readout ───────────────────────── */

const panel = document.getElementById("panel");
const closeBtn = document.getElementById("close");
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const mod = (n) => { const m = Math.floor((n - 10) / 2); return (m >= 0 ? "+" : "−") + Math.abs(m); };

function renderPanel(i) {
  const f = FOODS[i];
  let n = 0;
  const L = (cls, html, tag = "div") => `<${tag} class="ln ${cls}" style="--i:${n++}">${html}</${tag}>`;
  const sig = f.sig.map((s, k) => (k % 2 === 0 ? `<span class="k">${esc(s)}</span>` : esc(s))).join("");
  const code = esc(f.code).replace(/&lt;c&gt;(.*?)&lt;\/c&gt;/g, '<span class="c">$1</span>');
  const feats = (title, list) => list ? L("feat hd", title) + list.map(([a, b]) => L("feat", `<b>${esc(a)}</b> ${esc(b)}`)).join("") : "";
  panel.innerHTML =
    L("prompt", `&gt; inspect <b>food[${i}]</b> --id=${f.id}<span class="cur"></span>`) +
    L("", esc(f.name), "h1") +
    L("sig", sig) +
    L("sec", "// literal") +
    L("lit", esc(f.lit), "p") +
    L("sec", "// in code") +
    L("code", code, "pre") +
    L("sec", "// d&amp;d stat block") +
    `<div class="stat ln" style="--i:${n++}">` +
      `<div class="type">${esc(f.type)}</div>` +
      `<div class="row"><span>Armor Class</span><span>${esc(f.ac)}</span></div>` +
      `<div class="row"><span>Hit Points</span><span>${esc(f.hp)}</span></div>` +
      `<div class="row"><span>Speed</span><span>${esc(f.speed)}</span></div>` +
      `<div class="abil">${["STR", "DEX", "CON", "INT", "WIS", "CHA"].map((k, j) => `<div><small>${k}</small>${f.abil[j]} (${mod(f.abil[j])})</div>`).join("")}</div>` +
      f.extra.map(([a, b]) => `<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join("") +
    `</div>` +
    feats("traits", f.traits) + feats("actions", f.actions) + feats("reactions", f.reactions) +
    L("nav", `<button type="button" data-go="-1">&lt; prev</button><button type="button" data-go="1">next &gt;</button><span class="hint">←/→ · esc</span>`);
  panel.scrollTop = 0;
  // restart the line-in animation
  panel.classList.remove("open"); void panel.offsetWidth; panel.classList.add("open");
}

function focus(i) {
  if (i === focused) return;
  focused = i;
  if (i < 0) {
    panel.classList.remove("open"); closeBtn.classList.remove("open");
    document.title = "Food";
  } else {
    renderPanel(i); closeBtn.classList.add("open");
    items[i].vel = Math.max(items[i].vel, 3);
    document.title = `${FOODS[i].name} · Food`;
  }
  applyTargets();
}

panel.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]");
  if (b) focus((focused + +b.dataset.go + FOODS.length) % FOODS.length);
});
closeBtn.addEventListener("click", () => focus(-1));
addEventListener("keydown", (e) => {
  if (e.key === "Escape") focus(-1);
  else if (focused >= 0 && e.key === "ArrowRight") focus((focused + 1) % FOODS.length);
  else if (focused >= 0 && e.key === "ArrowLeft") focus((focused + FOODS.length - 1) % FOODS.length);
});
const picker = document.getElementById("picker");
FOODS.forEach((f, i) => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = f.name;
  b.addEventListener("click", () => focus(i)); picker.appendChild(b);
});

/* ───────────────────────── input ───────────────────────── */

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  ndc.set((x / W) * 2 - 1, -(y / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const targets = focused < 0 ? items.map((it) => it.content) : [items[focused].content];
  const hit = ray.intersectObjects(targets, true)[0];
  return hit ? hit.object.userData.item : -1;
}
let down = null, hovered = -1;
canvas.addEventListener("pointerdown", (e) => {
  down = { x: e.clientX, y: e.clientY, lx: e.clientX, t: performance.now(), moved: false, item: focused >= 0 ? focused : pick(e.clientX, e.clientY) };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (down) {
    if (Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 6) { down.moved = true; canvas.classList.add("drag"); }
    if (down.moved && down.item >= 0) { const it = items[down.item]; const dx = e.clientX - down.lx; it.angle += dx * 0.012; it.vel = dx * 0.6; }
    down.lx = e.clientX;
    return;
  }
  if (e.pointerType === "mouse") {
    hovered = pick(e.clientX, e.clientY);
    canvas.classList.toggle("hover", hovered >= 0);
  }
});
canvas.addEventListener("pointerup", (e) => {
  canvas.classList.remove("drag");
  if (down && !down.moved) {
    const i = pick(e.clientX, e.clientY);
    if (focused < 0) { if (i >= 0) focus(i); }
    else if (i < 0) focus(-1);
  }
  down = null;
});
canvas.addEventListener("pointerleave", () => { if (!down) { hovered = -1; canvas.classList.remove("hover"); } });

/* ───────────────────────── loop ───────────────────────── */

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const params = new URLSearchParams(location.search);
const still = params.has("still");
let last = performance.now(), time = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  const k = 1 - Math.exp(-dt * 7);
  items.forEach((it, i) => {
    it.pos.lerp(it.tPos, k);
    it.hover += ((i === hovered && focused < 0 ? 1 : 0) - it.hover) * (1 - Math.exp(-dt * 10));
    it.scl += (it.tScl - it.scl) * k;
    const s = Math.max(0.0001, it.scl * (1 + it.hover * 0.06));
    it.root.position.copy(it.pos);
    it.root.scale.setScalar(s);
    it.root.visible = s > 0.002;
    const base = still ? 0 : reduced ? 0.12 : i === focused ? 0.35 : 0.55;
    if (!down || down.item !== i) it.vel += (base - it.vel) * (1 - Math.exp(-dt * 1.6));
    if (still) it.vel = 0;
    it.angle += it.vel * dt;
    it.spin.rotation.y = it.angle;
    it.flames.forEach((fl) => { fl.scale.set(1 + 0.08 * Math.sin(time * 23), 1 + 0.14 * Math.sin(time * 17 + 1), 1); fl.rotation.z = 0.06 * Math.sin(time * 11); });
  });
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener("resize", layout);
layout();
items.forEach((it) => { it.pos.copy(it.tPos); });
if (params.has("item")) { const i = FOODS.findIndex((f) => f.id === params.get("item")); if (i >= 0) { focus(i); items.forEach((it) => { it.pos.copy(it.tPos); it.scl = it.tScl; }); } }
if (still) { items.forEach((it, i) => { it.angle = +(params.get("a") ?? 0.6 + i * 0.4); it.scl = it.tScl; }); window.__items = items; }
requestAnimationFrame(frame);
</script>
</body>
</html>
