<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>macOS Tahoe Simulator</title>
<meta name="description" content="A self-contained macOS Tahoe 26 desktop simulator — windows, Dock, System Settings, Wi-Fi setup, Safari, Terminal and the full restart / erase flow.">
<!-- Real SF Pro is used when it's installed locally (Apple ships it with Xcode /
     developer.apple.com/fonts). Otherwise Inter — the closest free match to SF —
     is pulled from Google Fonts, falling back to Segoe UI Variable offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   macOS Tahoe 26 Simulator — self-contained, no dependencies
   ============================================================
   Layout note: the whole desktop is authored at a fixed logical
   1512×982 (a 14" MacBook Pro's default scaled resolution) and
   then transform-scaled to fit whatever viewport it lands in.
   Every coordinate in this file is therefore in "Mac points",
   which is what makes window dragging / Dock magnification math
   simple and resolution-independent.
   ============================================================ */
:root{
  /* system palette — dark is the default appearance */
  --blue:#0a84ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
  --purple:#bf5af2; --yellow:#ffd60a; --pink:#ff375f; --teal:#40c8e0;
  --graphite:#98989d; --indigo:#5e5ce6; --brown:#ac8e68;
  --accent:#0a84ff; --accent-txt:#fff;

  /* surfaces */
  --win:rgba(28,28,30,.86);
  --win-solid:#1e1e20;
  --sidebar:rgba(48,48,52,.5);
  --chrome:rgba(52,52,56,.62);
  --field:rgba(255,255,255,.07);
  --field-b:rgba(255,255,255,.12);
  --card:rgba(255,255,255,.055);
  --card-h:rgba(255,255,255,.09);
  --sep:rgba(255,255,255,.10);
  --sep-s:rgba(255,255,255,.06);
  --txt:#fff;
  --txt2:rgba(235,235,245,.62);
  --txt3:rgba(235,235,245,.32);
  --menu:rgba(42,42,46,.72);
  --menu-b:rgba(255,255,255,.14);
  --shadow:0 24px 70px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.4);
  --shadow-key:0 34px 90px rgba(0,0,0,.66),0 3px 14px rgba(0,0,0,.45);

  /* Liquid Glass — Tahoe leans on a heavier blur than Sonoma did, but the
     saturate has to stay modest or a warm wallpaper stains every window. */
  --glass:saturate(135%) blur(34px);
  --glass-lite:saturate(125%) blur(20px);

  --sf:"SF Pro Display","SF Pro Text","SF Pro",-apple-system,BlinkMacSystemFont,
       "Inter","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px;
  --menubar-h:26px;
}
.light{
  --blue:#007aff; --green:#34c759; --red:#ff3b30; --orange:#ff9500;
  --purple:#af52de; --yellow:#ffcc00; --pink:#ff2d55; --teal:#30b0c7;
  --accent:#007aff;
  --win:rgba(246,246,247,.90);
  --win-solid:#f6f6f7;
  --sidebar:rgba(240,240,242,.55);
  --chrome:rgba(250,250,252,.7);
  --field:rgba(255,255,255,.75);
  --field-b:rgba(0,0,0,.13);
  --card:rgba(0,0,0,.035);
  --card-h:rgba(0,0,0,.06);
  --sep:rgba(0,0,0,.10);
  --sep-s:rgba(0,0,0,.06);
  --txt:#000;
  --txt2:rgba(60,60,67,.62);
  --txt3:rgba(60,60,67,.30);
  --menu:rgba(250,250,252,.72);
  --menu-b:rgba(0,0,0,.10);
  --shadow:0 24px 60px rgba(0,0,0,.24),0 2px 8px rgba(0,0,0,.14);
  --shadow-key:0 34px 80px rgba(0,0,0,.32),0 3px 12px rgba(0,0,0,.18);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#06070a;
  background-image:radial-gradient(1400px 800px at 50% -20%,#161c28 0%,#06070a 65%);
  font-family:var(--sf);color:#fff;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:default;text-align:left}
input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
ul,ol{list-style:none}
svg{display:block}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* thin macOS overlay scrollbars — applied to .scroll and to every sidebar,
   which scrolls on its own and would otherwise get chunky default bars */
.scroll,.wsidebar,.nt-list,.ml-list,.ms-scroll,.sf-start,.term{scrollbar-width:thin;scrollbar-color:rgba(140,140,150,.5) transparent}
.scroll::-webkit-scrollbar,.wsidebar::-webkit-scrollbar,.nt-list::-webkit-scrollbar,.ml-list::-webkit-scrollbar,.ms-scroll::-webkit-scrollbar,.sf-start::-webkit-scrollbar,.term::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-track,.wsidebar::-webkit-scrollbar-track,.nt-list::-webkit-scrollbar-track,.ml-list::-webkit-scrollbar-track,.ms-scroll::-webkit-scrollbar-track,.sf-start::-webkit-scrollbar-track,.term::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb,.wsidebar::-webkit-scrollbar-thumb,.nt-list::-webkit-scrollbar-thumb,.ml-list::-webkit-scrollbar-thumb,.ms-scroll::-webkit-scrollbar-thumb,.sf-start::-webkit-scrollbar-thumb,.term::-webkit-scrollbar-thumb{background:rgba(140,140,150,.42);border-radius:9px;border:2.5px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-thumb:hover,.wsidebar::-webkit-scrollbar-thumb:hover{background:rgba(150,150,160,.7);background-clip:content-box}
.scroll{overflow:auto}
.noscroll::-webkit-scrollbar{display:none}
.noscroll{scrollbar-width:none}

/* ---------- Rig / device ---------- */
#rig{position:relative;transform-origin:center center}
#mac{
  position:relative;width:1512px;height:982px;border-radius:22px;
  padding:12px 12px 12px;
  background:linear-gradient(160deg,#4c4f56,#26282d 30%,#6e737c 52%,#26282d 74%,#4c4f56);
  box-shadow:0 60px 130px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);
}
#mac::before{content:"";position:absolute;inset:6px;border-radius:17px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);pointer-events:none;z-index:20}
#mac::after{ /* the notch */
  content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:170px;height:26px;background:#000;border-radius:0 0 11px 11px;z-index:30;pointer-events:none;
}
#screen{
  position:relative;width:100%;height:100%;border-radius:11px;overflow:hidden;
  background:#000;isolation:isolate;font-size:13px;color:var(--txt);cursor:default;
  user-select:none;-webkit-user-select:none;
}
#screen.text-select,#screen .selectable{user-select:text;-webkit-user-select:text}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9998;transition:opacity .5s}

/* legend rail beside the Mac */
#hints{position:absolute;left:calc(100% + 26px);top:50%;transform:translateY(-50%);width:196px;font-size:11.5px;line-height:1.55;color:rgba(255,255,255,.5)}
#hints h4{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:rgba(255,255,255,.34);margin:0 0 8px}
#hints div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#hints kbd{font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,.09);border-radius:4px;padding:1px 5px;color:rgba(255,255,255,.72);white-space:nowrap}
@media (max-width:1400px){#hints{display:none}}

/* ---------- Wallpaper ---------- */
#wall{position:absolute;inset:0;background-size:cover;background-position:center;transition:filter .6s,transform .6s}
#wall.zoom{transform:scale(1.06);filter:blur(24px) brightness(.7)}
.wp-tahoe{background:
  radial-gradient(120% 90% at 78% 12%,rgba(255,214,120,.95) 0%,rgba(255,148,60,.85) 26%,transparent 58%),
  radial-gradient(100% 80% at 12% 88%,rgba(120,60,190,.85) 0%,rgba(48,22,88,.9) 45%,transparent 74%),
  linear-gradient(155deg,#2b1852 0%,#7b2f6d 34%,#d4623c 66%,#ffb547 100%)}
.wp-sequoia{background:
  radial-gradient(110% 80% at 20% 10%,rgba(120,180,255,.6),transparent 60%),
  linear-gradient(165deg,#1a1040 0%,#3a1f6e 32%,#6f3a95 60%,#c06a9a 84%,#f4b183 100%)}
.wp-sonoma{background:
  radial-gradient(120% 90% at 70% 20%,rgba(255,120,180,.55),transparent 62%),
  linear-gradient(150deg,#04143c 0%,#0b3a7a 38%,#1f77b8 66%,#5fd0d8 100%)}
.wp-macintosh{background:
  radial-gradient(100% 100% at 50% 0%,#3b3f47,#16181c 62%,#0a0b0d 100%)}
.wp-solar{background:
  radial-gradient(90% 70% at 26% 18%,#ffd166,#f77f00 40%,#9d0208 78%,#370617 100%)}
.wp-abyss{background:
  radial-gradient(120% 100% at 50% 110%,#0e7490 0%,#083344 42%,#020617 82%)}
.wp-forest{background:
  radial-gradient(90% 80% at 30% 20%,#a7f3d0,#10b981 34%,#065f46 66%,#022c22 100%)}
.wp-mono{background:linear-gradient(160deg,#e7e7ea 0%,#b8bcc4 46%,#7c828d 100%)}
.wp-graphite{background:linear-gradient(160deg,#26282e 0%,#3a3d45 48%,#141518 100%)}
.wp-bloom{background:
  radial-gradient(80% 70% at 74% 26%,#f0abfc,transparent 62%),
  radial-gradient(80% 70% at 22% 74%,#38bdf8,transparent 62%),
  linear-gradient(150deg,#1e1b4b,#4c1d95 52%,#831843 100%)}

/* ---------- Desktop ---------- */
#desktop{position:absolute;inset:var(--menubar-h) 0 0 0;z-index:5}
.dt-icon{
  position:absolute;width:86px;padding:6px 4px 5px;border-radius:8px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.dt-icon .gl{width:52px;height:52px;display:grid;place-items:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
/* long file names wrap to two lines and then ellipsis, the way the Finder does */
.dt-icon .nm{font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);line-height:1.25;
  padding:1px 4px;border-radius:4px;max-width:100%;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dt-icon.sel .nm{-webkit-line-clamp:4}
.dt-icon.sel .nm{background:var(--accent);color:#fff;text-shadow:none}
.dt-icon.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
#dt-marquee{position:absolute;border:1px solid color-mix(in srgb,var(--accent) 80%,#fff);
  background:color-mix(in srgb,var(--accent) 18%,transparent);pointer-events:none;z-index:9;border-radius:1px}

/* ---------- Menu bar ---------- */
/* Tahoe's menu bar is fully transparent — it reads straight onto the wallpaper. */
#menubar{
  position:absolute;top:0;left:0;right:0;height:var(--menubar-h);z-index:700;
  display:flex;align-items:center;padding:0 8px 0 12px;gap:0;
  font-size:13px;font-weight:400;color:#fff;
  text-shadow:0 0 6px rgba(0,0,0,.28);
}
#menubar.opaque{background:var(--menu);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);text-shadow:none;color:var(--txt)}
/* white-on-white is unreadable, so a bright wallpaper flips the bar to dark ink
   — macOS does the same trick by sampling the wallpaper behind the bar */
#menubar.on-light:not(.opaque){color:#1c1c1e;text-shadow:0 0 7px rgba(255,255,255,.75)}
#menubar.on-light:not(.opaque) .mb-item:hover,#menubar.on-light:not(.opaque) .mb-item.open{background:rgba(0,0,0,.12)}
.on-light-wall .dt-icon .nm{text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 10px rgba(0,0,0,.35)}
#menubar .mb-left{display:flex;align-items:center;gap:0;flex:1;min-width:0;overflow:hidden}
#menubar .mb-right{display:flex;align-items:center;gap:0;flex:none}
.mb-item{padding:2px 10px;border-radius:5px;white-space:nowrap;display:flex;align-items:center;gap:5px;height:19px;line-height:1}
.mb-item.bold{font-weight:700}
.mb-item:hover,.mb-item.open{background:rgba(255,255,255,.20)}
.light #menubar.opaque .mb-item:hover,.light #menubar.opaque .mb-item.open{background:rgba(0,0,0,.10)}
#menubar.opaque .mb-item.open{background:var(--accent);color:#fff}
.mb-item.dis{opacity:.4;pointer-events:none}
.mb-clock{font-size:12.5px;padding-right:4px;padding-left:8px}
.mb-battery{display:flex;align-items:center;gap:4px}
.mb-batt-pct{font-size:12px}

/* menus */
.menu{
  position:absolute;z-index:900;min-width:200px;padding:5px;border-radius:11px;
  background:var(--menu);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:.5px solid var(--menu-b);box-shadow:0 18px 44px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.2);
  color:var(--txt);font-size:13.5px;
  animation:menuIn .13s cubic-bezier(.2,.9,.3,1);transform-origin:top left;
}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.menu.up{transform-origin:bottom left;animation-name:menuUp}
@keyframes menuUp{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:8px;padding:4px 9px;border-radius:6px;white-space:nowrap;min-height:22px}
.mi:hover:not(.dis):not(.sep):not(.hdr){background:var(--accent);color:#fff}
.mi:hover:not(.dis):not(.sep):not(.hdr) .key,.mi:hover:not(.dis) .mi-sub{color:rgba(255,255,255,.8)}
.mi .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mi .key{color:var(--txt2);font-size:13px;margin-left:20px;letter-spacing:.5px}
.mi .tick{width:13px;flex:none;font-size:12px;display:grid;place-items:center}
.mi.dis{opacity:.36}
.mi.hdr{font-size:11.5px;color:var(--txt2);padding:5px 9px 3px;font-weight:600;letter-spacing:.2px}
.mi.sep{height:1px;background:var(--sep);margin:5px 9px;padding:0;min-height:0;border-radius:0}
.mi .arrow{margin-left:auto;opacity:.6;font-size:10px}
.mi-ic{width:16px;flex:none;display:grid;place-items:center;opacity:.85}

/* ---------- Dock ---------- */
/* The reveal strip only exists while the Dock is hidden — otherwise it would
   swallow clicks on any window sitting near the bottom of the screen. */
#dockzone{position:absolute;left:0;right:0;bottom:0;height:64px;z-index:690;pointer-events:none}
#dock{
  position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:695;
  display:flex;align-items:flex-end;gap:6px;padding:6px;
  border-radius:22px;background:rgba(120,120,130,.24);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:.5px solid rgba(255,255,255,.16);
  box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.16);
  transition:transform .34s cubic-bezier(.2,.9,.3,1),opacity .25s;
}
.light #dock{background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.6)}
#dock.hidden{transform:translateX(-50%) translateY(96px);opacity:0}
#dock.left{left:6px;bottom:auto;top:50%;transform:translateY(-50%);flex-direction:column;align-items:center}
#dock.left.hidden{transform:translateY(-50%) translateX(-110px);opacity:0}
#dock.right{left:auto;right:6px;bottom:auto;top:50%;transform:translateY(-50%);flex-direction:column;align-items:center}
#dock.right.hidden{transform:translateY(-50%) translateX(110px);opacity:0}
.dock-i{position:relative;width:52px;height:52px;flex:none;display:flex;align-items:flex-end;justify-content:center;
  transition:width .16s cubic-bezier(.2,.9,.3,1),height .16s cubic-bezier(.2,.9,.3,1),margin .16s}
.dock-i .app-ic{width:100%;height:100%;transition:inherit}
.dock-i.bounce{animation:dockBounce .58s cubic-bezier(.28,.9,.35,1) 2}
@keyframes dockBounce{0%,100%{transform:translateY(0)}42%{transform:translateY(-24px)}}
.dock-dot{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;
  background:rgba(255,255,255,.85);opacity:0;transition:opacity .2s}
.light .dock-dot{background:rgba(0,0,0,.6)}
.dock-i.running .dock-dot{opacity:1}
#dock.left .dock-dot,#dock.right .dock-dot{bottom:auto;left:-4px;top:50%;transform:translateY(-50%)}
.dock-sep{width:1px;align-self:stretch;margin:6px 4px;background:rgba(255,255,255,.22);flex:none}
#dock.left .dock-sep,#dock.right .dock-sep{width:auto;height:1px;align-self:stretch;margin:4px 6px}
.dock-tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);
  padding:3px 10px;border-radius:8px;background:var(--menu);backdrop-filter:var(--glass);
  border:.5px solid var(--menu-b);font-size:12.5px;white-space:nowrap;color:var(--txt);
  box-shadow:0 8px 20px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .12s;z-index:5}
.dock-i:hover .dock-tip{opacity:1}
#dock.left .dock-tip,#dock.right .dock-tip{bottom:auto;left:calc(100% + 12px);top:50%;transform:translateY(-50%)}
#dock.right .dock-tip{left:auto;right:calc(100% + 12px)}

/* app icons */
.app-ic{border-radius:23%;display:grid;place-items:center;overflow:hidden;position:relative;
  box-shadow:0 3px 8px rgba(0,0,0,.32);flex:none}
.app-ic.round{border-radius:50%}
.app-ic.plain{box-shadow:none;background:none!important}
.app-ic>svg{width:100%;height:100%}

/* ---------- Window manager ---------- */
#winlayer{position:absolute;inset:0;z-index:100}
.win{
  position:absolute;display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--radius);background:var(--win);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  box-shadow:var(--shadow);border:.5px solid rgba(255,255,255,.14);
  color:var(--txt);min-width:340px;min-height:200px;
}
.light .win{border-color:rgba(0,0,0,.10)}
.win.key{box-shadow:var(--shadow-key);z-index:2}
.win.opening{animation:winIn .28s cubic-bezier(.2,.9,.3,1)}
@keyframes winIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.win.closing{animation:winOut .18s ease-in forwards;pointer-events:none}
@keyframes winOut{to{opacity:0;transform:scale(.93)}}
.win.dragging{transition:none!important}
.win.snapping{transition:left .22s cubic-bezier(.2,.9,.3,1),top .22s cubic-bezier(.2,.9,.3,1),width .22s cubic-bezier(.2,.9,.3,1),height .22s cubic-bezier(.2,.9,.3,1),border-radius .22s}
.win.min{animation:genie .34s cubic-bezier(.5,0,.75,.3) forwards;pointer-events:none}
@keyframes genie{to{opacity:0;transform:scale(.06) translateY(420px);filter:blur(3px)}}
.win.unmin{animation:genieBack .32s cubic-bezier(.2,.9,.3,1)}
@keyframes genieBack{from{opacity:0;transform:scale(.06) translateY(420px);filter:blur(3px)}to{opacity:1;transform:none}}
.win.full{border-radius:0;border:none}
.win.shaded{height:auto!important;min-height:0}
.win.shaded .win-body{display:none}

/* toolbar / title bar */
.win-bar{
  height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--chrome);border-bottom:.5px solid var(--sep);position:relative;z-index:3;
}
.win-bar.tall{height:52px}
.win-bar.plain{background:transparent;border-bottom:none}
.win-title{font-size:13.5px;font-weight:600;letter-spacing:-.1px;position:absolute;left:0;right:0;text-align:center;pointer-events:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 130px}
.win-title .sub{font-weight:400;color:var(--txt2);font-size:11px;display:block;margin-top:-1px}
.win:not(.key) .win-bar{opacity:.72}
.tl{display:flex;align-items:center;gap:8px;flex:none;z-index:4}
.tl b{width:12px;height:12px;border-radius:50%;display:grid;place-items:center;font-size:9px;
  color:rgba(0,0,0,.55);font-weight:900;line-height:1;position:relative;cursor:default;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.tl b span{opacity:0;transition:opacity .1s;font-family:var(--sf);transform:translateY(-.5px)}
.tl:hover b span{opacity:1}
.tl .c{background:#ff5f57}.tl .m{background:#febc2e}.tl .z{background:#28c840}
.win:not(.key) .tl b{background:#5b5b60;box-shadow:none}
.light .win:not(.key) .tl b{background:#d5d5d8}
.win:not(.key) .tl:hover .c{background:#ff5f57}
.win:not(.key) .tl:hover .m{background:#febc2e}
.win:not(.key) .tl:hover .z{background:#28c840}
.win-body{flex:1;min-height:0;display:flex;overflow:hidden;position:relative}
.win-grip{position:absolute;z-index:8}
.win-grip.n{top:0;left:8px;right:8px;height:5px;cursor:ns-resize}
.win-grip.s{bottom:0;left:8px;right:8px;height:5px;cursor:ns-resize}
.win-grip.w{left:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.win-grip.e{right:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.win-grip.nw{top:0;left:0;width:12px;height:12px;cursor:nwse-resize}
.win-grip.ne{top:0;right:0;width:12px;height:12px;cursor:nesw-resize}
.win-grip.sw{bottom:0;left:0;width:12px;height:12px;cursor:nesw-resize}
.win-grip.se{bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize}
.win.full .win-grip{display:none}
#snaphint{position:absolute;z-index:660;border-radius:10px;background:rgba(120,170,255,.22);
  border:2px solid rgba(160,200,255,.7);pointer-events:none;opacity:0;transition:all .15s;backdrop-filter:blur(3px)}

/* generic split layout inside a window */
.wsidebar{width:220px;flex:none;background:var(--sidebar);border-right:.5px solid var(--sep-s);
  padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.wmain{flex:1;min-width:0;overflow:auto;position:relative;background:color-mix(in srgb,var(--win-solid) 55%,transparent)}
.sb-h{font-size:11px;font-weight:600;color:var(--txt2);padding:10px 8px 4px;letter-spacing:.1px}
.sb-i{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;font-size:13px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.sb-i:hover{background:var(--card)}
.sb-i.on{background:color-mix(in srgb,var(--accent) 88%,#000 0%);color:#fff}
.sb-i.on:hover{background:var(--accent)}
.sb-i .gl{width:19px;flex:none;display:grid;place-items:center;color:var(--accent)}
.sb-i.on .gl{color:#fff}
.sb-i .cnt{margin-left:auto;font-size:11.5px;color:var(--txt2);flex:none}
.sb-i.on .cnt{color:rgba(255,255,255,.8)}

/* ---------- UI kit ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;
  padding:4px 12px;border-radius:7px;background:var(--field);border:.5px solid var(--field-b);
  box-shadow:0 1px 1px rgba(0,0,0,.12);white-space:nowrap;transition:filter .1s}
.btn:hover{filter:brightness(1.18)}
.btn:active{filter:brightness(.9)}
.light .btn{background:#fff;box-shadow:0 1px 1.5px rgba(0,0,0,.10)}
.btn.p{background:var(--accent);border-color:transparent;color:#fff;font-weight:500}
.btn.d{color:var(--red)}
.btn.dis{opacity:.4;pointer-events:none}
.btn.big{padding:7px 18px;font-size:13.5px;border-radius:9px}
.btn.round{border-radius:99px}
.icobtn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--txt);flex:none}
.icobtn:hover{background:var(--card-h)}
.icobtn.on{background:var(--accent);color:#fff}
.icobtn.dis{opacity:.32;pointer-events:none}

.sw{width:38px;height:22px;border-radius:99px;background:rgba(120,120,128,.34);position:relative;flex:none;
  transition:background .22s;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.28);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(16px)}
.sw.dis{opacity:.4;pointer-events:none}

.chk{width:15px;height:15px;border-radius:4px;background:var(--field);border:.5px solid var(--field-b);flex:none;
  display:grid;place-items:center;color:#fff}
.chk.on{background:var(--accent);border-color:transparent}
.chk:not(.on) svg{opacity:0}
.radio{width:15px;height:15px;border-radius:50%;background:var(--field);border:.5px solid var(--field-b);flex:none;
  display:grid;place-items:center}
.radio.on{background:var(--accent);border-color:transparent}
.radio.on::after{content:"";width:5px;height:5px;border-radius:50%;background:#fff}

.seg{display:inline-flex;background:rgba(120,120,128,.24);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:3px 13px;border-radius:6px;font-size:12.5px;white-space:nowrap;color:var(--txt)}
.seg button.on{background:var(--win-solid);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.light .seg button.on{background:#fff}

.fld{background:var(--field);border:.5px solid var(--field-b);border-radius:7px;padding:4px 9px;font-size:13px;
  display:flex;align-items:center;gap:7px;min-width:0}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 26%,transparent)}
.fld input{flex:1;min-width:0}
.fld input::placeholder{color:var(--txt3)}

.slider{position:relative;height:22px;display:flex;align-items:center;flex:1;min-width:60px}
.slider .track{height:4px;border-radius:2px;background:rgba(120,120,128,.34);width:100%;overflow:hidden}
.slider .fill{height:100%;background:var(--accent)}
.slider .knob{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.35);transform:translateX(-50%);pointer-events:none}
.slider.thick{height:34px}
.slider.thick .track{height:26px;border-radius:9px;background:rgba(255,255,255,.16)}
.light .slider.thick .track{background:rgba(0,0,0,.10)}
.slider.thick .fill{background:#fff}
.light .slider.thick .fill{background:rgba(0,0,0,.55)}
.slider.thick .knob{display:none}
.slider.thick .gl{position:absolute;left:7px;color:rgba(0,0,0,.45);pointer-events:none;mix-blend-mode:luminosity}

/* settings-style grouped rows */
.grp{background:var(--card);border-radius:10px;overflow:hidden;margin-bottom:16px;border:.5px solid var(--sep-s)}
.grp-h{font-size:12.5px;font-weight:600;color:var(--txt2);margin:0 0 6px 4px}
.grp-f{font-size:11.5px;color:var(--txt2);line-height:1.45;margin:-10px 4px 16px;padding:0 2px}
.grp-f b{color:var(--txt);font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:38px;position:relative;font-size:13px}
.row+.row::before{content:"";position:absolute;top:0;left:12px;right:0;height:.5px;background:var(--sep-s)}
.row.tap:hover{background:var(--card-h)}
.row .ic{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;color:#fff}
.row .lbl{flex:1;min-width:0}
.row .lbl .sub{font-size:11.5px;color:var(--txt2);margin-top:1px;line-height:1.35}
.row .val{color:var(--txt2);font-size:13px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.row .chev{color:var(--txt3);flex:none;display:grid;place-items:center}
.row.destructive .lbl{color:var(--red)}
.row.center{justify-content:center}
.row.center .lbl{flex:none;text-align:center}

/* dialogs, sheets, popovers */
#overlay{position:absolute;inset:0;z-index:800;pointer-events:none}
#overlay>*{pointer-events:auto}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.001);z-index:1}
.pop{position:absolute;z-index:900;border-radius:16px;background:var(--menu);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:.5px solid var(--menu-b);box-shadow:0 22px 60px rgba(0,0,0,.5);color:var(--txt);
  animation:popIn .18s cubic-bezier(.2,.9,.3,1);transform-origin:top right}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(-8px)}to{opacity:1;transform:none}}

.alert-back{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:950;display:grid;place-items:center;
  animation:fade .16s;backdrop-filter:blur(1px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.alert{width:280px;padding:18px 18px 14px;border-radius:14px;background:var(--menu);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:.5px solid var(--menu-b);
  box-shadow:0 30px 80px rgba(0,0,0,.55);text-align:center;color:var(--txt);
  animation:alertIn .22s cubic-bezier(.2,1.3,.4,1)}
@keyframes alertIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.alert .ic{margin:0 auto 10px}
.alert h3{font-size:13.5px;font-weight:700;margin-bottom:5px;line-height:1.32}
.alert p{font-size:11.5px;color:var(--txt2);line-height:1.42;margin-bottom:14px;white-space:pre-line}
/* Buttons are always passed as [dismissive, …, default]. macOS puts the default
   button rightmost in a row and topmost in a stack, hence the reversed column. */
.alert .acts{display:flex;flex-direction:column-reverse;gap:7px}
.alert .acts.h{flex-direction:row;justify-content:flex-end}
.alert .acts .btn{width:100%;justify-content:center;padding:5px 12px}
.alert input{width:100%;margin-bottom:12px}

/* window-attached sheet */
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.22);z-index:40;display:flex;justify-content:center;
  align-items:flex-start;animation:fade .16s;border-radius:inherit}
.sheet{width:min(460px,86%);margin-top:-1px;border-radius:0 0 12px 12px;background:var(--menu);
  backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:.5px solid var(--menu-b);border-top:none;box-shadow:0 24px 60px rgba(0,0,0,.5);
  padding:22px;color:var(--txt);animation:sheetIn .3s cubic-bezier(.2,.9,.3,1);max-height:86%;overflow:auto}
@keyframes sheetIn{from{transform:translateY(-100%)}to{transform:none}}
.sheet h3{font-size:14px;font-weight:700;margin-bottom:6px}
.sheet p.d{font-size:11.5px;color:var(--txt2);line-height:1.45;margin-bottom:14px}
.sheet .acts{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.frow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.frow>label{width:104px;flex:none;text-align:right;font-size:13px;color:var(--txt)}
.frow>.fld,.frow>.seg,.frow>.picker{flex:1;min-width:0}
.picker{background:var(--field);border:.5px solid var(--field-b);border-radius:7px;padding:4px 9px;font-size:13px;
  display:flex;align-items:center;gap:8px;justify-content:space-between}
.picker:hover{filter:brightness(1.15)}

/* toast + notifications */
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(14px);z-index:960;
  background:var(--menu);backdrop-filter:var(--glass);border:.5px solid var(--menu-b);color:var(--txt);
  padding:9px 18px;border-radius:11px;font-size:13px;box-shadow:0 16px 40px rgba(0,0,0,.4);
  opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;max-width:520px;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#hud{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:960;width:190px;padding:20px;
  border-radius:20px;background:rgba(60,60,64,.6);backdrop-filter:var(--glass);border:.5px solid rgba(255,255,255,.12);
  display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;transition:opacity .2s;pointer-events:none}
#hud.on{opacity:1}
#hud .bars{display:flex;gap:2px;width:150px;height:8px}
#hud .bars i{flex:1;background:rgba(255,255,255,.24);border-radius:1px}
#hud .bars i.on{background:#fff}

#notifs{position:absolute;top:calc(var(--menubar-h) + 8px);right:10px;z-index:750;display:flex;flex-direction:column;gap:8px;width:334px}
.ntf{background:var(--menu);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:.5px solid var(--menu-b);border-radius:15px;padding:11px 13px;color:var(--txt);
  box-shadow:0 12px 34px rgba(0,0,0,.4);display:flex;gap:10px;align-items:flex-start;
  animation:ntfIn .32s cubic-bezier(.2,.9,.3,1)}
@keyframes ntfIn{from{opacity:0;transform:translateX(60px) scale(.96)}to{opacity:1;transform:none}}
.ntf.out{animation:ntfOut .26s ease-in forwards}
@keyframes ntfOut{to{opacity:0;transform:translateX(60px) scale(.96)}}
.ntf .app-ic{width:34px;height:34px}
.ntf .bd{flex:1;min-width:0}
.ntf .t{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ntf .t time{font-weight:400;color:var(--txt2);font-size:11px;flex:none}
.ntf .m{font-size:12px;color:var(--txt2);line-height:1.35;margin-top:1px}

/* ---------- Boot / login / lock / power ---------- */
#boot{position:absolute;inset:0;z-index:9000;background:#000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:36px;transition:opacity .6s}
#boot.gone{opacity:0;pointer-events:none}
#boot .apple{color:#f5f5f7;animation:bootPulse 2.4s ease-in-out infinite}
@keyframes bootPulse{0%,100%{opacity:.92}50%{opacity:.62}}
#boot .prog{width:216px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
#boot .prog i{display:block;height:100%;width:0;background:#f5f5f7;border-radius:3px;transition:width .3s linear}
#boot .msg{position:absolute;bottom:64px;font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.2px}
#boot .spin{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(255,255,255,.16);
  border-top-color:rgba(255,255,255,.8);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(140,140,150,.28);
  border-top-color:var(--txt2);animation:spin .7s linear infinite;flex:none}

/* The opaque backdrop is load-bearing: blurring .lk-wall makes its composited
   layer slightly translucent, and without this the menu bar reads through the
   Lock Screen. */
#lock{position:absolute;inset:0;z-index:8000;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:0;background:#0a0a0c;
  transition:opacity .5s,transform .5s cubic-bezier(.4,0,.2,1)}
#lock.gone{opacity:0;pointer-events:none;transform:scale(1.04)}
#lock .lk-wall{position:absolute;inset:0;background-size:cover;filter:blur(26px) brightness(.56);transform:scale(1.1)}
#lock .lk-clock{position:absolute;top:52px;left:0;right:0;text-align:center;color:#fff;
  text-shadow:0 2px 22px rgba(0,0,0,.4);z-index:2}
#lock .lk-clock .t{font-size:82px;font-weight:600;letter-spacing:-2.4px;line-height:1}
#lock .lk-clock .d{font-size:17px;font-weight:500;opacity:.9;margin-top:2px}
#lock .lk-user{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff}
.lk-av{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:600;
  color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.2)}
#lock .lk-name{font-size:17px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.lk-pw{display:flex;align-items:center;gap:0;width:222px;height:32px;border-radius:99px;
  background:rgba(255,255,255,.20);border:.5px solid rgba(255,255,255,.28);backdrop-filter:blur(20px);
  padding:0 4px 0 14px;transition:box-shadow .2s}
.lk-pw:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.22)}
.lk-pw.shake{animation:shake .42s}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.lk-pw input{flex:1;min-width:0;font-size:13.5px;color:#fff;letter-spacing:2px}
.lk-pw input::placeholder{color:rgba(255,255,255,.62);letter-spacing:0}
.lk-go{width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.26);display:grid;place-items:center;color:#fff;flex:none}
.lk-go:hover{background:rgba(255,255,255,.4)}
#lock .lk-hint{font-size:11.5px;color:rgba(255,255,255,.62);height:15px;text-align:center}
#lock .lk-foot{position:absolute;bottom:26px;display:flex;gap:34px;z-index:2}
#lock .lk-foot button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;
  color:rgba(255,255,255,.82);text-shadow:0 1px 6px rgba(0,0,0,.5)}
#lock .lk-foot button:hover{color:#fff}
#lock .lk-foot .cir{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);
  backdrop-filter:blur(16px);display:grid;place-items:center;border:.5px solid rgba(255,255,255,.2)}

#power{position:absolute;inset:0;z-index:9500;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:30px}
#power.on{opacity:1;pointer-events:auto}
#screensaver{position:absolute;inset:0;z-index:7000;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;
  display:grid;place-items:center;overflow:hidden}
#screensaver.on{opacity:1;pointer-events:auto}
#screensaver .ss-clock{color:#fff;font-size:110px;font-weight:200;letter-spacing:-4px;
  animation:drift 26s ease-in-out infinite alternate;text-shadow:0 4px 40px rgba(0,0,0,.6)}
@keyframes drift{from{transform:translate(-140px,-90px)}to{transform:translate(140px,90px)}}

/* ---------- Control Center ---------- */
#cc{position:absolute;top:calc(var(--menubar-h) + 6px);right:8px;width:314px;z-index:880;
  padding:11px;border-radius:19px;background:var(--menu);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:.5px solid var(--menu-b);box-shadow:0 24px 60px rgba(0,0,0,.5);color:var(--txt);
  display:none;grid-template-columns:1fr 1fr;gap:9px;animation:popIn .2s cubic-bezier(.2,.9,.3,1);transform-origin:top right}
#cc.on{display:grid}
.cc-card{background:rgba(120,120,128,.22);border-radius:14px;padding:10px;position:relative;overflow:hidden}
.light .cc-card{background:rgba(255,255,255,.5)}
.cc-card.wide{grid-column:span 2}
.cc-tog{display:flex;align-items:center;gap:9px;padding:4px 2px;border-radius:9px}
.cc-tog+.cc-tog{margin-top:4px}
.cc-tog:hover{background:rgba(255,255,255,.06)}
.cc-cir{width:29px;height:29px;border-radius:50%;background:rgba(140,140,150,.5);display:grid;place-items:center;
  color:#fff;flex:none;transition:background .18s}
.cc-cir.on{background:var(--accent)}
.cc-lbl{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.2}
.cc-lbl small{display:block;font-weight:400;font-size:11px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-chev{color:var(--txt3);flex:none;opacity:0;transition:opacity .15s}
.cc-tog:hover .cc-chev{opacity:1}
.cc-card .ttl{font-size:11.5px;color:var(--txt2);margin-bottom:7px;font-weight:600}
.cc-sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:100%;padding:4px 0}
.cc-sq .cc-cir{width:34px;height:34px}
.cc-sq span{font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.cc-np{display:flex;align-items:center;gap:10px}
.cc-np .art{width:36px;height:36px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:16px}
.cc-np .meta{flex:1;min-width:0}
.cc-np .meta b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-np .meta small{color:var(--txt2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

/* ---------- Notification Center ---------- */
#nc{position:absolute;top:0;right:0;bottom:0;width:352px;z-index:870;
  background:rgba(0,0,0,.14);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border-left:.5px solid rgba(255,255,255,.1);padding:calc(var(--menubar-h) + 10px) 10px 14px;
  overflow-y:auto;display:none;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
#nc.on{display:block;transform:none}
#nc .wdg{background:var(--menu);border:.5px solid var(--menu-b);border-radius:16px;padding:13px;margin-bottom:9px;
  color:var(--txt);box-shadow:0 8px 24px rgba(0,0,0,.24)}
#nc .wdg h4{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt2);margin-bottom:7px;
  display:flex;align-items:center;gap:5px}
.nc-empty{text-align:center;color:rgba(255,255,255,.6);padding:40px 20px;font-size:13px}
.light #nc{background:rgba(255,255,255,.2)}
.light .nc-empty{color:var(--txt2)}

/* ---------- Spotlight ---------- */
#spot{position:absolute;top:22%;left:50%;transform:translateX(-50%) scale(.96);width:660px;z-index:940;
  border-radius:18px;background:var(--menu);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);
  border:.5px solid var(--menu-b);box-shadow:0 40px 100px rgba(0,0,0,.6);color:var(--txt);
  overflow:hidden;display:none;opacity:0;transition:opacity .16s,transform .16s cubic-bezier(.2,.9,.3,1)}
#spot.on{display:block;opacity:1;transform:translateX(-50%) scale(1)}
#spot .q{display:flex;align-items:center;gap:12px;padding:14px 18px}
#spot .q input{flex:1;font-size:24px;font-weight:300;letter-spacing:-.3px}
#spot .q input::placeholder{color:var(--txt3)}
#spot .res{max-height:388px;overflow-y:auto;border-top:.5px solid var(--sep);padding:6px}
#spot .sh{font-size:11px;font-weight:600;color:var(--txt2);padding:7px 10px 3px;text-transform:uppercase;letter-spacing:.5px}
.sp-i{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:8px;font-size:13.5px}
.sp-i.on{background:var(--accent);color:#fff}
.sp-i.on .sub,.sp-i.on .kind{color:rgba(255,255,255,.78)}
.sp-i .gl{width:26px;height:26px;flex:none;display:grid;place-items:center}
.sp-i .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-i .sub{font-size:11.5px;color:var(--txt2);display:block;margin-top:-1px}
.sp-i .kind{font-size:11.5px;color:var(--txt3);flex:none}

/* ---------- Mission Control / App Switcher ---------- */
/* top padding has to clear the Spaces strip (6px gap + a 70px thumbnail),
   otherwise the first row of window cards lands on top of it */
#mc{position:absolute;inset:0;z-index:860;display:none;background:rgba(0,0,0,.42);backdrop-filter:blur(22px);
  padding:calc(var(--menubar-h) + 94px) 30px 30px;opacity:0;transition:opacity .22s}
#mc.on{display:block;opacity:1}
#mc .spaces{position:absolute;top:calc(var(--menubar-h) + 6px);left:0;right:0;display:flex;justify-content:center;gap:10px}
#mc .space{width:112px;height:70px;border-radius:7px;background-size:cover;background-position:center;
  border:1.5px solid rgba(255,255,255,.22);display:grid;place-items:end center;font-size:10.5px;color:#fff;padding-bottom:3px;
  text-shadow:0 1px 3px #000}
#mc .space.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
#mc .grid{display:flex;flex-wrap:wrap;gap:22px;align-content:flex-start;justify-content:center;height:100%;overflow:auto}
#mc .card{border-radius:9px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.5);position:relative;
  transition:transform .18s;background:var(--win-solid);border:.5px solid rgba(255,255,255,.15)}
#mc .card:hover{transform:scale(1.045)}
#mc .card .cap{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;font-size:11.5px;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.75));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mc .mc-empty{color:rgba(255,255,255,.62);text-align:center;padding-top:120px;font-size:15px}

#appsw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:945;display:none;
  padding:18px;border-radius:22px;background:rgba(60,60,64,.55);backdrop-filter:var(--glass);
  border:.5px solid rgba(255,255,255,.14);box-shadow:0 30px 70px rgba(0,0,0,.55);max-width:1100px}
#appsw.on{display:block}
#appsw .strip{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#appsw .it{width:76px;height:76px;border-radius:14px;display:grid;place-items:center;position:relative}
#appsw .it.on{background:rgba(255,255,255,.2)}
#appsw .it .app-ic{width:60px;height:60px}
#appsw .nm{text-align:center;color:#fff;font-size:12.5px;margin-top:10px;height:16px}

/* ---------- System Settings ---------- */
.st-search{margin:2px 4px 8px;position:sticky;top:0;z-index:2}
.st-body{padding:16px 20px 26px;max-width:100%}
.st-hero{display:flex;align-items:center;gap:14px;padding:12px;background:var(--card);border-radius:10px;margin-bottom:16px;
  border:.5px solid var(--sep-s)}
.st-hero .av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:600;color:#fff;flex:none}
.st-hero .nm{font-size:16px;font-weight:600}
.st-hero .sb{font-size:11.5px;color:var(--txt2);margin-top:2px}
.st-title{font-size:19px;font-weight:700;letter-spacing:-.2px;margin:0 0 14px}
.st-title .bk{color:var(--accent);font-size:13px;font-weight:400;display:block;margin-bottom:4px}
.st-pane{animation:paneIn .2s ease-out}
@keyframes paneIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.st-pane.back{animation-name:paneBack}
@keyframes paneBack{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.st-empty{padding:70px 24px;text-align:center;color:var(--txt2)}
.st-empty h3{font-size:15px;color:var(--txt);margin-bottom:5px}
.wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px}
.wallgrid .w{border-radius:9px;height:78px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.24);
  border:2px solid transparent}
.wallgrid .w.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent)}
.wallgrid .cap{position:absolute;bottom:0;left:0;right:0;font-size:10.5px;color:#fff;padding:14px 6px 4px;
  background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:center}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatch{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.swatch.on{box-shadow:0 0 0 2.5px var(--win-solid),0 0 0 4.5px currentColor}
.apr{display:flex;gap:14px}
.apr .o{text-align:center}
.apr .sw2{width:90px;height:58px;border-radius:7px;border:2px solid transparent;overflow:hidden;position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.24)}
.apr .o.on .sw2{border-color:var(--accent)}
.apr .lb{font-size:11.5px;margin-top:5px;color:var(--txt2)}
.apr .o.on .lb{color:var(--txt)}
.bar-meter{height:9px;border-radius:5px;background:rgba(120,120,128,.28);overflow:hidden;display:flex;margin:6px 0 9px}
.bar-meter i{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:11.5px;color:var(--txt2)}
.legend s{text-decoration:none;display:flex;align-items:center;gap:5px}
.legend b{width:9px;height:9px;border-radius:2.5px;display:block}
.about-tbl{font-size:12.5px}
.about-tbl .r{display:flex;padding:5px 0;gap:12px;border-bottom:.5px solid var(--sep-s)}
.about-tbl .r:last-child{border:none}
.about-tbl .k{width:150px;flex:none;color:var(--txt2);text-align:right}
.about-tbl .v{flex:1;min-width:0}

/* ---------- Wi-Fi ---------- */
.wf-row{display:flex;align-items:center;gap:10px;padding:7px 12px;min-height:38px;position:relative;font-size:13px}
.wf-row+.wf-row::before{content:"";position:absolute;top:0;left:12px;right:0;height:.5px;background:var(--sep-s)}
.wf-row:hover{background:var(--card-h)}
.wf-row.static:hover{background:none}
.wf-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-name .sub{font-size:11px;color:var(--txt2);margin-top:1px}
.wf-meta{display:flex;align-items:center;gap:8px;flex:none;color:var(--txt2)}
.wf-tick{width:15px;flex:none;color:var(--accent);display:grid;place-items:center}
.wf-more{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--txt2);flex:none}
.wf-more:hover{background:var(--card-h);color:var(--txt)}
.pwmeter{height:4px;border-radius:2px;background:rgba(120,120,128,.3);overflow:hidden;margin-top:7px}
.pwmeter i{display:block;height:100%;width:0;transition:width .25s,background .25s}

/* ---------- Finder ---------- */
.fi-path{display:flex;align-items:center;gap:2px;font-size:11.5px;color:var(--txt2);
  padding:4px 12px;border-top:.5px solid var(--sep-s);background:var(--chrome);flex:none}
.fi-path b{font-weight:400;display:flex;align-items:center;gap:3px}
.fi-path b:hover{color:var(--txt)}
.fi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;padding:14px;align-content:start}
.fi-item{padding:8px 4px;border-radius:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px}
.fi-item:hover{background:var(--card)}
.fi-item.sel{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.fi-item .gl{width:50px;height:50px;display:grid;place-items:center}
.fi-item .nm{font-size:11.5px;line-height:1.25;word-break:break-word;padding:1px 4px;border-radius:4px;max-width:100%}
.fi-item.sel .nm{background:var(--accent);color:#fff}
.fi-list{font-size:12.5px}
.fi-head{display:flex;padding:5px 12px;font-size:11px;color:var(--txt2);border-bottom:.5px solid var(--sep);
  position:sticky;top:0;background:var(--chrome);backdrop-filter:blur(10px);z-index:2;font-weight:600}
.fi-r{display:flex;padding:5px 12px;border-radius:5px;align-items:center;gap:9px}
.fi-r:nth-child(odd){background:var(--sep-s)}
.fi-r:hover{background:var(--card-h)}
.fi-r.sel{background:var(--accent);color:#fff}
.fi-r.sel .c-kind,.fi-r.sel .c-size,.fi-r.sel .c-date{color:rgba(255,255,255,.82)}
.c-name{flex:1;min-width:0;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-date{width:140px;flex:none;color:var(--txt2)}
.c-size{width:84px;flex:none;color:var(--txt2);text-align:right;padding-right:14px}
.c-kind{width:104px;flex:none;color:var(--txt2)}
.fi-status{padding:4px 12px;font-size:11px;color:var(--txt2);border-top:.5px solid var(--sep-s);text-align:center;flex:none;
  background:var(--chrome)}

/* ---------- Safari ---------- */
.sf-tabs{display:flex;gap:5px;align-items:center;flex:1;min-width:0;overflow:hidden;padding:0 4px}
.sf-tab{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:8px;font-size:12px;
  min-width:0;max-width:190px;flex:1;background:rgba(120,120,128,.16);height:26px}
.sf-tab.on{background:var(--win-solid);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.light .sf-tab.on{background:#fff}
.sf-tab .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-tab .x{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;opacity:0;flex:none;font-size:11px}
.sf-tab:hover .x{opacity:.7}
.sf-tab .x:hover{background:var(--card-h);opacity:1}
.sf-tab .fav{width:13px;height:13px;border-radius:3px;flex:none;display:grid;place-items:center;font-size:9px;color:#fff;font-weight:700}
.sf-url{flex:1;min-width:120px;max-width:560px;height:26px;border-radius:8px;background:rgba(120,120,128,.2);
  display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12.5px;color:var(--txt2);margin:0 auto}
.sf-url:focus-within{background:var(--field);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 24%,transparent)}
.sf-url input{flex:1;min-width:0;color:var(--txt);font-size:12.5px;text-align:center}
.sf-url:focus-within input{text-align:left}
.sf-frame{flex:1;position:relative;background:#fff;overflow:hidden}
.light .sf-frame{background:#fff}
.sf-frame iframe{width:100%;height:100%;border:none;background:#fff}
.sf-start{position:absolute;inset:0;overflow:auto;background:var(--win-solid);padding:34px 40px}
.sf-start h2{font-size:15px;font-weight:600;margin:22px 0 12px;color:var(--txt)}
.sf-fav{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px}
.sf-fav .f{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px;border-radius:10px}
.sf-fav .f:hover{background:var(--card)}
.sf-fav .ic{width:56px;height:56px;border-radius:13px;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.24)}
.sf-fav .nm{font-size:11.5px;color:var(--txt2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sf-err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px;background:var(--win-solid)}
.sf-err h3{font-size:17px;margin-bottom:8px}
.sf-err p{font-size:12.5px;color:var(--txt2);max-width:420px;line-height:1.5;margin-bottom:16px}
.sf-sugg{position:absolute;top:100%;left:0;right:0;background:var(--menu);backdrop-filter:var(--glass);
  border:.5px solid var(--menu-b);border-radius:10px;margin-top:5px;padding:5px;z-index:20;
  box-shadow:0 16px 40px rgba(0,0,0,.4);max-height:280px;overflow:auto}
.sf-prog{position:absolute;top:0;left:0;height:2.5px;background:var(--accent);z-index:5;transition:width 1.6s ease-out}

/* ---------- Terminal ---------- */
.term{flex:1;font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:10px 12px;overflow:auto;
  background:rgba(12,12,14,.86);color:#e6e6e6;white-space:pre-wrap;word-break:break-word}
.light .term{background:rgba(255,255,255,.9);color:#111}
.term .ps{color:#5ac8fa}
.term .ok{color:#30d158}
.term .er{color:#ff6961}
.term .dim{color:#8e8e93}
.term .in{display:flex;gap:0;align-items:baseline}
.term .in input{flex:1;font-family:var(--mono);font-size:12.5px;color:inherit;caret-color:#30d158}

/* ---------- Notes / TextEdit ---------- */
.nt-list{width:236px;flex:none;border-right:.5px solid var(--sep-s);overflow-y:auto;background:var(--sidebar)}
.nt-i{padding:9px 12px;border-radius:8px;margin:2px 6px}
.nt-i:hover{background:var(--card)}
.nt-i.on{background:var(--accent);color:#fff}
.nt-i .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-i .p{font-size:11px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.nt-i.on .p{color:rgba(255,255,255,.78)}
.nt-ed{flex:1;padding:22px 34px;overflow:auto}
.nt-ed textarea{width:100%;height:100%;resize:none;font-size:13.5px;line-height:1.62;color:var(--txt);font-family:var(--sf)}
.nt-fmt{display:flex;gap:2px;align-items:center}

/* ---------- Mail / Messages ---------- */
.ml-list{width:290px;flex:none;border-right:.5px solid var(--sep-s);overflow-y:auto}
.ml-i{padding:9px 13px;border-bottom:.5px solid var(--sep-s);position:relative}
.ml-i:hover{background:var(--card)}
.ml-i.on{background:var(--accent);color:#fff}
.ml-i.on .s,.ml-i.on .p,.ml-i.on time{color:rgba(255,255,255,.82)}
.ml-i .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ml-i .f{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-i time{font-size:11px;color:var(--txt2);flex:none}
.ml-i .s{font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-i .p{font-size:11.5px;color:var(--txt2);margin-top:2px;line-height:1.35;max-height:32px;overflow:hidden}
.ml-i .unread{position:absolute;left:4px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ml-i.on .unread{background:#fff}
.ml-read{flex:1;overflow:auto;padding:22px 30px;font-size:13px;line-height:1.6}
.ml-read h2{font-size:19px;font-weight:600;margin-bottom:10px;letter-spacing:-.2px}
.ml-read .from{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:.5px solid var(--sep);margin-bottom:16px}
.ml-read .bd{white-space:pre-line;color:var(--txt)}
.avatar{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}

.ms-thread{flex:1;display:flex;flex-direction:column;min-width:0}
.ms-scroll{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:3px}
.bub{max-width:66%;padding:7px 12px;border-radius:17px;font-size:13px;line-height:1.38;position:relative;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:rgba(120,120,128,.26);border-bottom-left-radius:5px}
.light .bub.them{background:#e9e9eb}
.bub.first{margin-top:10px}
.ms-day{text-align:center;font-size:11px;color:var(--txt2);margin:12px 0 4px}
.ms-compose{flex:none;padding:10px 14px;border-top:.5px solid var(--sep-s);display:flex;gap:9px;align-items:center;background:var(--chrome)}
.typing{align-self:flex-start;background:rgba(120,120,128,.26);border-radius:17px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--txt3);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- Music / Photos / Calendar ---------- */
.mu-hero{padding:26px 30px;display:flex;gap:22px;align-items:flex-end}
.mu-art{width:190px;height:190px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:60px;
  box-shadow:0 16px 40px rgba(0,0,0,.45)}
.mu-row{display:flex;align-items:center;gap:12px;padding:7px 30px;font-size:13px;border-radius:6px}
.mu-row:hover{background:var(--card)}
.mu-row.on{color:var(--accent)}
.mu-row .n{width:22px;color:var(--txt2);font-size:12px;text-align:right;flex:none}
.mu-row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-row .d{color:var(--txt2);font-size:12px;flex:none}
.mu-bar{flex:none;height:58px;border-top:.5px solid var(--sep);display:flex;align-items:center;gap:16px;padding:0 18px;
  background:var(--chrome)}
.eq{display:flex;align-items:flex-end;gap:1.5px;height:12px}
.eq i{width:2px;background:var(--accent);border-radius:1px;animation:eqa .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.16s}.eq i:nth-child(3){animation-delay:.32s}.eq i:nth-child(4){animation-delay:.48s}
@keyframes eqa{0%,100%{height:3px}50%{height:12px}}

.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:3px;padding:3px}
.ph-c{aspect-ratio:1;border-radius:3px;position:relative;overflow:hidden}
.ph-c:hover{filter:brightness(1.12)}
.ph-c.sel{outline:3px solid var(--accent);outline-offset:-3px}
.ph-view{position:absolute;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:12}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);flex:1;border-top:.5px solid var(--sep-s)}
.cal-d{border-right:.5px solid var(--sep-s);border-bottom:.5px solid var(--sep-s);padding:5px 7px;min-height:78px;
  font-size:11.5px;position:relative}
.cal-d .n{font-size:12px;color:var(--txt2)}
.cal-d.today .n{background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  margin:-2px 0 0 -3px}
.cal-d.out{opacity:.34}
.cal-ev{font-size:10.5px;border-radius:4px;padding:1.5px 5px;margin-top:3px;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--txt2);text-align:right;padding:0 7px 5px}

/* ---------- Calculator ---------- */
.calc{display:flex;flex-direction:column;flex:1;background:rgba(20,20,22,.55)}
.light .calc{background:rgba(250,250,252,.6)}
.calc .out{flex:none;text-align:right;padding:14px 18px 10px;font-size:42px;font-weight:300;letter-spacing:-1.5px;
  overflow:hidden;white-space:nowrap;min-height:74px}
.calc .keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--sep-s)}
.calc button{display:grid;place-items:center;font-size:19px;background:rgba(80,80,86,.3);transition:filter .08s}
.light .calc button{background:rgba(255,255,255,.62)}
.calc button:hover{filter:brightness(1.25)}
.calc button:active{filter:brightness(1.6)}
.calc button.op{background:var(--orange);color:#fff}
.calc button.fn{background:rgba(120,120,128,.34)}
.calc button.w2{grid-column:span 2}

/* ---------- App Store ---------- */
.as-hero{border-radius:14px;overflow:hidden;margin-bottom:20px;position:relative;height:210px;
  display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff}
.as-hero .k{font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.86}
.as-hero .t{font-size:26px;font-weight:800;line-height:1.12;margin-top:4px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.as-row{display:flex;align-items:center;gap:13px;padding:9px 4px}
.as-row:hover{background:var(--card)}
.as-row .meta{flex:1;min-width:0}
.as-row .nm{font-size:13.5px;font-weight:500}
.as-row .sb{font-size:11.5px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.getbtn{background:rgba(120,120,128,.26);color:var(--accent);font-weight:700;font-size:12.5px;border-radius:99px;
  padding:4px 18px;min-width:72px;text-align:center;flex:none}
.getbtn:hover{filter:brightness(1.2)}
.getbtn.dis{color:var(--txt2)}
.prog-ring{width:22px;height:22px;border-radius:50%;border:2px solid rgba(140,140,150,.3);
  border-top-color:var(--accent);animation:spin .8s linear infinite}

/* ---------- Activity Monitor ---------- */
.am-tbl{font-size:11.5px;font-family:var(--mono)}
.am-tbl .hd,.am-tbl .r{display:flex;gap:0;padding:3px 10px}
.am-tbl .hd{position:sticky;top:0;background:var(--chrome);backdrop-filter:blur(10px);border-bottom:.5px solid var(--sep);
  font-weight:600;font-family:var(--sf);font-size:11px;color:var(--txt2);z-index:2}
.am-tbl .r:nth-child(even){background:var(--sep-s)}
.am-tbl .r:hover{background:var(--card-h)}
.am-tbl .cp{width:64px;text-align:right;flex:none}
.am-tbl .nm2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--sf)}
.am-graph{height:64px;display:flex;align-items:flex-end;gap:1px;padding:0 10px 6px}
.am-graph i{flex:1;background:linear-gradient(180deg,var(--green),color-mix(in srgb,var(--green) 30%,transparent));
  border-radius:1px 1px 0 0;min-height:1px;transition:height .4s}

/* misc */
.kbd{font-family:var(--mono);font-size:11px;background:var(--field);border:.5px solid var(--field-b);
  border-radius:4px;padding:1px 5px}
.pill{font-size:10.5px;padding:1.5px 7px;border-radius:99px;background:var(--card-h);color:var(--txt2)}
.pill.g{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green)}
.pill.r{background:color-mix(in srgb,var(--red) 22%,transparent);color:var(--red)}
.pill.o{background:color-mix(in srgb,var(--orange) 22%,transparent);color:var(--orange)}
.mono{font-family:var(--mono)}
.hstack{display:flex;align-items:center;gap:10px}
.vstack{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.muted{color:var(--txt2)}
.tiny{font-size:11px}
.hidden{display:none!important}
</style>
</head>

  try{

/* =========================================================================
   3. Appearance / accent
   ========================================================================= */
const ACCENTS={
  multicolour:'#0a84ff', blue:'#0a84ff', purple:'#bf5af2', pink:'#ff375f', red:'#ff453a',
  orange:'#ff9f0a', yellow:'#ffd60a', green:'#30d158', graphite:'#98989d'
};
/* wallpapers bright enough that white menu-bar text would disappear on them */
const LIGHT_WALLS=['wp-mono'];
function darkNow(){
  if(State.appearance==='auto'){ const hr=new Date().getHours(); return hr<7||hr>=19; }
  return State.appearance==='dark';
}
function applyAppearance(){
  const sc=$('#screen'), dark=darkNow();
  sc.classList.toggle('light',!dark);
  document.body.classList.toggle('light',!dark);
  sc.style.setProperty('--accent',ACCENTS[State.accent]||ACCENTS.blue);
  sc.style.setProperty('--radius', S().reduceMotion?'10px':'12px');
  sc.style.fontSize=(13*(S().textSize||1))+'px';
  $('#wall').className=State.wallpaper+(S().nightShift?' ns':'');
  $('#wall').style.filter=(S().nightShift?'sepia(.28) saturate(1.25) hue-rotate(-14deg) ':'')+
    `brightness(${0.45+S().brightness*0.62})`;
  $('#menubar').classList.toggle('opaque',!!State.menubarOpaque);
  const bright=LIGHT_WALLS.includes(State.wallpaper) && S().brightness>0.35;
  $('#menubar').classList.toggle('on-light',bright);
  sc.classList.toggle('on-light-wall',bright);
  if(S().reduceTransparency){
    sc.style.setProperty('--glass','none');
    sc.style.setProperty('--win','var(--win-solid)');
    sc.style.setProperty('--menu',dark?'#2a2a2e':'#f2f2f4');
  }else{
    /* clear the overrides so the stylesheet's own Liquid Glass values win again */
    sc.style.removeProperty('--glass');
    sc.style.removeProperty('--win'); sc.style.removeProperty('--menu');
  }
  if(S().increaseContrast){ sc.style.setProperty('--sep',dark?'rgba(255,255,255,.3)':'rgba(0,0,0,.3)'); }
  else sc.style.removeProperty('--sep');
  document.documentElement.style.setProperty('--anim', S().reduceMotion?'0s':'');
}

/* =========================================================================
   4. Overlay primitives — menus, popovers, alerts, sheets, toast, HUD
   ========================================================================= */
let openMenuEl=null, menuCloser=null;
function closeMenus(){
  $$('#overlay .menu,#overlay .pop,#scrim').forEach(n=>n.remove());
  $$('.mb-item.open').forEach(n=>n.classList.remove('open'));
  openMenuEl=null;
  if(menuCloser){ menuCloser(); menuCloser=null; }
}
/* items: {label, key, onClick, dis, tick, sep, hdr, icon, sub:[…]} */
function showMenu(items,x,y,{anchorEl,align='left',width,up=false,onClose}={}){
  closeMenus();
  const scrim=el('div'); scrim.id='scrim';
  scrim.addEventListener('mousedown',e=>{e.stopPropagation();closeMenus();});
  scrim.addEventListener('contextmenu',e=>{e.preventDefault();closeMenus();});
  $('#overlay').appendChild(scrim);
  const m=el('div','menu'+(up?' up':''));
  if(width) m.style.minWidth=width+'px';
  buildMenuInto(m,items);
  $('#overlay').appendChild(m);
  const r=m.getBoundingClientRect(), w=r.width/SCALE, hh=r.height/SCALE;
  let left=x, top=y;
  if(align==='right') left=x-w;
  left=clamp(left,4,SCREEN_W-w-4);
  if(up) top=y-hh;
  top=clamp(top,MENUBAR_H+2,SCREEN_H-hh-4);
  m.style.left=left+'px'; m.style.top=top+'px';
  openMenuEl=m;
  if(anchorEl) anchorEl.classList.add('open');
  menuCloser=onClose||null;
  return m;
}
function buildMenuInto(m,items){
  items.filter(Boolean).forEach(it=>{
    if(it.sep){ m.appendChild(el('div','mi sep')); return; }
    if(it.hdr){ m.appendChild(el('div','mi hdr',esc(it.hdr))); return; }
    const row=el('div','mi'+(it.dis?' dis':''));
    row.innerHTML=`<div class="tick">${it.tick?I.tickS:''}</div>`+
      (it.icon?`<div class="mi-ic">${it.icon}</div>`:'')+
      `<div class="lbl">${it.labelHTML||esc(it.label||'')}</div>`+
      (it.sub?`<div class="arrow">${I.chev}</div>`:(it.key?`<div class="key">${esc(it.key)}</div>`:''));
    if(!it.dis){
      if(it.sub){
        let subEl=null, t;
        row.onmouseenter=()=>{
          clearTimeout(t);
          $$('.menu.submenu').forEach(n=>n.remove());
          const rr=row.getBoundingClientRect(), sr=$('#screen').getBoundingClientRect();
          subEl=el('div','menu submenu');
          buildMenuInto(subEl,typeof it.sub==='function'?it.sub():it.sub);
          $('#overlay').appendChild(subEl);
          const w2=subEl.getBoundingClientRect().width/SCALE;
          subEl.style.left=clamp((rr.right-sr.left)/SCALE-4,4,SCREEN_W-w2-4)+'px';
          subEl.style.top=((rr.top-sr.top)/SCALE-5)+'px';
        };
        row.onmouseleave=()=>{ t=setTimeout(()=>{ if(subEl&&!subEl.matches(':hover')) subEl.remove(); },260); };
      }else{
        row.onmouseenter=()=>$$('.menu.submenu').forEach(n=>n.remove());
        row.onclick=()=>{ closeMenus(); it.onClick&&it.onClick(); };
      }
    }
    m.appendChild(row);
  });
}
function contextMenu(e,items){ e.preventDefault(); e.stopPropagation(); const p=pt(e); showMenu(items,p.x,p.y); }

function alertBox({title,message,buttons,icon,input,horizontal}={}){
  return new Promise(res=>{
    const back=el('div','alert-back');
    const a=el('div','alert');
    a.innerHTML=(icon===false?'':`<div class="ic">${icon||appIconHTML('settings',52)}</div>`)+
      `<h3>${esc(title||'')}</h3>`+(message?`<p>${message.includes('<')?message:esc(message)}</p>`:'');
    let inp=null;
    if(input){ inp=el('input','fld'); inp.type=input.type||'text'; inp.placeholder=input.placeholder||'';
      inp.value=input.value||''; a.appendChild(inp); }
    const acts=el('div','acts'+(horizontal?' h':''));
    (buttons||[{text:'OK',style:'p'}]).forEach(b=>{
      const btn=el('button','btn big '+(b.style==='p'?'p':'')+(b.style==='d'?' d':''),esc(b.text));
      btn.onclick=()=>{ back.remove(); b.onClick&&b.onClick(inp?inp.value:undefined); res(b.text); };
      acts.appendChild(btn);
    });
    a.appendChild(acts); back.appendChild(a); $('#screen').appendChild(back);
    if(inp) setTimeout(()=>inp.focus(),120);
    else setTimeout(()=>a.querySelector('.btn.p,.btn')?.focus(),120);
    back.tabIndex=-1;
    back.addEventListener('keydown',ev=>{ if(ev.key==='Escape'){ back.remove(); res(null); } });
  });
}
/* a sheet slides out of a window's title bar, exactly like AppKit's */
function windowSheet(win,build){
  const back=el('div','sheet-back');
  const s=el('div','sheet');
  const close=()=>{ s.style.animation='sheetIn .22s reverse'; setTimeout(()=>back.remove(),210); };
  build(s,close);
  back.appendChild(s); (win||$('#screen')).appendChild(back);
  setTimeout(()=>s.querySelector('input,textarea')?.focus(),300);
  return close;
}
let toastT;
function toast(msg,ms=1900){
  const t=$('#toast'); t.innerHTML=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),ms);
}
let hudT;
function hud(icon,value){
  const el2=$('#hud');
  el2.innerHTML=`<div style="color:#fff">${icon}</div><div class="bars">${
    Array.from({length:16},(_,i)=>`<i class="${i<Math.round(value*16)?'on':''}"></i>`).join('')}</div>`;
  el2.classList.add('on');
  clearTimeout(hudT); hudT=setTimeout(()=>el2.classList.remove('on'),1100);
}

/* banner notifications */
const NotifLog=[];
function notify(appId,title,body,{action,ms=5200}={}){
  const n=el('div','ntf');
  n.innerHTML=`<div class="app-ic" style="width:34px;height:34px">${appIconHTML(appId,34,true)}</div>
    <div class="bd"><div class="t"><span>${esc(title)}</span><time>now</time></div>
    <div class="m">${esc(body)}</div></div>`;
  n.onclick=()=>{ dismiss(); action? action() : openApp(appId); };
  $('#notifs').appendChild(n);
  NotifLog.unshift({appId,title,body,when:Date.now()});
  let t=setTimeout(dismiss,ms);
  function dismiss(){ clearTimeout(t); n.classList.add('out'); setTimeout(()=>n.remove(),260); }
  n.addEventListener('mouseenter',()=>clearTimeout(t));
  n.addEventListener('mouseleave',()=>{ t=setTimeout(dismiss,2200); });
  return dismiss;
}

/* reusable controls ---------------------------------------------------- */
function toggle(get,set){
  const sw=el('div','sw'+(get()?' on':''));
  sw.onclick=e=>{ e.stopPropagation(); const v=!get(); set(v); sw.classList.toggle('on',v); };
  return sw;
}
function slider(get,set,{thick=false,icon=''}={}){
  const s=el('div','slider'+(thick?' thick':''));
  s.innerHTML=`<div class="track"><div class="fill"></div></div><div class="knob"></div>${thick&&icon?`<div class="gl">${icon}</div>`:''}`;
  const fill=$('.fill',s), knob=$('.knob',s);
  const paint=()=>{ const v=clamp(get(),0,1); fill.style.width=(v*100)+'%'; knob.style.left=(v*100)+'%'; };
  paint();
  const grab=e=>{
    e.preventDefault(); e.stopPropagation();
    const move=ev=>{ const r=s.getBoundingClientRect();
      set(clamp((ev.clientX-r.left)/r.width,0,1)); paint(); };
    move(e);
    const up=()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  };
  s.addEventListener('mousedown',grab);
  s.refresh=paint;
  return s;
}
function pickerRow(label,value,options,onPick){
  const p=el('div','picker');
  p.innerHTML=`<span>${esc(value)}</span><span style="opacity:.6">${I.chevUD}</span>`;
  p.onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(), sr=$('#screen').getBoundingClientRect();
    showMenu(options.map(o=>({label:typeof o==='string'?o:o.label, tick:(typeof o==='string'?o:o.value)===value,
      onClick:()=>onPick(typeof o==='string'?o:o.value)})),
      (r.left-sr.left)/SCALE,(r.bottom-sr.top)/SCALE+3,{width:r.width/SCALE}); };
  return p;
}
/* grouped settings list, mirrors the iPhone build's group()/makeRow() */
function group(parent,{header,footer,rows}={}){
  if(header) parent.appendChild(el('div','grp-h',esc(header)));
  const g=el('div','grp'); parent.appendChild(g);
  (rows||[]).filter(Boolean).forEach(r=>g.appendChild(makeRow(r)));
  if(footer) parent.appendChild(el('div','grp-f',footer));
  return g;
}
function makeRow(r){
  if(r instanceof HTMLElement) return r;
  const row=el('div','row '+(r.cls||''));
  if(r.icon) row.appendChild(h(`<div class="ic" style="background:${r.iconBg||'var(--graphite)'}">${r.icon}</div>`));
  const lbl=el('div','lbl');
  lbl.innerHTML=`<div>${r.labelHTML||esc(r.label||'')}</div>`+(r.sub?`<div class="sub">${r.sub.includes('<')?r.sub:esc(r.sub)}</div>`:'');
  row.appendChild(lbl);
  if(r.value!=null) row.appendChild(el('div','val',esc(r.value)));
  if(r.right) row.appendChild(r.right instanceof HTMLElement?r.right:h(`<div>${r.right}</div>`));
  if(r.toggle){
    const sw=toggle(r.toggle,r.onToggle);
    row.appendChild(sw);
    row.onclick=e=>{ if(!e.target.closest('.sw')) sw.click(); };
    row.classList.add('tap');
  }
  if(r.picker) row.appendChild(pickerRow(r.label,r.picker.value,r.picker.options,r.picker.onPick));
  if(r.onClick){
    row.classList.add('tap');
    if(r.chevron!==false && !/center/.test(r.cls||'')) row.appendChild(h(`<div class="chev">${I.chev}</div>`));
    row.onclick=()=>r.onClick(row);
  }
  return row;
}
