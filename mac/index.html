/* =========================================================================
   6. App registry + window manager
   ========================================================================= */
const Apps={};
function defineApp(def){ Apps[def.id]=def; return def; }
const Wins=[];                 // z-order, last = frontmost
let activeApp='finder';
let zTop=100;
let cascade=0;

function runningApps(){ return [...new Set(Wins.map(w=>w.appId))]; }
function isRunning(id){ return Wins.some(w=>w.appId===id) || id===activeApp && id==='finder'; }
function winsOf(id){ return Wins.filter(w=>w.appId===id); }

function openWindow(o){
  const win={
    id:uid(), appId:o.appId, title:o.title||appName(o.appId),
    w:o.w||760, h:o.h||520, minW:o.minW||420, minH:o.minH||260,
    min:false, full:false, resizable:o.resizable!==false, onClose:o.onClose, onFocus:o.onFocus,
    data:o.data||{}
  };
  const spread=(cascade++%7);
  win.x=o.x!=null?o.x:Math.round((SCREEN_W-win.w)/2+spread*26-70);
  win.y=o.y!=null?o.y:Math.round((SCREEN_H-win.h)/2-40+spread*22-40);
  win.x=clamp(win.x,10,SCREEN_W-win.w-10);
  win.y=clamp(win.y,MENUBAR_H+6,SCREEN_H-140);

  const n=el('div','win opening');
  n.dataset.id=win.id;
  n.style.cssText=`left:${win.x}px;top:${win.y}px;width:${win.w}px;height:${win.h}px;z-index:${++zTop}`;
  const bar=el('div','win-bar'+(o.tallBar?' tall':'')+(o.plainBar?' plain':''));
  bar.innerHTML=`<div class="tl">
      <b class="c"><span>${sf('<path d="M6 6l12 12M18 6L6 18"/>',{w:2.8,size:8})}</span></b>
      <b class="m"><span>${sf('<path d="M5 12h14"/>',{w:2.8,size:8})}</span></b>
      <b class="z"><span>${sf('<path d="M8 16L16 8M9 8h7v7"/>',{w:2.6,size:8})}</span></b>
    </div>`;
  $('.c',bar).onclick=e=>{e.stopPropagation();closeWindow(win);};
  $('.m',bar).onclick=e=>{e.stopPropagation();minimizeWindow(win);};
  $('.z',bar).onclick=e=>{e.stopPropagation();zoomWindow(win);};
  $('.z',bar).oncontextmenu=e=>contextMenu(e,[
    {label:'Fill Screen',onClick:()=>tileWindow(win,'full')},
    {label:'Move & Resize Left',onClick:()=>tileWindow(win,'left')},
    {label:'Move & Resize Right',onClick:()=>tileWindow(win,'right')},
    {label:'Top Half',onClick:()=>tileWindow(win,'top')},
    {label:'Bottom Half',onClick:()=>tileWindow(win,'bottom')},
    {sep:1},{label:'Zoom',onClick:()=>zoomWindow(win)}
  ]);
  const toolbar=el('div','grow');
  toolbar.style.cssText='display:flex;align-items:center;gap:9px;min-width:0;position:relative;z-index:4';
  bar.appendChild(toolbar);
  if(o.titleInBar!==false){
    const t=el('div','win-title',esc(win.title)+(o.subtitle?`<span class="sub">${esc(o.subtitle)}</span>`:''));
    bar.appendChild(t); win.titleEl=t;
  }
  const body=el('div','win-body');
  n.append(bar,body);
  if(win.resizable) ['n','s','w','e','nw','ne','sw','se'].forEach(d=>{
    const g=el('div','win-grip '+d); g.addEventListener('mousedown',ev=>startResize(ev,win,d)); n.appendChild(g); });
  bar.addEventListener('mousedown',ev=>{ if(ev.target.closest('.tl,button,input,.seg,.sf-tab,.icobtn,.fld')) return; startDrag(ev,win); });
  bar.addEventListener('dblclick',ev=>{ if(ev.target.closest('.tl,button,input')) return; zoomWindow(win); });
  n.addEventListener('mousedown',()=>focusWindow(win),true);
  $('#winlayer').appendChild(n);
  win.node=n; win.bar=bar; win.body=body; win.toolbar=toolbar;
  Wins.push(win);
  setTimeout(()=>n.classList.remove('opening'),300);
  o.build && o.build(body,win,toolbar);
  focusWindow(win);
  renderDock();
  return win;
}
function focusWindow(win){
  if(!win||win.min) return;
  Wins.splice(Wins.indexOf(win),1); Wins.push(win);
  $$('.win').forEach(n=>n.classList.remove('key'));
  win.node.classList.add('key');
  win.node.style.zIndex=++zTop;
  if(activeApp!==win.appId){ activeApp=win.appId; renderMenuBar(); }
  win.onFocus&&win.onFocus(win);
  renderDock();
}
function closeWindow(win){
  if(!win) return;
  if(win.onClose && win.onClose(win)===false) return;
  win.node.classList.add('closing');
  setTimeout(()=>win.node.remove(),190);
  const i=Wins.indexOf(win); if(i>=0) Wins.splice(i,1);
  const next=[...Wins].reverse().find(w=>!w.min);
  if(next) focusWindow(next);
  else { if(activeApp!=='finder'&&!winsOf(activeApp).length){ /* app stays "running" until quit */ } renderMenuBar(); }
  renderDock();
}
function minimizeWindow(win){
  if(!win||win.min) return;
  win.min=true;
  win.node.classList.add('min');
  setTimeout(()=>{ win.node.style.display='none'; win.node.classList.remove('min'); },330);
  const next=[...Wins].reverse().find(w=>!w.min);
  if(next) focusWindow(next); else renderMenuBar();
  renderDock();
}
function unminimize(win){
  win.min=false; win.node.style.display='';
  win.node.classList.add('unmin');
  setTimeout(()=>win.node.classList.remove('unmin'),330);
  focusWindow(win);
  renderDock();
}
function zoomWindow(win){
  if(win.full){ restoreWindow(win); return; }
  tileWindow(win,'full');
}
function restoreWindow(win){
  if(!win.prev) return;
  win.node.classList.add('snapping');
  Object.assign(win,win.prev); win.full=false; win.prev=null;
  applyGeom(win); win.node.classList.remove('full');
  setTimeout(()=>win.node.classList.remove('snapping'),240);
}
function tileWindow(win,mode){
  if(!win.full) win.prev={x:win.x,y:win.y,w:win.w,h:win.h};
  const top=MENUBAR_H, dockGap=State.dockHide?6:(State.dockPos==='bottom'?70:6);
  const L=State.dockPos==='left'&&!State.dockHide?70:6, R=State.dockPos==='right'&&!State.dockHide?70:6;
  const availW=SCREEN_W-L-R, availH=SCREEN_H-top-dockGap;
  const set=(x,y,w2,h2,full)=>{ Object.assign(win,{x,y,w:w2,h:h2,full:!!full}); };
  if(mode==='full') set(0,0,SCREEN_W,SCREEN_H,true);
  else if(mode==='left') set(L,top,availW/2,availH);
  else if(mode==='right') set(L+availW/2,top,availW/2,availH);
  else if(mode==='top') set(L,top,availW,availH/2);
  else if(mode==='bottom') set(L,top+availH/2,availW,availH/2);
  else if(mode==='centre') set(L+availW*.12,top+availH*.08,availW*.76,availH*.84);
  win.node.classList.add('snapping');
  win.node.classList.toggle('full',mode==='full');
  applyGeom(win);
  setTimeout(()=>win.node.classList.remove('snapping'),240);
}
function applyGeom(w){
  w.node.style.left=w.x+'px'; w.node.style.top=w.y+'px';
  w.node.style.width=w.w+'px'; w.node.style.height=w.h+'px';
}
function setWinTitle(win,title,sub){
  win.title=title;
  if(win.titleEl) win.titleEl.innerHTML=esc(title)+(sub?`<span class="sub">${esc(sub)}</span>`:'');
  renderMenuBar();
}

/* drag + edge snapping (macOS 26 window tiling) */
let snapMode=null;
function startDrag(e,win){
  e.preventDefault();
  focusWindow(win);
  if(win.full){ /* dragging a zoomed window pops it back out under the cursor */
    const frac=(pt(e).x)/SCREEN_W; restoreWindow(win);
    win.x=clamp(pt(e).x-win.w*frac,0,SCREEN_W-win.w); win.y=MENUBAR_H+2; applyGeom(win);
  }
  const p0=pt(e), x0=win.x, y0=win.y;
  win.node.classList.add('dragging');
  const hint=$('#snaphint');
  const move=ev=>{
    const p=pt(ev);
    win.x=Math.round(x0+p.x-p0.x);
    win.y=Math.round(Math.max(MENUBAR_H, y0+p.y-p0.y));
    applyGeom(win);
    snapMode=null;
    if(p.y<=2) snapMode='full';
    else if(p.x<=2) snapMode='left';
    else if(p.x>=SCREEN_W-2) snapMode='right';
    if(snapMode && !S().reduceMotion){
      const top=MENUBAR_H, dockGap=State.dockHide?6:70;
      const g=snapMode==='full'?[0,0,SCREEN_W,SCREEN_H]
        :snapMode==='left'?[6,top,(SCREEN_W-12)/2,SCREEN_H-top-dockGap]
        :[SCREEN_W/2,top,(SCREEN_W-12)/2,SCREEN_H-top-dockGap];
      hint.style.cssText=`left:${g[0]}px;top:${g[1]}px;width:${g[2]}px;height:${g[3]}px;opacity:1`;
    } else hint.style.opacity='0';
  };
  const up=()=>{
    window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up);
    win.node.classList.remove('dragging'); hint.style.opacity='0';
    if(snapMode){ tileWindow(win,snapMode); snapMode=null; }
    /* never let a title bar end up unreachable under the menu bar */
    win.x=clamp(win.x,-win.w+120,SCREEN_W-120); win.y=clamp(win.y,MENUBAR_H,SCREEN_H-40);
    applyGeom(win);
  };
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
}
function startResize(e,win,dir){
  e.preventDefault(); e.stopPropagation();
  focusWindow(win);
  if(win.full) return;
  const p0=pt(e), g0={x:win.x,y:win.y,w:win.w,h:win.h};
  win.node.classList.add('dragging');
  const move=ev=>{
    const p=pt(ev), dx=p.x-p0.x, dy=p.y-p0.y;
    let {x,y,w,h}=g0;
    if(dir.includes('e')) w=g0.w+dx;
    if(dir.includes('s')) h=g0.h+dy;
    if(dir.includes('w')){ w=g0.w-dx; x=g0.x+dx; }
    if(dir.includes('n')){ h=g0.h-dy; y=g0.y+dy; }
    if(w<win.minW){ if(dir.includes('w')) x=g0.x+g0.w-win.minW; w=win.minW; }
    if(h<win.minH){ if(dir.includes('n')) y=g0.y+g0.h-win.minH; h=win.minH; }
    if(y<MENUBAR_H){ h+= y-MENUBAR_H; y=MENUBAR_H; }
    Object.assign(win,{x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)});
    applyGeom(win);
    win.onResize&&win.onResize(win);
  };
  const up=()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up);
    win.node.classList.remove('dragging'); };
  window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
}

/* launching / quitting -------------------------------------------------- */
function openApp(id,{fromDock}={}){
  const def=Apps[id];
  if(!def){ toast(`“${esc(id)}” can’t be opened.`); return; }
  closeMenus(); hideSpotlight(); $('#cc').classList.remove('on'); closeMC();
  const existing=winsOf(id);
  if(existing.length){
    activeApp=id;
    const m=existing.find(w=>!w.min)||existing[0];
    if(m.min) unminimize(m); else focusWindow(m);
    renderMenuBar(); return existing[0];
  }
  if(def.singletonLaunch){ def.singletonLaunch(); activeApp=id; renderMenuBar(); renderDock(); return; }
  /* Dock bounce while the app "launches" */
  const tile=$(`.dock-i[data-app="${id}"]`);
  if(tile && !S().reduceMotion) { tile.classList.add('bounce'); setTimeout(()=>tile.classList.remove('bounce'),1200); }
  activeApp=id;
  State.recentApps=[id,...State.recentApps.filter(a=>a!==id)].slice(0,6); save();
  const w=def.open? def.open() : openWindow({appId:id,title:def.name,build:b=>b.appendChild(h(`<div class="st-empty"><h3>${esc(def.name)}</h3><p>This app has no content yet.</p></div>`))});
  clearBadge(id);
  renderMenuBar(); renderDock();
  return w;
}
function quitApp(id){
  const ws=winsOf(id);
  let blocked=false;
  ws.forEach(w=>{ if(w.onClose && w.onClose(w)===false) blocked=true; });
  if(blocked) return;
  ws.forEach(w=>{ w.node.remove(); Wins.splice(Wins.indexOf(w),1); });
  if(activeApp===id){
    const next=[...Wins].reverse().find(w=>!w.min);
    activeApp=next?next.appId:'finder';
    if(next) focusWindow(next);
  }
  renderMenuBar(); renderDock();
}
function clearBadge(id){ if(State.badges[id]){ delete State.badges[id]; save(); renderDock(); } }

function clockText(){
  const d=new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let hh=State.clock24? d.getHours() : (d.getHours()%12||12);
  const mm=String(d.getMinutes()).padStart(2,'0');
  const ss=State.clockSeconds?':'+String(d.getSeconds()).padStart(2,'0'):'';
  const ap=State.clock24?'':(d.getHours()<12?' AM':' PM');
  return `${days[d.getDay()]} ${mons[d.getMonth()]} ${d.getDate()}  ${State.clock24?String(hh).padStart(2,'0'):hh}:${mm}${ss}${ap}`;
}

/* magnification — the classic cosine falloff, only while the pointer is inside */
function applyDockMag(){
  $$('#dock .dock-i').forEach(it=>{
    it.style.width=State.dockSize+'px'; it.style.height=State.dockSize+'px';
    it.style.marginLeft=''; it.style.marginRight='';
  });
}
function dockMagnify(e){
  if(!State.dockMag||S().reduceMotion) return;
  const items=$$('#dock .dock-i');
  const vertical=State.dockPos!=='bottom';
  const p=pt(e);
  items.forEach(it=>{
    const r=it.getBoundingClientRect(), sr=$('#screen').getBoundingClientRect();
    const c=vertical? (r.top-sr.top+r.height/2)/SCALE : (r.left-sr.left+r.width/2)/SCALE;
    const d=Math.abs((vertical?p.y:p.x)-c);
    const reach=110;
    const k=d>reach?0:Math.cos(d/reach*Math.PI/2);
    const size=State.dockSize*(1+k*0.62);
    it.style.width=size+'px'; it.style.height=size+'px';
  });
}
$('#dock').addEventListener('mousemove',dockMagnify);
$('#dock').addEventListener('mouseleave',applyDockMag);
$('#dock').addEventListener('contextmenu',e=>{
  if(e.target.closest('.dock-i')) return;
  contextMenu(e,[
    {label:'Turn Magnification '+(State.dockMag?'Off':'On'),onClick:()=>{State.dockMag=!State.dockMag;save();applyDockMag();}},
    {label:'Turn Hiding '+(State.dockHide?'Off':'On'),onClick:()=>{State.dockHide=!State.dockHide;save();updateDockHide();}},
    {label:'Position on Screen',sub:['Left','Bottom','Right'].map(p=>({label:p,tick:State.dockPos===p.toLowerCase(),
      onClick:()=>{State.dockPos=p.toLowerCase();save();renderDock();}}))},
    {sep:1},
    {label:'Dock Settings…',onClick:()=>{openApp('settings');setTimeout(()=>settingsGo('desktop'),160);}}
  ]);
});
function updateDockHide(){

let spotIndex=0, spotResults=[];
function showSpotlight(){
  closeMenus(); $('#cc').classList.remove('on'); $('#nc').classList.remove('on');
  const sp=$('#spot');
  $('.q',sp).innerHTML=`<span style="color:var(--txt2)">${sf('<circle cx="10.5" cy="10.5" r="6.6"/><path d="M15.5 15.5L21 21"/>',{size:22,w:1.8})}</span>`;
  const inp=el('input'); inp.placeholder='Spotlight Search'; inp.spellcheck=false;
  $('.q',sp).appendChild(inp);
  sp.classList.add('on');
  const scrim=el('div'); scrim.id='scrim';
  scrim.addEventListener('mousedown',e=>{e.stopPropagation();hideSpotlight();});
  $('#overlay').appendChild(scrim);
  inp.oninput=()=>runSpotlight(inp.value);
  inp.onkeydown=e=>{
    if(e.key==='Escape'){ hideSpotlight(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); spotIndex=Math.min(spotIndex+1,spotResults.length-1); paintSpot(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); spotIndex=Math.max(spotIndex-1,0); paintSpot(); }
    else if(e.key==='Enter'){ e.preventDefault(); const r=spotResults[spotIndex]; if(r){ hideSpotlight(); r.go(); } }
  };
  runSpotlight('');
  setTimeout(()=>inp.focus(),40);
}
function hideSpotlight(){ $('#spot').classList.remove('on'); $('#scrim')?.remove(); }
/* People type "wifi", "airdrop", "donotdisturb" — fold away punctuation and
   spaces on both sides so those still reach "Wi-Fi", "AirDrop", "Do Not Disturb". */
const fold = s => String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'');
function runSpotlight(q){
  const query=q.trim().toLowerCase(), f=fold(q);
  const hit=(...fields)=>fields.some(x=>String(x??'').toLowerCase().includes(query)||fold(x).includes(f));
  spotResults=[]; spotIndex=0;
  const push=(kind,name,sub,gl,go)=>spotResults.push({kind,name,sub,gl,go});
  if(!query){
    State.recentApps.slice(0,5).forEach(a=>push('Application',appName(a),'Recent',appIconHTML(a,26),()=>openApp(a)));
    if(!spotResults.length) ['safari','settings','finder','terminal','notes'].forEach(a=>push('Application',appName(a),'',appIconHTML(a,26),()=>openApp(a)));
  }else{
    Object.values(Apps).filter(a=>hit(a.name,a.id))
      .forEach(a=>push('Application',a.name,'',appIconHTML(a.id,26),()=>openApp(a.id)));
    SETTINGS_INDEX.filter(s=>hit(s.k,s.p,s.go))
      .slice(0,6).forEach(s=>push('System Settings',s.k,s.p,`<div class="app-ic" style="width:26px;height:26px;border-radius:6px">${ICONS.settings}</div>`,
        ()=>{ openApp('settings'); setTimeout(()=>settingsGo(s.go),160); }));
    WF().known.filter(n=>hit(n.ssid)).slice(0,4)
      .forEach(n=>push('Wi-Fi Network',n.ssid,n.sec,`<div class="app-ic" style="width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:#0a84ff;color:#fff">${I.wifi()}</div>`,
        ()=>{ openApp('settings'); setTimeout(()=>{ settingsWin().data.detailSSID=n.ssid; settingsGo('wifi/details'); },160); }));
    FS.all().filter(f2=>hit(f2.name)).slice(0,6)
      .forEach(f2=>push(f2.kind||'Document',f2.name,f2.where,`<div style="width:26px;height:26px">${f2.dir?I.folder():I.doc()}</div>`,
        ()=>openFinderAt(f2.where,f2.name)));
    NOTES().filter(n=>(n.title+n.body).toLowerCase().includes(query)).slice(0,4)
      .forEach(n=>push('Note',n.title,n.body.slice(0,60),appIconHTML('notes',26),()=>{openApp('notes');setTimeout(()=>notesSelect(n.id),200);}));
    push('Web Search',`Search the web for “${q.trim()}”`,'Safari',appIconHTML('safari',26),
      ()=>{ openApp('safari'); setTimeout(()=>safariGo(q.trim()),200); });
    if(/^[\d\s+\-*/().%^]+$/.test(query)){
      try{ const v=Function('"use strict";return('+query.replace(/\^/g,'**')+')')();
        if(Number.isFinite(v)) spotResults.unshift({kind:'Calculator',name:String(v),sub:q.trim(),
          gl:appIconHTML('calculator',26),go:()=>openApp('calculator')});
      }catch(e){}
    }
  }
  paintSpot();
}
function paintSpot(){
  const res=$('#spot .res');
  if(!spotResults.length){ res.innerHTML='<div style="padding:26px;text-align:center;color:var(--txt2);font-size:13px">No Results</div>'; return; }
  const groups={};
  spotResults.forEach((r,i)=>{ (groups[r.kind]=groups[r.kind]||[]).push({...r,i}); });
  res.innerHTML='';
  for(const k in groups){
    res.appendChild(el('div','sh',k));
    groups[k].forEach(r=>{
      const it=el('div','sp-i'+(r.i===spotIndex?' on':''));
      it.innerHTML=`<div class="gl">${r.gl}</div><div class="nm">${esc(r.name)}${r.sub?`<span class="sub">${esc(r.sub)}</span>`:''}</div>`;
      it.onclick=()=>{ hideSpotlight(); r.go(); };
      it.onmouseenter=()=>{ spotIndex=r.i; $$('.sp-i',res).forEach(n=>n.classList.remove('on')); it.classList.add('on'); };
      res.appendChild(it);
    });
  }
  const on=$('.sp-i.on',res); on&&on.scrollIntoView({block:'nearest'});
}

/* Thumbnails are live clones of each window, so they must be thrown away the
   moment Mission Control closes — otherwise duplicated markup (and a second
   copy of every Safari iframe) piles up in the document. */
function closeMC(){ const mc=$('#mc'); mc.classList.remove('on'); setTimeout(()=>{ if(!mc.classList.contains('on')) mc.innerHTML=''; },240); }
function toggleMC(){
  const mc=$('#mc');
  if(mc.classList.contains('on')){ closeMC(); return; }
  closeMenus();
  mc.innerHTML='';
  const spaces=el('div','spaces');
  ['Desktop 1'].forEach((n,i)=>{
    const s=el('div','space'+(i===0?' on':''),n);
    s.style.background=getComputedStyle($('#wall')).background;
    spaces.appendChild(s);
  });
  mc.appendChild(spaces);
  const grid=el('div','grid');
  const list=Wins.filter(w=>!w.min);
  if(!list.length) grid.appendChild(h('<div class="mc-empty">No open windows</div>'));
  list.forEach(w=>{
    const k=Math.min(300/w.w,190/w.h,0.42);
    const c=el('div','card');
    c.style.cssText=`width:${w.w*k}px;height:${w.h*k}px`;
    c.innerHTML=`<div style="width:${w.w}px;height:${w.h}px;transform:scale(${k});transform-origin:top left;pointer-events:none"></div>
      <div class="cap">${esc(w.title)}</div>`;
    const clone=w.node.cloneNode(true);
    clone.style.cssText=`position:relative;left:0;top:0;width:${w.w}px;height:${w.h}px;box-shadow:none;border-radius:8px`;
    /* a cloned iframe would fetch the page a second time — swap it for a still */
    $$('iframe',clone).forEach(f=>f.replaceWith(h('<div style="width:100%;height:100%;background:#fff"></div>')));
    c.firstElementChild.appendChild(clone);
    c.onclick=()=>{ closeMC(); focusWindow(w); };
    grid.appendChild(c);
  });
  mc.appendChild(grid);
  mc.classList.add('on');
  mc.onclick=e=>{ if(e.target===mc||e.target===grid) closeMC(); };
}
let swIndex=0, swOpen=false;
function showSwitcher(back){
  const list=[...new Set([activeApp,...[...Wins].reverse().map(w=>w.appId),...State.recentApps])].filter(a=>Apps[a]);
  if(list.length<2) return;
  if(!swOpen){ swOpen=true; swIndex=1; }

    `<div class="it${i===swIndex?' on':''}" data-i="${i}">${appIconHTML(a,60)}</div>`).join('')}</div>
    <div class="nm">${esc(appName(list[swIndex]))}</div>`;
  $$('.it',sw).forEach(it=>{ it.onmouseenter=()=>{ swIndex=+it.dataset.i; showSwitcher(); };
    it.onclick=()=>{ endSwitcher(); }; });

function endSwitcher(){
  const sw=$('#appsw');

function bootSequence({fast=false}={}){
  const b=$('#boot');
  b.classList.remove('gone');
  b.innerHTML=`<div class="apple">${I.apple(58)}</div><div class="prog"><i></i></div><div class="msg"></div>`;
  const bar=$('.prog i',b), msg=$('.msg',b);
  const steps=[[6,''],[22,''],[40,'Loading system extensions…'],[58,''],[74,'Starting services…'],[88,''],[100,'']];
  let i=0;
  const dur=fast?55:230;
  const step=()=>{
    if(i>=steps.length){
      setTimeout(()=>{ b.classList.add('gone'); lockMac(); },320);
      return;
    }
    bar.style.width=steps[i][0]+'%';
    msg.textContent=steps[i][1];
    i++; setTimeout(step,dur+Math.random()*90);
  };
  setTimeout(step,fast?120:500);
}
function renderLock(fromLogout){
  const lk=$('#lock');
  const d=new Date();
  lk.innerHTML=`<div class="lk-wall ${State.wallpaper}"></div>
    <div class="lk-clock"><div class="t tnum">${State.clock24?String(d.getHours()).padStart(2,'0'):(d.getHours()%12||12)}:${String(d.getMinutes()).padStart(2,'0')}</div>
      <div class="d">${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div></div>
    <div class="lk-user">
      <div class="lk-av" style="background:${State.user.color}">${esc(State.user.initials)}</div>
      <div class="lk-name">${esc(State.user.name)}</div>
      <div class="lk-pw"><input type="password" placeholder="Enter Password" spellcheck="false"><button class="lk-go">${sf('<path d="M5 12h13M12 5.5l6.5 6.5-6.5 6.5"/>',{size:13,w:2.2})}</button></div>
      <div class="lk-hint">${esc(State.user.pw?'':'Touch ID or password — the password is blank, just press Return')}</div>
    </div>
    <div class="lk-foot">
      <button data-a="sleep"><span class="cir">${I.moon}</span>Sleep</button>
      <button data-a="restart"><span class="cir">${I.reload}</span>Restart</button>
      <button data-a="shutdown"><span class="cir">${I.power}</span>Shut Down</button>
    </div>`;
  const inp=$('.lk-pw input',lk), pwBox=$('.lk-pw',lk), hint=$('.lk-hint',lk);
  const tryUnlock=()=>{
    if((inp.value||'')===(State.user.pw||'')){ unlockMac(); }
    else{
      pwBox.classList.add('shake'); setTimeout(()=>pwBox.classList.remove('shake'),440);
      inp.value=''; hint.textContent=State.user.hint? 'Password hint: '+State.user.hint : 'Incorrect password. Try again.';
    }
  };
  inp.onkeydown=e=>{ if(e.key==='Enter') tryUnlock(); };
  $('.lk-go',lk).onclick=tryUnlock;
  $$('.lk-foot button',lk).forEach(btn=>btn.onclick=()=>{
    const a=btn.dataset.a;
    if(a==='sleep'){ $('#lock').classList.add('gone'); sleepMac(); }
    else doPower(a);
  });
  setTimeout(()=>inp.focus(),420);
}
function unlockMac(){
  $('#lock').classList.add('gone');
  if(!State.bootedOnce){
    State.bootedOnce=true; save();

      'Right-click the desktop, press ⌘Space for Spotlight, or open System Settings to explore.'),1400);

   17. Keyboard
   ========================================================================= */
document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA)$/.test(e.target.tagName)||e.target.isContentEditable;
  const cmd=e.metaKey||e.ctrlKey;
  if(!$('#lock').classList.contains('gone')||!$('#boot').classList.contains('gone')) return;

  if(cmd&&e.key===' '){ e.preventDefault(); $('#spot').classList.contains('on')?hideSpotlight():showSpotlight(); return; }
  if(cmd&&e.key==='Tab'){ e.preventDefault(); showSwitcher(e.shiftKey); return; }
  if(e.key==='F3'||(e.ctrlKey&&e.key==='ArrowUp')){ e.preventDefault(); toggleMC(); return; }
  if(e.key==='Escape'){
    if($('#spot').classList.contains('on')) return hideSpotlight();
    if($('#mc').classList.contains('on')) return closeMC();
    if($('#cc').classList.contains('on')||$('#nc').classList.contains('on')){ $('#cc').classList.remove('on');$('#nc').classList.remove('on'); return closeMenus(); }
    if(openMenuEl) return closeMenus();
  }
  if(cmd&&e.ctrlKey&&e.key.toLowerCase()==='q'){ e.preventDefault(); return lockMac(); }
  if(typing&&!(cmd&&['w','q','m','n'].includes(e.key.toLowerCase()))) return;
  if(cmd){
    const k=e.key.toLowerCase();
    if(k==='w'){ e.preventDefault(); const w=frontWin(); if(w) closeWindow(w); }
    else if(k==='q'){ e.preventDefault(); if(activeApp!=='finder') quitApp(activeApp); else toast('You can’t quit the Finder'); }
    else if(k==='m'){ e.preventDefault(); const w=frontWin(); if(w) minimizeWindow(w); }
    else if(k==='n'){ e.preventDefault(); Apps[activeApp]?.newWindow? Apps[activeApp].newWindow() : openApp(activeApp); }
    else if(k==='h'){ e.preventDefault(); winsOf(activeApp).forEach(minimizeWindow); }
    else if(k===','){ e.preventDefault(); Apps[activeApp]?.settings? Apps[activeApp].settings() : openApp('settings'); }
    else if(e.ctrlKey&&e.altKey){ /* window tiling ⌃⌥ */ }
  }
  if(e.ctrlKey&&e.altKey){
    const w=frontWin(); if(!w) return;
    const m={arrowleft:'left',arrowright:'right',arrowup:'top',arrowdown:'bottom',f:'full',c:'centre'}[e.key.toLowerCase()];
    if(m){ e.preventDefault(); tileWindow(w,m); }
  }
});

let connectingTo=null;
function connectTo(ssid,{onDone}={}){
  const W=WF(), air=inRange(ssid)||{ssid,sec:'WPA2 Personal'}, saved=knownNet(ssid);
  if(W.connected===ssid) return;
  if(isEnterprise(air.sec) && !saved?.user) return enterpriseSheet(air,onDone);
  if(isSecured(air.sec) && !saved?.pw) return passwordSheet(air,onDone);
  finishConnect(ssid,null,onDone);
}
function finishConnect(ssid,pw,onDone){
  const W=WF(), air=inRange(ssid)||{ssid,sec:'WPA2 Personal',bars:2};
  connectingTo=ssid; W.connected=null;
  refreshWifiUI(); renderMenuBar(); renderCC();
  setTimeout(()=>{
    connectingTo=null;
    W.connected=ssid;
    let k=knownNet(ssid);
    if(!k){ k={ssid,sec:air.sec,autoJoin:true,lowData:false,priv:'Rotating',limitIP:true,last:Date.now()}; W.known.unshift(k); }
    k.last=Date.now();
    if(pw) k.pw=pw;
    save(); refreshWifiUI(); renderMenuBar(); renderCC();
    notify('settings','Wi-Fi',`Connected to “${ssid}”.`);
    onDone&&onDone();
  },1500);
}

defineApp({
  id:'settings', name:'System Settings', version:'26.4',
  about:'The full System Settings surface — every pane below is live and writes to the same saved state the rest of the Mac reads.',
  icon:ICONS.settings,
  open(){
    const win=openWindow({appId:'settings',title:'System Settings',w:860,h:620,minW:700,minH:460,
      data:{pane:'general',history:[],search:''},
      build(body,w){
        const sb=el('div','wsidebar'); sb.style.width='236px'; sb.id='stSidebar';
        const main=el('div','wmain scroll'); main.id='stMain';
        body.append(sb,main);
        w.data.sb=sb; w.data.main=main;
        settingsRender(w);
      }});
    return win;
  },
  menus(g){
    g[0].items=[{label:'Close',key:'⌘W',onClick:()=>closeWindow(frontWin())}];
    g[2].items=[{label:'Back',key:'⌘[',onClick:()=>settingsBack()},{label:'Forward',key:'⌘]',dis:true},
      {sep:1},{label:'Enter Full Screen',onClick:()=>zoomWindow(frontWin())}];
    return g;
  }
});
function settingsWin(){ return winsOf('settings')[0]; }
function settingsGo(pane){
  const w=settingsWin(); if(!w) return;
  if(w.data.pane!==pane){ w.data.history.push(w.data.pane); w.data.pane=pane; }
  settingsRender(w); focusWindow(w);
}
function settingsBack(){
  const w=settingsWin(); if(!w||!w.data.history.length) return;
  w.data.pane=w.data.history.pop(); settingsRender(w,true);
}
function settingsRender(w,back){
  const {sb,main}=w.data;
  const root=w.data.pane.split('/')[0];
  /* sidebar */
  sb.innerHTML='';
  const search=el('div','fld st-search');
  search.innerHTML=`<span style="color:var(--txt2)">${sf('<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',{size:13,w:2})}</span>`;
  const si=el('input'); si.placeholder='Search'; si.value=w.data.search||'';
  search.appendChild(si);
  si.oninput=()=>{ w.data.search=si.value; paintSidebar(); };
  sb.appendChild(search);
  const listWrap=el('div'); listWrap.style.cssText='display:flex;flex-direction:column;gap:1px';
  sb.appendChild(listWrap);
  function paintSidebar(){
    listWrap.innerHTML='';
    const q=(w.data.search||'').toLowerCase();
    if(q){
      const hits=SETTINGS_INDEX.filter(s=>s.k.toLowerCase().includes(q)||s.p.toLowerCase().includes(q));
      if(!hits.length) listWrap.appendChild(h('<div style="padding:16px 8px;font-size:12px;color:var(--txt2)">No results</div>'));
      hits.forEach(hit=>{
        const it=el('div','sb-i');
        it.innerHTML=`<div class="gl">${I.search}</div><div class="grow">${esc(hit.k)}<div style="font-size:10.5px;color:var(--txt2)">${esc(hit.p)}</div></div>`;
        it.onclick=()=>{ w.data.search=''; settingsGo(hit.go); };
        listWrap.appendChild(it);
      });
      return;
    }
    SIDEBAR.forEach((grp,gi)=>{
      if(gi) listWrap.appendChild(h('<div style="height:1px;background:var(--sep-s);margin:7px 8px"></div>'));
      grp.forEach(item=>{
        if(item.hero){
          const a=State.user;
          const hero=el('div','sb-i'+(root==='account'?' on':''));
          hero.style.cssText='padding:9px 8px;gap:10px';
          hero.innerHTML=`<div class="avatar" style="width:34px;height:34px;font-size:14px;background:${a.color}">${esc(a.initials)}</div>
            <div class="grow" style="line-height:1.25"><div style="font-size:12.5px;font-weight:600">${esc(a.name)}</div>
            <div style="font-size:10.5px;opacity:.7">Apple Account</div></div><div style="opacity:.4">${I.chev}</div>`;
          hero.onclick=()=>settingsGo('account');
          listWrap.appendChild(hero);
          return;
        }
        const it=el('div','sb-i'+(root===item.id?' on':''));
        it.innerHTML=`<div class="gl">${stIcon(item.bg,item.g())}</div><div class="grow">${esc(item.t)}</div>`;
        $('.ic',it).style.cssText+=';width:20px;height:20px;border-radius:5px;color:#fff';
        $('.ic',it).firstElementChild && ($('.ic',it).firstElementChild.style.transform='scale(.78)');
        if(item.id==='general'&&State.updates.available!==State.updates.installed)
          it.appendChild(h('<span class="pill r" style="margin-left:auto">1</span>'));
        it.onclick=()=>settingsGo(item.id);
        listWrap.appendChild(it);
      });
    });
  }
  paintSidebar();

  /* detail */
  main.innerHTML='';
  const pane=el('div','st-pane'+(back?' back':''));
  pane.style.cssText='padding:18px 22px 30px';
  main.appendChild(pane);
  const fn=PANES[w.data.pane]||PANES[root]||PANES.general;
  const meta=SIDEBAR.flat().find(s=>s.id===root);
  const parts=w.data.pane.split('/');
  const title=el('h2','st-title');
  if(parts.length>1){
    const bk=el('span','bk'); bk.innerHTML=`${I.chevL} ${esc(meta?meta.t:'Back')}`;
    bk.style.cursor='default'; bk.onclick=()=>settingsGo(root);
    title.appendChild(bk);
  }
  title.appendChild(document.createTextNode(paneTitle(w.data.pane)));
  pane.appendChild(title);
  fn(pane,w);
  setWinTitle(w,'System Settings',paneTitle(w.data.pane));
}
function paneTitle(p){
  const map={
    'general/about':'About','general/update':'Software Update','general/storage':'Storage',
    'general/datetime':'Date & Time','general/language':'Language & Region','general/sharing':'Sharing',
    'general/timemachine':'Time Machine','general/startup':'Startup Disk','general/reset':'Transfer or Reset',
    'general/airdrop':'AirDrop & Handoff','general/login':'Login Items & Extensions','general/autofill':'AutoFill & Passwords',
    'general/devicemgmt':'Device Management',
    'wifi/known':'Known Networks','wifi/details':'Network Details',
    'accessibility/display':'Display',
    'network/firewall':'Firewall','network/vpn':'VPN','network/dns':'DNS','network/details':'Wi-Fi Details',
    'privacy/location':'Location Services','privacy/analytics':'Analytics & Improvements','privacy/filevault':'FileVault',
    'icloud/storage':'iCloud Storage','account/devices':'Devices'
  };
  if(map[p]) return map[p];
  const s=SIDEBAR.flat().find(x=>x.id===p);
  return s?s.t:'General';
}

/* ------------------------------- Wi-Fi --------------------------------- */
PANES['wifi']=(p,w)=>{
  const W=WF(), on=wifiOn();
  const head=el('div','grp');
  const r=el('div','row');
  r.innerHTML='<div class="lbl"><div>Wi-Fi</div></div>';
  r.appendChild(toggle(()=>on,v=>{ S().wifi=v; if(!v) connectingTo=null; save(); renderMenuBar(); renderCC(); reRender(); }));
  head.appendChild(r);
  p.appendChild(head);

  if(!on){
    p.appendChild(h('<div class="grp-f">Wi-Fi is off. Turn Wi-Fi on to see networks in range and join one.</div>'));
    group(p,{rows:[{label:'Known Networks',value:String(W.known.length),onClick:()=>settingsGo('wifi/known')}]});
    return;
  }

  /* connected network card */
  const conn=W.connected? (inRange(W.connected)||{ssid:W.connected,sec:knownNet(W.connected)?.sec||'WPA2 Personal',bars:3,band:'5 GHz',ch:149,rate:1201}) : null;
  p.appendChild(el('div','grp-h','Known Network'));
  const g1=el('div','grp');
  if(connectingTo){
    g1.appendChild(h(`<div class="wf-row static"><div class="wf-tick"></div>
      <div class="wf-name">${esc(connectingTo)}<div class="sub">Connecting…</div></div>
      <div class="wf-meta"><div class="spinner"></div></div></div>`));
  }else if(conn){
    const info=netInfo(conn.ssid);
    const row=el('div','wf-row static');
    row.innerHTML=`<div class="wf-tick">${I.tickS}</div>
      <div class="wf-name">${esc(conn.ssid)}<div class="sub">Connected · ${esc(conn.sec)} · ${esc(conn.band||'5 GHz')} · IP ${info.ip}</div></div>
      <div class="wf-meta">${barsIcon(conn.bars)}</div>`;
    const det=el('button','btn','Details…');
    det.onclick=()=>{ w.data.detailSSID=conn.ssid; settingsGo('wifi/details'); };
    const dis=el('button','btn','Disconnect');
    dis.onclick=()=>disconnectWifi();
    const box=el('div','hstack'); box.style.gap='6px'; box.append(det,dis);
    $('.wf-meta',row).prepend(box);
    g1.appendChild(row);
  }else{
    g1.appendChild(h('<div class="wf-row static"><div class="wf-tick"></div><div class="wf-name muted">Not connected</div></div>'));
  }
  p.appendChild(g1);

  const mkRow=(net,known)=>{
    const row=el('div','wf-row');
    const busy=connectingTo===net.ssid;
    row.innerHTML=`<div class="wf-tick"></div>
      <div class="wf-name">${esc(net.ssid)}${known?`<div class="sub">${knownNet(net.ssid).autoJoin?'Auto-Join on':'Auto-Join off'} · ${lastSeenText(knownNet(net.ssid).last)}</div>`:''}</div>
      <div class="wf-meta">${busy?'<div class="spinner"></div>':''}
        ${isSecured(net.sec)?sf('<rect x="4.5" y="10.5" width="15" height="10.5" rx="2.6"/><path d="M8 10.5V7.2a4 4 0 018 0v3.3"/>',{size:12,w:1.9}):''}
        ${barsIcon(net.bars)}</div>`;
    const more=el('div','wf-more',sf('<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',{size:14}));
    more.onclick=e=>{ e.stopPropagation(); contextMenu(e,[
      {label:'Join',onClick:()=>connectTo(net.ssid)},
      {label:'Copy Network Name',onClick:()=>{navigator.clipboard?.writeText(net.ssid);toast('Copied');}},
      ...(known?[{sep:1},{label:'Remove from Known Networks',onClick:()=>forgetNetwork(net.ssid,reRender)}]:[]),
      {sep:1},{label:'Network Details…',onClick:()=>{ w.data.detailSSID=net.ssid; settingsGo('wifi/details'); }}
    ]); };
    $('.wf-meta',row).appendChild(more);
    row.onclick=e=>{ if(!e.target.closest('.wf-more')) connectTo(net.ssid); };
    return row;
  };

  const mine=AIRWAVES.filter(a=>knownNet(a.ssid)&&a.ssid!==W.connected);
  if(mine.length){
    p.appendChild(el('div','grp-h','My Networks'));
    const g=el('div','grp'); mine.forEach(n=>g.appendChild(mkRow(n,true))); p.appendChild(g);
  }
  p.appendChild(el('div','grp-h','Other Networks'));
  const g2=el('div','grp');
  AIRWAVES.filter(a=>!knownNet(a.ssid)&&a.ssid!==W.connected).forEach(n=>g2.appendChild(mkRow(n,false)));
  const other=el('div','wf-row');
  other.innerHTML=`<div class="wf-tick"></div><div class="wf-name">Other…</div><div class="wf-meta">${I.chev}</div>`;
  other.onclick=()=>joinOtherSheet();
  g2.appendChild(other);
  const scan=el('div','wf-row static');
  scan.innerHTML=`<div class="wf-tick"></div><div class="wf-name muted">Looking for networks…</div><div class="wf-meta"><div class="spinner"></div></div>`;
  g2.appendChild(scan);
  p.appendChild(g2);

  group(p,{rows:[
    pRow('Ask to join networks',W.askToJoin,['Off','Notify','Ask'],v=>{WF().askToJoin=v;},
      'Known networks are joined automatically. If none are available, you’ll be asked before joining a new one.'),
    pRow('Ask to join hotspots',W.askToJoinHotspot,['Never','Ask','Automatic'],v=>{WF().askToJoinHotspot=v;}),
    {label:'Known Networks',value:String(W.known.length),onClick:()=>settingsGo('wifi/known')}
  ],footer:'Networks you join are remembered so this Mac can rejoin them automatically. Removing one also removes its password from iCloud Keychain.'});

PANES['wifi/known']=(p)=>{
  const W=WF();
  if(!W.known.length){ p.appendChild(h('<div class="st-empty"><h3>No Known Networks</h3><p>Networks you join will appear here.</p></div>')); return; }
  const sorted=[...W.known].sort((a,b)=>b.last-a.last);
  const build=(list,header)=>{
    if(!list.length) return;
    p.appendChild(el('div','grp-h',header));
    const g=el('div','grp');
    list.forEach(n=>{
      const row=el('div','wf-row');
      row.innerHTML=`<div class="wf-tick">${W.connected===n.ssid?I.tickS:''}</div>
        <div class="wf-name">${esc(n.ssid)}<div class="sub">${esc(n.sec)} · ${lastSeenText(n.last)}${n.autoJoin?'':' · Auto-Join off'}</div></div>`;
      const meta=el('div','wf-meta');
      const aj=toggle(()=>n.autoJoin,v=>{n.autoJoin=v;save();});
      meta.appendChild(aj);
      const del=el('div','wf-more',I.trashSm);
      del.onclick=e=>{ e.stopPropagation(); forgetNetwork(n.ssid,reRender); };
      meta.appendChild(del);
      row.appendChild(meta);
      row.onclick=e=>{ if(e.target.closest('.sw,.wf-more')) return;
        const w=settingsWin(); w.data.detailSSID=n.ssid; settingsGo('wifi/details'); };
      g.appendChild(row);
    });
    p.appendChild(g);

function runUpdate(card,btn){
  btn.classList.add('dis');
  const box=$('#updProg',card);
  box.innerHTML='<div class="bar-meter" style="height:6px"><i style="width:0;background:var(--accent);transition:width .3s"></i></div><div style="font-size:11px;color:var(--txt2)" id="updTxt">Preparing…</div>';
  const bar=$('i',box), txt=$('#updTxt',box);
  let v=0;
  const steps=['Downloading…','Verifying…','Preparing to install…'];
  const t=setInterval(()=>{
    v+=4+Math.random()*7;
    bar.style.width=Math.min(100,v)+'%';
    txt.textContent=steps[Math.min(steps.length-1,Math.floor(v/40))]+' '+Math.min(100,Math.round(v))+'%';
    if(v>=100){
      clearInterval(t);
      txt.textContent='Ready to install.';
      alertBox({icon:appIconHTML('settings',52),title:'Restart to install macOS Tahoe '+State.updates.available+'?',
        message:'Your Mac will restart and the update will be installed. Open documents are saved in this simulator.',
        buttons:[{text:'Later'},{text:'Restart',style:'p',onClick:()=>{
          State.updates.installed=State.updates.available; State.updates.downloaded=false; saveNow();
          doPower('restart');
          setTimeout(()=>notify('settings','macOS updated',`Your Mac is now running ${OS_NAME} ${State.updates.installed}.`),5200);
        }}],horizontal:true});
    }
  },260);
}

function runErase(){
  const p=$('#power');
  p.innerHTML=`<div style="color:#f5f5f7">${I.apple(46)}</div>
    <div style="width:230px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden">
      <i id="erBar" style="display:block;height:100%;width:0;background:#f5f5f7;transition:width .35s linear"></i></div>
    <div style="color:rgba(255,255,255,.5);font-size:12px" id="erTxt">Erasing…</div>`;
  p.classList.add('on');
  Wins.slice().forEach(w=>w.node.remove()); Wins.length=0;
  let v=0;
  const steps=['Erasing…','Removing volume…','Restoring factory defaults…','Restarting…'];
  const t=setInterval(()=>{
    v+=9; $('#erBar').style.width=Math.min(100,v)+'%';
    $('#erTxt').textContent=steps[Math.min(steps.length-1,Math.floor(v/28))];
    if(v>=100){
      clearInterval(t);
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      setTimeout(()=>location.reload(),700);
    }
  },300);
}

function changePassword(){
  const w=settingsWin()||frontWin();
  windowSheet(w?w.node:$('#screen'),(s,close)=>{
    s.innerHTML='<h3>Change your login password</h3><p class="d">Your login password also unlocks the keychain and, if enabled, FileVault.</p>';
    const mk=(l,ph)=>{ const r=el('div','frow'); r.innerHTML=`<label>${l}</label>`;
      const f=el('div','fld'); const i=el('input'); i.type='password'; i.placeholder=ph; f.appendChild(i); r.appendChild(f); s.appendChild(r); return i; };
    const oldp=mk('Old password:','Current password'), n1=mk('New password:','New password'), n2=mk('Verify:','Re-enter');
    const hint=el('div','frow'); hint.innerHTML='<label>Password hint:</label>';
    const hf=el('div','fld'); const hi=el('input'); hi.placeholder='Recommended'; hi.value=State.user.hint||''; hf.appendChild(hi); hint.appendChild(hf); s.appendChild(hint);
    const acts=el('div','acts');
    const c=el('button','btn','Cancel'); c.onclick=close;
    const ok=el('button','btn p','Change Password');
    ok.onclick=()=>{
      if((oldp.value||'')!==(State.user.pw||'')) return toast('The old password is incorrect');
      if(n1.value!==n2.value) return toast('The new passwords don’t match');
      State.user.pw=n1.value; State.user.hint=hi.value; save(); close();
      toast('Login password changed');
    };
    acts.append(c,ok); s.appendChild(acts);
  });
}

function editUser(){
  const w=settingsWin();
  windowSheet(w?w.node:$('#screen'),(s,close)=>{
    s.innerHTML='<h3>Account</h3>';
    const mk=(l,v)=>{ const r=el('div','frow'); r.innerHTML=`<label>${l}</label>`;
      const f=el('div','fld'); const i=el('input'); i.value=v; f.appendChild(i); r.appendChild(f); s.appendChild(r); return i; };
    const nm=mk('Full name:',State.user.name), sh=mk('Account name:',State.user.short);
    const cRow=el('div','frow'); cRow.innerHTML='<label>Picture colour:</label>';
    const sw=el('div','swatches');
    ['linear-gradient(160deg,#0a84ff,#5e5ce6)','linear-gradient(160deg,#ff375f,#bf5af2)','linear-gradient(160deg,#30d158,#0a84ff)',
     'linear-gradient(160deg,#ff9f0a,#ff453a)','linear-gradient(160deg,#40c8e0,#5e5ce6)','linear-gradient(160deg,#8e8e93,#3a3a3e)']
      .forEach(c=>{ const b2=el('div','swatch'+(State.user.color===c?' on':'')); b2.style.background=c; b2.style.color='#0a84ff';
        b2.onclick=()=>{ State.user.color=c; $$('.swatch',sw).forEach(x=>x.classList.remove('on')); b2.classList.add('on'); }; sw.appendChild(b2); });
    cRow.appendChild(sw); s.appendChild(cRow);
    const acts=el('div','acts');
    const c=el('button','btn','Cancel'); c.onclick=close;
    const ok=el('button','btn p','OK');
    ok.onclick=()=>{ State.user.name=nm.value||State.user.name; State.user.short=sh.value||State.user.short;
      State.user.initials=State.user.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
      save(); close(); reRender(); renderMenuBar(); };
    acts.append(c,ok); s.appendChild(acts);
  });
}

function finderRender(w){
  const {main,pathbar,status,sb}=w.data;
  const where=w.data.where;
  setWinTitle(w,where);
  /* sidebar */
  sb.innerHTML='';
  FINDER_SIDEBAR.forEach(item=>{
    if(item.h){ sb.appendChild(el('div','sb-h',item.h)); return; }
    const it=el('div','sb-i'+(where===item.n?' on':''));
    const gl=item.tag? `<span style="width:11px;height:11px;border-radius:50%;background:${item.tag};display:block"></span>`
      : item.disk? `<span style="width:16px;height:16px;display:block">${I.disk}</span>`
      : item.i || `<span style="width:16px;height:16px;display:block">${I.folder()}</span>`;
    it.innerHTML=`<div class="gl">${gl}</div><div class="grow">${esc(item.n)}</div>`;
    it.onclick=()=>{ if(item.tag) return toast('Tag filtering is simulated');
      w.data.history.push(where); w.data.where=item.n; w.data.query=''; finderRender(w); };
    sb.appendChild(it);
  });
  const trashRow=el('div','sb-i'+(where==='Trash'?' on':''));
  trashRow.innerHTML=`<div class="gl"><span style="width:16px;height:16px;display:block">${I.trash(FS.trash.length>0)}</span></div><div class="grow">Bin</div>`;
  trashRow.onclick=()=>{ w.data.history.push(where); w.data.where='Trash'; finderRender(w); };
  sb.appendChild(el('div','sb-h','Bin')); sb.appendChild(trashRow);

  /* contents */
  let items=FS.list(where);
  if(w.data.query) items=items.filter(f=>f.name.toLowerCase().includes(w.data.query.toLowerCase()));
  main.innerHTML='';
  if(!items.length){
    main.appendChild(h(`<div class="st-empty"><h3>${where==='Trash'?'Bin is Empty':'No Items'}</h3>
      <p>${where==='Trash'?'Items you delete land here first.':'This folder is empty.'}</p></div>`));
  }else if(w.data.view==='icon'){
    const g=el('div','fi-grid');
    items.forEach(f=>{
      const it=el('div','fi-item'+(w.data.sel===f.name?' sel':''));
      it.innerHTML=`<div class="gl">${fileGlyph(f)}</div><div class="nm">${esc(f.name)}</div>`;
      wireFile(it,f,w);
      g.appendChild(it);
    });
    main.appendChild(g);
  }else{
    const list=el('div','fi-list');
    list.appendChild(h('<div class="fi-head"><div class="c-name">Name</div><div class="c-date">Date Modified</div><div class="c-size">Size</div><div class="c-kind">Kind</div></div>'));
    const body=el('div'); body.style.padding='4px';
    items.forEach(f=>{
      const r=el('div','fi-r'+(w.data.sel===f.name?' sel':''));
      r.innerHTML=`<div class="c-name"><span style="width:17px;height:17px;display:block;flex:none">${fileGlyph(f)}</span>${esc(f.name)}</div>
        <div class="c-date">${esc(f.date||'—')}</div><div class="c-size">${esc(f.size||'—')}</div>
        <div class="c-kind">${esc(f.dir?'Folder':(f.kind||'Document'))}</div>`;
      wireFile(r,f,w);
      body.appendChild(r);
    });
    list.appendChild(body);
    main.appendChild(list);
  }
  /* path bar + status */
  const chain=where==='Home'?['Macintosh HD','Users',State.user.short]:['Macintosh HD','Users',State.user.short,where];
  pathbar.innerHTML=chain.map((c,i)=>
    `<b>${i?`<span style="opacity:.5;margin:0 3px">${I.chev}</span>`:''}<span style="width:13px;height:13px;display:inline-block;vertical-align:-2px">${i===0?I.disk:I.folder()}</span> ${esc(c)}</b>`).join('');
  const sel=items.find(f=>f.name===w.data.sel);
  status.textContent=`${items.length} item${items.length===1?'':'s'}${sel?`, “${sel.name}” selected`:''}, ${State.storage.total-State.storage.used} GB available`;
  $$('button',w.data.viewSeg).forEach((b,i)=>b.classList.toggle('on',(i===0)===(w.data.view==='icon')));
}
function fileGlyph(f){
  if(f.app) return `<div class="app-ic" style="width:100%;height:100%;border-radius:22%">${iconFor(f.app)}</div>`;
  if(f.dir) return I.folder();
  if(/\.(png|jpg|jpeg|heic)$/i.test(f.name)) return `<svg viewBox="0 0 38 48" width="100%" height="100%"><rect x="2" y="5" width="34" height="38" rx="4" fill="#f2f2f5"/><path d="M6 35l8-9 6 6 6-8 6 11z" fill="#5ac8fa"/><circle cx="12" cy="15" r="3.4" fill="#ffd60a"/></svg>`;
  if(/\.pdf$/i.test(f.name)) return I.doc('#ff453a');
  if(/\.(zip|pkg|dmg)$/i.test(f.name)) return `<svg viewBox="0 0 38 48" width="100%" height="100%"><rect x="3" y="4" width="32" height="40" rx="4" fill="#c9ccd3"/><rect x="16" y="4" width="6" height="22" fill="#8e939c"/><rect x="16" y="26" width="6" height="8" rx="2" fill="#5b6270"/></svg>`;
  if(/\.(wav|mp3|m4a)$/i.test(f.name)) return I.doc('#ff375f');
  if(/\.(mov|mp4)$/i.test(f.name)) return I.doc('#5e5ce6');
  return I.doc();
}
function wireFile(node,f,w){
  node.onclick=()=>{ w.data.sel=f.name; $$('.fi-item,.fi-r',w.data.main).forEach(n=>n.classList.remove('sel'));
    node.classList.add('sel'); finderRender(w); };
  node.ondblclick=()=>openFile(f,w);
  node.oncontextmenu=e=>contextMenu(e,[
    {label:'Open',onClick:()=>openFile(f,w)},
    {label:'Open With',sub:[{label:'Preview',onClick:()=>previewFile(f.name)},{label:'TextEdit',onClick:()=>openTextEdit(f.name,'')},{label:'Safari',onClick:()=>openApp('safari')}]},
    {sep:1},
    {label:'Get Info',onClick:()=>getInfo(f.name,f.dir?'folder':'doc')},
    {label:'Rename',onClick:()=>toast('Renaming is simulated')},
    {label:'Duplicate',onClick:()=>toast('Duplicated (simulated)')},
    {sep:1},
    {label:'Move to Bin',onClick:()=>{
      FS.trash.push({name:f.name,kind:f.dir?'folder':'doc'});
      const arr=FS.tree[w.data.where]; if(arr){ const i=arr.indexOf(f); if(i>=0) arr.splice(i,1); }
      finderRender(w); renderDock(); toast(`Moved “${f.name}” to the Bin`); }},
    {sep:1},
    {label:'Tags…',sub:['Red','Orange','Green','Blue'].map(t=>({label:t,onClick:()=>toast('Tagged '+t)}))}
  ]);
}
function openFile(f,w){
  if(f.app) return openApp(f.app);
  if(f.dir){ w.data.history.push(w.data.where); w.data.where=f.name; w.data.query=''; return finderRender(w); }
  if(/\.(png|jpg|jpeg|pdf|heic)$/i.test(f.name)) return previewFile(f.name);
  if(/\.(rtf|txt|md)$/i.test(f.name)) return openTextEdit(f.name,'');
  if(/\.(wav|mp3|m4a)$/i.test(f.name)) return openApp('music');
  toast(`There is no application set to open “${f.name}”.`);
}

function safariCloseTab(i){

function safariGo(v){

  if(!url){ t.url=''; t.title='Start Page'; }
  else{
    t.history=t.history.slice(0,t.idx+1); t.history.push(url); t.idx=t.history.length-1;
    t.url=url; t.title=prettyHost(url);
    if(!SafariState().privateMode){
      SafariState().history.unshift({u:url,t:t.title,when:Date.now()});
      SafariState().history=SafariState().history.slice(0,60);
    }
  }

function safariBack(){ const t=activeTab(); if(t.idx>0){ t.idx--; t.url=t.history[t.idx]; t.title=prettyHost(t.url); }
  else if(t.idx===0){ t.idx=-1; t.url=''; t.title='Start Page'; } save(); safariRender(true); }
function safariFwd(){ const t=activeTab(); if(t.idx<t.history.length-1){ t.idx++; t.url=t.history[t.idx]; t.title=prettyHost(t.url); save(); safariRender(true); } }

      {sep:1},{label:'Close Tab',onClick:()=>safariCloseTab(i)},

function safariRender(reload){
  const w=sfWin(); if(!w) return;
  const s=SafariState(), t=activeTab(), frame=w.data.frame;
  safariPaint();
  w.node.style.setProperty('--win-solid', s.privateMode?'#1a1a1c':'');
  if(!reload && frame.dataset.url===(t.url||'')) return;
  frame.dataset.url=t.url||'';
  frame.innerHTML='';
  if(!t.url){ frame.appendChild(safariStartPage()); return; }
  if(!S().wifi && !WF().connected){
    frame.appendChild(safariError('You Are Not Connected to the Internet',
      S().wifi?'Wi-Fi is on but this Mac has not joined a network. Open the Wi-Fi menu to pick one.'
        :'Wi-Fi is turned off. Turn it on from the menu bar or System Settings.',t.url));
    return;
  }
  const frameEl=el('iframe');
  frameEl.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox');
  frameEl.setAttribute('referrerpolicy','no-referrer');
  frameEl.src=t.url;
  frame.appendChild(frameEl);
  const prog=el('div','sf-prog'); prog.style.width='10%'; frame.appendChild(prog);
  requestAnimationFrame(()=>prog.style.width='90%');
  let done=false;
  frameEl.onload=()=>{
    done=true; prog.style.width='100%'; setTimeout(()=>prog.remove(),300);
    let blocked=false;
    try{ const d=frameEl.contentDocument;
      /* a same-origin empty document means the browser refused the frame (CSP / X-Frame-Options);
         a genuine cross-origin load throws or returns null, which means the page really painted */
      if(d && (!d.body || d.body.innerHTML.trim()==='')) blocked=true;
    }catch(err){ blocked=false; }
    if(blocked) frame.appendChild(safariBlocked(t.url));
    else safariHatch(frame,t.url);
  };
  setTimeout(()=>{ if(!done){ prog.remove(); frame.appendChild(safariBlocked(t.url,true)); } },7500);
}

function safariSuggest(w){
  $('.sf-sugg',w.node)?.remove();

  const s=SafariState();
  const items=[];
  if(q){
    items.push({t:q,s:'Search with DuckDuckGo',go:()=>safariGo(q)});
    if(/\./.test(q)) items.push({t:normalizeURL(q),s:'Go to site',go:()=>safariGo(q)});
  }
  s.bookmarks.filter(b=>!q||b.n.toLowerCase().includes(q.toLowerCase())).slice(0,4)
    .forEach(b=>items.push({t:b.n,s:b.u,go:()=>safariGo(b.u)}));
  s.history.filter(x=>!q||x.t.toLowerCase().includes(q.toLowerCase())).slice(0,4)
    .forEach(x=>items.push({t:x.t,s:x.u,go:()=>safariGo(x.u)}));
  if(!items.length) return;
  const box=el('div','sf-sugg');
  items.slice(0,8).forEach(it=>{
    const r=el('div','sp-i');
    r.innerHTML=`<div class="gl">${I.search}</div><div class="nm">${esc(it.t)}<span class="sub">${esc(it.s)}</span></div>`;
    r.onmousedown=e=>{ e.preventDefault(); box.remove(); it.go(); w.data.input.blur(); };
    box.appendChild(r);
  });
  w.data.url.style.position='relative';
  w.data.url.appendChild(box);
}

function termWindow(){
  const host='isaiahs-macbook-pro';
  return openWindow({appId:'terminal',title:`${State.user.short} — -zsh — 96×26`,w:760,h:460,minW:420,minH:220,
    build(body,w){
      const out=el('div','term scroll');
      body.appendChild(out);
      const prompt=()=>`<span class="ps">${host}:~ ${State.user.short}$</span> `;
      const line=t=>{ out.appendChild(h(`<div>${t}</div>`)); out.scrollTop=out.scrollHeight; };
      const write=t=>{ out.appendChild(h(`<div>${t}</div>`)); out.scrollTop=out.scrollHeight; };
      w.data.clear=()=>{ out.innerHTML=''; newPrompt(); };
      write(`Last login: ${new Date().toLocaleString()} on ttys000`);
      let histIdx=-1; const hist=[];
      function newPrompt(){
        const row=el('div','in');
        row.innerHTML=prompt();
        const inp=el('input'); inp.spellcheck=false; inp.autocapitalize='off';
        row.appendChild(inp); out.appendChild(row); out.scrollTop=out.scrollHeight;
        inp.focus();
        inp.onkeydown=e=>{
          if(e.key==='Enter'){
            const cmd=inp.value; hist.unshift(cmd); histIdx=-1;
            row.removeChild(inp); row.appendChild(h(`<span>${esc(cmd)}</span>`));
            runCmd(cmd,write); newPrompt();
          }else if(e.key==='ArrowUp'){ e.preventDefault(); if(histIdx<hist.length-1){ histIdx++; inp.value=hist[histIdx]; } }
          else if(e.key==='ArrowDown'){ e.preventDefault(); if(histIdx>0){ histIdx--; inp.value=hist[histIdx]; } else { histIdx=-1; inp.value=''; } }
          else if(e.key==='l'&&(e.ctrlKey)){ e.preventDefault(); w.data.clear(); }
        };
      }
      out.onmousedown=e=>{ if(!e.target.matches('input')) setTimeout(()=>$('input',out)?.focus(),0); };
      newPrompt();
      w.node.classList.add('term-win');
    }});
}

defineApp({
  id:'calculator', name:'Calculator', version:'12.0', icon:ICONS.calculator,
  about:'A working basic calculator — keyboard input included.',
  open(){
    let cur='0', prev=null, op=null, fresh=true;
    return openWindow({appId:'calculator',title:'Calculator',w:250,h:352,minW:250,minH:352,resizable:false,plainBar:true,
      build(b,w){
        const c=el('div','calc');
        const out=el('div','out','0');
        const keys=el('div','keys');
        const KEYS=[['AC','fn'],['±','fn'],['%','fn'],['÷','op'],
                    ['7',''],['8',''],['9',''],['×','op'],
                    ['4',''],['5',''],['6',''],['−','op'],
                    ['1',''],['2',''],['3',''],['+','op'],
                    ['0','w2'],['.',''],['=','op']];
        const show=v=>{ const s=String(v); out.textContent=s.length>11?Number(v).toPrecision(9):s;
          out.style.fontSize=s.length>9?'30px':'42px'; };
        const calc=()=>{
          if(op==null||prev==null) return Number(cur);
          const a=Number(prev), b2=Number(cur);
          return op==='+'?a+b2:op==='−'?a-b2:op==='×'?a*b2:op==='÷'?(b2===0?NaN:a/b2):b2;
        };
        const press=k=>{
          if(/^\d$/.test(k)){ cur=fresh?k:(cur==='0'?k:cur+k); fresh=false; }
          else if(k==='.'){ if(fresh){cur='0.';fresh=false;} else if(!cur.includes('.')) cur+='.'; }
          else if(k==='AC'){ cur='0'; prev=null; op=null; fresh=true; }
          else if(k==='±'){ cur=String(-Number(cur)); }
          else if(k==='%'){ cur=String(Number(cur)/100); }
          else if(k==='='){ const r=calc(); cur=Number.isFinite(r)?String(+r.toFixed(10)):'Error'; prev=null; op=null; fresh=true; }
          else { if(op&&!fresh){ const r=calc(); cur=Number.isFinite(r)?String(+r.toFixed(10)):'Error'; }
            prev=cur; op=k; fresh=true; }
          show(cur);
          $$('button',keys).forEach(x=>x.style.filter='');
        };
        KEYS.forEach(([k,cls])=>{ const btn=el('button',cls,k); btn.onclick=()=>press(k); keys.appendChild(btn); });
        c.append(out,keys); b.appendChild(c);
        w.node.addEventListener('keydown',e=>{
          const map={'/':'÷','*':'×','-':'−','+':'+','Enter':'=','=':'=','Escape':'AC','Backspace':'AC','%':'%'};
          const k=map[e.key]||(/^[\d.]$/.test(e.key)?e.key:null);
          if(k){ e.preventDefault(); press(k); }
        });
        w.node.tabIndex=0; setTimeout(()=>w.node.focus(),120);
      }});
  }
});

function relTime(ts){
  const s=(Date.now()-ts)/1000;
  if(s<60) return 'now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(s<7*86400) return new Date(ts).toLocaleDateString([],{weekday:'short'});
  return new Date(ts).toLocaleDateString([],{month:'short',day:'numeric'});
}

defineApp({
  id:'calendar', name:'Calendar', version:'14.0', icon:ICONS.calendar,
  about:'A month grid built from the real system date.',
  open(){
    let cursor=new Date();
    return openWindow({appId:'calendar',title:'Calendar',w:900,h:600,minW:560,minH:380,
      build(b,w,toolbar){
        const sb=el('div','wsidebar'); sb.style.width='176px';
        sb.innerHTML='<div class="sb-h">iCloud</div>';
        [['Home','#ff453a'],['Work','#0a84ff'],['Personal','#bf5af2'],['Birthdays','#ff9f0a'],['Holidays','#30d158']]
          .forEach(([n,c])=>sb.appendChild(h(`<div class="sb-i"><div class="chk on" style="background:${c};border-color:transparent">${I.tickS}</div><div class="grow">${n}</div></div>`)));
        const col=el('div','vstack grow');
        const head=el('div'); head.style.cssText='padding:10px 14px 4px;font-size:20px;font-weight:700;letter-spacing:-.3px';
        const dow=el('div','cal-dow');
        ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>dow.appendChild(h(`<div>${d}</div>`)));
        const grid=el('div','cal-grid');
        col.append(head,dow,grid); b.append(sb,col);
        const prev2=el('button','icobtn',I.chevL), next2=el('button','icobtn',I.chev);
        const today=el('button','btn','Today');
        prev2.onclick=()=>{ cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1); paint(); };
        next2.onclick=()=>{ cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1); paint(); };
        today.onclick=()=>{ cursor=new Date(); paint(); };
        const seg=el('div','seg');
        ['Day','Week','Month','Year'].forEach((t,i)=>{ const btn=el('button',i===2?'on':'',t);
          btn.onclick=()=>{ $$('button',seg).forEach(x=>x.classList.remove('on')); btn.classList.add('on');
            if(i!==2) toast(t+' view is simulated'); }; seg.appendChild(btn); });
        toolbar.append(today,prev2,next2,el('div','grow'),seg);
        function paint(){
          head.textContent=cursor.toLocaleDateString([],{month:'long',year:'numeric'});
          setWinTitle(w,'Calendar',head.textContent);
          grid.innerHTML='';
          const first=new Date(cursor.getFullYear(),cursor.getMonth(),1);
          const start=new Date(first); start.setDate(1-first.getDay());
          const now=new Date();
          for(let i=0;i<42;i++){
            const d=new Date(start); d.setDate(start.getDate()+i);
            const out=d.getMonth()!==cursor.getMonth();
            const isToday=d.toDateString()===now.toDateString();
            const cell=el('div','cal-d'+(out?' out':'')+(isToday?' today':''));
            cell.innerHTML=`<div class="n">${d.getDate()}</div>`;
            CAL_EVENTS.filter(e=>{
              const ed=new Date(now); ed.setDate(now.getDate()+e.day);
              return ed.toDateString()===d.toDateString();
            }).forEach(e=>cell.appendChild(h(`<div class="cal-ev" style="background:${e.color}">${esc(e.title)}</div>`)));
            cell.onclick=()=>{
              const evs=[...cell.querySelectorAll('.cal-ev')].map(x=>x.textContent);
              alertBox({icon:appIconHTML('calendar',52),title:d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}),
                message:evs.length?evs.join('\n'):'No events.',buttons:[{text:'Done',style:'p'}]});
            };
            grid.appendChild(cell);
          }
        }
        paint();
      }});
  }
});
defineApp({
  id:'reminders', name:'Reminders', version:'8.0', icon:ICONS.reminders,
  about:'A checklist that persists between sessions.',
  open(){
    if(!State.reminders) State.reminders=[
      {t:'Test the erase flow end to end',done:false,list:'Today'},
      {t:'Ship the Mac page',done:false,list:'Today'},
      {t:'Call Mom',done:true,list:'Today'},
      {t:'Renew domain',done:false,list:'Scheduled'}
    ];
    return openWindow({appId:'reminders',title:'Reminders',w:700,h:500,minW:440,minH:320,
      build(b,w,toolbar){
        const sb=el('div','wsidebar'); sb.style.width='176px';
        [['Today','#0a84ff'],['Scheduled','#ff453a'],['All','#1c1c1e'],['Flagged','#ff9f0a'],['Completed','#8e8e93']]
          .forEach(([n,c],i)=>sb.appendChild(h(`<div class="sb-i${i===0?' on':''}"><div class="gl" style="color:${c}">${I.list}</div><div class="grow">${n}</div>
            <div class="cnt">${State.reminders.filter(r=>n==='All'||n==='Completed'?(n==='Completed'?r.done:true):r.list===n).length}</div></div>`)));
        const main=el('div','wmain scroll grow'); main.style.padding='14px 18px';
        b.append(sb,main);
        const add=el('button','icobtn',I.plus);
        add.onclick=()=>{ State.reminders.unshift({t:'New Reminder',done:false,list:'Today'}); save(); paint();
          setTimeout(()=>$('input',main)?.focus(),60); };
        toolbar.append(add,el('div','grow'));
        function paint(){
          main.innerHTML='<div style="font-size:22px;font-weight:700;color:var(--accent);margin-bottom:12px">Today</div>';
          State.reminders.forEach((r,i)=>{
            const row=el('div','hstack');
            row.style.cssText='padding:7px 2px;border-bottom:.5px solid var(--sep-s)';
            const c=el('div','radio'+(r.done?' on':''));
            c.onclick=()=>{ r.done=!r.done; save(); paint(); };
            const inp=el('input'); inp.value=r.t; inp.style.cssText='flex:1;font-size:13px'+(r.done?';opacity:.5;text-decoration:line-through':'');
            inp.oninput=()=>{ r.t=inp.value; save(); };
            const del=el('button','icobtn',I.trashSm);
            del.onclick=()=>{ State.reminders.splice(i,1); save(); paint(); };
            row.append(c,inp,del); main.appendChild(row);
          });
          if(!State.reminders.length) main.appendChild(h('<div class="st-empty"><h3>No Reminders</h3></div>'));
        }
        paint();
      }});
  }
});

defineApp({
  id:'appstore', name:'App Store', version:'3.0', icon:ICONS.appstore,
  about:'Installs apps into the Dock for real — and lets you delete them again.',
  open(){
    return openWindow({appId:'appstore',title:'App Store',w:900,h:620,minW:560,minH:400,
      build(b,w,toolbar){
        const sb=el('div','wsidebar'); sb.style.width='188px';
        [['Discover',I.grid],['Arcade',I.play],['Create',I.doc?I.list:I.list],['Work',I.list],['Play',I.play],['Develop',I.cmd],['Categories',I.grid],['Updates',I.arrowU]]
          .forEach(([n,ic],i)=>{ const it=el('div','sb-i'+(i===0?' on':''));
            it.innerHTML=`<div class="gl">${ic}</div><div class="grow">${n}</div>${n==='Updates'&&State.badges.appstore?`<div class="cnt">${State.badges.appstore}</div>`:''}`;
            it.onclick=()=>{ $$('.sb-i',sb).forEach(x=>x.classList.remove('on')); it.classList.add('on'); paint(n); };
            sb.appendChild(it); });
        const main=el('div','wmain scroll grow'); main.style.padding='20px 24px';
        b.append(sb,main);
        const search=el('div','fld'); search.style.width='180px';
        search.innerHTML=`<span class="muted">${I.search}</span>`;
        const si=el('input'); si.placeholder='Search'; search.appendChild(si);
        si.oninput=()=>paint('Discover',si.value);
        toolbar.append(el('div','grow'),search);
        function installBtn(app){
          const installed=State.installed.includes(app.id)||State.dock.includes(app.id);
          const btn=el('button','getbtn'+(installed?' dis':''),installed?'Open':app.price);
          btn.onclick=e=>{
            e.stopPropagation();
            if(installed) return openApp(app.id);
            btn.innerHTML='<div class="prog-ring" style="margin:0 auto"></div>';
            setTimeout(()=>{
              State.installed.push(app.id); save(); renderDock();
              btn.textContent='Open'; btn.classList.add('dis');
              notify('appstore',app.name,'Installed and added to the Dock.');
              const tile=$(`.dock-i[data-app="${app.id}"]`);
              if(tile&&!S().reduceMotion){ tile.classList.add('bounce'); setTimeout(()=>tile.classList.remove('bounce'),1200); }
            },1500+Math.random()*900);
          };
          return btn;
        }
        function paint(tab='Discover',q=''){
          main.innerHTML='';
          if(tab==='Updates'){
            main.appendChild(h('<div class="st-title">Updates</div>'));
            if(State.updates.available!==State.updates.installed){
              const r=el('div','as-row');
              r.innerHTML=`<div class="app-ic" style="width:52px;height:52px;border-radius:12px">${ICONS.safari}</div>
                <div class="meta"><div class="nm">Safari</div><div class="sb">Version ${State.updates.available} — improved Liquid Glass rendering</div></div>`;
              const btn=el('button','getbtn','Update');
              btn.onclick=()=>{ btn.innerHTML='<div class="prog-ring" style="margin:0 auto"></div>';
                setTimeout(()=>{ btn.textContent='Open'; btn.classList.add('dis'); clearBadge('appstore');
                  notify('appstore','Safari','Updated to '+State.updates.available); },1800); };
              r.appendChild(btn); main.appendChild(r);
            }else main.appendChild(h('<div class="st-empty"><h3>All Apps Are Up to Date</h3></div>'));
            return;
          }
          const hero=el('div','as-hero');
          hero.style.background='linear-gradient(150deg,#2b1852,#7b2f6d 42%,#d4623c 76%,#ffb547)';
          hero.innerHTML=`<div class="k">Now Available</div><div class="t">Everything new in<br>macOS Tahoe</div>`;
          hero.onclick=()=>{ openApp('settings'); setTimeout(()=>settingsGo('general/update'),160); };
          main.appendChild(hero);
          const list=STORE.filter(s=>!q||s.name.toLowerCase().includes(q.toLowerCase()));
          main.appendChild(h(`<div style="font-size:17px;font-weight:700;margin:6px 0 8px">${q?'Results':'Apps We Love'}</div>`));
          list.forEach(app=>{
            const r=el('div','as-row');
            r.innerHTML=`<div class="app-ic" style="width:52px;height:52px;border-radius:12px">${ICONS[app.id]||ICONS.textedit}</div>
              <div class="meta"><div class="nm">${esc(app.name)}</div><div class="sb">${esc(app.blurb)} · ${esc(app.size)}</div></div>`;
            r.appendChild(installBtn(app));
            r.onclick=()=>toast(`${app.name} — ${app.dev} · ${app.cat}`);
            main.appendChild(r);
          });
          if(State.installed.length){
            main.appendChild(h('<div style="font-size:17px;font-weight:700;margin:20px 0 8px">Installed</div>'));
            State.installed.forEach(id=>{
              const app=STORE.find(s=>s.id===id)||{id,name:appName(id),blurb:''};
              const r=el('div','as-row');
              r.innerHTML=`<div class="app-ic" style="width:44px;height:44px;border-radius:11px">${ICONS[id]||ICONS.textedit}</div>
                <div class="meta"><div class="nm">${esc(app.name)}</div><div class="sb">Installed</div></div>`;
              const del=el('button','getbtn'); del.textContent='Delete'; del.style.color='var(--red)';
              del.onclick=e=>{ e.stopPropagation();
                alertBox({icon:appIconHTML(id,52),title:`Delete “${app.name}”?`,
                  message:'The app will be removed from this Mac and the Dock.',
                  buttons:[{text:'Cancel'},{text:'Delete',style:'d',onClick:()=>{
                    quitApp(id);
                    State.installed=State.installed.filter(x=>x!==id);
                    State.dock=State.dock.filter(x=>x!==id);
                    save(); renderDock(); paint(tab); toast('Deleted'); }}],horizontal:true}); };
              r.appendChild(del);
              main.appendChild(r);
            });
          }
        }
        paint();
      }});
  }
});

/* =========================================================================
   35. Boot the machine
   ========================================================================= */
/* the whole screen owns its own context menus — never the browser's */
$('#screen').addEventListener('contextmenu',e=>{
  if(e.target.closest('.dt-icon,#desktop,#dock,.fi-item,.fi-r,.sf-tab,.ml-i,.nt-i,.tl b')) return;
  e.preventDefault();
  const w=frontWin();
  showMenu([
    {label:'Spotlight Search',key:'⌘ Space',onClick:showSpotlight},
    {label:'Mission Control',key:'F3',onClick:toggleMC},
    {sep:1},
    {label:'Minimise Window',dis:!w,onClick:()=>w&&minimizeWindow(w)},
    {label:'Close Window',dis:!w,onClick:()=>w&&closeWindow(w)},
    {sep:1},
    {label:'System Settings…',onClick:()=>openApp('settings')},
    {label:'Change Wallpaper…',onClick:()=>{openApp('settings');setTimeout(()=>settingsGo('wallpaper'),160);}}
  ],pt(e).x,pt(e).y);
});
/* clicking bare desktop or the menu bar's empty middle deactivates menus */
$('#screen').addEventListener('mousedown',e=>{
  if(e.target.closest('.menu,#scrim,.pop,#cc,#nc,#spot')) return;
  if(!e.target.closest('.mb-item')) closeMenus();
},true);

function init(){
  fitStage();
  applyAppearance();
  if(!State.desktopIcons) State.desktopIcons=defaultDesktopIcons();
  WF(); NOTES(); MAIL(); CHATS(); SafariState();
  renderMenuBar(); renderDock(); renderDesktop(); updateDockHide();
  $('#dockzone').style.pointerEvents='none';
  const firstEver=!State.bootedOnce;
  bootSequence({fast:!firstEver});
  save();
}
init();
</script>
