<!DOCTYPE html>
<html lang="en" data-style="default" data-color="auto" data-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Rate Tracker</title>

    <!-- Restore the saved theme before first paint so there's no flash. -->
    <script>
    (function () {
        try {
            var s = JSON.parse(localStorage.getItem('smt-theme') || 'null') || {};
            var d = document.documentElement;
            if (s.style) d.setAttribute('data-style', s.style);
            if (s.color) d.setAttribute('data-color', s.color);
            if (s.mode)  d.setAttribute('data-mode',  s.mode);
        } catch (e) {}
    })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=VT323&family=Share+Tech+Mono&family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Shared theme system — same file the Call Flow Tracker loads. -->
    <link rel="stylesheet" href="../smt/theme.css">

    <style>
        /* ── App-specific layout only. Everything themed lives in theme.css. ── */
        body { overflow: hidden; }

        #scene {
            perspective: 1500px;
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 1rem;
            transition: padding var(--dur-mid) var(--ease-out);
        }

        #trackerPanel {
            width: 100%; max-width: 600px; padding: 2rem;
            cursor: grab; user-select: none;
            border-radius: var(--panel-radius);
            box-shadow: 0 25px 50px -12px var(--shadow);
            background: var(--card-bg);
            backdrop-filter: blur(var(--panel-blur));
            -webkit-backdrop-filter: blur(var(--panel-blur));
            border: var(--panel-border-width) solid var(--border);
        }
        #trackerPanel:active { cursor: grabbing; }

        /* Depth is only applied while the panel is actually being tilted —
           see the .tt-tilting rules in theme.css. */
        #trackerPanel.tt-tilting .raised-element   { transform: translateZ(30px); }
        #trackerPanel.tt-tilting .stat-card-raised { transform: translateZ(20px); }
        .raised-element   { box-shadow: 0 8px 20px var(--raised-element-shadow); border-radius: 0.75rem; transition: transform var(--dur-mid) var(--ease-out); }
        .stat-card-raised { box-shadow: 0 6px 15px var(--raised-element-shadow); transition: transform var(--dur-mid) var(--ease-out); }

        .glass-effect { background: var(--card-bg); border: 1px solid var(--border); }
        .glass-input  { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); transition: box-shadow var(--dur-fast), border-color var(--dur-fast); }
        .focus-accent:focus { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

        #keptRate, #totalCalls, #totalTransfers { font-variant-numeric: tabular-nums; transition: color var(--dur-slow) ease; }

        .modal-backdrop { background-color: rgba(0,0,0,0.7); }
        .modal-border-accent { border-color: var(--accent); }
        .modal-border-danger { border-color: var(--danger); }
        .danger-bg { background-color: var(--danger); color: #fff; }
        .danger-bg:hover { background-color: var(--danger-hover); }
        .fixed-modal { z-index: 70; }
        .fixed-modal > div { animation: modalIn 300ms var(--ease-spring); }
        @keyframes modalIn { from { opacity: 0; transform: translateY(16px) scale(0.96); } to { opacity: 1; transform: none; } }

        #keptRateMeter { max-width: 160px; margin-top: 10px; height: 8px; }
    </style>
</head>
<body>
    <div id="scene">
        <main id="trackerPanel" class="space-y-6">

            <!-- Stats -->
            <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
                <div class="glass-effect tt-card stat-card-raised rounded-xl p-4 flex flex-col items-center justify-center">
                    <h2 class="text-sm font-medium subtle-text uppercase tracking-wider">Total Calls</h2>
                    <div class="flex items-center gap-3 mt-2">
                        <button id="decrementCalls" aria-label="Decrement total calls" class="p-2 rounded-full custom-hover transition-colors"><span class="material-symbols-outlined text-lg">remove</span></button>
                        <p id="totalCalls" class="text-4xl font-bold font-['Roboto_Mono']">0</p>
                        <button id="incrementCalls" aria-label="Increment total calls" class="p-2 rounded-full custom-hover transition-colors"><span class="material-symbols-outlined text-lg">add</span></button>
                    </div>
                </div>
                <div class="glass-effect tt-card stat-card-raised rounded-xl p-4 flex flex-col items-center justify-center">
                    <h2 class="text-sm font-medium subtle-text uppercase tracking-wider">Transfers</h2>
                    <p id="totalTransfers" class="text-4xl font-bold font-['Roboto_Mono'] mt-2">0</p>
                </div>
                <div class="glass-effect tt-card stat-card-raised rounded-xl p-4 flex flex-col items-center justify-center">
                    <h2 class="text-sm font-medium subtle-text uppercase tracking-wider">Kept Rate</h2>
                    <p id="keptRate" class="text-4xl font-bold font-['Roboto_Mono'] mt-2 subtle-text">0.0%</p>
                    <div id="keptRateMeter" class="tt-meter"></div>
                </div>
            </section>

            <!-- Transfer management -->
            <section class="space-y-4 raised-element glass-effect tt-card p-4">
                <div class="flex gap-3">
                    <div class="relative flex-grow">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 subtle-text">edit_note</span>
                        <input type="text" id="transferNoteInput" placeholder="Enter reason for transfer..." class="w-full pl-10 pr-4 py-3 glass-input tt-input rounded-lg focus-accent text-inherit">
                    </div>
                    <button id="addTransferBtn" class="accent-bg tt-btn font-bold px-4 py-3 rounded-lg flex items-center gap-2 shadow-md">
                        <span class="material-symbols-outlined">add_circle</span>
                        <span class="hidden sm:inline">Add</span>
                    </button>
                </div>
                <div id="transferListContainer" class="space-y-3 max-h-[30vh] overflow-y-auto p-1">
                    <p id="emptyState" class="text-center subtle-text py-8">No transfers logged yet.</p>
                </div>
            </section>

            <!-- Footer -->
            <footer class="flex flex-col sm:flex-row justify-between items-center gap-4 text-sm pt-2">
                <button id="resetDataBtn" class="flex items-center gap-2 subtle-text hover:text-red-500 transition-colors py-2 px-3 rounded-lg custom-hover">
                    <span class="material-symbols-outlined text-base">restart_alt</span>
                    Reset Data
                </button>
                <div id="lastUpdatedEl" class="flex items-center gap-2 subtle-text">
                    <span class="material-symbols-outlined text-base">history</span>
                    <span></span>
                </div>
            </footer>
        </main>
    </div>

    <!-- Edit modal -->
    <div id="editModal" class="fixed-modal fixed inset-0 modal-backdrop backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="glass-effect tt-surface rounded-xl p-6 w-full max-w-md space-y-4 border-2 modal-border-accent shadow-2xl">
            <h3 class="text-lg font-semibold flex items-center gap-2"><span class="material-symbols-outlined accent-text">edit</span> Edit Transfer Note</h3>
            <input type="text" id="editNoteInput" class="w-full p-3 glass-input tt-input rounded-lg focus-accent text-inherit">
            <div class="flex justify-end gap-3">
                <button id="cancelEditBtn" class="px-4 py-2 rounded-lg custom-hover transition-colors">Cancel</button>
                <button id="saveEditBtn" class="accent-bg tt-btn font-bold px-4 py-2 rounded-lg">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Reset confirmation modal -->
    <div id="resetConfirmModal" class="fixed-modal fixed inset-0 modal-backdrop backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="glass-effect tt-surface rounded-xl p-6 w-full max-w-md space-y-4 border-2 modal-border-danger shadow-2xl">
            <h3 class="text-lg font-semibold flex items-center gap-2 text-red-500"><span class="material-symbols-outlined">warning</span> Reset Confirmation</h3>
            <p class="subtle-text">Are you sure? All data will be permanently deleted. This action cannot be undone.</p>
            <div class="flex justify-end gap-3">
                <button id="cancelResetBtn" class="px-4 py-2 rounded-lg custom-hover transition-colors">Cancel</button>
                <button id="confirmResetBtn" class="danger-bg font-bold px-4 py-2 rounded-lg transition-colors">Yes, Reset Data</button>
            </div>
        </div>
    </div>

    <script src="../smt/theme.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const panel = document.getElementById('trackerPanel');

        // ════════════════════ APPLICATION LOGIC ════════════════════
        const totalCallsEl = document.getElementById('totalCalls');
        const totalTransfersEl = document.getElementById('totalTransfers');
        const keptRateEl = document.getElementById('keptRate');
        const keptRateMeter = document.getElementById('keptRateMeter');
        const incrementCallsBtn = document.getElementById('incrementCalls');
        const decrementCallsBtn = document.getElementById('decrementCalls');
        const transferNoteInput = document.getElementById('transferNoteInput');
        const addTransferBtn = document.getElementById('addTransferBtn');
        const transferListContainer = document.getElementById('transferListContainer');
        const emptyStateEl = document.getElementById('emptyState');
        const lastUpdatedEl = document.getElementById('lastUpdatedEl').querySelector('span:last-child');

        const editModal = document.getElementById('editModal');
        const editNoteInput = document.getElementById('editNoteInput');
        const saveEditBtn = document.getElementById('saveEditBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        const resetDataBtn = document.getElementById('resetDataBtn');
        const resetConfirmModal = document.getElementById('resetConfirmModal');
        const confirmResetBtn = document.getElementById('confirmResetBtn');
        const cancelResetBtn = document.getElementById('cancelResetBtn');

        const getInitialState = () => ({
            totalCalls: 0, transfers: [], editingTransferId: null, lastUpdated: null,
        });
        let state = getInitialState();

        // Previous values are tracked here rather than read back out of the
        // DOM, because the counters now roll rather than snap.
        let shown = { calls: 0, transfers: 0, rate: 0 };

        function loadState() {
            const savedState = localStorage.getItem('transferTrackerState');
            if (savedState) state = { ...getInitialState(), ...JSON.parse(savedState) };
        }

        function saveState() {
            state.lastUpdated = new Date().toISOString();
            localStorage.setItem('transferTrackerState', JSON.stringify(state));
        }

        function render() {
            const calls = state.totalCalls;
            const transfers = state.transfers.length;

            if (calls !== shown.calls) { SMTTheme.countUp(totalCallsEl, calls); SMTTheme.pop(totalCallsEl); }
            else totalCallsEl.textContent = calls;
            if (transfers !== shown.transfers) { SMTTheme.countUp(totalTransfersEl, transfers); SMTTheme.pop(totalTransfersEl); }
            else totalTransfersEl.textContent = transfers;

            const cs = getComputedStyle(document.documentElement);
            const rateGreen = cs.getPropertyValue('--rate-green').trim();
            const rateRed = cs.getPropertyValue('--rate-red').trim();
            const accentColor = cs.getPropertyValue('--accent').trim();
            const subtleTextColor = cs.getPropertyValue('--subtle').trim();

            let rateToShow = 0;
            if (calls > 0) {
                const keptCalls = calls - transfers;
                rateToShow = Math.max(0, (keptCalls / calls) * 100);

                if (Math.abs(rateToShow - shown.rate) > 0.05) {
                    SMTTheme.countUp(keptRateEl, rateToShow, { decimals: 1, suffix: '%' });
                    SMTTheme.pop(keptRateEl);
                } else {
                    keptRateEl.textContent = rateToShow.toFixed(1) + '%';
                }

                if (rateToShow >= 90) keptRateEl.style.color = rateGreen;
                else if (rateToShow >= 75) keptRateEl.style.color = accentColor;
                else keptRateEl.style.color = rateRed;
            } else {
                keptRateEl.textContent = '0.0%';
                keptRateEl.style.color = subtleTextColor;
            }

            SMTTheme.renderMeter(keptRateMeter, rateToShow, { segments: 10, hearts: 5 });
            shown = { calls, transfers, rate: rateToShow };

            transferListContainer.innerHTML = '';
            if (transfers === 0) {
                transferListContainer.appendChild(emptyStateEl);
                emptyStateEl.classList.remove('hidden');
            } else {
                [...state.transfers].reverse().forEach(transfer => {
                    const transferEl = document.createElement('div');
                    transferEl.className = 'flex items-center justify-between p-3 list-item-bg tt-card rounded-lg shadow';
                    transferEl.dataset.id = transfer.id;
                    transferEl.innerHTML = `
                        <div class="flex-grow pr-4 overflow-hidden">
                            <p class="text-inherit truncate">${escapeHTML(transfer.note)}</p>
                            <p class="text-xs subtle-text">${new Date(transfer.timestamp).toLocaleString()}</p>
                        </div>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            <button class="edit-btn p-2 rounded-full custom-hover transition-colors" aria-label="Edit note"><span class="material-symbols-outlined text-sm">edit</span></button>
                            <button class="delete-btn p-2 rounded-full custom-hover transition-colors" aria-label="Delete note"><span class="material-symbols-outlined text-sm">delete</span></button>
                        </div>`;
                    transferListContainer.appendChild(transferEl);
                });
                SMTTheme.stagger(transferListContainer.children);
            }

            if (state.lastUpdated) lastUpdatedEl.textContent = `Last updated ${formatRelativeTime(new Date(state.lastUpdated))}`;
            else lastUpdatedEl.textContent = 'No updates yet.';

            saveState();
        }

        function handleAddTransfer() {
            const note = transferNoteInput.value.trim();
            if (note) {
                state.transfers.push({ id: Date.now(), note, timestamp: new Date().toISOString() });
                transferNoteInput.value = '';
                render();
            }
        }

        function handleListClick(e) {
            const target = e.target.closest('button');
            if (!target) return;
            const transferEl = target.closest('[data-id]');
            if (!transferEl) return;
            const transferId = Number(transferEl.dataset.id);

            if (target.classList.contains('delete-btn')) {
                transferEl.classList.remove('tt-stagger');
                transferEl.classList.add('tt-row-exit');
                const finish = () => {
                    state.transfers = state.transfers.filter(t => t.id !== transferId);
                    render();
                };
                transferEl.addEventListener('animationend', finish, { once: true });
                if (SMTTheme.reduceMotion) finish();
            } else if (target.classList.contains('edit-btn')) {
                const transferToEdit = state.transfers.find(t => t.id === transferId);
                if (transferToEdit) {
                    state.editingTransferId = transferId;
                    editNoteInput.value = transferToEdit.note;
                    editModal.classList.remove('hidden');
                    editNoteInput.focus();
                }
            }
        }

        function handleSaveEdit() {
            const newNote = editNoteInput.value.trim();
            if (newNote && state.editingTransferId !== null) {
                const transferIndex = state.transfers.findIndex(t => t.id === state.editingTransferId);
                if (transferIndex > -1) state.transfers[transferIndex].note = newNote;
                closeEditModal();
                render();
            }
        }

        function handleResetData() {
            state = getInitialState();
            localStorage.removeItem('transferTrackerState');
            state.lastUpdated = null;
            shown = { calls: 0, transfers: 0, rate: 0 };
            closeResetModal();
            render();
        }

        function closeEditModal() { state.editingTransferId = null; editModal.classList.add('hidden'); }
        function openResetModal() { resetConfirmModal.classList.remove('hidden'); }
        function closeResetModal() { resetConfirmModal.classList.add('hidden'); }

        function escapeHTML(str) { const div = document.createElement('div'); div.appendChild(document.createTextNode(str)); return div.innerHTML; }

        function formatRelativeTime(date) {
            const now = new Date(); const seconds = Math.round((now - date) / 1000);
            const minutes = Math.round(seconds / 60); const hours = Math.round(minutes / 60);
            const days = Math.round(hours / 24);
            if (seconds < 10) return `a few seconds ago`; if (seconds < 60) return `${seconds}s ago`;
            if (minutes < 2) return `1m ago`; if (minutes < 60) return `${minutes}m ago`;
            if (hours < 2) return `1h ago`; if (hours < 24) return `${hours}h ago`;
            if (days < 2) return `yesterday`; return `${days}d ago`;
        }

        incrementCallsBtn.addEventListener('click', () => { state.totalCalls++; render(); });
        decrementCallsBtn.addEventListener('click', () => { if (state.totalCalls > 0) { state.totalCalls--; render(); } });
        addTransferBtn.addEventListener('click', handleAddTransfer);
        transferNoteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAddTransfer(); });
        transferListContainer.addEventListener('click', handleListClick);

        saveEditBtn.addEventListener('click', handleSaveEdit);
        cancelEditBtn.addEventListener('click', closeEditModal);
        editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });
        editNoteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSaveEdit(); });

        resetDataBtn.addEventListener('click', openResetModal);
        confirmResetBtn.addEventListener('click', handleResetData);
        cancelResetBtn.addEventListener('click', closeResetModal);
        resetConfirmModal.addEventListener('click', (e) => { if (e.target === resetConfirmModal) closeResetModal(); });

        loadState();

        // ════════════════════ THEME ════════════════════
        SMTTheme.init({
            app: 'transfer',
            title: 'Transfer Rate Tracker',
            emoji: '📱',
            sibling: { label: 'Call Flow Tracker', href: 'https://isaiart.com/flow' },
            legacy: { style: 'trt-style', color: 'trt-color', mode: 'trt-mode' },
            onChange: render
        });
        SMTTheme.tilt(panel, { max: 30, excludeScroll: () => transferListContainer });

        render();
    });
    </script>
</body>
</html>
