    <style>
        /* ════ BASE DARK ════ */
        :root {
            --accent:#F59E0B;--accent-hover:#D97706;--accent-trans:rgba(245,158,11,0.12);

            --panel-radius:1.5rem;--btn-radius:0.5rem;--font-main:'Poppins',sans-serif;
            --rate-green:#22C55E;--rate-red:#EF4444;
            --list-item-bg:rgba(40,50,65,0.8);
            /* Aliases for transfer's existing CSS rules */
            --background-color:var(--bg);
            --text-color:var(--text);
            --subtle-text-color:var(--subtle);
            --card-bg-color:var(--card-bg);
            --panel-shadow-color:var(--shadow);
            --raised-element-shadow:rgba(0,0,0,0.20);
            --border-color:var(--border);
            --hover-bg-color:var(--hover-bg);
            --accent-color:var(--accent);
            --danger-color:var(--danger);
            --danger-hover-color:var(--danger-hover);
        }
        /* ════ LIGHT BASE ════ */
        html[data-mode="light"] {
            --bg:#F0F2F5;--text:#1F2937;--subtle:#6B7280;
            --card-bg:rgba(255,255,255,0.70);--border:rgba(0,0,0,0.10);
            --hover-bg:#E5E7EB;--input-bg:rgba(255,255,255,0.9);
            --dropdown-bg:#FFFFFF;--shadow:rgba(0,0,0,0.10);
            --accent:#D97706;--accent-hover:#B45309;--accent-trans:rgba(217,119,6,0.10);--success:#16A34A;
            --rate-green:#16A34A;--rate-red:#DC2626;
            --list-item-bg:#FFFFFF;
            --raised-element-shadow:rgba(0,0,0,0.08);
        }

        html[data-mode="dark"][data-color="green"] { --bg:#030A05;--text:#AEEEC7;--subtle:#2D6644;--card-bg:rgba(5,18,10,0.74);--border:rgba(34,197,94,0.09);--hover-bg:rgba(34,197,94,0.06);--input-bg:rgba(34,197,94,0.04);--dropdown-bg:#06150C;--shadow:rgba(0,20,5,0.65);--accent:#22C55E;--accent-hover:#16A34A;--accent-trans:rgba(34,197,94,0.12); }
        html[data-mode="dark"][data-color="pink"]  { --bg:#0D0308;--text:#FAC8E8;--subtle:#7A3060;--card-bg:rgba(28,6,22,0.74);--border:rgba(244,114,182,0.09);--hover-bg:rgba(244,114,182,0.06);--input-bg:rgba(244,114,182,0.04);--dropdown-bg:#1A0515;--shadow:rgba(40,0,25,0.65);--accent:#F472B6;--accent-hover:#EC4899;--accent-trans:rgba(244,114,182,0.12); }
        html[data-mode="dark"][data-color="orange"]{ --bg:#0C0500;--text:#FDDCB5;--subtle:#7A4A1A;--card-bg:rgba(25,12,0,0.74);--border:rgba(251,146,60,0.09);--hover-bg:rgba(251,146,60,0.06);--input-bg:rgba(251,146,60,0.04);--dropdown-bg:#1C0E00;--shadow:rgba(40,12,0,0.65);--accent:#FB923C;--accent-hover:#EA580C;--accent-trans:rgba(251,146,60,0.12); }

        html[data-mode="light"][data-color="blue"]  { --bg:#EFF6FF;--text:#1E3A5F;--subtle:#60A5FA;--card-bg:rgba(219,234,254,0.80);--border:rgba(37,99,235,0.12);--hover-bg:rgba(37,99,235,0.06);--input-bg:rgba(255,255,255,0.9);--dropdown-bg:#FFFFFF;--shadow:rgba(30,60,120,0.12);--accent:#2563EB;--accent-hover:#1D4ED8;--accent-trans:rgba(37,99,235,0.12);--success:#16A34A; }

        html[data-mode="light"][data-color="pink"]  { --bg:#FDF2F8;--text:#6B1050;--subtle:#F9A8D4;--card-bg:rgba(252,231,243,0.80);--border:rgba(219,39,119,0.12);--hover-bg:rgba(219,39,119,0.06);--input-bg:rgba(255,255,255,0.9);--dropdown-bg:#FFFFFF;--shadow:rgba(107,16,80,0.10);--accent:#DB2777;--accent-hover:#BE185D;--accent-trans:rgba(219,39,119,0.12);--success:#16A34A; }

        /* ══════════════════════════ STYLE THEMES ══════════════════════════ */

        /* ── GLASS ── */
        html[data-style="glass"] #gradientBg { display:block !important; }
        html[data-style="glass"] #trackerPanel { background:rgba(255,255,255,0.05) !important; border-color:rgba(255,255,255,0.14) !important; backdrop-filter:blur(32px) saturate(200%) !important; -webkit-backdrop-filter:blur(32px) saturate(200%) !important; }
        html[data-mode="light"][data-style="glass"] #trackerPanel { background:rgba(255,255,255,0.35) !important; border-color:rgba(255,255,255,0.5) !important; }

        /* ── NEUMORPHIC DARK ── */
        html[data-mode="dark"][data-style="neumorphic"] { --bg:#1C2130;--text:#C8D0E8;--subtle:#4A5470;--card-bg:#1C2130;--border:transparent;--hover-bg:#18202E;--input-bg:#1C2130;--dropdown-bg:#1C2130;--panel-radius:1.75rem; }
        html[data-mode="dark"][data-style="neumorphic"][data-color="blue"]   { --bg:#101828;--card-bg:#101828;--input-bg:#101828;--dropdown-bg:#101828; }
        html[data-mode="dark"][data-style="neumorphic"][data-color="green"]  { --bg:#0E1A12;--card-bg:#0E1A12;--input-bg:#0E1A12;--dropdown-bg:#0E1A12; }
        html[data-mode="dark"][data-style="neumorphic"][data-color="pink"]   { --bg:#1A1020;--card-bg:#1A1020;--input-bg:#1A1020;--dropdown-bg:#1A1020; }
        html[data-mode="dark"][data-style="neumorphic"][data-color="orange"] { --bg:#1A1208;--card-bg:#1A1208;--input-bg:#1A1208;--dropdown-bg:#1A1208; }
        html[data-mode="dark"][data-style="neumorphic"][data-color="white"]  { --bg:#181C2C;--card-bg:#181C2C;--input-bg:#181C2C;--dropdown-bg:#181C2C; }
        html[data-mode="dark"][data-style="neumorphic"] #trackerPanel { background:var(--bg) !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; border:none !important; box-shadow:10px 10px 22px rgba(8,10,18,0.7),-10px -10px 22px rgba(45,52,75,0.35) !important; }
        html[data-mode="dark"][data-style="neumorphic"] #themePanel { background:var(--bg) !important; border:none !important; box-shadow:8px 8px 16px rgba(8,10,18,0.65),-8px -8px 16px rgba(45,52,75,0.3) !important; }
        /* ── NEUMORPHIC LIGHT ── */
        html[data-mode="light"][data-style="neumorphic"] { --bg:#DDE5EF;--text:#2C3650;--subtle:#7A8BA5;--card-bg:#DDE5EF;--border:transparent;--hover-bg:#D0D9E5;--input-bg:#DDE5EF;--dropdown-bg:#DDE5EF;--panel-radius:1.75rem; }
        html[data-mode="light"][data-style="neumorphic"][data-color="blue"]   { --bg:#CEDEF0;--card-bg:#CEDEF0;--input-bg:#CEDEF0;--dropdown-bg:#CEDEF0; }
        html[data-mode="light"][data-style="neumorphic"][data-color="green"]  { --bg:#CEEADE;--card-bg:#CEEADE;--input-bg:#CEEADE;--dropdown-bg:#CEEADE; }
        html[data-mode="light"][data-style="neumorphic"][data-color="pink"]   { --bg:#EDD4E9;--card-bg:#EDD4E9;--input-bg:#EDD4E9;--dropdown-bg:#EDD4E9; }
        html[data-mode="light"][data-style="neumorphic"][data-color="orange"] { --bg:#EFE0D0;--card-bg:#EFE0D0;--input-bg:#EFE0D0;--dropdown-bg:#EFE0D0; }
        html[data-mode="light"][data-style="neumorphic"][data-color="white"]  { --bg:#E8EEF6;--card-bg:#E8EEF6;--input-bg:#E8EEF6;--dropdown-bg:#E8EEF6; }
        html[data-mode="light"][data-style="neumorphic"] #trackerPanel { background:var(--bg) !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; border:none !important; box-shadow:14px 14px 28px rgba(163,177,198,0.65),-14px -14px 28px rgba(255,255,255,0.85) !important; }
        html[data-mode="light"][data-style="neumorphic"] #themePanel { background:var(--bg) !important; border:none !important; box-shadow:10px 10px 20px rgba(163,177,198,0.55),-10px -10px 20px rgba(255,255,255,0.75) !important; }

        /* ── MINIMAL ── */
        html[data-style="minimal"] { --panel-radius:0.375rem;--btn-radius:0.125rem; }
        html[data-style="minimal"] #trackerPanel { background:var(--bg) !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; border:1px solid var(--border) !important; border-radius:var(--panel-radius) !important; box-shadow:none !important; }

        /* ── CYBERPUNK ── */
        html[data-style="cyberpunk"] { --font-main:'VT323',monospace;--panel-radius:0px;--btn-radius:0px; }
        html[data-mode="dark"][data-style="cyberpunk"],html[data-mode="dark"][data-style="cyberpunk"][data-color="dark"],html[data-mode="dark"][data-style="cyberpunk"][data-color="green"] { --bg:#080808;--text:#33FF66;--subtle:#195E30;--card-bg:#080808;--border:#33FF66;--hover-bg:rgba(51,255,102,0.08);--input-bg:#000;--dropdown-bg:#080808;--accent:#33FF66;--accent-hover:#00CC44;--accent-trans:rgba(51,255,102,0.12);--success:#33FF66; }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="white"]  { --text:#C8C8FF;--subtle:#4040AA;--border:#C8C8FF;--accent:#C8C8FF;--accent-hover:#9090DD;--hover-bg:rgba(200,200,255,0.08);--accent-trans:rgba(200,200,255,0.12); }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="blue"]   { --text:#33CCFF;--subtle:#114466;--border:#33CCFF;--accent:#33CCFF;--accent-hover:#0099CC;--hover-bg:rgba(51,204,255,0.08);--accent-trans:rgba(51,204,255,0.12);--success:#33CCFF; }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="pink"]   { --text:#FF66CC;--subtle:#661144;--border:#FF66CC;--accent:#FF66CC;--accent-hover:#CC3399;--hover-bg:rgba(255,102,204,0.08);--accent-trans:rgba(255,102,204,0.12);--success:#FF66CC; }
        html[data-mode="dark"][data-style="cyberpunk"][data-color="orange"] { --text:#FF9933;--subtle:#663300;--border:#FF9933;--accent:#FF9933;--accent-hover:#CC6600;--hover-bg:rgba(255,153,51,0.08);--accent-trans:rgba(255,153,51,0.12);--success:#FF9933; }
        html[data-mode="light"][data-style="cyberpunk"],html[data-mode="light"][data-style="cyberpunk"][data-color="dark"] { --bg:#EEEEEE;--text:#111111;--subtle:#555555;--card-bg:#DDDDDD;--border:#111111;--hover-bg:rgba(0,0,0,0.07);--input-bg:#FFFFFF;--dropdown-bg:#DDDDDD;--accent:#111111;--accent-hover:#000000;--accent-trans:rgba(0,0,0,0.10);--success:#111111; }
        html[data-mode="light"][data-style="cyberpunk"][data-color="blue"]   { --bg:#E0F0FF;--text:#003366;--subtle:#5588AA;--card-bg:#C8DFFF;--border:#003366;--accent:#003366;--accent-hover:#001F44;--hover-bg:rgba(0,51,102,0.08); }
        html[data-mode="light"][data-style="cyberpunk"][data-color="green"]  { --bg:#E0FFE8;--text:#003322;--subtle:#337755;--card-bg:#C8FFDA;--border:#003322;--accent:#003322;--accent-hover:#001A11;--hover-bg:rgba(0,51,34,0.08); }
        html[data-mode="light"][data-style="cyberpunk"][data-color="pink"]   { --bg:#FFE0F5;--text:#660033;--subtle:#AA4477;--card-bg:#FFC8ED;--border:#660033;--accent:#660033;--accent-hover:#440022;--hover-bg:rgba(102,0,51,0.08); }
        html[data-mode="light"][data-style="cyberpunk"][data-color="orange"] { --bg:#FFF0E0;--text:#663300;--subtle:#AA6633;--card-bg:#FFE0C0;--border:#663300;--accent:#663300;--accent-hover:#441F00;--hover-bg:rgba(102,51,0,0.08); }
        html[data-mode="light"][data-style="cyberpunk"][data-color="white"]  { --bg:#F5F5FF;--text:#111133;--card-bg:#E5E5FF;--border:#4040AA;--accent:#4040AA;--accent-hover:#202088; }
        html[data-style="cyberpunk"] #matrixCanvas { display:block !important; }
        html[data-style="cyberpunk"] #trackerPanel { background:var(--bg) !important; backdrop-filter:none !important; -webkit-backdrop-filter:none !important; border:3px solid var(--border) !important; border-radius:0 !important; box-shadow:6px 6px 0 var(--accent) !important; }
        html[data-style="cyberpunk"] #themePanel { border:3px solid var(--border) !important; border-radius:0 !important; box-shadow:6px 6px 0 var(--accent) !important; }
        html[data-style="cyberpunk"] h1, html[data-style="cyberpunk"] h2 { letter-spacing:2px; }

        /* ── PIXEL ART ── */
        html[data-style="pixelart"] { --font-main:'Press Start 2P',monospace;--panel-radius:0px;--btn-radius:0px; }
        html[data-mode="dark"][data-style="pixelart"],html[data-mode="dark"][data-style="pixelart"][data-color="dark"] { --bg:#1a1c2c;--text:#f4f4f4;--subtle:#5f5f7e;--card-bg:#2d2b55;--border:#6b6bae;--hover-bg:rgba(107,107,174,0.2);--input-bg:#1a1c2c;--dropdown-bg:#2d2b55;--shadow:rgba(0,0,0,0.7);--accent:#ff004d;--accent-hover:#cc0033;--accent-trans:rgba(255,0,77,0.15);--success:#00e436; }
        html[data-mode="dark"][data-style="pixelart"][data-color="white"]  { --accent:#fff1e8;--accent-hover:#d4c8bc;--accent-trans:rgba(255,241,232,0.15); }
        html[data-mode="dark"][data-style="pixelart"][data-color="blue"]   { --accent:#29adff;--accent-hover:#1a8ecc;--accent-trans:rgba(41,173,255,0.15);--success:#29adff; }
        html[data-mode="dark"][data-style="pixelart"][data-color="green"]  { --accent:#00e436;--accent-hover:#00b82c;--accent-trans:rgba(0,228,54,0.15); }
        html[data-mode="dark"][data-style="pixelart"][data-color="pink"]   { --accent:#ff77a8;--accent-hover:#cc4477;--accent-trans:rgba(255,119,168,0.15);--success:#ff77a8; }
        html[data-mode="dark"][data-style="pixelart"][data-color="orange"] { --accent:#ffa300;--accent-hover:#cc8200;--accent-trans:rgba(255,163,0,0.15);--success:#ffa300; }

        html[data-mode="light"][data-style="pixelart"][data-color="pink"]   { --bg:#ffe0f0;--text:#3a0a1a;--card-bg:#eec0d0;--border:#8a2a4a;--accent:#8a2a4a;--accent-hover:#6a1a38;--hover-bg:rgba(138,42,74,0.1); }
        html[data-mode="light"][data-style="pixelart"][data-color="orange"] { --bg:#fff0d0;--text:#3a1a00;--card-bg:#eecca0;--border:#8a4a00;--accent:#8a4a00;--accent-hover:#6a3800;--hover-bg:rgba(138,74,0,0.1); }
        html[data-mode="light"][data-style="pixelart"][data-color="white"]  { --bg:#f4f4f4;--text:#111;--card-bg:#e4e4e4;--border:#444;--accent:#222;--accent-hover:#000; }

        /* ════ BACKGROUND LAYERS ════ */
        #gradientBg { display:none; position:fixed; inset:0; z-index:-1; overflow:hidden; background:#060818; }
        html[data-mode="light"] #gradientBg { background:#d0e4f8; }
        #gradientBg::before { content:''; position:absolute; width:180%; height:180%; top:-40%; left:-40%; background:conic-gradient(from 0deg at 45% 55%,var(--accent) 0deg,transparent 80deg,var(--success) 150deg,transparent 200deg,color-mix(in srgb,var(--accent) 50%,purple) 270deg,transparent 310deg,var(--accent) 360deg); filter:blur(70px); opacity:0.45; animation:rotateBg 20s linear infinite; }
        html[data-mode="light"] #gradientBg::before { opacity:0.22; }
        #gradientBg::after { content:''; position:absolute; width:60%; height:60%; top:10%; left:20%; background:radial-gradient(ellipse,var(--accent-trans) 0%,transparent 70%); filter:blur(40px); animation:floatBg 10s ease-in-out infinite alternate; }
        @keyframes rotateBg { to{transform:rotate(360deg)} }

        /* ════ KEPT-RATE METER ════ */
        .rate-meter { width:100%; max-width:160px; height:8px; margin-top:10px; border-radius:6px; background:var(--hover-bg); overflow:hidden; }
        .rate-meter .meter-fill { display:block; height:100%; width:0%; background:var(--accent); border-radius:6px; transition:width 0.6s cubic-bezier(0.22,1,0.36,1); }

        .rate-meter.seg-meter { display:flex; gap:3px; background:transparent; height:14px; border-radius:0; overflow:visible; }

        .rate-meter.seg-meter .seg.on { background:var(--accent); }

        #matrixCanvas { display:none; position:fixed; inset:0; z-index:-1; }

        #crtOverlay { display:none; position:fixed; inset:0; z-index:9998; pointer-events:none; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.09) 2px,rgba(0,0,0,0.09) 4px); animation:crtFlicker 8s infinite; }
        @keyframes crtFlicker { 0%,99%{opacity:1} 99.5%{opacity:0.96} 100%{opacity:1} }
        #medievalBg { display:none; position:fixed; inset:0; z-index:-1; }

        html[data-mode="light"] #medievalBg { background:radial-gradient(ellipse at 50% 30%,#b8914a 0%,#7a5228 60%,#3a2810 100%); }
        #brutalistBg { display:none; position:fixed; inset:0; z-index:-1; background:var(--bg); background-image:repeating-linear-gradient(45deg,transparent,transparent 25px,rgba(128,128,128,0.04) 25px,rgba(128,128,128,0.04) 26px); }

        #retroTitleBar { display:none; background:linear-gradient(90deg,var(--accent),var(--accent-hover)); color:#fff; font-size:0.8rem; font-weight:bold; padding:3px 5px; align-items:center; justify-content:space-between; margin:-2rem -2rem 1.25rem -2rem; font-family:'Courier New',monospace; user-select:none; border-radius:0; }
        .retro-win-btn { width:16px; height:14px; background:#C0C0C0; color:#000; font-size:9px; display:inline-flex; align-items:center; justify-content:center; box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 #fff; cursor:pointer; font-weight:bold; margin-left:2px; }

        /* ════ BASE PAGE & PANEL (transfer-specific) ════ */
        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.35s, color 0.25s;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        #scene {
            perspective: 1500px;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #trackerPanel {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1.0);

            user-select: none;
            border-radius: var(--panel-radius);

            cursor: grabbing;

        .raised-element {
            transform: translateZ(30px);
            box-shadow: 0 8px 20px var(--raised-element-shadow);

        }
        .stat-card-raised {
            transform: translateZ(20px);
            box-shadow: 0 6px 15px var(--raised-element-shadow);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-hover); }

        .glass-input {
            background: var(--input-bg);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid var(--border);
            color: var(--text);
        }
        html[data-mode="light"] .glass-input {
            background: rgba(0,0,0,0.05);
        }

        .focus-accent:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
        }

        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; vertical-align: middle; transition: color 0.3s ease; }

        #keptRate { transition: color 0.5s ease-in-out, transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        #totalCalls, #totalTransfers { transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55); }

        .bounce-stat { animation: stat-bounce-anim 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        @keyframes stat-bounce-anim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .list-item-base { transition: opacity 0.3s ease, transform 0.3s ease; }
        .list-item-enter-from { opacity: 0; transform: translateY(20px) scale(0.9); }
        .list-item-enter-active { animation: item-enter-bounce-anim 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        @keyframes item-enter-bounce-anim {
            0%   { opacity: 0; transform: translateY(30px) scale(0.8); }
            60%  { opacity: 1; transform: translateY(-10px) scale(1.1); }
            80%  { transform: translateY(5px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .list-item-exit-active { opacity: 0; transform: translateX(30px) scale(0.9); }

        .custom-hover:hover { background-color: var(--hover-bg) !important; }
        .list-item-bg { background-color: var(--list-item-bg); }
        .subtle-text { color: var(--subtle); }
        .accent-text { color: var(--accent); }
        .accent-bg { background-color: var(--accent) !important; color:#fff !important; }
        .accent-bg:hover { background-color: var(--accent-hover) !important; }
        .modal-backdrop { background-color: rgba(0, 0, 0, 0.7); }
        .modal-border-accent { border-color: var(--accent); }
        .modal-border-danger { border-color: var(--danger); }
        .danger-bg { background-color: var(--danger); color:#fff; }
        .danger-bg:hover { background-color: var(--danger-hover); }
        .glass-effect { background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border); }

        .fixed-modal { z-index: 70; }

        /* ════ THEME PANEL ════ */
        #themePanel { position:fixed; top:72px; right:1.5rem; width:296px; background:var(--card-bg); border:1px solid var(--border); border-radius:1rem; padding:1rem; box-shadow:0 16px 40px var(--shadow); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); z-index:65; opacity:0; transform:translateY(-8px) scale(0.96); pointer-events:none; transition:opacity 0.22s,transform 0.22s; color:var(--text); }
        #themePanel.visible { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }

        .mode-pill { display:flex; background:var(--hover-bg); border-radius:9999px; border:1px solid var(--border); padding:3px; gap:2px; margin-bottom:0.9rem; }
        .mode-pill-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:5px 10px; border-radius:9999px; font-size:0.7rem; font-weight:600; cursor:pointer; transition:all 0.2s; color:var(--subtle); font-family:var(--font-main); border:none; background:transparent; }
        .mode-pill-btn.active { background:var(--card-bg); color:var(--text); box-shadow:0 2px 8px var(--shadow); }
        html[data-mode="light"] .mode-pill-btn.active { background:#fff; }

        .tp-label { font-size:0.6rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--subtle); margin-bottom:7px; display:block; }

        .style-btn:hover { border-color:var(--accent); color:var(--text); }

    </style>
</head>
<body>

    <!-- Edit Modal (Stays Fixed) -->
    <div id="editModal" class="fixed-modal fixed inset-0 modal-backdrop backdrop-blur-sm flex items-center justify-center p-4 hidden">

    <!-- Reset Confirmation Modal (Stays Fixed) -->
    <div id="resetConfirmModal" class="fixed-modal fixed inset-0 modal-backdrop backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="glass-effect rounded-xl p-6 w-full max-w-md space-y-4 border-2 modal-border-danger shadow-2xl">
            <h3 class="text-lg font-semibold flex items-center gap-2 text-red-500"><span class="material-symbols-outlined">warning</span> Reset Confirmation</h3>
            <p class="subtle-text">Are you sure? All data will be permanently deleted. This action cannot be undone.</p>
            <div class="flex justify-end gap-3">
                <button id="cancelResetBtn" class="px-4 py-2 rounded-lg custom-hover transition-colors">Cancel</button>
                <button id="confirmResetBtn" class="danger-bg font-bold px-4 py-2 rounded-lg transition-colors">Yes, Reset Data</button>
            </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const html = document.documentElement;
        const panel = document.getElementById('trackerPanel');
        const transferList = document.getElementById('transferListContainer');

        // ════════════════════ 3D PANEL INTERACTION ════════════════════
        let isDragging = false;
        let previousMouseX, previousMouseY;
        let currentRotationX = 0;
        let currentRotationY = 0;
        const SENSITIVITY = 0.25;
        const MAX_ROTATION_X = 30;
        const DRAG_TRANSITION = 'transform 0.05s linear';
        const SNAP_TRANSITION = 'transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1.0)';

        panel.addEventListener('mousedown', (e) => {
            const targetElement = e.target;
            if (targetElement.closest('button, input, a')) return;
            if (transferList.contains(targetElement)) {
                const listRect = transferList.getBoundingClientRect();
                const scrollbarWidth = transferList.offsetWidth - transferList.clientWidth;
                if (e.clientX >= listRect.right - scrollbarWidth && e.clientX <= listRect.right &&
                    e.clientY >= listRect.top && e.clientY <= listRect.bottom) {
                    return;
                }
            }
            isDragging = true;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
            panel.style.transition = DRAG_TRANSITION;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - previousMouseX;
            const dy = e.clientY - previousMouseY;
            currentRotationY += dx * SENSITIVITY;
            currentRotationX -= dy * SENSITIVITY;
            currentRotationX = Math.max(-MAX_ROTATION_X, Math.min(MAX_ROTATION_X, currentRotationX));
            panel.style.transform = `rotateX(${currentRotationX}deg) rotateY(${currentRotationY}deg)`;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                panel.style.transition = SNAP_TRANSITION;
                panel.style.transform = `rotateX(0deg) rotateY(0deg)`;
                currentRotationX = 0;
                currentRotationY = 0;
            }
        });
        panel.ondragstart = () => false;

        // ════════════════════ MATRIX RAIN (cyberpunk style) ════════════════════
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        const MCHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*!?+-=><アイウエオカキクケコサシスセソタチツテトナニヌネノ';
        let matrixAnimId = null, mDrops = [];
        function mResize() { matrixCanvas.width = window.innerWidth; matrixCanvas.height = window.innerHeight; const cols = Math.floor(matrixCanvas.width / 14); mDrops = Array.from({ length: cols }, () => Math.random() * -matrixCanvas.height); }
        function mTick() {
            const accent = getComputedStyle(html).getPropertyValue('--accent').trim() || '#33FF66';
            mCtx.fillStyle = 'rgba(0,0,0,0.045)';
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            mCtx.font = '14px VT323,monospace';
            mDrops.forEach((y, i) => {
                const ch = MCHARS[Math.floor(Math.random() * MCHARS.length)];
                mCtx.fillStyle = Math.random() > 0.92 ? '#ffffff' : accent;
                mCtx.fillText(ch, i * 14, y);
                if (y > matrixCanvas.height && Math.random() > 0.975) mDrops[i] = 0;
                mDrops[i] += 14;
            });
            matrixAnimId = requestAnimationFrame(mTick);
        }
        function startMatrix() { if (matrixAnimId) return; mResize(); mTick(); }
        function stopMatrix() { if (matrixAnimId) { cancelAnimationFrame(matrixAnimId); matrixAnimId = null; } mCtx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height); }
        window.addEventListener('resize', () => { if (currentStyle === 'cyberpunk') mResize(); });

        // ════════════════════ THEME SYSTEM ════════════════════
        let currentStyle = localStorage.getItem('trt-style') || 'default';
        let currentColor = localStorage.getItem('trt-color') || 'dark';
        let currentMode  = localStorage.getItem('trt-mode')  || 'dark';

        function applyMode(mode) { currentMode = mode; html.setAttribute('data-mode', mode); localStorage.setItem('trt-mode', mode); document.getElementById('modeDark').classList.toggle('active', mode === 'dark'); document.getElementById('modeLight').classList.toggle('active', mode === 'light'); render(); }
        function applyStyle(style) {
            currentStyle = style; html.setAttribute('data-style', style); localStorage.setItem('trt-style', style);
            document.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('selected', b.dataset.style === style));
            if (style === 'cyberpunk') startMatrix(); else stopMatrix();
            render();
        }
        function applyColor(color) { currentColor = color; html.setAttribute('data-color', color); localStorage.setItem('trt-color', color); document.querySelectorAll('.color-dot').forEach(d => d.classList.toggle('selected', d.dataset.color === color)); render(); }

        // NB: the initial applyMode/applyStyle/applyColor calls happen at the
        // very bottom of this file, not here. They each end in render(), which
        // touches the `const` element refs declared further down — calling them
        // this early throws a TDZ ReferenceError and kills the whole script.

        const themePanel = document.getElementById('themePanel');
        document.getElementById('themePickerBtn').addEventListener('click', e => { e.stopPropagation(); themePanel.classList.toggle('visible'); });
        document.getElementById('closePanelBtn').addEventListener('click', () => themePanel.classList.remove('visible'));
        document.getElementById('modeDark').addEventListener('click', () => applyMode('dark'));
        document.getElementById('modeLight').addEventListener('click', () => applyMode('light'));
        document.querySelectorAll('.style-btn').forEach(b => b.addEventListener('click', () => applyStyle(b.dataset.style)));
        document.querySelectorAll('.color-dot').forEach(d => d.addEventListener('click', () => applyColor(d.dataset.color)));
        document.addEventListener('click', e => { if (!themePanel.contains(e.target) && !document.getElementById('themePickerBtn').contains(e.target)) themePanel.classList.remove('visible'); });

        // ════════════════════ APPLICATION LOGIC ════════════════════
        const totalCallsEl = document.getElementById('totalCalls');
        const totalTransfersEl = document.getElementById('totalTransfers');
        const keptRateEl = document.getElementById('keptRate');
        const incrementCallsBtn = document.getElementById('incrementCalls');
        const decrementCallsBtn = document.getElementById('decrementCalls');
        const transferNoteInput = document.getElementById('transferNoteInput');
        const addTransferBtn = document.getElementById('addTransferBtn');
        const transferListContainer = document.getElementById('transferListContainer');
        const emptyStateEl = document.getElementById('emptyState');
        const lastUpdatedEl = document.getElementById('lastUpdatedEl').querySelector('span:last-child');

        const editModal = document.getElementById('editModal');
        const editNoteInput = document.getElementById('editNoteInput');
        const saveEditBtn = document.getElementById('saveEditBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        const resetDataBtn = document.getElementById('resetDataBtn');
        const resetConfirmModal = document.getElementById('resetConfirmModal');
        const confirmResetBtn = document.getElementById('confirmResetBtn');
        const cancelResetBtn = document.getElementById('cancelResetBtn');

        const getInitialState = () => ({
            totalCalls: 0, transfers: [], editingTransferId: null, lastUpdated: null,
        });
        let state = getInitialState();

        function loadState() {
            const savedState = localStorage.getItem('transferTrackerState');
            if (savedState) state = { ...getInitialState(), ...JSON.parse(savedState) };
        }

        function saveState() {
            state.lastUpdated = new Date().toISOString();
            localStorage.setItem('transferTrackerState', JSON.stringify(state));
        }

        function applyBounce(element) {
            if (!element) return;
            element.classList.add('bounce-stat');
            element.addEventListener('animationend', () => {
                element.classList.remove('bounce-stat');
            }, { once: true });
        }

        // The kept-rate meter takes a different form per UI style: a bar by
        // default, chunky segments for the blocky themes, hearts for medieval.
        const keptRateMeter = document.getElementById('keptRateMeter');
        function renderRateMeter(pct) {
            const p = Math.max(0, Math.min(100, pct));
            keptRateMeter.className = 'rate-meter';
            keptRateMeter.innerHTML = '';
            if (['pixelart', 'cyberpunk', 'retro', 'brutalist'].includes(currentStyle)) {
                keptRateMeter.classList.add('seg-meter');
                const N = 10, filled = Math.round(p / 10);
                for (let i = 0; i < N; i++) {
                    const s = document.createElement('span');
                    s.className = 'seg' + (i < filled ? ' on' : '');
                    keptRateMeter.appendChild(s);
                }
            } else if (currentStyle === 'medieval') {
                keptRateMeter.classList.add('heart-meter');
                const N = 5, full = Math.round(p / 20);
                for (let i = 0; i < N; i++) {
                    const h = document.createElement('span');
                    h.className = 'heart' + (i < full ? ' on' : '');
                    h.textContent = '♥';
                    keptRateMeter.appendChild(h);
                }
            } else {
                const f = document.createElement('div');
                f.className = 'meter-fill';
                f.style.width = '0%';
                keptRateMeter.appendChild(f);
                void f.offsetWidth;          // force reflow so the width animates
                f.style.width = p + '%';
            }
        }

        function render() {
            const oldTotalCalls = parseInt(totalCallsEl.textContent);
            const oldTotalTransfers = parseInt(totalTransfersEl.textContent);

            totalCallsEl.textContent = state.totalCalls;
            totalTransfersEl.textContent = state.transfers.length;

            if (state.totalCalls !== oldTotalCalls) applyBounce(totalCallsEl);
            if (state.transfers.length !== oldTotalTransfers) applyBounce(totalTransfersEl);

            const rateGreen = getComputedStyle(html).getPropertyValue('--rate-green').trim();
            const rateRed = getComputedStyle(html).getPropertyValue('--rate-red').trim();
            const accentColor = getComputedStyle(html).getPropertyValue('--accent').trim();
            const subtleTextColor = getComputedStyle(html).getPropertyValue('--subtle').trim();

            let rateToShow = 0;
            if (state.totalCalls > 0) {
                const keptCalls = state.totalCalls - state.transfers.length;
                const rate = (keptCalls / state.totalCalls) * 100;
                rateToShow = Math.max(0, rate);
                const oldRateText = keptRateEl.textContent;
                const newRateText = `${rateToShow.toFixed(1)}%`;

                keptRateEl.textContent = newRateText;
                if (newRateText !== oldRateText) applyBounce(keptRateEl);

                if (rateToShow >= 90) keptRateEl.style.color = rateGreen;
                else if (rateToShow >= 75) keptRateEl.style.color = accentColor;
                else keptRateEl.style.color = rateRed;
            } else {
                keptRateEl.textContent = `0.0%`;
                keptRateEl.style.color = subtleTextColor;
            }
            renderRateMeter(rateToShow);

            transferListContainer.innerHTML = '';

            if (state.transfers.length === 0) {
                transferListContainer.appendChild(emptyStateEl);
                emptyStateEl.classList.remove('hidden');
            } else {
                [...state.transfers].reverse().forEach(transfer => {
                    const transferEl = document.createElement('div');
                    transferEl.className = 'flex items-center justify-between p-3 list-item-bg rounded-lg list-item-base list-item-enter-from shadow';
                    transferEl.dataset.id = transfer.id;
                    transferEl.innerHTML = `
                        <div class="flex-grow pr-4 overflow-hidden">
                            <p class="text-inherit truncate">${escapeHTML(transfer.note)}</p>
                            <p class="text-xs subtle-text">${new Date(transfer.timestamp).toLocaleString()}</p>
                        </div>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            <button class="edit-btn p-2 rounded-full custom-hover transition-colors" aria-label="Edit note"><span class="material-symbols-outlined text-sm">edit</span></button>
                            <button class="delete-btn p-2 rounded-full custom-hover transition-colors" aria-label="Delete note"><span class="material-symbols-outlined text-sm">delete</span></button>
                        </div>`;
                    transferListContainer.appendChild(transferEl);

                    requestAnimationFrame(() => {
                        transferEl.classList.remove('list-item-enter-from');
                        transferEl.classList.add('list-item-enter-active');
                        transferEl.addEventListener('animationend', () => {
                            transferEl.classList.remove('list-item-enter-active');
                        }, { once: true });
                    });
                });
            }

            if (state.lastUpdated) lastUpdatedEl.textContent = `Last updated ${formatRelativeTime(new Date(state.lastUpdated))}`;
            else lastUpdatedEl.textContent = 'No updates yet.';

            saveState();
        }

        function handleAddTransfer() {
            const note = transferNoteInput.value.trim();
            if (note) {
                state.transfers.push({ id: Date.now(), note, timestamp: new Date().toISOString() });
                transferNoteInput.value = '';
                render();
            }
        }

        function handleListClick(e) {
            const target = e.target.closest('button');
            if (!target) return;
            const transferEl = target.closest('[data-id]');
            if (!transferEl) return;
            const transferId = Number(transferEl.dataset.id);

            if (target.classList.contains('delete-btn')) {
                transferEl.classList.add('list-item-exit-active');
                transferEl.addEventListener('transitionend', () => {
                    state.transfers = state.transfers.filter(t => t.id !== transferId);
                    render();
                }, { once: true });
            } else if (target.classList.contains('edit-btn')) {
                const transferToEdit = state.transfers.find(t => t.id === transferId);
                if (transferToEdit) {
                    state.editingTransferId = transferId;
                    editNoteInput.value = transferToEdit.note;
                    editModal.classList.remove('hidden');
                    editNoteInput.focus();
                }
            }
        }

        function handleSaveEdit() {
            const newNote = editNoteInput.value.trim();
            if (newNote && state.editingTransferId !== null) {
                const transferIndex = state.transfers.findIndex(t => t.id === state.editingTransferId);
                if (transferIndex > -1) state.transfers[transferIndex].note = newNote;
                closeEditModal();
                render();
            }
        }

        function handleResetData() {
            state = getInitialState();
            localStorage.removeItem('transferTrackerState');
            state.lastUpdated = null;
            closeResetModal();
            render();
        }

        function closeEditModal() { state.editingTransferId = null; editModal.classList.add('hidden'); }
        function openResetModal() { resetConfirmModal.classList.remove('hidden'); }
        function closeResetModal() { resetConfirmModal.classList.add('hidden'); }

        function escapeHTML(str) { const div = document.createElement('div'); div.appendChild(document.createTextNode(str)); return div.innerHTML; }

        function formatRelativeTime(date) {
            const now = new Date(); const seconds = Math.round((now - date) / 1000);
            const minutes = Math.round(seconds / 60); const hours = Math.round(minutes / 60);
            const days = Math.round(hours / 24);
            if (seconds < 10) return `a few seconds ago`; if (seconds < 60) return `${seconds}s ago`;
            if (minutes < 2) return `1m ago`; if (minutes < 60) return `${minutes}m ago`;
            if (hours < 2) return `1h ago`; if (hours < 24) return `${hours}h ago`;
            if (days < 2) return `yesterday`; return `${days}d ago`;
        }

        incrementCallsBtn.addEventListener('click', () => { state.totalCalls++; render(); });
        decrementCallsBtn.addEventListener('click', () => { if (state.totalCalls > 0) { state.totalCalls--; render(); } });
        addTransferBtn.addEventListener('click', handleAddTransfer);
        transferNoteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAddTransfer(); });
        transferListContainer.addEventListener('click', handleListClick);

        saveEditBtn.addEventListener('click', handleSaveEdit);
        cancelEditBtn.addEventListener('click', closeEditModal);
        editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });
        editNoteInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSaveEdit(); });

        resetDataBtn.addEventListener('click', openResetModal);
        confirmResetBtn.addEventListener('click', handleResetData);
        cancelResetBtn.addEventListener('click', closeResetModal);
        resetConfirmModal.addEventListener('click', (e) => { if (e.target === resetConfirmModal) closeResetModal(); });

        loadState();
        applyMode(currentMode); applyStyle(currentStyle); applyColor(currentColor);
        render();
    });
    </script>
</body>
</html>
